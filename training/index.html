<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Team Training</title>
<link rel="icon" type="image/png" sizes="32x32" href="../shared/dsy-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../shared/dsy-favicon-192.png">
<link rel="apple-touch-icon" href="../shared/dsy-touch-180.png">
<meta name="theme-color" content="#1f5b43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=20261121q">
<style>
/* AR course card (member view): the student's AR course dates, separate from team sessions. */
.ar-card { border-left: 5px solid var(--brand); }
.ar-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .4rem .8rem; }
.ar-head h2 { font-size: 1.15rem; }
.ar-list { display: flex; flex-direction: column; }
.ar-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; padding: .65rem 0; border-top: 1px solid var(--line); }
.ar-row .what { flex: 1 1 9rem; min-width: 0; display: flex; flex-direction: column; gap: .1rem; }
.ar-row .t { font-weight: 600; overflow-wrap: anywhere; }
.ar-row .act { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.ar-more > summary { cursor: pointer; font-weight: 600; color: var(--brand); padding: .3rem 0; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading...</p></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js?v=20261121q"></script>
<script src="sa-dates.js?v=20261121q"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";
  var C = window.TRAINING_APP;
  var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey);
  var $app = document.getElementById("app");
  var $toast = document.getElementById("toast");
  var S = {
    user: null, profile: null, tab: location.hash === "#lessons" ? "lessons" : "calendar", view: null,
    reflections: {}, attFilter: null, attSession: null, groups: [], lessons: [], sessions: [], bookings: [], profiles: [], memberships: [],
    mySessions: [], myBookings: {}, filter: "all", typeFilter: "all", showPast: false, authMode: "in", detail: null, lessonEdit: null, personEdit: null,
    shared: [], files: [], shares: [], roster: [], rosterSession: null, lessonView: null, memberTab: "sessions", delSession: null, cluster: null, plan: null
  };

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function parseDate(d) { var p = String(d).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayStr() { var n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); }
  function hhmm(t) { var h = +String(t).slice(0, 2), m = String(t).slice(3, 5), ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return h + (m === "00" ? "" : ":" + m) + ap; }
  function timeRange(s) { return hhmm(s.start_time) + " to " + hhmm(s.end_time); }
  function tile(d) {
    var dt = parseDate(d);
    return '<div class="when"><span class="dow">' + dt.toLocaleDateString("en-AU", { weekday: "short" }) + '</span><span class="dom">' + dt.getDate() + '</span><span class="mon">' + dt.toLocaleDateString("en-AU", { month: "short" }) + "</span></div>";
  }
  function longDate(d) { return parseDate(d).toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" }); }
  function toast(msg, bad) {
    $toast.textContent = msg; $toast.className = "toast" + (bad ? " err" : ""); $toast.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { $toast.hidden = true; }, bad ? 6000 : 2600);
  }
  function fail(err) { toast(err && err.message ? err.message : "Something went wrong. Try again.", true); }
  function isLeader() { return S.profile && S.profile.role === "leader"; }
  /* clusters (16 Nov 2026): each team has a cluster; a leader with a cluster sees everything but can only change their own.
     A leader with no cluster (the lead instructor) changes everything. The database enforces the same rule. */
  var CLUSTERS = ["Lower Eyre", "Central Eyre", "West Coast"];
  function myCluster() { return (S.profile && S.profile.cluster) || null; }
  // The test roster team (type "test", Summer Bay) is open to every Team Leader, to match can_edit_group() in the database.
  function canEdit(gid) { var g = groupOf(gid), m = myCluster(); return !m || !g || !g.cluster || g.cluster === m || g.type === "test"; }
  function inView(g) { return S.cluster === "all" || !g || !g.cluster || g.cluster === S.cluster; }
  function clusterChips() {
    return '<div class="filters" role="group" aria-label="Cluster">' + [["all", "All clusters"]].concat(CLUSTERS.map(function (c) { return [c, c + (c === myCluster() ? " (yours)" : "")]; })).map(function (x) {
      return '<button aria-pressed="' + (S.cluster === x[0]) + '" data-act="cluster" data-c="' + x[0] + '">' + esc(x[1]) + "</button>";
    }).join("") + "</div>";
  }
  function groupChip(g) { return '<span class="chip ' + (g && g.type === "course" ? "course" : "hi") + '">' + esc(g ? g.name : "") + "</span>"; }
  function by(id, list) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function groupOf(id) { return by(id, S.groups); }
  function nameOf(p) { return (p && p.full_name) || "Unnamed member"; }
  function typeChip(t) { return t === "team" ? '<span class="chip warn">Team-led</span>' : '<span class="chip hi">Leader-led</span>'; }
  function ledBy(s) { return s.facilitator_name ? "Led by " + s.facilitator_name : (s.session_type === "team" ? "Facilitator to be confirmed" : ""); }
  function linkify(text) {
    return esc(text).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>"; });
  }
  function linkRow(text) {
    var seen = {}, urls = (String(text || "").match(/https?:\/\/[^\s<]+[^\s<.,;:!?)\]]/g) || []).filter(function (u) { return seen[u] ? false : (seen[u] = true); });
    if (!urls.length) return "";
    return '<span class="small muted">Tap a link to open it</span><div class="row">' + urls.map(function (u) {
      return '<a class="link" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u.replace(/^https?:\/\//, "").replace(/\/$/, "")) + "</a>";
    }).join("") + "</div>";
  }
  function paras(text) {
    return String(text || "").split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean).map(function (p) { return "<p>" + linkify(p).replace(/\n/g, "<br>") + "</p>"; }).join("");
  }

  /* ---------- auth ---------- */
  function loginEmail(v) { v = String(v || "").trim(); if (v.indexOf("@") > -1) return v.toLowerCase(); return v.toLowerCase().replace(/[^a-z0-9]/g, "") + "@id.dsytraining.com"; }
  function renderAuth() {
    var up = S.authMode === "up";
    $app.innerHTML =
      '<div class="auth stack"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>' + esc(C.appName) + "</h1><p>Sign in to see your sessions and book a spot.</p></div></div>" +
      '<form class="panel pad stack" data-form="auth" autocomplete="on">' +
      (up ? '<label>Your name<input id="f-name" name="name" autocomplete="name" required></label>' : "") +
      '<label>' + (up ? "Ambulance ID number" : "Ambulance ID number (or email)") + '<input id="f-email" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="' + (up ? "numeric" : "text") + '" required></label>' +
      (up ? '<p class="small muted">Your ID number is only used to sign you in and so your team leader knows who you are. We do not ask for an email address.</p>' : "") +
      '<label>Password<input id="f-pass" name="pass" type="password" minlength="8" autocomplete="' + (up ? "new-password" : "current-password") + '" required></label>' +
      '<button class="btn" type="submit">' + (up ? "Create account" : "Sign in") + "</button>" +
      '<a class="link" href="/signin/?first=1&amp;next=' + encodeURIComponent(location.pathname) + '">First time here? Set up your sign-in</a></form></div>';
  }

  /* ---------- data loading ---------- */
  function q(p) { return p.then(function (r) { if (r.error) throw r.error; return r.data || []; }); }

  function loadMember() {
    return Promise.all([
      q(sb.from("upcoming_sessions").select("*").gte("session_date", todayStr()).order("session_date").order("start_time")),
      q(sb.from("bookings").select("session_id,status").eq("member_id", S.user.id)),
      q(sb.from("lessons").select("*").order("created_at", { ascending: false })),
      q(sb.from("lesson_files").select("*").order("created_at")),
      /* AR course (21 Nov 2026): a student in an active AR course group sees its dates here too. Never blocks the calendar. */
      sb.rpc("course_home").then(function (x) { return x.error ? null : x.data; }, function () { return null; })
    ]).then(function (r) {
      S.ar = r[4] && r[4].enrolled ? r[4] : null;
      S.mySessions = r[0]; S.myBookings = {};
      r[1].forEach(function (b) { S.myBookings[b.session_id] = b.status; });
      S.shared = r[2]; S.files = r[3];
    });
  }

  function loadLeader() {
    return Promise.all([
      q(sb.from("groups").select("*").order("type", { ascending: false }).order("name")),
      q(sb.from("lessons").select("*").order("created_at", { ascending: false })),
      q(sb.from("sessions").select("*").order("session_date").order("start_time")),
      q(sb.from("bookings").select("session_id,member_id,status")),
      q(sb.from("profiles").select("*").order("full_name")),
      q(sb.from("memberships").select("*")),
      q(sb.from("attendance").select("*")),
      q(sb.from("lesson_files").select("*").order("created_at")),
      q(sb.from("lesson_shares").select("*")),
      q(sb.from("session_reflections").select("*"))
    ]).then(function (r) {
      S.reflections = {}; r[9].forEach(function (x) { S.reflections[x.session_id] = x.notes; });
      S.groups = r[0]; S.lessons = r[1]; S.sessions = r[2]; S.bookings = r[3];
      S.profiles = r[4]; S.memberships = r[5]; S.attendance = r[6]; S.files = r[7]; S.shares = r[8];
    });
  }

  function load() {
    return q(sb.from("profiles").select("*").eq("id", S.user.id)).then(function (rows) {
      S.profile = rows[0] || { id: S.user.id, full_name: "", role: "member" };
      if (S.profile.must_change_password) { location.replace("/signin/?change=1&next=" + encodeURIComponent("/training/")); return new Promise(function () {}); }
      /* relief cover (16 Nov 2026): someone covering for a leader works as a leader for that leader's cluster */
      return sb.rpc("my_access").then(function (a) {
        var x = (a && a.data) || {};
        S.realLeader = S.profile.role === "leader";
        S.covering = x.covering || [];
        if (x.role === "leader" && !S.realLeader) S.profile = Object.assign({}, S.profile, { role: "leader", cluster: x.cluster || null });
        if (S.cluster === null) S.cluster = myCluster() || "all";
        return isLeader() ? loadLeader() : loadMember();
      });
    });
  }

  function refresh() { return load().then(render).catch(fail); }

  /* ---------- member view ---------- */
  function header(sub) {
    return '<header class="top"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>' + esc(C.appName) + "</h1><p>" + esc(sub) + '</p></div></div><div class="row"><a class="link" href="../">DSY home</a>' + (S.profile && S.profile.role === "leader" ? '<a class="link" href="../region/">Region</a>' : "") + '<a class="link" href="../teams/">Team page</a><button class="link" data-act="signout">Sign out</button></div></header>';
  }

  function renderMember() {
    var html = header(nameOf(S.profile) + (S.memberTab === "shared" && S.shared.length ? " - shared with you" : " - your upcoming sessions"));
    if (S.rosterSession) { $app.innerHTML = html + renderRoster(); return; }
    if (S.lessonView) { $app.innerHTML = html + renderSharedLesson(); return; }
    if (S.shared.length) {
      html += '<div class="tabs" role="tablist">' + [["sessions", "Sessions"], ["shared", "Shared with you"]].map(function (t) {
        return '<button role="tab" aria-selected="' + (S.memberTab === t[0]) + '" data-act="mtab" data-tab="' + t[0] + '">' + t[1] + "</button>";
      }).join("") + "</div>";
    }
    $app.innerHTML = html + (S.memberTab === "shared" && S.shared.length ? renderSharedList() : renderMemberSessions());
  }

  /* ---------- AR course card in the member calendar (bookings and roll live in the course_* tables) ---------- */
  var AR_ATT = { present: "Attended", late: "Attended (late)", left_early: "Left early", absent: "Marked absent" };
  function arDayState(day) {
    var st = "";
    (S.ar.workshops || []).forEach(function (w) {
      if (w.day !== day) return;
      if (w.attended === "present" || w.attended === "late") st = "done";
      else if (st !== "done" && w.my && !w.cancelled && w.date >= todayStr()) st = w.my;
    });
    return st;
  }
  function arRow(w, title) {
    var act, full = w.capacity != null && w.booked >= w.capacity;
    var total = S.ar.cohort.total_days, cons = total && w.day > total;
    if (w.attended) act = '<span class="chip' + (w.attended === "absent" ? "" : " good") + '">' + AR_ATT[w.attended] + "</span>";
    else if (w.my === "confirmed") act = '<span class="chip good">Booked</span>' + (w.can_cancel ? '<button class="btn danger small" data-act="arcancel" data-id="' + w.id + '">Cancel</button>'
      : '<span class="small muted">Too close to cancel here: tell your facilitator</span>');
    else if (w.my === "waitlist") act = '<span class="chip warn">Waiting list #' + (w.my_place || 1) + '</span><button class="btn ghost small" data-act="arcancel" data-id="' + w.id + '">Leave list</button>';
    else if (full) act = '<span class="chip warn">Full</span><button class="btn ghost small" data-act="arwait" data-id="' + w.id + '">Join waiting list</button>';
    else act = '<button class="btn small" data-act="arbook" data-id="' + w.id + '">Book</button>';
    var when = w.start ? hhmm(w.start) + (w.end ? " to " + hhmm(w.end) : "") : "Time to be confirmed";
    return '<li class="ar-row">' + tile(w.date) + '<div class="what"><span class="t">Day ' + w.day + (title[w.day] ? " · " + esc(title[w.day]) : "") + (cons ? ' <span class="chip">Extra</span>' : "") + "</span>" +
      '<span class="small muted">' + when + (w.location ? " - " + esc(w.location) : "") + "</span></div>" + '<div class="act">' + act + "</div></li>";
  }
  function renderArCard() {
    if (!S.ar) return "";
    var a = S.ar, today = todayStr(), title = {}, nums = {};
    (a.days || []).forEach(function (d) { title[d.day] = d.title; nums[d.day] = 1; });
    var up = (a.workshops || []).filter(function (w) { return w.date >= today && !w.cancelled; });
    up.forEach(function (w) { nums[w.day] = 1; });
    var total = a.cohort.total_days || Object.keys(nums).length;
    var done = Object.keys(nums).filter(function (n) { return +n <= total && arDayState(+n) === "done"; }).length;
    var mine = up.filter(function (w) { return w.my; });
    var open = up.filter(function (w) { return !w.my && !arDayState(w.day); });
    var html = '<section class="panel pad stack ar-card"><div class="ar-head"><div><span class="eyebrow">Your course</span><h2>' + esc(a.cohort.course_name || "Ambulance Responder Course") + "</h2></div></div>";
    html += mine.length ? '<ul class="ar-list">' + mine.map(function (w) { return arRow(w, title); }).join("") + "</ul>"
      : '<p class="small muted">' + (open.length ? "Nothing booked yet. Pick your dates below." : done >= total && total ? "All course days done. Well done." : "No dates to book yet. Your facilitator will add them.") + "</p>";
    if (open.length) {
      html += '<details class="ar-more"' + (S.arMore || !mine.length ? " open" : "") + '><summary>Dates to book (' + open.length + ")</summary>" +
        '<ul class="ar-list">' + open.map(function (w) { return arRow(w, title); }).join("") + "</ul></details>";
    }
    return html + '<a class="link small" href="../ar/course/">All course days, attendance and progress</a></section>';
  }

  function arCall(fn, args, msg) {
    return sb.rpc(fn, args).then(function (r) { if (r.error) throw r.error; toast(msg); return refresh(); }).catch(fail);
  }

  function renderMemberSessions() {
    var rows = S.mySessions, card = renderArCard();
    if (!rows.length) return card + '<div class="panel empty">No upcoming ' + (card ? "team " : "") + 'sessions yet. If you expected to see some, ask your team leader to add you to your team.</div>';
    return card + '<ul class="panel list">' + rows.map(function (s, i) {
      var booked = S.myBookings[s.id] === "booked", mine = s.is_facilitator && s.session_type === "team";
      var title = s.lesson_title || s.topic;
      return '<li><div class="item' + (i === 0 ? " next" : "") + '">' + tile(s.session_date) +
        '<div class="what"><span class="t">' + (title ? esc(title) : '<span class="muted">Topic to be confirmed</span>') + "</span>" +
        '<span class="small muted">' + timeRange(s) + (s.location ? " - " + esc(s.location) : "") + "</span>" +
        (ledBy(s) ? '<span class="small muted">' + esc(ledBy(s)) + "</span>" : "") +
        '<span class="row">' + groupChip({ name: s.group_name, type: s.group_type }) + typeChip(s.session_type) + (mine ? '<span class="chip good">You are facilitating</span>' : "") + "</span>" +
        (s.lessons && s.lessons.length > 1 ? s.lessons.map(function (l) { return '<span class="small muted"><strong>' + esc(l.title) + "</strong>" + (l.summary ? " - " + esc(l.summary) : "") + "</span>"; }).join("")
          : s.lesson_summary ? '<span class="small muted">' + esc(s.lesson_summary) + "</span>" : "") + "</div>" +
        '<div class="act">' + (mine ? '<button class="btn ghost small" type="button" data-act="roster" data-id="' + s.id + '">Team list</button>' : "") +
        (booked ? '<span class="chip good">Booked</span><button class="btn danger small" data-act="cancel" data-id="' + s.id + '">Cancel</button>'
          : '<button class="btn small" data-act="book" data-id="' + s.id + '">Book a spot</button>') + "</div></div></li>";
    }).join("") + "</ul>";
  }

  function renderSharedList() {
    return '<ul class="panel list">' + S.shared.map(function (l) {
      return '<li><button class="item" type="button" data-act="viewlesson" data-id="' + l.id + '"><div class="what"><span class="t">' + esc(l.title) + "</span>" +
        (l.summary ? '<span class="small muted">' + esc(l.summary) + "</span>" : "") + '</div><div class="act"><span class="chip hi">Open</span></div></button></li>';
    }).join("") + "</ul>";
  }

  function renderSharedLesson() {
    var l = by(S.lessonView, S.shared); if (!l) { S.lessonView = null; return ""; }
    var fs = S.files.filter(function (f) { return f.lesson_id === l.id; });
    return '<button class="link back" type="button" data-act="lessonviewback">Back</button>' +
      '<section class="panel pad stack"><h2>' + esc(l.title) + "</h2>" + (l.summary ? '<p class="muted">' + esc(l.summary) + "</p>" : "") +
      (l.content ? '<div class="prose">' + paras(l.content) + "</div>" : "") + "</section>" +
      (l.resources ? '<section class="panel pad stack"><h3>Resources and links</h3><div class="prose">' + paras(l.resources) + "</div></section>" : "") +
      (fs.length ? '<section class="panel pad stack"><h3>Files</h3>' + filesList(l.id, true) + "</section>" : "");
  }

  function renderRoster() {
    var s = by(S.rosterSession, S.mySessions) || {}, here = S.roster.filter(function (r) { return r.attended; }).length;
    return '<button class="link back" type="button" data-act="rback">Back</button>' +
      '<section class="panel pad stack"><div class="row">' + groupChip({ name: s.group_name, type: s.group_type }) + typeChip(s.session_type) + "</div><h2>" + esc(s.session_date ? longDate(s.session_date) : "Team list") + "</h2>" +
      '<p class="muted">You are facilitating this session. Tick each person who is here. <strong id="rcount">' + here + " of " + S.roster.length + " here</strong></p>" +
      (S.roster.length ? "<ul>" + S.roster.map(function (r) {
        return '<li><label class="check"><input type="checkbox" data-act="rattend" data-sid="' + S.rosterSession + '" data-mid="' + r.member_id + '"' + (r.attended ? " checked" : "") + "> <span>" + esc(r.full_name || "Unnamed member") + "</span>" + (r.booked ? ' <span class="chip good">Booked</span>' : "") + "</label></li>";
      }).join("") + "</ul>" : '<p class="muted">No one is in this team yet.</p>') + "</section>";
  }
  function openRoster(id) {
    return sb.rpc("session_roster", { p_session: id }).then(function (r) {
      if (r.error) throw r.error;
      S.roster = r.data || []; S.rosterSession = id; render(); window.scrollTo(0, 0);
    }).catch(fail);
  }
  function setRoster(sid, mid, on) {
    return sb.rpc("set_attendance", { p_session: sid, p_member: mid, p_attended: on }).then(function (r) {
      if (r.error) throw r.error;
      S.roster.forEach(function (x) { if (x.member_id === mid) x.attended = on; });
      var el = document.getElementById("rcount");
      if (el) el.textContent = S.roster.filter(function (x) { return x.attended; }).length + " of " + S.roster.length + " here";
    }).catch(function (e) { fail(e); openRoster(sid); });
  }

  function book(id) {
    return sb.from("bookings").upsert({ session_id: id, member_id: S.user.id, status: "booked" }, { onConflict: "session_id,member_id" })
      .then(function (r) { if (r.error) throw r.error; toast("Booked. See you there."); return refresh(); }).catch(fail);
  }
  function cancelBooking(id) {
    return sb.from("bookings").update({ status: "cancelled" }).eq("session_id", id).eq("member_id", S.user.id)
      .then(function (r) { if (r.error) throw r.error; toast("Booking cancelled."); return refresh(); }).catch(fail);
  }

  /* ---------- leader: shared pieces ---------- */
  function bookedCount(sid) { return S.bookings.filter(function (b) { return b.session_id === sid && b.status === "booked"; }).length; }
  function lessonIds(s) { return s.lesson_ids && s.lesson_ids.length ? s.lesson_ids : s.lesson_id ? [s.lesson_id] : []; }

  function lessonPicker(ids) {

      }).join("") + "</ul>" : '<p class="small muted">No lesson yet.</p>') +
      (rest.length ? '<label>Add a lesson<select id="s-addlesson" data-act="addlesson"><option value="">Choose a lesson to add</option>' + rest.map(function (l) { return '<option value="' + l.id + '">' + esc(l.title) + "</option>"; }).join("") + "</select></label>" : "");
  }
  function pickedLessons() { return Array.prototype.map.call(document.querySelectorAll('#s-lessons input[name="lesson"]'), function (x) { return x.value; }); }

  function renderLeader() {
    var html = header("Team leader - " + nameOf(S.profile) + (myCluster() ? " (" + myCluster() + ")" : "") +
      ((S.covering || []).length ? " - covering for " + S.covering.map(function (c) { return c.name || "a leader"; }).join(", ") : ""));
    if (S.detail) {
      $app.innerHTML = html + renderSessionDetail();
      var ds = by(S.detail, S.sessions);
      if (ds && !canEdit(ds.group_id)) {   // another cluster's session: view only
        var g0 = groupOf(ds.group_id), back = $app.querySelector(".back");
        Array.prototype.forEach.call($app.querySelectorAll("main input, main select, main textarea, main button, #app input, #app select, #app textarea, #app button"), function (el) {
          if (!el.classList.contains("back") && !el.closest("header")) el.disabled = true;

        if (back) back.insertAdjacentHTML("afterend", '<div class="notice"><p><strong>View only.</strong> This session belongs to ' + esc((g0 && g0.cluster) || "another cluster") + '. Only its own cluster\'s leader (or the lead instructor) can change it.</p></div>');
      }

  /* ---------- leader: calendar ---------- */
  /* ---------- leader: set up training nights (18 Nov 2026) ----------
     A leader picks a team, who the nights are for (their own visits or team-led training), the first night, how
     often and the last date; school and public holidays are left out and dates that already have a session are
     kept. Single nights can then be added or deleted one by one. */
  var SAD = window.SA_DATES || { schoolHolidays: [], publicHolidays: {}, yearEnd: {}, knownUntil: "" };
  function ymd(dt) { return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
  function schoolHoliday(d) { for (var i = 0; i < SAD.schoolHolidays.length; i++) { var h = SAD.schoolHolidays[i]; if (d >= h[0] && d <= h[1]) return h[2]; } return null; }
  function editableTeams() { return S.groups.filter(function (g) { return g.type !== "course" && canEdit(g.id) && inView(g); }); }
  function shortDate(d) { return parseDate(d).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", year: "numeric" }); }
  function planDates(f) {
    var first = f.get("first"), last = f.get("last"), every = +f.get("every") || 14, gid = f.get("group");
    var skipSchool = f.get("skipschool") === "on", skipPublic = f.get("skippublic") === "on", out = [];
    if (!first || !last || last < first) return out;
    var have = {}; S.sessions.forEach(function (s) { if (s.group_id === gid) have[s.session_date] = true; });
    for (var dt = parseDate(first), n = 0; ymd(dt) <= last && n < 120; dt.setDate(dt.getDate() + every), n++) {
      var d = ymd(dt), why = null;
      if (have[d]) why = "Already has a session";
      else if (skipSchool && schoolHoliday(d)) why = schoolHoliday(d);
      else if (skipPublic && SAD.publicHolidays[d]) why = SAD.publicHolidays[d] + " (public holiday)";
      out.push({ d: d, skip: why, unknown: skipSchool && SAD.knownUntil && d > SAD.knownUntil });
    }
    return out;
  }
  function planPreview(form) {
    var f = new FormData(form), rows = planDates(f), make = rows.filter(function (r) { return !r.skip; });
    var unknown = rows.some(function (r) { return r.unknown; });
    var btn = form.querySelector('[type="submit"]');
    if (btn) { btn.textContent = "Create " + make.length + " session" + (make.length === 1 ? "" : "s"); btn.disabled = !make.length; }
    if (!rows.length) return '<p class="small muted">Choose the first night and a last date after it.</p>';
    var dow = parseDate(rows[0].d).toLocaleDateString("en-AU", { weekday: "long" }), every = +f.get("every");
    return '<p><strong>' + make.length + " new session" + (make.length === 1 ? "" : "s") + "</strong>, " + (every === 7 ? "every " : every === 14 ? "every second " : "every " + every / 7 + " weeks on ") + dow + "." +
      (rows.length > make.length ? " " + (rows.length - make.length) + " left out." : "") + "</p>" +
      (unknown ? '<p class="small muted">School holidays after ' + esc(shortDate(SAD.knownUntil)) + " are not loaded yet, so dates after that are not checked for them.</p>" : "") +
      '<ul class="stack">' + rows.map(function (r) {
        return '<li class="row" style="justify-content:space-between"><span' + (r.skip ? ' class="muted" style="text-decoration:line-through"' : "") + ">" + esc(shortDate(r.d)) + "</span>" +
          (r.skip ? '<span class="chip warn">' + esc(r.skip) + "</span>" : '<span class="chip good">New</span>') + "</li>";
      }).join("") + "</ul>";
  }
  function redrawPlan(changed) {
    var form = document.querySelector('form[data-form="plan"]'), box = document.getElementById("plan-preview");
    if (!form || !box) return;
    /* the last date follows the first night's school year until the leader sets it themselves */
    var first = form.elements.first.value, last = form.elements.last;
    if (changed === last) last.dataset.auto = "";
    else if (first && (last.dataset.auto || !last.value || last.value < first)) {
      var y = first.slice(0, 4), end = SAD.yearEnd[y] && SAD.yearEnd[y] >= first ? SAD.yearEnd[y] : y + "-12-31";
      last.value = end; last.dataset.auto = "1";
    }
    box.innerHTML = planPreview(form);
  }
  function teamSelect(id) {
    var teams = editableTeams(), pick = S.filter !== "all" && teams.some(function (g) { return g.id === S.filter; }) ? S.filter : "";
    return '<label>Team<select id="' + id + '" name="group" required><option value="">Choose a team</option>' + teams.map(function (g) {
      return '<option value="' + g.id + '"' + (g.id === pick ? " selected" : "") + ">" + esc(g.name) + (g.cluster ? " (" + esc(g.cluster) + ")" : "") + "</option>";
    }).join("") + "</select></label>";
  }
  function whoChoice() {
    return '<fieldset class="stack" style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:.3rem">Who are these nights for?</legend>' +
      '<label class="check"><input type="radio" name="type" value="leader" checked> <span><strong>Team Leader visits</strong>: leader-led, with you as facilitator</span></label>' +
      '<label class="check"><input type="radio" name="type" value="team"> <span><strong>Team training</strong>: team-led, choose the facilitator later</span></label></fieldset>';
  }
  function timeFields(p) {
    return '<label>Start<input id="' + p + '-start" name="start" type="time" value="19:00" required></label><label>Finish<input id="' + p + '-end" name="end" type="time" value="21:00" required></label>';
  }
  function renderPlan() {
    var t = todayStr();
    if (!editableTeams().length) return '<button class="link back" data-act="plan" data-p="">Back to calendar</button><div class="panel empty">There are no teams you can change in this view. Pick your own cluster above.</div>';
    if (S.plan === "one") {
      return '<button class="link back" data-act="plan" data-p="">Back to calendar</button>' +
        '<form class="panel pad stack" data-form="onesession"><h2>Add one session</h2><p class="small muted">For a single extra night. To remove a night, open it in the calendar and choose Delete session.</p>' +
        teamSelect("o-group") + '<label>Date<input id="o-date" name="date" type="date" min="' + t + '" required></label>' + whoChoice() +
        '<div class="grid2">' + timeFields("o") + "</div>" +
        '<label>Location (optional)<input id="o-loc" name="location" autocomplete="off"></label>' +
        '<button class="btn" type="submit">Add session</button></form>';
    }
    return '<button class="link back" data-act="plan" data-p="">Back to calendar</button>' +
      '<form class="panel pad stack" data-form="plan"><h2>Set up training nights</h2><p class="small muted">Creates a repeating set of nights for one team. Nights that already have a session are kept as they are. Afterwards you can open any night to change it or delete it, or add a single extra night.</p>' +
      teamSelect("p-group") + whoChoice() +
      '<div class="grid2"><label>First night<input id="p-first" name="first" type="date" min="' + t + '" required></label>' +
      '<label>Repeat<select id="p-every" name="every"><option value="7">Every week</option><option value="14" selected>Every second week (fortnightly)</option><option value="21">Every third week</option><option value="28">Every fourth week</option></select></label>' +
      '<label>Last date<input id="p-last" name="last" type="date" data-auto="1" required></label><span></span>' + timeFields("p") + "</div>" +
      '<label>Location (optional)<input id="p-loc" name="location" autocomplete="off"></label>' +
      '<label class="check"><input type="checkbox" name="skipschool" checked> <span>Leave out SA school holidays</span></label>' +
      '<label class="check"><input type="checkbox" name="skippublic" checked> <span>Leave out SA public holidays</span></label>' +
      '<div id="plan-preview" class="stack"><p class="small muted">Choose the first night and a last date after it.</p></div>' +
      '<button class="btn" type="submit" disabled>Create sessions</button></form>';
  }
  function sessionRow(f, d) {
    var type = f.get("type") === "team" ? "team" : "leader";
    return { group_id: f.get("group"), session_date: d, start_time: f.get("start"), end_time: f.get("end"), session_type: type,
      facilitator_id: type === "leader" ? S.profile.id : null, facilitator_name: type === "leader" ? nameOf(S.profile) : null, location: (f.get("location") || "").trim() || null };
  }
  function createPlan(form) {
    var f = new FormData(form);
    if (!f.get("group")) return Promise.resolve(fail({ message: "Choose a team." }));
    if (f.get("end") <= f.get("start")) return Promise.resolve(fail({ message: "The finish time must be after the start." }));
    var rows = planDates(f).filter(function (r) { return !r.skip; }).map(function (r) { return sessionRow(f, r.d); });
    if (!rows.length) return Promise.resolve(fail({ message: "There are no new nights to create." }));
    var g = groupOf(f.get("group"));
    return sb.from("sessions").insert(rows).then(function (r) {
      if (r.error) throw r.error;
      S.plan = null; S.filter = f.get("group"); toast(rows.length + " sessions created for " + (g ? g.name : "the team") + "."); return refresh();
    }).catch(fail);
  }
  function createOne(form) {
    var f = new FormData(form), gid = f.get("group"), d = f.get("date");
    if (!gid || !d) return Promise.resolve(fail({ message: "Choose a team and a date." }));
    if (f.get("end") <= f.get("start")) return Promise.resolve(fail({ message: "The finish time must be after the start." }));
    if (S.sessions.some(function (s) { return s.group_id === gid && s.session_date === d; })) return Promise.resolve(fail({ message: "That team already has a session on that date." }));
    return sb.from("sessions").insert(sessionRow(f, d)).then(function (r) {
      if (r.error) throw r.error;
      S.plan = null; S.filter = gid; toast("Session added."); return refresh();
    }).catch(fail);
  }

  function renderCalendar() {
    var t = todayStr();
    if (S.plan) return clusterChips() + renderPlan();
    var tools = '<div class="row"><button class="btn small" data-act="plan" data-p="repeat">Set up training nights</button><button class="btn ghost small" data-act="plan" data-p="one">Add one session</button></div>';
    if (S.filter !== "all" && !inView(groupOf(S.filter))) S.filter = "all";
    var list = S.sessions.filter(function (s) {
      return inView(groupOf(s.group_id)) && (S.filter === "all" || s.group_id === S.filter) && (S.typeFilter === "all" || s.session_type === S.typeFilter) && (S.showPast || s.session_date >= t);
    });
    var html = clusterChips() + tools + '<div class="filters" role="group" aria-label="Filter by team or course"><button aria-pressed="' + (S.filter === "all") + '" data-act="filter" data-g="all">All</button>' +
      S.groups.filter(inView).map(function (g) { return '<button aria-pressed="' + (S.filter === g.id) + '" data-act="filter" data-g="' + g.id + '">' + esc(g.name) + "</button>"; }).join("") + "</div>" +
      '<div class="filters" role="group" aria-label="Filter by who leads">' + [["all", "Any session"], ["leader", "Leader-led"], ["team", "Team-led"]].map(function (x) {
        return '<button aria-pressed="' + (S.typeFilter === x[0]) + '" data-act="typefilter" data-t="' + x[0] + '">' + x[1] + "</button>";
      }).join("") + '<button aria-pressed="' + S.showPast + '" data-act="past">Show past</button></div>';
    if (!list.length) return html + '<div class="panel empty">No sessions to show.</div>';
    return html + '<ul class="panel list">' + list.map(function (s) {
      var ls = lessonsOf(s), n = bookedCount(s.id), team = s.session_type === "team";
      var set = ls.length ? '<span class="chip good">' + (ls.length > 1 ? ls.length + " lessons" : "Lesson set") + "</span>" : s.topic ? '<span class="chip hi">Topic set</span>' : '<span class="chip warn">' + (team ? "Needs topic" : "Needs lesson") + "</span>";
      return '<li><button class="item" data-act="open" data-id="' + s.id + '">' + tile(s.session_date) +
        '<div class="what"><span class="t">' + (ls.length ? esc(ls.map(function (l) { return l.title; }).join(" + ")) : s.topic ? esc(s.topic) : '<span class="muted">' + (team ? "No topic yet" : "No lesson yet") + "</span>") + "</span>" +
        '<span class="small muted">' + timeRange(s) + (s.location ? " - " + esc(s.location) : "") + (ledBy(s) ? " - " + esc(ledBy(s)) : "") + '</span><span class="row">' + groupChip(groupOf(s.group_id)) + typeChip(s.session_type) + "</span></div>" +
        '<div class="act">' + set + (team && !s.facilitator_name ? '<span class="chip warn">Needs facilitator</span>' : "") + '<span class="chip">' + n + " booked</span>" + (S.reflections[s.id] ? '<span class="chip good">Reflection</span>' : s.session_date < t ? '<span class="chip warn">Needs reflection</span>' : "") + "</div></button></li>";
    }).join("") + "</ul>";
  }

  function renderSessionDetail() {
    var s = by(S.detail, S.sessions); if (!s) { S.detail = null; return ""; }
    var g = groupOf(s.group_id);
    var members = S.memberships.filter(function (m) { return m.group_id === s.group_id; }).map(function (m) { return by(m.member_id, S.profiles); }).filter(Boolean);
    var bookedIds = {}; S.bookings.forEach(function (b) { if (b.session_id === s.id && b.status === "booked") bookedIds[b.member_id] = true; });
    var att = {}; S.attendance.forEach(function (a) { if (a.session_id === s.id) att[a.member_id] = a.attended; });
    var nb = Object.keys(bookedIds).length;
    var facOpts = '<option value="">To be confirmed</option><option value="' + S.profile.id + '"' + (s.facilitator_id === S.profile.id ? " selected" : "") + ">" + esc(nameOf(S.profile)) + " (regional team leader)</option>" +
      members.filter(function (p) { return p.id !== S.profile.id; }).map(function (p) { return '<option value="' + p.id + '"' + (s.facilitator_id === p.id ? " selected" : "") + ">" + esc(nameOf(p)) + "</option>"; }).join("");
    var visitor = !s.facilitator_id && s.facilitator_name ? s.facilitator_name : "";
    return '<button class="link back" data-act="back">Back to calendar</button>' +
      '<section class="panel pad stack"><div class="row">' + groupChip(g) + typeChip(s.session_type) + '<span class="chip">' + nb + " booked</span></div><h2>" + esc(longDate(s.session_date)) + '</h2><p class="muted">' + timeRange(s) + "</p>" +
      '<form class="stack" data-form="session" data-id="' + s.id + '"><div class="grid2">' +
      '<label>Who leads<select id="s-type" name="type"><option value="leader"' + (s.session_type === "leader" ? " selected" : "") + '>Leader-led</option><option value="team"' + (s.session_type === "team" ? " selected" : "") + ">Team-led</option></select></label>" +
      '<label>Facilitator<select id="s-fac" name="fac">' + facOpts + "</select></label></div>" +

      '<div class="stack" id="s-lessons">' + lessonPicker(lessonIds(s)) + "</div>" +
      '<label>Location<input id="s-loc" name="location" value="' + esc(s.location || "") + '"></label>' +
      '<label>Session name (shown when there are no lessons)<input id="s-topic" name="topic" value="' + esc(s.topic || "") + '"></label>' +
      '<label>Notes for you<input id="s-notes" name="notes" value="' + esc(s.notes || "") + '"></label>' +

      (S.delSession === s.id ? '<div class="notice stack"><p><strong>Delete this session?</strong> Its bookings and attendance are removed too. This cannot be undone.</p><div class="row"><button class="btn danger small" type="button" data-act="deletesession" data-id="' + s.id + '">Yes, delete session</button><button class="btn ghost small" type="button" data-act="keepsession">Keep it</button></div></div>' : "") + "</section>" +

  function renderAttendance(s, members, att, bookedIds) {

  function saveReflection(form) {

      : sb.from("session_reflections").delete().eq("session_id", id);

  }

  function saveSession(form) {
    var id = form.dataset.id, f = new FormData(form);
    var type = f.get("type"), fid = f.get("fac") || null, ftext = f.get("facname").trim(), fname = null;

    }).eq("id", id)
      .then(function (r) { if (r.error) throw r.error; toast("Session saved."); return load().then(render); }).catch(fail);

  function setAttendance(sid, mid, on) {

  /* ---------- leader: lessons ---------- */
  function renderLessons() {

  function fileSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  function filesList(lid, ro) {
    var fs = (S.files || []).filter(function (f) { return f.lesson_id === lid; });

  function redrawFiles(lid) { var el = document.getElementById("lfiles"); if (el) el.innerHTML = filesList(lid); }

  function uploadFiles(lid, fileList, input) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length || S.uploading) return;
    S.uploading = true; if (input) input.disabled = true; toast("Uploading...");
    var chain = Promise.resolve(), done = 0;
    files.forEach(function (file) {
      chain = chain.then(function () {
        if (file.size > 52428800) throw new Error(file.name + " is over 50 MB.");
        var safe = file.name.replace(/[^A-Za-z0-9._-]+/g, "_");
        var path = lid + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "-" + safe;
        return sb.storage.from("lesson-files").upload(path, file, { contentType: file.type || "application/octet-stream" }).then(function (r) {
          if (r.error) throw r.error;
          return sb.from("lesson_files").insert({ lesson_id: lid, path: path, name: file.name, size: file.size, content_type: file.type || null }).select().single();
        }).then(function (r) { if (r.error) throw r.error; S.files.push(r.data); done++; redrawFiles(lid); });
      });
    });
    return chain.then(function () { toast(done + (done === 1 ? " file" : " files") + " attached."); })
      .catch(fail).then(function () { S.uploading = false; var el = document.getElementById("l-upload"); if (el) { el.disabled = false; el.value = ""; } });
  }
  function openFile(id) {
    var f = by(id, S.files); if (!f) return;
    var w = window.open("", "_blank");
    return sb.storage.from("lesson-files").createSignedUrl(f.path, 300).then(function (r) {
      if (r.error) throw r.error;
      if (w) w.location.href = r.data.signedUrl; else window.location.href = r.data.signedUrl;
    }).catch(function (e) { if (w) w.close(); fail(e); });
  }
  function removeFile(id) {
    var f = by(id, S.files); if (!f) return;
    return sb.storage.from("lesson-files").remove([f.path]).then(function (r) {
      if (r.error) throw r.error;
      return sb.from("lesson_files").delete().eq("id", id);
    }).then(function (r) {
      if (r.error) throw r.error;
      S.files = S.files.filter(function (x) { return x.id !== id; }); redrawFiles(f.lesson_id); toast("File removed.");
    }).catch(fail);
  }

  function saveLesson(form) {
    var f = new FormData(form), id = form.dataset.id;
    var row = { title: f.get("title").trim(), summary: f.get("summary").trim() || null, content: f.get("content") || null, resources: f.get("resources") || null };
    var checked = f.getAll("sess");
    var p = id ? sb.from("lessons").update(row).eq("id", id).select().single() : sb.from("lessons").insert(row).select().single();
    return p.then(function (r) {
      if (r.error) throw r.error;
      var lid = r.data.id, t = todayStr();
      var ops = [];
      S.sessions.forEach(function (s) {
        if (s.session_date < t) return;
        var ids = lessonIds(s), has = ids.indexOf(lid) > -1, want = checked.indexOf(s.id) > -1;
        if (want && !has) ops.push(sb.from("sessions").update({ lesson_ids: ids.concat(lid) }).eq("id", s.id));
        else if (!want && has) ops.push(sb.from("sessions").update({ lesson_ids: ids.filter(function (x) { return x !== lid; }) }).eq("id", s.id));
      });
      var want = f.getAll("share"), have = S.shares.filter(function (x) { return x.lesson_id === lid; }).map(function (x) { return x.member_id; });
      var addS = want.filter(function (m) { return have.indexOf(m) < 0; }), delS = have.filter(function (m) { return want.indexOf(m) < 0; });
      if (addS.length) ops.push(sb.from("lesson_shares").insert(addS.map(function (m) { return { lesson_id: lid, member_id: m }; })));
      if (delS.length) ops.push(sb.from("lesson_shares").delete().eq("lesson_id", lid).in("member_id", delS));
      return Promise.all(ops).then(function (rs) { rs.forEach(function (x) { if (x.error) throw x.error; }); });
    }).then(function () { toast("Lesson saved."); S.lessonEdit = null; return load().then(render); }).catch(fail);
  }

      '<label class="drop" data-gid="' + g.id + '"><strong>Drag a photo here</strong><span class="small">or click to choose. JPG, PNG or WebP, up to 10 MB.</span><input id="pg-photo" type="file" accept="image/jpeg,image/png,image/webp" data-act="uploadphoto" data-gid="' + g.id + '"></label>' +

  /* Photo gallery (owner, 18 Nov 2026): members swipe through these on the Team Page. groups.photos = [{path, caption}]. */
  function galleryOf(g) { return Array.isArray(g && g.photos) ? g.photos.filter(function (x) { return x && (x.path || x.url); }) : []; }
  function renderGallery(g) {

  function fillThumbs() {

  function saveGallery(gid, list, msg) {

  function uploadGallery(gid, fileList) {
    var files = Array.prototype.slice.call(fileList || []); if (!files.length || S.uploading) return;
    var bad = files.filter(function (f) { return !/^image\/(jpeg|png|webp)$/.test(f.type) || f.size > 10485760; });
    if (bad.length) return fail({ message: "Photos must be JPG, PNG or WebP and up to 10 MB each." });

    var added = [];
    var chain = files.reduce(function (p, file, k) {

  }

  function setMembership(mid, gid, on) {
    var p = on ? sb.from("memberships").insert({ member_id: mid, group_id: gid }) : sb.from("memberships").delete().eq("member_id", mid).eq("group_id", gid);
    return p.then(function (r) {
      if (r.error) throw r.error;
      S.memberships = S.memberships.filter(function (m) { return !(m.member_id === mid && m.group_id === gid); });
      if (on) S.memberships.push({ member_id: mid, group_id: gid });
    }).catch(function (e) { fail(e); refresh(); });
  }
  function setRole(mid, role) {
    return sb.from("profiles").update({ role: role }).eq("id", mid).then(function (r) { if (r.error) throw r.error; toast("Role updated."); return refresh(); }).catch(fail);
  }
  function setCluster(mid, c) {
    return sb.from("profiles").update({ cluster: c || null }).eq("id", mid).then(function (r) { if (r.error) throw r.error; toast("Cluster updated."); return refresh(); }).catch(fail);
  }
  function createCourse(form) {
    var f = new FormData(form), name = f.get("name").trim();
    return sb.from("groups").insert({ name: name, type: "course", year: parseDate(f.get("first")).getFullYear(), cluster: myCluster() }).select().single().then(function (r) {
      if (r.error) throw r.error;
      return sb.rpc("generate_sessions", { p_group: r.data.id, p_first: f.get("first"), p_last: f.get("last"), p_every: +f.get("every") });
    }).then(function (r) { if (r.error) throw r.error; toast("Course created with " + r.data + " sessions."); return refresh(); }).catch(fail);
  }

  /* ---------- render and events ---------- */
  function render() {
    if (!S.user) return renderAuth();
    if (isLeader()) return renderLeader();
    return renderMember();
  }

  var actions = {
    authmode: function () { S.authMode = S.authMode === "in" ? "up" : "in"; renderAuth(); },
    signout: function () { sb.auth.signOut(); },
    book: function (d) { return book(d.id); },
    arbook: function (d) { return arCall("course_book", { p_workshop: d.id, p_waitlist: false }, "Booked. See you there."); },
    arwait: function (d) { return arCall("course_book", { p_workshop: d.id, p_waitlist: true }, "You are on the waiting list."); },
    arcancel: function (d) { if (!confirm("Cancel this?")) return; return arCall("course_cancel", { p_workshop: d.id }, "Cancelled."); },
    cancel: function (d) { return cancelBooking(d.id); },
    tab: function (d) { S.tab = d.tab; S.plan = null; S.lessonEdit = null; S.personEdit = null; S.pageEdit = null; render(); },
    filter: function (d) { S.filter = d.g; render(); },
    cluster: function (d) { S.cluster = d.c; render(); if (S.plan) redrawPlan(); },
    plan: function (d) { S.plan = d.p || null; render(); window.scrollTo(0, 0); },
    typefilter: function (d) { S.typeFilter = d.t; render(); },
    mtab: function (d) { S.memberTab = d.tab; render(); },
    viewlesson: function (d) { S.lessonView = d.id; render(); window.scrollTo(0, 0); },
    lessonviewback: function () { S.lessonView = null; render(); },
    roster: function (d) { return openRoster(d.id); },
    rback: function () { S.rosterSession = null; refresh(); },
    asksession: function (d) { S.delSession = d.id; render(); },
    keepsession: function () { S.delSession = null; render(); },
    deletesession: function (d) {
      return sb.from("sessions").delete().eq("id", d.id).then(function (r) {
        if (r.error) throw r.error;
        S.delSession = null; S.detail = null; toast("Session deleted."); return refresh();
      }).catch(fail);
    },
    attfilter: function (d) { S.attSession = d.sid; S.attFilter = d.f; render(); },
    past: function () { S.showPast = !S.showPast; render(); },
    open: function (d) { S.detail = d.id; S.attFilter = null; render(); window.scrollTo(0, 0); },
    back: function () { S.detail = null; render(); },
    newlesson: function () { S.lessonEdit = "new"; render(); },
    editlesson: function (d) { S.lessonEdit = d.id; render(); window.scrollTo(0, 0); },
    lessonback: function () { S.lessonEdit = null; render(); },
    deletelesson: function (d) {
      if (!window.confirm("Delete this lesson? Sessions using it will be left without a lesson.")) return;
      var paths = (S.files || []).filter(function (f) { return f.lesson_id === d.id; }).map(function (f) { return f.path; });
      var clear = paths.length ? sb.storage.from("lesson-files").remove(paths) : Promise.resolve({});
      return clear.then(function (r) { if (r.error) throw r.error; return sb.from("lessons").delete().eq("id", d.id); })
        .then(function (r) { if (r.error) throw r.error; S.lessonEdit = null; toast("Lesson deleted."); return refresh(); }).catch(fail);
    },
    editpage: function (d) { S.pageEdit = d.id; render(); window.scrollTo(0, 0); },
    pageback: function () { S.pageEdit = null; render(); },
    removephoto: function (d) { return removePhoto(d.id); },
    gremove: function (d) { if (!window.confirm("Remove this photo from the gallery?")) return; return galleryChange(d.gid, function (l) { return l.splice(+d.i, 1)[0].path || null; }, "Photo removed."); },
    gmove: function (d) { return galleryChange(d.gid, function (l) { var x = l.splice(+d.i, 1)[0]; l.splice(+d.to, 0, x); }); },
    askdelcourse: function (d) { S.delCourse = d.id; render(); },
    keepcourse: function () { S.delCourse = null; render(); },
    deletecourse: function (d) {
      var g = groupOf(d.id); if (!g || g.type !== "course") return;
      return sb.from("groups").delete().eq("id", d.id).eq("type", "course").then(function (r) {
        if (r.error) throw r.error;
        S.delCourse = null; if (S.filter === d.id) S.filter = "all"; toast("Course deleted."); return refresh();
      }).catch(fail);
    },
    openfile: function (d) { return openFile(d.id); },
    removefile: function (d) { return removeFile(d.id); },
    droplesson: function (d) { redrawPicker(pickedLessons().filter(function (x) { return x !== d.id; })); },
    editperson: function (d) { S.personEdit = d.id; render(); window.scrollTo(0, 0); },
    personback: function () { S.personEdit = null; render(); }
  };

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t || t.tagName === "INPUT" || t.tagName === "SELECT") return;
    var fn = actions[t.dataset.act]; if (fn) fn(t.dataset, t);
  });
  document.addEventListener("toggle", function (e) { if (e.target.classList && e.target.classList.contains("ar-more")) S.arMore = e.target.open; }, true);
  document.addEventListener("input", function (e) {
    if (e.target && e.target.form && e.target.form.dataset.form === "plan") redrawPlan(e.target);
    if (e.target && e.target.id === "l-res") { var b = document.getElementById("l-links"); if (b) b.innerHTML = linkRow(e.target.value); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.form && t.form.dataset.form === "plan") { redrawPlan(t); return; }
    if (!t.dataset || !t.dataset.act) return;
    if (t.dataset.act === "attend") setAttendance(t.dataset.sid, t.dataset.mid, t.checked);
    else if (t.dataset.act === "rattend") setRoster(t.dataset.sid, t.dataset.mid, t.checked);
    else if (t.dataset.act === "member") setMembership(t.dataset.mid, t.dataset.gid, t.checked);
    else if (t.dataset.act === "role") setRole(t.dataset.mid, t.value);
    else if (t.dataset.act === "pcluster") setCluster(t.dataset.mid, t.value);
    else if (t.dataset.act === "upload") uploadFiles(t.dataset.lid, t.files, t);
    else if (t.dataset.act === "uploadphoto") uploadPhoto(t.dataset.gid, t.files);
    else if (t.dataset.act === "uploadgallery") uploadGallery(t.dataset.gid, t.files);
    else if (t.dataset.act === "gcaption") galleryChange(t.dataset.gid, function (l) { l[+t.dataset.i].caption = t.value.trim(); }, "Caption saved.");
    else if (t.dataset.act === "addlesson" && t.value) { redrawPicker(pickedLessons().concat(t.value)); var a = document.getElementById("s-addlesson"); if (a) a.focus(); }
  });
  /* drag and drop: highlight the drop zone, and stop the browser opening a file dropped elsewhere */
  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0; }
  document.addEventListener("dragover", function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    var z = e.target.closest && e.target.closest(".drop");
    e.dataTransfer.dropEffect = z ? "copy" : "none";
    Array.prototype.forEach.call(document.querySelectorAll(".drop"), function (d) { d.classList.toggle("over", d === z); });
  });
  document.addEventListener("dragleave", function (e) {
    if (!e.relatedTarget) Array.prototype.forEach.call(document.querySelectorAll(".drop"), function (d) { d.classList.remove("over"); });
  });
  document.addEventListener("drop", function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    Array.prototype.forEach.call(document.querySelectorAll(".drop"), function (d) { d.classList.remove("over"); });
    var z = e.target.closest && e.target.closest(".drop");
    if (z && z.dataset.gallery) uploadGallery(z.dataset.gallery, e.dataTransfer.files);
    else if (z && z.dataset.gid) uploadPhoto(z.dataset.gid, e.dataTransfer.files);
    else if (z) uploadFiles(z.dataset.lid, e.dataTransfer.files);
  });
  document.addEventListener("submit", function (e) {
    var form = e.target; if (!form.dataset.form) return;
    e.preventDefault();
    var btn = form.querySelector('[type="submit"]'); if (btn) btn.disabled = true;
    var kind = form.dataset.form, f = new FormData(form), job;
    if (kind === "auth") {
      var raw = f.get("email").trim(), email = loginEmail(raw), pass = f.get("pass");
      if (S.authMode === "up" && raw.indexOf("@") > -1) { if (btn) btn.disabled = false; return fail({ message: "Enter your ambulance ID number, not an email address." }); }
      job = S.authMode === "up"
        ? sb.auth.signUp({ email: email, password: pass, options: { data: { full_name: f.get("name").trim(), staff_id: raw } } }).then(function (r) {
            if (r.error) throw r.error;
            if (!r.data.session) return sb.auth.signInWithPassword({ email: email, password: pass }).then(function (x) { if (x.error) throw x.error; });
          })
        : sb.auth.signInWithPassword({ email: email, password: pass }).then(function (r) { if (r.error) throw r.error; });
      job = job.catch(fail);
    } else if (kind === "resetpw") {
      job = sb.rpc("leader_set_password", { member: form.dataset.id, new_password: f.get("pw") }).then(function (r) { if (r.error) throw r.error; form.reset(); toast("Password set. Let them know."); }).catch(fail);
    } else if (kind === "reflection") job = saveReflection(form);
    else if (kind === "session") job = saveSession(form);
    else if (kind === "lesson") job = saveLesson(form);
    else if (kind === "course") job = createCourse(form);
    else if (kind === "plan") job = createPlan(form);
    else if (kind === "onesession") job = createOne(form);
    else if (kind === "page") job = savePage(form);
    if (job) job.then(function () { if (btn && document.contains(btn)) btn.disabled = false; });
  });

  /* ---------- start ---------- */
  function onSession(session) {
    S.user = session ? session.user : null;
    if (!S.user) { S.profile = null; S.detail = null; S.tab = location.hash === "#lessons" ? "lessons" : "calendar"; return renderAuth(); }
    load().then(render).catch(function (e) { fail(e); renderAuth(); });
  }
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(function () { onSession(session); }, 0);
  });
})();
</script>
</body>
</html>
