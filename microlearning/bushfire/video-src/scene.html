<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:6,stdDeviation:8,"flood-color":"#000","flood-opacity":.28},sh)}
/* reveal: fade/slide in starting at time s */
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function tick(g,x,y,a,r){r=r||20;el("circle",{cx:x,cy:y,r,fill:a>0?C.ok:"rgba(255,255,255,.15)"},g);
  if(a>0)el("path",{d:`M${x-r*.45} ${y} L${x-r*.1} ${y+r*.38} L${x+r*.5} ${y-r*.35}`,fill:"none",stroke:"#fff","stroke-width":r*.28,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":60,"stroke-dashoffset":60*(1-a)},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?(Array.isArray(sub)?h*.32:h*.42):h*.62),"font-size":32,"font-weight":700},gg);
  if(Array.isArray(sub))sub.forEach((ln,k)=>txt(ln,{x:x+34,y:y+h*.62+k*30,"font-size":23,fill:"#cfe7da"},gg));
  else if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function bullets(g,x,y,items,t,starts,col){items.forEach((s,i)=>{const a=rv(t,starts[i]);const gg=grp(g,a);
  el("circle",{cx:x,cy:y+i*50-9,r:7,fill:col||C.gold},gg);txt(s,{x:x+24,y:y+i*50,"font-size":28},gg)})}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>70;
  el("rect",{x:70,y:long?570:590,width:1140,height:long?112:84,rx:22,fill:"rgba(0,0,0,.34)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>62?30:34,"font-weight":600},g);
  else{ // wrap into two lines at the nearest space to the middle
    let m=Math.floor(s.text.length/2), L=s.text.lastIndexOf(" ",m), R=s.text.indexOf(" ",m);
    const cut=(m-L<R-m||R<0)?L:R;
    const fs=s.text.length>150?25:(s.text.length>125?28:32);
    txt(s.text.slice(0,cut),{x:640,y:620,"text-anchor":"middle","font-size":fs,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:664,"text-anchor":"middle","font-size":fs,"font-weight":600},g);}
  txt("SAAS PRO-239 · PRO-082",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const chips=(items,x0,y,starts,fill,maxX)=>{let x=x0,yy=y;items.forEach((c,k)=>{const w=c.length*13.2+40;if(x+w>maxX){x=x0;yy+=62}
      const a=rv(T,starts[k],0.35);if(a>0){const g2=grp(g,a);el("rect",{x,y:yy,width:w,height:48,rx:24,fill:Array.isArray(fill)?fill[k]:fill},g2);txt(c,{x:x+w/2,y:yy+31,"text-anchor":"middle","font-size":22,"font-weight":700},g2)}x+=w+10})};
  const tiles=(labels,starts,y,hiLast)=>{const n=labels.length,gap=20,w=(1140-(n-1)*gap)/n;labels.forEach((p,k)=>{const a=rv(T,starts[k],0.4), x=70+k*(w+gap);
      const hi=hiLast&&k===n-1;
      const gg=grp(g,a);el("rect",{x,y,width:w,height:170,rx:26,fill:hi?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,y+50,p[0],hi?"#fff":C.gold);
      txt(p[1],{x:x+w/2,y:y+113,"text-anchor":"middle","font-size":27,"font-weight":800,fill:hi?C.ink:"#fff"},gg);txt(p[2],{x:x+w/2,y:y+147,"text-anchor":"middle","font-size":22,fill:hi?C.ink:"#cfe7da"},gg)})};
  const big=(x,y,w,h,title,sub,a,tone)=>{if(a<=0)return;const gg=grp(g,a);
      card(gg,x,y,w,h,tone==="no"?"rgba(226,87,76,.28)":tone==="ok"?"rgba(63,174,116,.30)":C.card,tone==="no"?"rgba(226,87,76,.7)":tone==="ok"?"rgba(139,224,177,.7)":C.cardLine);
      txt(title,{x:x+w/2,y:y+(sub?h*.44:h*.6),"text-anchor":"middle","font-size":30,"font-weight":800},gg);
      if(sub)txt(sub,{x:x+w/2,y:y+h*.78,"text-anchor":"middle","font-size":22,fill:"#e6f2ec"},gg)};

  if(i===0){
    txt("BUSHFIRE",{x:640,y:280,"text-anchor":"middle","font-size":120,"font-weight":800,"letter-spacing":"-4",opacity:rv(T,S[0].s,0.5)},g);
    el("rect",{x:640-210*rv(T,S[0].s+0.2,0.7),y:308,width:420*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("and burnover  ·  Ambulance Officer microlearning",{x:640,y:370,"text-anchor":"middle","font-size":32,fill:"#dff1e7",opacity:rv(T,S[0].s+0.6,0.5)},g);
    chips(["Standby at a staging area","Treating fire casualties","Driving home from a job"],96,400,[S[1].s,S[2].s,S[3].s],"rgba(0,0,0,.32)",1215);
    big(70,470,1140,90,"Burnover: a fast fire front overtakes people and vehicles",null,rv(T,S[4].s)*(T<S[5].s?1:0),"no");
    if(T>=S[5].s){badge(g,"Best protection: not being there",640,490,rv(T,S[5].s,0.4),"rgba(63,174,116,.6)");
      badge(g,"If it happens: know the drill",640,550,rv(T,S[6].s,0.4),"rgba(227,167,18,.6)");}
  }

  if(i===1){
    txt("Fire Danger Rating: not how likely, but how bad",{x:70,y:170,"font-size":28,"font-weight":700,fill:C.gold,opacity:rv(T,S[0].s,0.4)},g);
    const R=[["Moderate","Plan and prepare","#4caf50",3],["High","Be ready to act","#e6c619",5],["Extreme","Take action now","#ef7d1a",7],["Catastrophic","For your survival, leave bushfire risk areas","#b3261e",9]];
    R.forEach((r,k)=>{const y=190+k*78,a=rv(T,S[r[3]].s);if(a<=0)return;const gg=grp(g,a);card(gg,70,y,1140,66);
      el("rect",{x:70,y,width:260,height:66,rx:22,fill:r[2]},gg);txt(r[0],{x:200,y:y+43,"text-anchor":"middle","font-size":30,"font-weight":800,fill:k===1?C.ink:"#fff"},gg);
      txt(r[1],{x:360,y:y+43,"font-size":28,opacity:rv(T,S[r[3]+1].s,0.4)},gg)});
    badge(g,"ABC Port Lincoln · 1485 AM",640,535,rv(T,S[11].s,0.4),"rgba(0,0,0,.4)");
  }

  if(i===2){
    txt("Extreme or Catastrophic day: check the vehicle",{x:70,y:170,"font-size":28,"font-weight":700,fill:C.gold,opacity:rv(T,S[0].s,0.4)},g);
    chips(["Burnover kit","Helmets","P2 masks","Plenty of water"],70,195,[S[1].s,S[2].s,S[3].s,S[4].s],"rgba(63,174,116,.55)",1210);
    const fa=rv(T,S[5].s,0.5);
    if(fa>0){const gg=grp(g,fa);card(gg,70,270,1140,120);txt("Fuel",{x:110,y:340,"font-size":32,"font-weight":800},gg);
      el("rect",{x:220,y:312,width:900,height:36,rx:18,fill:"rgba(255,255,255,.15)"},gg);
      el("rect",{x:220,y:312,width:900*0.75*eo(pr(T,S[5].s,S[5].s+1.2)),height:36,rx:18,fill:C.gold},gg);
      txt("at least ¾",{x:220+900*0.75-12,y:338,"text-anchor":"end","font-size":24,"font-weight":800,fill:C.ink,opacity:pr(T,S[5].s+0.8,S[5].s+1.2)},gg);}
    big(70,415,1140,110,"No burnover kit? Tell the OM or CTL","at the start of the shift",rv(T,S[6].s),"no");
  }

  if(i===3){
    row(g,70,160,1140,72,"The EOC directs every response into a fire area",null,rv(T,S[0].s),C.gold);
    row(g,70,245,1140,72,"Often the CFS brings patients to a staging area",null,rv(T,S[1].s),C.ok);
    row(g,70,330,1140,72,"No active fireground without a fire appliance escort",null,rv(T,S[2].s),C.red);
    chips(["All lights on","A place to turn around","Burnt ground"],70,425,[S[4].s,S[4].s+1.2,S[5].s],"rgba(0,0,0,.32)",1210);
    badge(g,"Any doubt? Don't go in. Call the EOC.",640,535,rv(T,S[6].s,0.4),"rgba(226,87,76,.6)");
  }

  if(i===4){
    big(70,160,1140,80,"Don't try to outrun it",null,rv(T,S[0].s),"no");
    chips(["A building close by?","If not: stay in the vehicle","Long blasts on the siren or horn"],70,262,[S[1].s,S[2].s,S[3].s],["rgba(0,0,0,.32)","rgba(63,174,116,.55)","rgba(227,167,18,.55)"],1210);
    const pa=rv(T,S[4].s,0.6);
    if(pa>0){const gg=grp(g,pa);
      el("rect",{x:70,y:395,width:1140,height:160,rx:22,fill:"rgba(0,0,0,.25)"},gg);
      // vehicle facing right, towards the fire
      el("rect",{x:300,y:455,width:230,height:70,rx:12,fill:"#f4f4ef"},gg);el("rect",{x:470,y:435,width:70,height:90,rx:12,fill:"#f4f4ef"},gg);
      el("rect",{x:500,y:445,width:32,height:34,rx:6,fill:"#7fb3d5"},gg);el("circle",{cx:350,cy:530,r:18,fill:"#333"},gg);el("circle",{cx:490,cy:530,r:18,fill:"#333"},gg);
      el("path",{d:"M570 490 L760 490",stroke:C.gold,"stroke-width":7,"stroke-dasharray":"6 14","stroke-linecap":"round"},gg);
      [0,1,2,3,4].forEach(k=>{const x=820+k*70,h=60+((k*37)%40);el("path",{d:`M${x} 545 Q${x-25} ${545-h*0.6} ${x+5} ${545-h} Q${x+30} ${545-h*0.5} ${x+25} 545 Z`,fill:k%2?"#e2574c":"#ef7d1a"},gg)});
      txt("off the road · clearest spot · windscreen to the fire",{x:640,y:423,"text-anchor":"middle","font-size":24,fill:"#dff1e7"},gg);}
  }

  if(i===5){
    tiles([["1","MAYDAY ×3","GRN emergency button"],["2","Location","Garmin coordinates"]],[S[0].s,S[2].s],160,false);
    chips(["Windows and vents shut","Engine off","Air conditioner off","Headlights, hazards, beacons on"],70,355,[S[3].s,S[4].s,S[5].s,S[6].s],"rgba(0,0,0,.32)",1210);
    badge(g,"Gloves · P2 mask · goggles",640,525,rv(T,S[7].s,0.4),"rgba(227,167,18,.6)");
  }

  if(i===6){
    const a=rv(T,S[0].s,0.5);
    if(a>0){const gg=grp(g,a);
      el("rect",{x:70,y:160,width:1140,height:220,rx:22,fill:"rgba(0,0,0,.25)"},gg);
      el("path",{d:"M100 250 L1180 250",stroke:"#7fb3d5","stroke-width":4,"stroke-dasharray":"14 10"},gg);
      txt("window level",{x:1170,y:240,"text-anchor":"end","font-size":22,fill:"#7fb3d5"},gg);
      txt("Stay below it, beside the airway seat",{x:640,y:330,"text-anchor":"middle","font-size":32,"font-weight":700},gg);}
    chips(["Woollen fire blanket","Patient: blankets + a mask","Drink water, don't pour it"],70,405,[S[1].s,S[2].s,S[3].s],"rgba(0,0,0,.32)",1210);
    badge(g,"Look after each other",400,515,rv(T,S[5].s,0.4),"rgba(63,174,116,.6)");
    badge(g,"Stay in until the sound has passed",860,515,rv(T,S[6].s,0.4),"rgba(227,167,18,.6)");
  }

  if(i===7){
    tiles([["1","Helmet + PPE","get out carefully"],["2","Side or back","window, not windscreen"],["3","Injuries","check everyone"],["4","EOC","then burnt ground"]],[S[0].s,S[1].s,S[3].s,S[4].s],160,false);
    big(70,355,1140,80,"A medical officer checks you before your shift is decided",null,rv(T,S[5].s),"");
    chips(["Know the day","Know your kit","Know the drill"],330,470,[S[6].s,S[7].s,S[8].s],"rgba(227,167,18,.6)",1210);
  }
}
const Z={w:"#f4f4ef",y:"#e6dc63",r:"#d9786e",p:"#9b7fc4"};
function badge(g,s,x,y,a,col){
  if(a<=0)return;
  const gg=grp(g,a), w=s.length*15.5+56;
  el("rect",{x:x-w/2,y:y-30,width:w,height:56,rx:28,fill:col||"rgba(0,0,0,.35)"},gg);
  txt(s,{x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":700},gg);
}
function render(t){
  v.innerHTML=""; defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Bushfire and burnover",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("SAAS PRO-239 · PRO-082  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
