<style>
/* Just-for-fun version of the lead instructor's dashboard: an old-school car instrument cluster.
   Same live sources as /dashboard/ (roster coverage, paging feed, tasks, training sessions, Open-Meteo),
   read by this page's own script below. Gauges:
   fuel = roster cover left today, speedo = crew on now, tacho = jobs in the last 24 h,
   temperature = today's top, tasks = open tasks; warning lights, odometer, trip meter and a radio display. */
:root {
  --bg:#120d0b; --ink:#f4ead4; --muted:#b9a88a; --face:#f3ead2; --face-ink:#1d1712; --needle:#e0482a;
  --wood1:#5a321c; --wood2:#3f2213; --wood3:#6e3e22; --chrome1:#f7f7f7; --chrome2:#8d939a;
  --amber:#ffb22e; --red:#ff4433; --green:#5dff7a; --blue:#4fb3ff; --lcd:#9dff7a; --lcd-bg:#0d1a0c;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#120d0b; } }
:root[data-theme="dark"] { --bg:#120d0b; }
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; }
body { min-height:100vh; background:radial-gradient(ellipse at 50% 0%,#2a1d17 0%,var(--bg) 60%); color:var(--ink);
  font-family:"Oswald",system-ui,sans-serif; letter-spacing:.02em; -webkit-font-smoothing:antialiased;
  padding:18px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left)); }
a { color:var(--muted); }
[hidden] { display:none !important; }
.top { max-width:1500px; margin:0 auto 14px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:space-between; }
.badge { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); }
.badge img { width:46px; height:46px; border-radius:50%; padding:3px; background:radial-gradient(circle at 35% 30%,#fff,#9aa1a8 55%,#e9ecef 70%,#6c737a); box-shadow:0 2px 8px rgba(0,0,0,.6); }
.badge b { display:block; font-size:22px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; background:linear-gradient(#fff,#a9b0b7 60%,#e8ebee); -webkit-background-clip:text; background-clip:text; color:transparent; }
.badge span { font-size:12px; color:var(--muted); letter-spacing:.2em; text-transform:uppercase; }
.links { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
.links a { text-decoration:none; } .links a:hover { color:var(--ink); }

/* the walnut dash */
.dash { max-width:1500px; margin:0 auto; border-radius:34px 34px 22px 22px; padding:26px 26px 22px; position:relative;
  background:
    repeating-linear-gradient(92deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(88deg,rgba(0,0,0,.18) 0 1px,transparent 1px 23px),
    radial-gradient(ellipse at 30% 20%,var(--wood3),transparent 60%),
    linear-gradient(180deg,var(--wood1),var(--wood2));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -6px 18px rgba(0,0,0,.5),0 30px 60px -20px rgba(0,0,0,.8),0 0 0 3px #1c120c,0 0 0 5px #8d939a; }
.binnacle { display:grid; grid-template-columns:1fr 1.25fr 1.5fr 1.25fr 1fr; align-items:end; gap:14px; padding:18px 18px 10px;
  border-radius:200px 200px 40px 40px / 120px 120px 40px 40px; background:linear-gradient(#0b0807,#1b1310); box-shadow:inset 0 10px 30px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08); }
.pod { display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; border:0; background:none; padding:0; color:inherit; font:inherit; }
.pod svg { width:100%; height:auto; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,.8)); }
.pod:focus-visible { outline:2px solid var(--amber); outline-offset:4px; border-radius:50%; }
.plate { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#1a1612; padding:3px 12px; border-radius:4px; white-space:nowrap;
  background:linear-gradient(#f2f4f6,#aeb4ba 55%,#e3e6e9); box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 4px rgba(0,0,0,.6); max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.plate b { font-weight:600; }

/* lower console */
.console { display:grid; grid-template-columns:1fr 1.6fr 1.4fr; gap:16px; margin-top:18px; align-items:stretch; }
.lights { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px; border-radius:14px; background:#0c0908; box-shadow:inset 0 4px 14px rgba(0,0,0,.9); }
.tt { border:0; font:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 4px; border-radius:10px; background:#17110e; color:#3b302a; text-decoration:none; cursor:default;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05); transition:color .4s, text-shadow .4s, background .4s; }
.tt i { font-style:normal; font-size:22px; line-height:1; }
.tt span { font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
.tt.on { cursor:pointer; }
.tt.on.amber { color:var(--amber); text-shadow:0 0 8px var(--amber),0 0 18px rgba(255,178,46,.5); background:#22180c; }
.tt.on.red { color:var(--red); text-shadow:0 0 8px var(--red),0 0 18px rgba(255,68,51,.5); background:#250f0b; }
.tt.on.green { color:var(--green); text-shadow:0 0 8px var(--green); background:#0f1d10; }
.tt.on.blue { color:var(--blue); text-shadow:0 0 8px var(--blue); background:#0d1722; }
@media (prefers-reduced-motion:no-preference) { .tt.on.blink { animation:blink 1.1s steps(2,start) infinite; } }
@keyframes blink { to { visibility:hidden; } }
.lcd { border-radius:14px; padding:12px 16px; background:linear-gradient(#0a0807,#140e0b); box-shadow:inset 0 4px 14px rgba(0,0,0,.9); display:flex; flex-direction:column; gap:10px; justify-content:center; }
.odo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.odo small { font-size:11px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; min-width:44px; }
.drum { display:inline-flex; gap:2px; padding:3px; background:#000; border-radius:4px; box-shadow:0 0 0 2px #6c737a; }
.drum span { font-family:"Share Tech Mono",monospace; font-size:24px; width:20px; text-align:center; color:#eee; background:linear-gradient(#111,#2a2a2a 50%,#111); border-radius:2px; }
.drum span:last-child { color:#111; background:linear-gradient(#ddd,#fff 50%,#ccc); }
.screen { font-family:"Share Tech Mono",monospace; color:var(--lcd); background:var(--lcd-bg); border-radius:6px; padding:8px 12px; text-shadow:0 0 6px rgba(157,255,122,.6);
  box-shadow:inset 0 0 12px rgba(0,0,0,.9); }
.clock { font-size:38px; line-height:1; letter-spacing:.06em; }
.clock small { font-size:14px; margin-left:8px; color:#6fbf58; }
.radio { border-radius:14px; padding:12px 14px; background:linear-gradient(#1f1a17,#0f0c0a); box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:10px; }
.radio .band { display:flex; justify-content:space-between; align-items:center; font-size:11px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; }
.radio .marq { font-family:"Share Tech Mono",monospace; font-size:18px; color:var(--amber); text-shadow:0 0 6px rgba(255,178,46,.6); background:#140c04; border-radius:6px; padding:10px 12px; min-height:68px; line-height:1.35; }
.knobs { display:flex; gap:10px; justify-content:space-between; }
.knob { flex:1; border:0; border-radius:8px; padding:8px 4px; font:inherit; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#1a1612; cursor:pointer;
  background:linear-gradient(#f2f4f6,#9aa1a8 55%,#d9dde1); box-shadow:0 3px 0 #4a4f55,0 4px 8px rgba(0,0,0,.6); }
.knob:active { transform:translateY(2px); box-shadow:0 1px 0 #4a4f55; }
.knob:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
.foot { max-width:1500px; margin:14px auto 0; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--muted); letter-spacing:.06em; }

@media (max-width:1100px) {
  .binnacle { grid-template-columns:repeat(2,1fr); border-radius:30px; }
  .pod.speed { grid-column:1 / -1; order:-1; max-width:420px; justify-self:center; width:100%; }
  .console { grid-template-columns:1fr; }
}
@media (max-width:520px) { .dash { padding:14px; border-radius:22px; } .binnacle { padding:12px; gap:10px; } .plate { font-size:10.5px; padding:3px 8px; } .lights { grid-template-columns:repeat(3,1fr); } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#9aa1a8"/><stop offset=".55" stop-color="#f1f3f5"/><stop offset=".8" stop-color="#6c737a"/><stop offset="1" stop-color="#d9dde1"/></linearGradient>
    <radialGradient id="face" cx=".5" cy=".42" r=".65"><stop offset="0" stop-color="#fbf5e6"/><stop offset=".8" stop-color="#ece0c2"/><stop offset="1" stop-color="#cdbd98"/></radialGradient>
    <radialGradient id="cap" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#9aa1a8"/><stop offset="1" stop-color="#3d4248"/></radialGradient>
    <linearGradient id="coldhot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f7fd8"/><stop offset=".5" stop-color="#e8e0c8"/><stop offset="1" stop-color="#d33a22"/></linearGradient>

<header class="top">
  <a class="badge" href="/"><img src="/microlearning/shared/dsy-logo.png" alt=""><div><b id="hello">DSY Motor Works</b><span>Eyre Peninsula ambulance teams</span></div></a>
  <nav class="links"><a href="/dashboard/wide/">Widescreen dashboard</a><a href="/dashboard/">Phone dashboard</a><a href="/">DSY home</a></nav>
</header>

<main class="dash">
  <div class="binnacle">
    <button class="pod fuel" id="p-fuel" type="button" data-go="/modules/rosters/operations/" aria-label="Roster cover left today"><span id="g-fuel"></span><span class="plate">Roster <b id="v-fuel">…</b></span></button>
    <button class="pod" id="p-tach" type="button" data-go="/dispatch/" aria-label="Jobs in the last 24 hours"><span id="g-tach"></span><span class="plate">Jobs 24 h <b id="v-tach">…</b></span></button>
    <button class="pod speed" id="p-speed" type="button" data-go="/modules/rosters/operations/" aria-label="Crew on shift now"><span id="g-speed"></span><span class="plate">Crew on now <b id="v-speed">…</b></span></button>
    <button class="pod" id="p-tasks" type="button" data-go="/dashboard/wide/" aria-label="Open tasks"><span id="g-tasks"></span><span class="plate">Tasks <b id="v-tasks">…</b></span></button>
    <button class="pod temp" id="p-temp" type="button" aria-label="Today's top temperature. Tap to change town"><span id="g-temp"></span><span class="plate"><span id="v-town">Tumby Bay</span> <b id="v-temp">…</b></span></button>
  </div>

  <div class="console">
    <div class="lights" id="lights" aria-label="Warning lights"></div>
    <div class="lcd">
      <div class="screen clock"><span id="time">--:--</span><small id="date"></small></div>
      <div class="odo"><small>Odo</small><span class="drum" id="odo" title="Jobs in the last 7 days"></span><small style="min-width:0">jobs · 7 days</small></div>
      <div class="odo"><small>Trip</small><span class="screen" id="trip" style="padding:4px 10px;font-size:15px">Next training …</span></div>
    </div>
    <div class="radio">
      <div class="band"><span>DSY FM · 88.1</span><span id="chan">1 / 1</span></div>
      <div class="marq" id="marq" aria-live="polite">Tuning in…</div>
      <div class="knobs"><button class="knob" id="prev" type="button">◀ Seek</button><button class="knob" id="refresh" type="button">↻ Refresh</button><button class="knob" id="next" type="button">Seek ▶</button></div>
    </div>
  </div>
</main>
<footer class="foot"><span id="updated">Ignition…</span><span>Just for fun: the same live data as the dashboard. Tap a gauge to open its page.</span></footer>

<script>
(function () {
  "use strict";
  var TZ = "Australia/Adelaide";
  var sb = window.supabase.createClient("https://ekaodnbnpsuayvmxvxbm.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrYW9kbmJucHN1YXl2bXh2eGJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NzIxMzQsImV4cCI6MjEwNzM0ODEzNH0.q3lTeCQAQjYeMUNl6lwsrxUAsTijJikABW4Ua2N4bmI");
  var $ = function (id) { return document.getElementById(id); };
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function t12(t) { var p = String(t).split(":"), h = +p[0]; return (h % 12 || 12) + (p[1] === "00" ? "" : ":" + p[1]) + (h < 12 ? "am" : "pm"); }

  /* ---------- gauges (SVG) ---------- */
  function pt(a, r) { var t = a * Math.PI / 180; return [(r * Math.sin(t)).toFixed(2), (-r * Math.cos(t)).toFixed(2)]; }
  function arc(a, b, r) { var p = pt(a, r), q = pt(b, r); return "M" + p[0] + " " + p[1] + " A" + r + " " + r + " 0 " + (b - a > 180 ? 1 : 0) + " 1 " + q[0] + " " + q[1]; }
  var G = {};
  function gauge(id, o) {
    o.a0 = o.a0 == null ? -135 : o.a0; o.a1 = o.a1 == null ? 135 : o.a1;
    G[id] = o; o.ang = function (v) { v = Math.max(o.min, Math.min(o.max, v)); return o.a0 + (v - o.min) / (o.max - o.min) * (o.a1 - o.a0); };

    s += '<circle r="118" fill="url(#chrome)"/><circle r="110" fill="#111"/><circle r="106" fill="url(#face)"/>';

      '<polygon points="-3.5,14 0,-' + (o.nl || 90) + ' 3.5,14" fill="#e0482a" stroke="#7a1d0c" stroke-width=".8"/></g><circle r="11" fill="url(#cap)"/><circle r="3" fill="#2a2a2a"/></svg>';

  function needle(id, v) { var n = $("n-" + id); if (n) n.style.transform = "rotate(" + G[id].ang(v) + "deg)"; }

  gauge("speed", { min: 0, max: 24, major: 4, minor: 1, title: "CREW ON NOW", unit: "crew on shift", labels: [0, 4, 8, 12, 16, 20, 24].map(function (v) { return [v, String(v)]; }), zones: [[0, 2, "#d33a22"], [2, 6, "#e6a23a"]], lr: 66, lsize: 20 });

    ["ok", "✔", "All good", "green", null]
  ];
  $("lights").innerHTML = LIGHTS.map(function (l) { return '<a class="tt ' + l[3] + '" id="t-' + l[0] + '" title="' + esc(l[2]) + '"' + (l[4] ? ' data-href="' + l[4] + '"' : "") + '><i aria-hidden="true">' + l[1] + "</i><span>" + esc(l[2]) + "</span></a>"; }).join("");
  var lit = {};
  function light(id, on, tip) {
    var e = $("t-" + id); if (!e) return; lit[id] = !!on;
    e.classList.toggle("on", !!on); if (tip) e.title = tip;
    var href = e.getAttribute("data-href"); if (on && href) e.setAttribute("href", href); else e.removeAttribute("href");
    var warn = ["lowcrew", "p1", "check", "service", "fire", "data"].some(function (k) { return lit[k]; });
    var ok = $("t-ok"); ok.classList.toggle("on", !warn);
  }
  tick(); setInterval(tick, 1000);

  /* ---------- radio messages ---------- */
  var MSG = {}, ORDER = ["train", "lesson", "crew", "job", "wx", "tasks"], chan = 0;
  function msgs() { return ORDER.filter(function (k) { return MSG[k]; }).map(function (k) { return MSG[k]; }); }
  function radio(step) {
    var m = msgs(); if (!m.length) return;
    chan = ((chan + (step || 0)) % m.length + m.length) % m.length;
    $("marq").textContent = m[chan]; $("chan").textContent = (chan + 1) + " / " + m.length;
  }
  $("prev").addEventListener("click", function () { radio(-1); restartRadio(); });
  $("next").addEventListener("click", function () { radio(1); restartRadio(); });
  var rTimer; function restartRadio() { clearInterval(rTimer); rTimer = setInterval(function () { radio(1); }, 6000); }

  /* ---------- roster: fuel + speedo ---------- */
  var CLUSTERS = [
    "https://script.google.com/macros/s/AKfycbxEboPS9reZI5OpUMdlriag0QeAJzIyXFZ2Jy0z_4qBJLEK054R5bDcJgyWAW2YSP6l/exec",
    "https://script.google.com/macros/s/AKfycbwbeUGYW4VaBC8i0k228ASyRQt-B4_7pKKr5F3O5L-CrCmTH0hnx48pN7QTqkjXrfwRDA/exec",
    "https://script.google.com/macros/s/AKfycbxrcfdjF7kUZQBkHuw2mqrYXhqz54VrK9Agv-zzOyBG8BbAbC-lrDkY6zGK91VAwB_z/exec"];
  var fails = {};
  function failed(k, bad) { fails[k] = bad; light("data", Object.keys(fails).some(function (x) { return fails[x]; }), "No signal from: " + Object.keys(fails).filter(function (x) { return fails[x]; }).join(", ")); }
  function opDate() { var p = parts(), d = p.year + "-" + p.month + "-" + p.day; return +p.hour < 8 ? addDays(d, -1) : d; }
  function loadRoster() {
    var date = opDate(), now = Date.now();
    return Promise.all(CLUSTERS.map(function (url) {
      return window.DSY_ROSTER_DATA.coverage(url, date).then(function (d) { if (!d.ok) throw new Error("bad"); return d; }).catch(function () { return null; });
    })).then(function (res) {
      var teams = 0, crew = 0, empty = 0, slots = 0, covered = 0;
      res.forEach(function (d) {
        if (!d) return;
        var ni = 0; d.hours.forEach(function (h, i) { if (Date.parse(h.start) <= now && now < Date.parse(h.end)) ni = i; });
        d.teams.forEach(function (t, ti) {
          if (/summer bay/i.test(t.name || "")) return;
          teams++; var c = d.hours[ni].counts[ti] || 0; crew += c; if (!c) empty++;
          for (var i = ni; i < d.hours.length; i++) { slots++; if (d.hours[i].counts[ti] >= 1) covered++; }
        });
      });
      if (!teams) { failed("roster", true); show("fuel", 0, "no signal"); show("speed", 0, "no signal"); return; }
      failed("roster", res.some(function (d) { return !d; }));
      var f = slots ? covered / slots : 0;
      show("fuel", f, Math.round(f * 100) + "%"); show("speed", crew, String(crew));
      light("lowcrew", f < .25, Math.round(f * 100) + "% of team-hours left today have crew");
      MSG.crew = "ON AIR NOW: " + crew + " crew on shift · " + (teams - empty) + " of " + teams + " teams crewed · " + Math.round(f * 100) + "% of the rest of today covered.";
      radio(0);
    });
  }

  /* ---------- dispatch: tacho + odometer ---------- */
  var HIDE = { PL: 1, CD: 1 };   // Port Lincoln and Ceduna crews, as on the dashboard
  function naive(date, time) { var a = date.split("-"), b = String(time).split(":"); return Date.UTC(+a[0], a[1] - 1, +a[2], +b[0], +b[1]); }
  function loadJobs() {
    var t = todayIso();
    return sb.from("paging_jobs").select("job_date,job_time,locality,job_type,priority,unit").gte("job_date", addDays(t, -6)).lte("job_date", t).order("job_date").order("job_time").then(function (r) {
      if (r.error) throw r.error;
      var p = parts(), nowN = naive(t, p.hour + ":" + p.minute);
      var jobs = (r.data || []).filter(function (j) { return !HIDE[String(j.unit || "").replace(/\d+$/, "")]; });
      var day = jobs.filter(function (j) { var n = naive(j.job_date, j.job_time); return n <= nowN && nowN - n <= 864e5; });
      var p1 = day.filter(function (j) { return +j.priority === 1; });
      show("tach", day.length, String(day.length));
      var o = String(Math.min(jobs.length, 999999)); while (o.length < 6) o = "0" + o;
      $("odo").innerHTML = o.split("").map(function (c) { return "<span>" + c + "</span>"; }).join("");
      light("p1", p1.length > 0, p1.length + " priority 1 job" + (p1.length === 1 ? "" : "s") + " in the last 24 hours");
      var last = jobs[jobs.length - 1];
      MSG.job = last ? "LATEST JOB: " + nice(last.job_date) + " " + String(last.job_time).slice(0, 5) + " · " + (last.job_type || "job") + " · " + (last.locality || "") + " · P" + last.priority + " (" + last.unit + ")" : "NO JOBS in the last 7 days (Port Lincoln and Ceduna crews not counted).";
      failed("dispatch", false); radio(0);
    }).catch(function () { failed("dispatch", true); show("tach", 0, "no signal"); });
  }

  /* ---------- tasks ---------- */
  function loadTasks() {
    return sb.from("dashboard_tasks").select("title,due_date,done").eq("done", false).then(function (r) {
      if (r.error) throw r.error;
      var t = todayIso(), open = r.data || [], late = open.filter(function (x) { return x.due_date && x.due_date < t; });
      show("tasks", open.length, open.length + (late.length ? " · " + late.length + " late" : ""));
      light("check", late.length > 0, late.length + " overdue task" + (late.length === 1 ? "" : "s"));
      MSG.tasks = open.length ? "TO DO: " + open.length + " open task" + (open.length === 1 ? "" : "s") + (late.length ? ", " + late.length + " overdue" : "") + ". Next up: " + open.sort(function (a, b) { return (a.due_date || "9") < (b.due_date || "9") ? -1 : 1; })[0].title : "TO DO: nothing on the list. Enjoy the drive.";
      failed("tasks", false); radio(0);
    }).catch(function () { failed("tasks", true); show("tasks", 0, "no signal"); });
  }

  /* ---------- training: trip meter + service light ---------- */
  function hasLesson(s) { return !!s.lesson_id || (Array.isArray(s.lesson_ids) && s.lesson_ids.length > 0); }
  function loadSessions() {
    var t = todayIso();
    return Promise.all([
      sb.from("sessions").select("group_id,session_date,start_time,topic,lesson_id,lesson_ids,session_type").gte("session_date", t).lte("session_date", addDays(t, 27)).order("session_date").order("start_time"),
      sb.from("groups").select("id,name,cluster"),
      sb.rpc("my_access").then(function (x) { return { data: [{ cluster: (x.data && x.data.cluster) || null }] }; })
    ]).then(function (r) {
      if (r[0].error) throw r[0].error;
      // a leader with a cluster sees their own cluster's training here (16 Nov 2026)
      var gn = {}, gc = {}; (r[1].data || []).forEach(function (g) { gn[g.id] = g.name; gc[g.id] = g.cluster; });
      var mine = (r[2].data && r[2].data[0] && r[2].data[0].cluster) || null;
      var rows = (r[0].data || []).filter(function (s) { return !mine || !gc[s.group_id] || gc[s.group_id] === mine; }), need = rows.filter(function (s) { return !hasLesson(s); }), n = rows[0];
      if (n) {
        var days = Math.round((dOf(n.session_date) - dOf(t)) / 864e5);
        $("trip").textContent = (days === 0 ? "TODAY" : days === 1 ? "TOMORROW" : days + " DAYS") + " · " + (gn[n.group_id] || "Team") + " " + t12(n.start_time);
        MSG.train = "NEXT TRAINING: " + (gn[n.group_id] || "Team") + (n.topic ? " · " + n.topic : "") + " · " + nice(n.session_date) + " " + t12(n.start_time) + (hasLesson(n) ? "" : " · no lesson yet");
      } else { $("trip").textContent = "NO TRAINING BOOKED"; MSG.train = "NEXT TRAINING: nothing booked in the next 4 weeks."; }
      MSG.lesson = need.length ? "SERVICE DUE: " + need.length + " of " + rows.length + " sessions in the next 4 weeks need a lesson." : (rows.length ? "SERVICE: every session in the next 4 weeks has a lesson." : null);
      light("service", need.length > 0, need.length + " sessions need a lesson");
      failed("training", false); radio(0);
    }).catch(function () { failed("training", true); $("trip").textContent = "NO SIGNAL"; });
  }

  /* ---------- weather: temperature gauge + fire light ---------- */
  var TOWNS = [["Tumby Bay", -34.375, 136.103], ["Port Neill", -34.118, 136.350], ["Cummins", -34.264, 135.727], ["Coffin Bay", -34.620, 135.468], ["Port Lincoln", -34.726, 135.858],
    ["Cleve", -33.700, 136.494], ["Cowell", -33.682, 136.921], ["Lock", -33.567, 135.757], ["Elliston", -33.648, 134.889], ["Wudinna", -33.049, 135.463], ["Kimba", -33.141, 136.418], ["Streaky Bay", -32.797, 134.212], ["Port Kenny", -33.171, 134.687]];
  var ti = Math.max(0, TOWNS.map(function (x) { return x[0]; }).indexOf(store("dsy-dash-town") || "Tumby Bay"));
  function loadWeather() {
    var x = TOWNS[ti]; $("v-town").textContent = x[0];
    return fetch("https://api.open-meteo.com/v1/forecast?latitude=" + x[1] + "&longitude=" + x[2] + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_gusts_10m_max&timezone=Australia%2FAdelaide&forecast_days=7")
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (w) {
        var d = w.daily, hi = Math.round(d.temperature_2m_max[0]), hot = [];
        d.time.forEach(function (iso, i) { if (d.temperature_2m_max[i] >= 35 && d.wind_gusts_10m_max[i] >= 40) hot.push(nice(iso)); });
        show("temp", hi, hi + "°");
        light("fire", hot.length > 0, "Hot and windy: " + hot.join(", ") + ". Check the CFS fire danger.");
        MSG.wx = "WEATHER " + x[0].toUpperCase() + ": today " + Math.round(d.temperature_2m_min[0]) + "° to " + hi + "°, " + d.precipitation_probability_max[0] + "% chance of rain" + (hot.length ? " · HOT AND WINDY: " + hot.join(", ") : "") + ".";
        failed("weather", false); radio(0);
      }).catch(function () { failed("weather", true); show("temp", 0, "no signal"); });
  }
  $("p-temp").addEventListener("click", function () { ti = (ti + 1) % TOWNS.length; store("dsy-dash-town", TOWNS[ti][0]); loadWeather(); });

  /* ---------- go ---------- */
  document.querySelectorAll(".pod[data-go]").forEach(function (b) { b.addEventListener("click", function () { location.href = b.getAttribute("data-go"); }); });
  function stamp() { $("updated").textContent = "Updated " + new Intl.DateTimeFormat("en-AU", { timeZone: TZ, hour: "numeric", minute: "2-digit" }).format(new Date()); }
  function loadAll() { stamp(); loadRoster(); loadJobs(); loadTasks(); loadSessions(); loadWeather(); }
  $("refresh").addEventListener("click", loadAll);
  (window.DSY_GATE ? window.DSY_GATE.ready : Promise.resolve({})).then(function (me) {
    if (me && me.name) $("hello").textContent = "G'day " + String(me.name).split(" ")[0];
    loadAll(); restartRadio();
    setInterval(function () { stamp(); loadRoster(); loadJobs(); loadTasks(); loadSessions(); }, 10 * 60000);
    setInterval(loadWeather, 60 * 60000);
  });
})();
</script>
</body>
</html>
