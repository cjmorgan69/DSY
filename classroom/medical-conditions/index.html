<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Conditions classroom slides</title>
<link rel="stylesheet" href="assets/style.css?v=20261028a">
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="stage" aria-live="polite"></div>
    <nav id="menu" aria-label="Slide list"></nav>
    <div id="black"></div>
    <div id="guide" aria-label="Facilitator guide"></div>
    <div id="bar">
      <button id="bMenu" title="Slide list (M)">&#9776; Slides</button>
      <button id="bPrev" title="Previous (left arrow)">&#9664;</button>
      <span id="count"></span>
      <button id="bNext" title="Next (right arrow)">&#9654;</button>
      <span class="grow"></span>
      <button id="bNotes" title="Facilitator notes (N)">Notes</button>
      <button id="bGuide" title="Facilitator guide">Guide</button>
      <button id="bPres" title="Presenter window (P)">Presenter view</button>
      <button id="bFull" title="Full screen (F)">Full screen</button>
    </div>
    <div id="progress"></div>
  </div>
  <aside id="notes" aria-label="Facilitator notes"></aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="data/manifest.js?v=20261028a"></script>
<script src="assets/common.js?v=20261028a"></script>
<script src="assets/player.js?v=20261028a"></script>
</body>
</html>
