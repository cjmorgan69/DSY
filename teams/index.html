<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Team Page</title>
<meta name="theme-color" content="#1f5b43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../training/theme.css">
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading...</p></div>
<div id="toast" class="toast err" hidden></div>

<script src="../training/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";
  var C = window.TRAINING_APP;
  var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey);
  var $app = document.getElementById("app");
  var $toast = document.getElementById("toast");
  var S = { user: null, profile: null, groups: [], current: null, authMode: "in", photoUrl: null, next: null };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fail(e) { $toast.textContent = e && e.message ? e.message : "Something went wrong. Try again."; $toast.hidden = false; clearTimeout(fail.t); fail.t = setTimeout(function () { $toast.hidden = true; }, 6000); }
  function parseDate(d) { var p = String(d).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayStr() { var n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); }
  function hhmm(t) { var h = +String(t).slice(0, 2), m = String(t).slice(3, 5), ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return h + (m === "00" ? "" : ":" + m) + ap; }
  function safeUrl(u) { u = String(u || "").trim(); return /^(https?:\/\/|\/)/i.test(u) && u.indexOf("//") !== 0 ? u : (/^https?:\/\//i.test(u) ? u : ""); }
  function links(g) { return Array.isArray(g.links) ? g.links.filter(function (l) { return l && l.label && safeUrl(l.url); }) : []; }
  function hasContent(g) { return !!(g.blurb || g.photo_path || safeUrl(g.roster_url) || links(g).length); }
  function isLeader() { return S.profile && S.profile.role === "leader"; }
  function q(p) { return p.then(function (r) { if (r.error) throw r.error; return r.data || []; }); }

  function loginEmail(v) { v = String(v || "").trim(); if (v.indexOf("@") > -1) return v.toLowerCase(); return v.toLowerCase().replace(/[^a-z0-9]/g, "") + "@id.dsytraining.com"; }
  function renderAuth() {
    var up = S.authMode === "up";
    $app.innerHTML = '<div class="auth stack"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>Team Page</h1><p>Sign in with your training account.</p></div></div>' +
      '<form class="panel pad stack" id="authform">' +
      (up ? '<label>Your name<input id="f-name" name="name" autocomplete="name" required></label>' : "") +
      '<label>' + (up ? "Ambulance ID number" : "Ambulance ID number (or email)") + '<input id="f-email" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>' +
      '<label>Password<input id="f-pass" name="pass" type="password" minlength="8" autocomplete="' + (up ? "new-password" : "current-password") + '" required></label>' +
      '<button class="btn" type="submit">' + (up ? "Create account" : "Sign in") + '</button>' +
      '<button class="linkbtn" type="button" id="swap">' + (up ? "I already have an account" : "Create an account") + '</button></form></div>';
  }

  function chooseGroup(list) {
    var want = decodeURIComponent((location.hash || "").slice(1));
    var hit = list.filter(function (g) { return g.id === want; })[0];
    return hit || list.filter(hasContent)[0] || list[0] || null;
  }

  function load() {
    return q(sb.from("profiles").select("*").eq("id", S.user.id)).then(function (rows) {
      S.profile = rows[0] || { role: "member", full_name: "" };
      return q(sb.from("groups").select("*").order("type", { ascending: false }).order("name"));
    }).then(function (groups) {
      S.groups = groups;
      var pool = isLeader() ? groups : groups.filter(hasContent);
      if (!isLeader() && !pool.length) { location.replace("../training/"); return null; }
      S.current = chooseGroup(pool);
      if (!S.current) { $app.innerHTML = header() + '<div class="panel pad muted">You have not been added to a team yet. Ask your team leader to add you, then come back.</div>'; return null; }
      return loadGroup();
    });
  }

  function loadGroup() {
    var g = S.current; S.photoUrl = null; S.next = null;
    var jobs = [];
    if (g.photo_path) jobs.push(sb.storage.from("team-photos").createSignedUrl(g.photo_path, 3600).then(function (r) { if (!r.error) S.photoUrl = r.data.signedUrl; }));
    jobs.push(sb.from("upcoming_sessions").select("*").eq("group_id", g.id).gte("session_date", todayStr()).order("session_date").order("start_time").limit(1).then(function (r) { if (!r.error && r.data && r.data[0]) S.next = r.data[0]; }));
    return Promise.all(jobs).then(render);
  }

  function header() {
    return '<header class="top"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>' + esc(C.appName || "Team Training") + '</h1><p>' + esc((S.profile && S.profile.full_name) || "") + '</p></div></div>' +
      '<div class="row"><a class="link" href="../training/">Training</a><button class="link" type="button" id="signout">Sign out</button></div></header>';
  }

  function paras(text) {
    return String(text || "").split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean).map(function (p) { return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>"; }).join("");
  }

  function render() {
    var g = S.current, html = header();
    var pool = isLeader() ? S.groups : S.groups.filter(hasContent);
    if (pool.length > 1) {
      html += '<div class="chips" role="group" aria-label="Choose a team">' + pool.map(function (x) { return '<button type="button" data-g="' + x.id + '" aria-pressed="' + (x.id === g.id) + '">' + esc(x.name) + "</button>"; }).join("") + "</div>";
    }
    html += '<section class="hero' + (S.photoUrl ? "" : " plain") + '">' + (S.photoUrl ? '<img src="' + esc(S.photoUrl) + '" alt="' + esc(g.name) + '">' : "") +
      '<div class="cap"><h1>' + esc(g.name) + "</h1><p>" + (g.type === "course" ? "Course" : "Team") + "</p></div></section>";
    if (isLeader() && !hasContent(g)) html += '<div class="notice">This page is empty, so members of ' + esc(g.name) + ' go straight to the training schedule. Add a photo, information and links in Training, People, Team pages.</div>';
    var ru = safeUrl(g.roster_url);
    html += '<div class="actions"><a class="big" href="../training/">Training schedule<span>Book a spot and see upcoming sessions</span></a>' +
      (ru ? '<a class="big alt" href="' + esc(ru) + '">Your roster<span>Open the roster for ' + esc(g.name) + "</span></a>" : "") + "</div>";
    if (S.next) {
      var d = parseDate(S.next.session_date);
      html += '<section class="panel nextcard"><div class="when"><span class="dow">' + d.toLocaleDateString("en-AU", { weekday: "short" }) + '</span><span class="dom">' + d.getDate() + '</span><span class="mon">' + d.toLocaleDateString("en-AU", { month: "short" }) + '</span></div>' +
        '<div class="what"><span class="eyebrow">Next training</span><span class="t">' + ((S.next.lesson_title || S.next.topic) ? esc(S.next.lesson_title || S.next.topic) : '<span class="muted">Topic to be confirmed</span>') + '</span><span class="small muted">' + hhmm(S.next.start_time) + " to " + hhmm(S.next.end_time) + (S.next.location ? " - " + esc(S.next.location) : "") + (S.next.facilitator_name ? " - Led by " + esc(S.next.facilitator_name) : "") + "</span></div>" +
        '<a class="link" href="../training/">Book</a></section>';
    }
    if (g.blurb) html += '<section class="panel pad stack"><h2>About ' + esc(g.name) + '</h2><div class="prose">' + paras(g.blurb) + "</div></section>";
    var ls = links(g);
    if (ls.length) html += '<section class="panel pad stack"><h2>Policies, procedures and links</h2><ul class="links">' + ls.map(function (l) { return '<li><a href="' + esc(safeUrl(l.url)) + '" rel="noopener">' + esc(l.label) + "</a></li>"; }).join("") + "</ul></section>";
    $app.innerHTML = html;
  }

  $app.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.id === "signout") sb.auth.signOut();
    else if (t.id === "swap") { S.authMode = S.authMode === "in" ? "up" : "in"; renderAuth(); }
    else if (t.dataset.g) { S.current = S.groups.filter(function (x) { return x.id === t.dataset.g; })[0]; history.replaceState(null, "", "#" + encodeURIComponent(S.current.id)); loadGroup().catch(fail); }
  });
  $app.addEventListener("submit", function (e) {
    if (e.target.id !== "authform") return;
    e.preventDefault();
    var f = new FormData(e.target), btn = e.target.querySelector('[type="submit"]'); btn.disabled = true;
    var raw = f.get("email").trim(), email = loginEmail(raw), pass = f.get("pass");
    if (S.authMode === "up" && raw.indexOf("@") > -1) { btn.disabled = false; return fail({ message: "Enter your ambulance ID number, not an email address." }); }
    var job = S.authMode === "up"
      ? sb.auth.signUp({ email: email, password: pass, options: { data: { full_name: f.get("name").trim(), staff_id: raw } } }).then(function (r) {
          if (r.error) throw r.error;
          if (!r.data.session) return sb.auth.signInWithPassword({ email: email, password: pass }).then(function (x) { if (x.error) throw x.error; });
        })
      : sb.auth.signInWithPassword({ email: email, password: pass }).then(function (r) { if (r.error) throw r.error; });
    job.catch(fail).then(function () { if (document.contains(btn)) btn.disabled = false; });
  });

  function onSession(session) {
    S.user = session ? session.user : null;
    if (!S.user) return renderAuth();
    load().catch(function (e) { fail(e); renderAuth(); });
  }
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(function () { onSession(session); }, 0);
  });
})();
</script>
</body>
</html>
