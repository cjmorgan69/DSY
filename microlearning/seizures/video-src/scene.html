<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:6,stdDeviation:8,"flood-color":"#000","flood-opacity":.28},sh)}
/* reveal: fade/slide in starting at time s */
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function tick(g,x,y,a,r){r=r||20;el("circle",{cx:x,cy:y,r,fill:a>0?C.ok:"rgba(255,255,255,.15)"},g);
  if(a>0)el("path",{d:`M${x-r*.45} ${y} L${x-r*.1} ${y+r*.38} L${x+r*.5} ${y-r*.35}`,fill:"none",stroke:"#fff","stroke-width":r*.28,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":60,"stroke-dashoffset":60*(1-a)},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?(Array.isArray(sub)?h*.32:h*.42):h*.62),"font-size":32,"font-weight":700},gg);
  if(Array.isArray(sub))sub.forEach((ln,k)=>txt(ln,{x:x+34,y:y+h*.62+k*30,"font-size":23,fill:"#cfe7da"},gg));
  else if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function bullets(g,x,y,items,t,starts,col){items.forEach((s,i)=>{const a=rv(t,starts[i]);const gg=grp(g,a);
  el("circle",{cx:x,cy:y+i*50-9,r:7,fill:col||C.gold},gg);txt(s,{x:x+24,y:y+i*50,"font-size":28},gg)})}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>70;
  el("rect",{x:70,y:long?570:590,width:1140,height:long?112:84,rx:22,fill:"rgba(0,0,0,.34)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>62?30:34,"font-weight":600},g);
  else{ // wrap into two lines at the nearest space to the middle
    let m=Math.floor(s.text.length/2), L=s.text.lastIndexOf(" ",m), R=s.text.indexOf(" ",m);
    const cut=(m-L<R-m||R<0)?L:R;
    const fs=s.text.length>150?25:(s.text.length>125?28:32);
    txt(s.text.slice(0,cut),{x:640,y:620,"text-anchor":"middle","font-size":fs,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:664,"text-anchor":"middle","font-size":fs,"font-weight":600},g);}
  txt("SAAS CPP-014-AO",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const frac=(k,f)=>S[k].s+(S[k].e-S[k].s)*f;
  const tiles=(labels,starts,y,hiLast)=>labels.forEach((p,k)=>{const a=rv(T,starts[k],0.4), w=262, x=70+k*292;
      const hi=hiLast&&k===labels.length-1;
      const gg=grp(g,a);el("rect",{x,y,width:w,height:170,rx:26,fill:hi?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,y+50,p[0],hi?"#fff":C.gold);
      txt(p[1],{x:x+w/2,y:y+113,"text-anchor":"middle","font-size":27,"font-weight":800,fill:hi?C.ink:"#fff"},gg);txt(p[2],{x:x+w/2,y:y+147,"text-anchor":"middle","font-size":22,fill:hi?C.ink:"#cfe7da"},gg)});

  if(i===0){
    txt("SEIZURES",{x:640,y:300,"text-anchor":"middle","font-size":130,"font-weight":800,"letter-spacing":"-4",opacity:rv(T,S[0].s,0.5)},g);
    txt("Ambulance Officer microlearning",{x:640,y:380,"text-anchor":"middle","font-size":36,fill:"#dff1e7",opacity:rv(T,S[1].s,0.5)},g);
    badge(g,"Protect · time it · call at 5 minutes",640,470,rv(T,frac(1,0.5),0.5),"rgba(63,174,116,.55)");
  }

  if(i===1){
    row(g,70,150,1140,90,"A sign of abnormal brain activity",null,rv(T,S[0].s),C.gold);
    row(g,70,256,1140,80,"Many possible causes",null,rv(T,S[1].s),C.mint);
    row(g,70,352,1140,96,"Generalised seizure","usually the whole body, with a loss or marked change in consciousness",rv(T,S[2].s),C.gold);
    const a=rv(T,S[3].s,0.5); if(a>0){const gg=grp(g,a);card(gg,70,464,1140,80,"rgba(226,87,76,.28)","rgba(226,87,76,.7)");
      txt("Can threaten the airway and breathing",{x:104,y:516,"font-size":32,"font-weight":800},gg)}
  }

  if(i===2){
    const it=[["Basic care and life support",S[0].s,0],["BGL: treat hypoglycaemia (CPP-009-AO)",S[1].s,0],["SpO2 below 94%: oxygen",S[2].s,0],["Febrile child: remove outer clothing",S[3].s,0],["No restraint, other than for safety",S[4].s,1]];
    it.forEach((x,k)=>{const b=rv(T,x[1],0.4); if(b<=0)return; const gg=grp(g,b), Y=145+k*82;
      card(gg,70,Y,1140,70,x[2]?"rgba(226,87,76,.25)":null,x[2]?"rgba(226,87,76,.6)":null); tick(gg,114,Y+35,b,18);
      txt(x[0],{x:150,y:Y+46,"font-size":30,"font-weight":700},gg)});
  }

  if(i===3){
    row(g,70,150,1140,86,"Request clinical support",null,rv(T,S[0].s),C.gold);
    txt("Treatable causes",{x:70,y:282,"font-size":28,"font-weight":700,fill:C.gold,opacity:rv(T,S[1].s,0.4)},g);
    tiles([["1","Hypoglycaemia","low sugar"],["2","Hypoxia","low oxygen"],["3","Head trauma","an injury"],["4","Hyperthermia","overheating"]],[frac(2,0.05),frac(2,0.3),frac(2,0.55),frac(2,0.8)],300,false);
    const a=rv(T,S[3].s,0.5); if(a>0){const gg=grp(g,a);card(gg,70,486,1140,70,"rgba(63,174,116,.30)","rgba(139,224,177,.7)");
      txt("Febrile convulsions: 6 months to 6 years, usually settle",{x:104,y:532,"font-size":28,"font-weight":700},gg)}
  }

  if(i===4){
    const a=rv(T,S[0].s,0.5); if(a>0){const gg=grp(g,a);card(gg,70,150,1140,150);
      txt("Time it from the start",{x:104,y:198,"font-size":30,"font-weight":800},gg);
      const x0=104,x1=1170,y=250; el("rect",{x:x0,y:y-6,width:x1-x0,height:12,rx:6,fill:"rgba(255,255,255,.18)"},gg);
      const f=eo(pr(T,S[0].s,S[1].e)); el("rect",{x:x0,y:y-6,width:(x1-x0)*f,height:12,rx:6,fill:f>0.83?C.red:C.gold},gg);
      for(let m=0;m<=6;m++){const xx=x0+(x1-x0)*m/6; txt(m+" min",{x:xx,y:y+40,"text-anchor":"middle","font-size":20,fill:m===5?C.gold:"#cfe7da","font-weight":m===5?800:400},gg)}
      el("rect",{x:x0+(x1-x0)*5/6-3,y:y-22,width:6,height:44,rx:3,fill:C.gold},gg)}
    row(g,70,320,1140,96,"Or clusters, little or no recovery","stopping effective breathing, or causing harm (injury or hypoxia)",rv(T,S[2].s),C.gold);
    const c=rv(T,S[3].s,0.5); if(c>0){const gg=grp(g,c);card(gg,70,436,1140,96,"rgba(227,167,18,.30)","rgba(227,167,18,.8)");
      txt("Consult the EOC Clinician",{x:640,y:498,"text-anchor":"middle","font-size":40,"font-weight":800},gg)}
  }

  if(i===5){
    row(g,70,145,1140,80,"IM midazolam: on EOC Clinician advice",null,rv(T,S[0].s),C.gold);
    const a=rv(T,S[1].s,0.5); if(a>0){const gg=grp(g,a);card(gg,70,240,560,150);el("rect",{x:70,y:240,width:8,height:150,rx:4,fill:C.gold},gg);
      txt("0.15 mg/kg",{x:104,y:300,"font-size":44,"font-weight":800,fill:C.gold},gg);txt("single max 10 mg",{x:104,y:350,"font-size":28,"font-weight":600},gg)}
    const b=rv(T,S[2].s,0.5); if(b>0){const gg=grp(g,b);card(gg,650,240,560,150);el("rect",{x:650,y:240,width:8,height:150,rx:4,fill:C.gold},gg);
      txt("65+ or frail < 40 kg",{x:684,y:290,"font-size":30,"font-weight":800,fill:C.gold},gg);txt("half the per kg dose",{x:684,y:333,"font-size":27,"font-weight":600},gg);txt("max 5 mg",{x:684,y:370,"font-size":26,fill:"#cfe7da"},gg)}
    row(g,70,406,560,80,"Max 5 mL per site","1 mg/mL: 10 mg = two sites",rv(T,S[3].s),C.mint);
    row(g,650,406,560,80,"Crew and patient safety",null,rv(T,S[4].s),C.mint);
  }

  if(i===6){
    row(g,70,150,1140,96,"Be ready","respiratory depression and loss of airway control",rv(T,S[0].s),C.gold);
    const a=rv(T,S[2].s,0.5); if(a>0){const gg=grp(g,a);card(gg,70,266,1140,110);el("rect",{x:70,y:266,width:8,height:110,rx:4,fill:C.mint},gg);
      txt("Trismus (clenched jaw)?",{x:104,y:312,"font-size":32,"font-weight":800},gg);txt("Consider a nasopharyngeal airway (CPPRO-025)",{x:104,y:352,"font-size":26,fill:"#cfe7da"},gg)}
    const c=rv(T,S[3].s,0.5); if(c>0){const gg=grp(g,c);card(gg,70,396,1140,90,"rgba(226,87,76,.30)","rgba(226,87,76,.75)");
      txt("Not breathing normally: CPR",{x:640,y:453,"text-anchor":"middle","font-size":36,"font-weight":800},gg)}
  }

  if(i===7){
    row(g,70,145,560,90,"Their seizure plan","if they have one",rv(T,S[0].s),C.mint);
    row(g,650,145,560,90,"Closest ED","early notification",rv(T,S[1].s),C.mint);
    tiles([["1","Basic care","BGL, SpO2"],["2","Time it","from the start"],["3","5 minutes","consult"],["4","Airway","be ready"]],[frac(2,0.1),frac(2,0.3),frac(2,0.55),frac(2,0.8)],260,true);
    badge(g,"Try the seizure checker",640,500,rv(T,S[3].s,0.5),"rgba(0,0,0,.35)");
  }
}
function badge(g,s,x,y,a,col){
  if(a<=0)return;
  const gg=grp(g,a), w=s.length*15.5+56;
  el("rect",{x:x-w/2,y:y-30,width:w,height:56,rx:28,fill:col||"rgba(0,0,0,.35)"},gg);
  txt(s,{x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":700},gg);
}
function render(t){
  v.innerHTML=""; defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Seizures",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("SAAS CPP-014-AO  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
