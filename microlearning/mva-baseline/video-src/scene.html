<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:6,stdDeviation:8,"flood-color":"#000","flood-opacity":.28},sh)}
/* reveal: fade/slide in starting at time s */
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function tick(g,x,y,a,r){r=r||20;el("circle",{cx:x,cy:y,r,fill:a>0?C.ok:"rgba(255,255,255,.15)"},g);
  if(a>0)el("path",{d:`M${x-r*.45} ${y} L${x-r*.1} ${y+r*.38} L${x+r*.5} ${y-r*.35}`,fill:"none",stroke:"#fff","stroke-width":r*.28,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":60,"stroke-dashoffset":60*(1-a)},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?(Array.isArray(sub)?h*.32:h*.42):h*.62),"font-size":32,"font-weight":700},gg);
  if(Array.isArray(sub))sub.forEach((ln,k)=>txt(ln,{x:x+34,y:y+h*.62+k*30,"font-size":23,fill:"#cfe7da"},gg));
  else if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function bullets(g,x,y,items,t,starts,col){items.forEach((s,i)=>{const a=rv(t,starts[i]);const gg=grp(g,a);
  el("circle",{cx:x,cy:y+i*50-9,r:7,fill:col||C.gold},gg);txt(s,{x:x+24,y:y+i*50,"font-size":28},gg)})}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>70;
  el("rect",{x:70,y:long?570:590,width:1140,height:long?112:84,rx:22,fill:"rgba(0,0,0,.34)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>62?30:34,"font-weight":600},g);
  else{ // wrap into two lines at the nearest space to the middle
    let m=Math.floor(s.text.length/2), L=s.text.lastIndexOf(" ",m), R=s.text.indexOf(" ",m);
    const cut=(m-L<R-m||R<0)?L:R;
    const fs=s.text.length>150?25:(s.text.length>125?28:32);
    txt(s.text.slice(0,cut),{x:640,y:620,"text-anchor":"middle","font-size":fs,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:664,"text-anchor":"middle","font-size":fs,"font-weight":600},g);}
  txt("SAAS CPP-063-AO · CTL-070 · CTL-042",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const chips=(items,x0,y,starts,fill,maxX)=>{let x=x0,yy=y;items.forEach((c,k)=>{const w=c.length*13.2+40;if(x+w>maxX){x=x0;yy+=62}
      const a=rv(T,starts[k],0.35);if(a>0){const g2=grp(g,a);el("rect",{x,y:yy,width:w,height:48,rx:24,fill:Array.isArray(fill)?fill[k]:fill},g2);txt(c,{x:x+w/2,y:yy+31,"text-anchor":"middle","font-size":22,"font-weight":700,fill:Array.isArray(fill)&&fill[k]===Z.w?C.ink:"#fff"},g2)}x+=w+10})};
  const tiles=(labels,starts,y,hiLast)=>labels.forEach((p,k)=>{const a=rv(T,starts[k],0.4), w=270, x=70+k*290;
      const hi=hiLast&&k===labels.length-1;
      const gg=grp(g,a);el("rect",{x,y,width:w,height:170,rx:26,fill:hi?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,y+50,p[0],hi?"#fff":C.gold);
      txt(p[1],{x:x+135,y:y+113,"text-anchor":"middle","font-size":27,"font-weight":800,fill:hi?C.ink:"#fff"},gg);txt(p[2],{x:x+135,y:y+147,"text-anchor":"middle","font-size":24,fill:hi?C.ink:"#cfe7da"},gg)});
  const zone=(x,y,w,h,label,fill,a,dark)=>{if(a<=0)return;const gg=grp(g,a);el("rect",{x,y,width:w,height:h,rx:18,fill},gg);
      txt(label,{x:x+w/2,y:y+h/2+11,"text-anchor":"middle","font-size":30,"font-weight":800,fill:dark?C.ink:"#fff"},gg)};

  if(i===0){
    txt("BASELINE OBS",{x:640,y:320,"text-anchor":"middle","font-size":130,"font-weight":800,"letter-spacing":"-4",opacity:rv(T,S[0].s,0.5)},g);
    el("rect",{x:640-220*rv(T,S[0].s+0.2,0.7),y:352,width:440*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("at a high-speed MVA  ·  Ambulance Officer microlearning",{x:640,y:420,"text-anchor":"middle","font-size":34,fill:"#dff1e7",opacity:rv(T,S[1].s,0.5)},g);
    badge(g,"One set can't tell you",640,470,rv(T,S[4].s,0.5),"rgba(226,87,76,.5)");
    badge(g,"Two or more sets show the trend",640,540,rv(T,S[5].s,0.5),"rgba(63,174,116,.55)");
  }

  if(i===1){
    tiles([["1","Gain, measure","and record"],["2","Two full sets","in the first hour"],["3","Every 15 min","at least"],["4","First set","= the baseline"]],[S[0].s,S[1].s,S[3].s,S[4].s],170,true);
    badge(g,"Risk · deterioration · response to treatment",640,420,rv(T,S[2].s,0.5),"rgba(0,0,0,.35)");
    badge(g,"Every later set is compared with it",640,500,rv(T,S[5].s,0.5),"rgba(227,167,18,.5)");
  }

  if(i===2){
    txt("A complete set",{x:70,y:175,"font-size":28,"font-weight":700,fill:C.gold,opacity:rv(T,S[0].s,0.4)},g);
    chips(["Resp rate","SpO2 + any O2","Blood pressure","Pulse rate","Temperature","GCS + pupils","Pain score","BGL"],70,200,[S[0].s,S[1].s,S[2].s,S[3].s,S[6].s,S[7].s,S[8].s,S[9].s],"rgba(0,0,0,.32)",1210);
    badge(g,"Feel the pulse: record the pulse rate, not the ECG heart rate",640,440,rv(T,S[4].s,0.5),"rgba(227,167,18,.5)");
  }

  if(i===3){
    txt("Adult RDR Chart (CTL-070)",{x:70,y:175,"font-size":28,"font-weight":700,fill:C.gold,opacity:rv(T,S[0].s,0.4)},g);
    [["White",Z.w,1],["Yellow",Z.y,1],["Red",Z.r,0],["Purple",Z.p,0]].forEach((z,k)=>zone(70+k*290,195,270,70,z[0],z[1],rv(T,S[2].s+k*0.35,0.35),z[2]));
    badge(g,"Yellow, red or purple: obs more often",640,315,rv(T,S[4].s,0.5),"rgba(0,0,0,.35)");
    txt("Escalate if",{x:70,y:385,"font-size":28,"font-weight":700,fill:C.gold,opacity:rv(T,S[5].s,0.4)},g);
    row(g,70,400,370,70,"Yellow → red,",null,rv(T,S[5].s),Z.r);
    txt("or red → purple",{x:250,y:500,"text-anchor":"middle","font-size":24,fill:"#cfe7da",opacity:rv(T,S[5].s+1.2,0.4)},g);
    row(g,455,400,370,70,"Any purple",null,rv(T,S[6].s),Z.p);
    row(g,840,400,370,70,"3+ red or yellow",null,rv(T,S[7].s),Z.y);
  }

  if(i===4){
    const X0=150,X1=1130,Y0=200,Y1=520, xs=[0,1,2,3].map(k=>X0+k*(X1-X0)/3);
    const ax=rv(T,S[0].s,0.4);
    el("line",{x1:X0,y1:Y1,x2:X1,y2:Y1,stroke:"rgba(255,255,255,.35)","stroke-width":2,opacity:ax},g);
    ["Set 1 (baseline)","Set 2","Set 3","Set 4"].forEach((s,k)=>txt(s,{x:xs[k],y:Y1+34,"text-anchor":"middle","font-size":20,fill:"#cfe7da",opacity:ax},g));
    const line=(pts,col,label,st,dur,lab)=>{const p=pr(T,st,st+dur);if(p<=0)return;
      const n=pts.length-1, upto=p*n; let d="";
      for(let k=0;k<=n;k++){if(k>upto+1e-6){const f=upto-(k-1);const x=pts[k-1][0]+(pts[k][0]-pts[k-1][0])*f,y=pts[k-1][1]+(pts[k][1]-pts[k-1][1])*f;d+=` L${x} ${y}`;break}
        d+=(k?" L":"M")+pts[k][0]+" "+pts[k][1]}
      el("path",{d,fill:"none",stroke:col,"stroke-width":6,"stroke-linecap":"round","stroke-linejoin":"round"},g);
      if(lab)txt(label,{x:lab[0],y:lab[1],"font-size":24,"font-weight":800,fill:col,opacity:eo(p)},g)};
    line([[xs[0],370],[xs[1],320],[xs[2],270],[xs[3],225]],Z.r,"Pulse",S[2].s,1.2,[X1+12,232]);
    line([[xs[0],420],[xs[1],395],[xs[2],365],[xs[3],335]],C.gold,"Resp rate",S[3].s,1.2,[X1+12,342]);
    line([[xs[0],300],[xs[1],303],[xs[2],308]],"#9fd3ff","BP",S[4].s,1.4,null);
    line([[xs[2],308],[xs[3],470]],"#9fd3ff","BP",S[5].s,0.8,null);
    txt("BP",{x:X1+12,y:477,"font-size":24,"font-weight":800,fill:"#9fd3ff",opacity:rv(T,S[4].s,0.5)},g);
    badge(g,"No baseline? You won't see the climb",640,170,rv(T,S[6].s,0.5),"rgba(226,87,76,.5)");
    txt("Illustration only (DSY, from the shock video)",{x:X0,y:Y0-12,"font-size":17,fill:"#cfe7da",opacity:ax*(1-rv(T,S[6].s,0.3))},g);
  }

  if(i===5){
    txt("Major Trauma Tool (CTL-042): Level 1 at any time",{x:70,y:170,"font-size":28,"font-weight":700,fill:C.gold,opacity:rv(T,S[0].s,0.4)},g);
    const cell=(x,y,a,big,sm)=>{if(a<=0)return;const gg=grp(g,a);card(gg,x,y,560,86);el("rect",{x,y,width:8,height:86,rx:4,fill:Z.r},gg);
      txt(big,{x:x+30,y:y+54,"font-size":32,"font-weight":800},gg);txt(sm,{x:x+540,y:y+54,"text-anchor":"end","font-size":22,fill:"#cfe7da"},gg)};
    cell(70,190,rv(T,S[1].s),"GCS ≤ 13","or 2 below normal");
    cell(650,190,rv(T,S[2].s),"SBP ≤ 100","mmHg");
    cell(70,290,rv(T,S[3].s),"HR < 50 or > 120","/min");
    cell(650,290,rv(T,S[4].s),"RR < 10 or > 30","/min");
    badge(g,"Set 1: not Level 1.  Set 3: maybe",640,425,rv(T,S[5].s,0.5),"rgba(0,0,0,.35)");
    const a=rv(T,S[6].s,0.5); if(a>0){const gg=grp(g,a);card(gg,70,465,1140,90,"rgba(226,87,76,.28)","rgba(226,87,76,.7)");
      txt("Unstable: closest trauma service or nearest ED, early notification",{x:640,y:520,"text-anchor":"middle","font-size":29,"font-weight":800},gg)}
  }

  if(i===6){
    txt("Temperature on the RDR chart",{x:70,y:175,"font-size":28,"font-weight":700,fill:C.gold,opacity:rv(T,S[0].s,0.4)},g);
    zone(70,195,370,80,"35.6 – 38.0",Z.w,rv(T,S[0].s+0.5,0.4),1);
    zone(455,195,370,80,"35.1 – 35.5",Z.y,rv(T,S[1].s,0.4),1);
    zone(840,195,370,80,"≤ 35.0",Z.r,rv(T,S[2].s,0.4),0);
    row(g,70,305,1140,80,"Hypothermia happens in hot and cold weather",null,rv(T,S[3].s),C.gold);
    row(g,70,395,1140,80,"Keep them warm and dry",null,rv(T,S[4].s),C.mint);
    badge(g,"Lethal triad video: why cold matters in bleeding",640,520,rv(T,S[5].s,0.5),"rgba(0,0,0,.35)");
  }

  if(i===7){
    row(g,70,160,1140,80,"Direct pressure on the bleeding",null,rv(T,S[0].s),C.mint);
    row(g,70,250,1140,80,"Request clinical support early",null,rv(T,S[1].s),C.gold);
    row(g,70,340,1140,80,"Consult the EOC Clinician",null,rv(T,S[2].s),C.gold);
    row(g,70,430,1140,96,"Hand over the trend, not just the last set","ISBAR (CTL-054)",rv(T,S[3].s),Z.r);
  }

  if(i===8){
    tiles([["1","Baseline","first full set"],["2","Repeat","every 15 min"],["3","Compare","RDR + MTT"],["4","Act","on the trend"]],[S[0].s,S[1].s,S[2].s,S[3].s],230,true);
  }
}
const Z={w:"#f4f4ef",y:"#e6dc63",r:"#d9786e",p:"#9b7fc4"};
function badge(g,s,x,y,a,col){
  if(a<=0)return;
  const gg=grp(g,a), w=s.length*15.5+56;
  el("rect",{x:x-w/2,y:y-30,width:w,height:56,rx:28,fill:col||"rgba(0,0,0,.35)"},gg);
  txt(s,{x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":700},gg);
}
function render(t){
  v.innerHTML=""; defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Baseline obs at a high-speed MVA",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("SAAS CPP-063-AO · CTL-070 · CTL-042  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
