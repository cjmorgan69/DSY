<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:6,stdDeviation:8,"flood-color":"#000","flood-opacity":.28},sh)}
/* reveal: fade/slide in starting at time s */
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function tick(g,x,y,a,r){r=r||20;el("circle",{cx:x,cy:y,r,fill:a>0?C.ok:"rgba(255,255,255,.15)"},g);
  if(a>0)el("path",{d:`M${x-r*.45} ${y} L${x-r*.1} ${y+r*.38} L${x+r*.5} ${y-r*.35}`,fill:"none",stroke:"#fff","stroke-width":r*.28,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":60,"stroke-dashoffset":60*(1-a)},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?(Array.isArray(sub)?h*.32:h*.42):h*.62),"font-size":32,"font-weight":700},gg);
  if(Array.isArray(sub))sub.forEach((ln,k)=>txt(ln,{x:x+34,y:y+h*.62+k*30,"font-size":23,fill:"#cfe7da"},gg));
  else if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function bullets(g,x,y,items,t,starts,col){items.forEach((s,i)=>{const a=rv(t,starts[i]);const gg=grp(g,a);
  el("circle",{cx:x,cy:y+i*50-9,r:7,fill:col||C.gold},gg);txt(s,{x:x+24,y:y+i*50,"font-size":28},gg)})}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>70;
  el("rect",{x:70,y:long?570:590,width:1140,height:long?112:84,rx:22,fill:"rgba(0,0,0,.34)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>62?30:34,"font-weight":600},g);
  else{ // wrap into two lines at the nearest space to the middle
    let m=Math.floor(s.text.length/2), L=s.text.lastIndexOf(" ",m), R=s.text.indexOf(" ",m);
    const cut=(m-L<R-m||R<0)?L:R;
    const fs=s.text.length>150?25:(s.text.length>125?28:32);
    txt(s.text.slice(0,cut),{x:640,y:620,"text-anchor":"middle","font-size":fs,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:664,"text-anchor":"middle","font-size":fs,"font-weight":600},g);}
  txt("SAAS CPP-050-AO",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const frac=(k,f)=>S[k].s+(S[k].e-S[k].s)*f;
  const chips=(items,x0,y,tStart,tEnd,fill,maxX)=>{let x=x0,yy=y;items.forEach((c,k)=>{const w=c.length*12+36;if(x+w>maxX){x=x0;yy+=62}
      const a=rv(T,Array.isArray(tStart)?tStart[k]:tStart+(tEnd-tStart)*k/Math.max(1,items.length-1),0.35);if(a>0){const g2=grp(g,a);el("rect",{x,y:yy,width:w,height:48,rx:24,fill},g2);txt(c,{x:x+w/2,y:yy+31,"text-anchor":"middle","font-size":22,"font-weight":700},g2)}x+=w+10})};

  const pill=(gg,s,x,y,w,fill,col)=>{el("rect",{x,y,width:w,height:56,rx:28,fill},gg);txt(s,{x:x+w/2,y:y+37,"text-anchor":"middle","font-size":26,"font-weight":800,fill:col||C.ink},gg)};

  if(i===0){
    txt("Asthma",{x:640,y:320,"text-anchor":"middle","font-size":150,"font-weight":800,"letter-spacing":"-4",opacity:rv(T,S[0].s,0.5)},g);
    el("rect",{x:640-200*rv(T,S[0].s+0.2,0.7),y:352,width:400*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("What every Ambulance Officer needs to know",{x:640,y:430,"text-anchor":"middle","font-size":38,fill:"#dff1e7",opacity:rv(T,S[1].s,0.5)},g);
    badge(g,"Protocol CPP-050-AO",640,505,rv(T,S[1].s+0.5,0.5),"rgba(0,0,0,.3)");
  }

  if(i===1){
    // an airway in cross-section that opens up as the bronchodilator works
    const open=eo(pr(T,frac(0,0.4),S[0].e+0.6)), cx=260, cy=345;
    const a0=rv(T,S[0].s,0.5); const ga=grp(g,a0);
    el("circle",{cx,cy,r:150,fill:"#e28c84",stroke:"#f4b9b2","stroke-width":6},ga);
    el("circle",{cx,cy,r:40+62*open,fill:"#123d2c"},ga);
    txt(open>0.6?"airway open":"bronchospasm",{x:cx,y:cy+200,"text-anchor":"middle","font-size":26,"font-weight":700,fill:open>0.6?C.mint:"#ffb3aa"},ga);
    row(g,480,180,730,120,"Relieve bronchospasm","with bronchodilators",rv(T,S[0].s),C.mint);
    row(g,480,330,730,140,"Basic care first",["then use the Asthma Severity & Treatment Table","to guide treatment"],rv(T,S[1].s),C.gold);
  }

  if(i===2){
    const a0=rv(T,S[0].s,0.5); if(a0>0){const gg=grp(g,a0);card(gg,70,190,520,250,"rgba(0,0,0,.30)");
      txt("Could this be",{x:110,y:270,"font-size":32,fill:"#cfe7da"},gg);txt("allergy or",{x:110,y:328,"font-size":46,"font-weight":800},gg);txt("anaphylaxis?",{x:110,y:384,"font-size":46,"font-weight":800},gg)}
    const a1=rv(T,S[1].s,0.5); if(a1>0){const gg=grp(g,a1);
      el("path",{d:"M610 315 L670 315 M652 298 L672 315 L652 332",fill:"none",stroke:"#fff","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"},gg);
      card(gg,690,190,520,250,"rgba(227,167,18,.18)","rgba(227,167,18,.6)");
      txt("Follow Anaphylaxis",{x:730,y:280,"font-size":36,"font-weight":800,fill:C.gold},gg);txt("CPP-003-AO first",{x:730,y:330,"font-size":36,"font-weight":800,fill:C.gold},gg);
      txt("including early clinical support",{x:730,y:384,"font-size":25,fill:"#cfe7da"},gg)}
  }

  if(i===3){
    const cols=[["Mild",C.mint,["Talks in sentences","Normal work of breathing","SpO2 usually above 95%"]],
                ["More severe",C.gold,["Phrases, words,","or unable to speak","Distressed","SpO2 usually below 95%"]],
                ["Life threatening",C.red,["Unable to speak","Drowsy or unconscious","Cyanosed","Poor respiratory effort"]]];
    cols.forEach((c,k)=>{const a=rv(T,S[k].s,0.45); if(a<=0)return; const gg=grp(g,a), x=70+k*385;
      card(gg,x,160,370,300);el("rect",{x,y:160,width:370,height:12,rx:6,fill:c[1]},gg);
      txt(c[0],{x:x+28,y:222,"font-size":34,"font-weight":800,fill:c[1]},gg);
      c[2].forEach((s,n)=>txt(s,{x:x+28,y:276+n*42,"font-size":25},gg))});
    badge(g,"Never judge severity on SpO2 alone",640,510,rv(T,S[3].s,0.5),"rgba(226,87,76,.55)");
  }

  if(i===4){
    row(g,70,165,1140,92,"Follow their asthma management plan","if appropriate",rv(T,S[0].s),C.mint);
    const a1=rv(T,S[1].s); if(a1>0){const gg=grp(g,a1);card(gg,70,275,1140,135,"rgba(0,0,0,.30)");
      // MDI and spacer
      el("rect",{x:110,y:315,width:250,height:60,rx:30,fill:"rgba(255,255,255,.75)"},gg);
      el("rect",{x:360,y:327,width:44,height:36,rx:8,fill:"#d9dfe3"},gg);el("rect",{x:398,y:298,width:50,height:92,rx:12,fill:"#3b6fd6"},gg);
      txt("Salbutamol via MDI and spacer",{x:490,y:332,"font-size":32,"font-weight":800},gg);txt("1 puff = 100 microg",{x:490,y:374,"font-size":26,fill:"#cfe7da"},gg)}
    const a2=rv(T,S[2].s,0.4),a3=rv(T,frac(2,0.55),0.4);
    if(a2>0){const gg=grp(g,a2);pill(gg,"6 or older: 12 puffs (1200 microg)",70,440,560,C.mint)}
    if(a3>0){const gg=grp(g,a3);pill(gg,"1 to 6 years: 6 puffs (600 microg)",650,440,560,C.gold)}
  }

  if(i===5){
    row(g,70,165,1140,100,"Under 4 years","consider adding a resuscitation mask to the MDI",rv(T,S[0].s),C.mint);
    row(g,70,285,1140,100,"Nebulised salbutamol 2.5 mg","1 to 6 years, plus saline to make 5 mL",rv(T,S[1].s),C.gold);
    row(g,70,405,1140,100,"Nebulised salbutamol 5 mg","over 6 years",rv(T,S[2].s),C.gold);
  }

  if(i===6){
    row(g,70,180,1140,120,"Consult the EOC Clinician","who may advise repeat doses, in line with paramedic level treatment",rv(T,S[0].s),C.gold);
    chips(["Consider clinical support","Continue basic care","Provide transport"],70,350,frac(1,0.05),frac(1,0.75),"rgba(63,174,116,.5)",1210);
  }

  if(i===7){
    row(g,70,165,1140,90,"Request early clinical support",null,rv(T,S[0].s),C.red);
    [["Over 6 years",["Salbutamol 5 mg","+ ipratropium 500 microg"],S[1].s],["1 to 6 years",["Salbutamol 2.5 mg","+ ipratropium 250 microg","+ 3 mL saline to make 5 mL"],S[2].s]].forEach((c,k)=>{
      const a=rv(T,c[2],0.45); if(a<=0)return; const gg=grp(g,a), x=70+k*580;
      card(gg,x,280,560,250,"rgba(227,167,18,.14)","rgba(227,167,18,.55)");
      txt("Nebulised: "+c[0],{x:x+30,y:330,"font-size":28,"font-weight":800,fill:C.gold},gg);
      c[1].forEach((s,n)=>txt(s,{x:x+30,y:384+n*44,"font-size":30,"font-weight":n?600:800},gg))});
  }

  if(i===8){
    row(g,70,160,1140,90,"High flow oxygen + early clinical support",null,rv(T,S[0].s),C.red);
    const a1=rv(T,S[1].s); if(a1>0){const gg=grp(g,a1);txt("If BVM ventilation is needed:",{x:70,y:298,"font-size":26,"font-weight":700,fill:"#cfe7da"},gg);
      [["Small tidal volumes",frac(1,0.25)],["Slow rates",frac(1,0.35)],["Gentle",frac(1,0.45)]].forEach((p,k)=>{const b=rv(T,p[1],0.35);if(b>0){const g3=grp(gg,b);pill(g3,p[0],70+k*380,315,360,C.mint)}})}
    const a2=rv(T,S[2].s); if(a2>0){const gg=grp(g,a2);card(gg,70,400,1140,130,"rgba(0,0,0,.30)");el("rect",{x:70,y:400,width:8,height:130,rx:4,fill:C.gold},gg);
      txt("The EOC Clinician may advise",{x:104,y:446,"font-size":30,"font-weight":800},gg);
      txt("continuous salbutamol nebulisation and/or IM adrenaline 10 microg/kg (max 500 microg)",{x:104,y:488,"font-size":23,fill:"#cfe7da"},gg)}
  }

  if(i===9){
    row(g,70,190,1140,120,"Getting worse at any point?","consult the EOC Clinician immediately",rv(T,S[0].s),C.gold);
    row(g,70,340,1140,120,"Unresponsive and not breathing normally","commence CPR",rv(T,S[1].s),C.red);
  }

  if(i===10){
    const labels=[["1","Think","anaphylaxis"],["2","Judge the","severity"],["3","Spacer","for mild"],["4","Nebs + support","more severe"],["5","Call the EOC","early"]];
    labels.forEach((p,k)=>{const a=rv(T,k===0?frac(0,0.4):S[k].s,0.4), x=45+k*236;
      const gg=grp(g,a);el("rect",{x,y:225,width:216,height:170,rx:26,fill:k===4?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,275,p[0],k===4?"#fff":C.gold);
      txt(p[1],{x:x+108,y:338,"text-anchor":"middle","font-size":25,"font-weight":800,fill:k===4?C.ink:"#fff"},gg);txt(p[2],{x:x+108,y:372,"text-anchor":"middle","font-size":23,fill:k===4?C.ink:"#cfe7da"},gg);
      if(k<4)txt("›",{x:x+226,y:330,"text-anchor":"middle","font-size":48,fill:C.gold,opacity:a},g)});
    badge(g,"Now try the asthma checker on this page",640,470,rv(T,S[5].s,0.5),"rgba(0,0,0,.35)");
  }
}
function badge(g,s,x,y,a,col){
  if(a<=0)return;
  const gg=grp(g,a), w=s.length*15.5+56;
  el("rect",{x:x-w/2,y:y-30,width:w,height:56,rx:28,fill:col||"rgba(0,0,0,.35)"},gg);
  txt(s,{x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":700},gg);
}
function render(t){
  v.innerHTML=""; defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Asthma",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("SAAS CPP-050-AO  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
