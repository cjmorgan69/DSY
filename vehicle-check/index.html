<!DOCTYPE html>
<html lang="en-AU">
<head>
<script src="/shared/gate.js?v=20261123h" data-level="student"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicle check - DSY Training</title>
<link rel="icon" type="image/png" sizes="32x32" href="../shared/dsy-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../shared/dsy-favicon-192.png">
<link rel="apple-touch-icon" href="../shared/dsy-touch-180.png">
<meta name="theme-color" content="#1f5b43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../training/theme.css?v=20261123h">
<style>
/* Vehicle check: the crew check the ambulance section by section (FRM-384), several people at once.
   Checks and the stock-to-order list are saved in Supabase (supabase/vehicle-check-setup.sql). */
.top a { color: inherit; text-decoration: none; }
.vehicle { display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: end; }
.vehicle label { flex: 1 1 12rem; }
.bar { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 9%, var(--surface)); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.nextcard .what { flex: 1 1 12rem; }
.area h2 { font-size: 1.1rem; }
.area .head { padding: 1rem 1.15rem .6rem; display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline; justify-content: space-between; }
.area .list > li { border-top: 1px solid var(--line); list-style: none; }
.sec { cursor: pointer; font: inherit; text-decoration: none; color: inherit; }
.sec .what .t { font-size: 1rem; }
.sec.due { box-shadow: inset 3px 0 0 var(--accent); }
.chip { white-space: normal; text-align: left; }
.chip.bad { background: color-mix(in srgb, var(--danger) 14%, var(--surface)); color: var(--danger); }
/* one section */
.items { list-style: none; }
.items > li { padding: .8rem 1.15rem; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: center; }
.items > li.unmarked { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.items .what { flex: 1 1 10rem; }
.items .qty { font-weight: 700; }
.mark { display: flex; gap: .4rem; flex: none; }
.mark button { min-width: 64px; min-height: 44px; padding: .3rem .8rem; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; }
.mark button.ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.mark button.short[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); color: #fff; }
.shortbox { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: center; }
.shortbox input[type=text] { flex: 1 1 10rem; }
.step { display: inline-flex; align-items: center; gap: .35rem; }
.step button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.2rem; font-weight: 700; cursor: pointer; }
.step b { min-width: 2ch; text-align: center; font-size: 1.05rem; }
.savebar { position: sticky; bottom: 0; padding: .7rem 0 calc(.7rem + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.savebar .btn { flex: 1 1 10rem; }
/* stock list */
.need { align-items: flex-start; }
.need.ordered .t { color: var(--muted); }
.addrow { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
.addrow label { flex: 1 1 12rem; }
/* lesson plan */
.plan { display: flex; flex-direction: column; gap: .5rem; padding-left: 1.2rem; line-height: 1.45; }
/* item information */
.about { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--brand); font: italic 700 1rem Georgia, serif; cursor: pointer; }
.about[aria-expanded="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.info { flex: 1 1 100%; display: flex; flex-direction: column; gap: .45rem; padding: .7rem .85rem; border-radius: 12px; background: var(--brand-soft); font-size: .92rem; line-height: 1.45; }
.info .docs { list-style: none; display: flex; flex-direction: column; gap: .25rem; }
.info .docs a { color: var(--brand); text-decoration: none; }
.info .docs a:hover { text-decoration: underline; }
.items .what .t + .t { margin-top: .15rem; }
.err { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="brand" href="../"><div class="brand-icon"><img src="../microlearning/shared/dsy-logo.png" alt="" width="40" height="40"></div>
      <div><h1>DSY Training</h1><p>Vehicle check</p></div></a>
    <span class="small muted" id="who"></span>
  </header>
  <div id="app" class="stack"><p class="muted">Loading the checklist...</p></div>
</main>
<script src="../training/config.js?v=20261123h"></script>
<script src="checklist.js?v=20261123h"></script>
<script src="item-info.js?v=20261123h"></script>
<script src="app.js?v=20261123h"></script>
</body>
</html>
