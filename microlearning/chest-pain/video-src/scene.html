<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:6,stdDeviation:8,"flood-color":"#000","flood-opacity":.28},sh)}
/* reveal: fade/slide in starting at time s */
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function tick(g,x,y,a,r){r=r||20;el("circle",{cx:x,cy:y,r,fill:a>0?C.ok:"rgba(255,255,255,.15)"},g);
  if(a>0)el("path",{d:`M${x-r*.45} ${y} L${x-r*.1} ${y+r*.38} L${x+r*.5} ${y-r*.35}`,fill:"none",stroke:"#fff","stroke-width":r*.28,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":60,"stroke-dashoffset":60*(1-a)},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?(Array.isArray(sub)?h*.32:h*.42):h*.62),"font-size":32,"font-weight":700},gg);
  if(Array.isArray(sub))sub.forEach((ln,k)=>txt(ln,{x:x+34,y:y+h*.62+k*30,"font-size":23,fill:"#cfe7da"},gg));
  else if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function bullets(g,x,y,items,t,starts,col){items.forEach((s,i)=>{const a=rv(t,starts[i]);const gg=grp(g,a);
  el("circle",{cx:x,cy:y+i*50-9,r:7,fill:col||C.gold},gg);txt(s,{x:x+24,y:y+i*50,"font-size":28},gg)})}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>78;
  el("rect",{x:70,y:long?570:590,width:1140,height:long?112:84,rx:22,fill:"rgba(0,0,0,.34)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>62?30:34,"font-weight":600},g);
  else{ // wrap into two lines at the nearest space to the middle
    let m=Math.floor(s.text.length/2), L=s.text.lastIndexOf(" ",m), R=s.text.indexOf(" ",m);
    const cut=(m-L<R-m||R<0)?L:R;
    const fs=s.text.length>150?25:(s.text.length>125?28:32);
    txt(s.text.slice(0,cut),{x:640,y:620,"text-anchor":"middle","font-size":fs,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:664,"text-anchor":"middle","font-size":fs,"font-weight":600},g);}
  txt("SAAS CPP-007-AO",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const frac=(k,f)=>S[k].s+(S[k].e-S[k].s)*f;
  const chipRow=(gg,items,x0,y,tStart,tEnd,fill,maxX)=>{let x=x0,yy=y;items.forEach((c,k)=>{const w=c.length*12+36;if(x+w>maxX){x=x0;yy+=62}
      const a=rv(T,tStart+(tEnd-tStart)*k/Math.max(1,items.length-1),0.35);if(a>0){const g2=grp(gg,a);el("rect",{x,y:yy,width:w,height:48,rx:24,fill},g2);txt(c,{x:x+w/2,y:yy+31,"text-anchor":"middle","font-size":22,"font-weight":700},g2)}x+=w+10})};

  if(i===0){
    txt("Chest pain",{x:640,y:320,"text-anchor":"middle","font-size":140,"font-weight":800,"letter-spacing":"-4",opacity:rv(T,S[0].s,0.5)},g);
    el("rect",{x:640-210*rv(T,S[0].s+0.2,0.7),y:352,width:420*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("What every Ambulance Officer needs to know",{x:640,y:430,"text-anchor":"middle","font-size":38,fill:"#dff1e7",opacity:rv(T,S[1].s,0.5)},g);
    badge(g,"Time is muscle",640,505,rv(T,S[1].s+0.5,0.5),"rgba(226,87,76,.55)");
  }

  if(i===1){
    const beat=1+0.07*Math.abs(Math.sin(T*5));
    const hx=235,hy=345,s=150*beat;
    el("path",{d:`M${hx} ${hy+s*.55} C${hx-s*1.2} ${hy-s*.2} ${hx-s*.55} ${hy-s*1.0} ${hx} ${hy-s*.35} C${hx+s*.55} ${hy-s*1.0} ${hx+s*1.2} ${hy-s*.2} ${hx} ${hy+s*.55} Z`,fill:C.red,filter:"url(#sh)",opacity:rv(T,S[0].s,0.5)},g);
    const a0=rv(T,S[0].s,0.5); if(a0>0){const gg=grp(g,a0);card(gg,500,165,710,92,"rgba(227,167,18,.18)","rgba(227,167,18,.6)");txt("Suspect cardiac ischaemia",{x:530,y:208,"font-size":30,"font-weight":800,fill:C.gold},gg);txt("unless there is an obvious alternative",{x:530,y:240,"font-size":21,fill:"#cfe7da"},gg)}
    const a1=rv(T,S[1].s,0.4); if(a1>0){const gg=grp(g,a1);
      txt("Pain, pressure, heaviness or tightness in:",{x:500,y:296,"font-size":23,fill:"#cfe7da"},gg);
      chipRow(g,["Chest","Neck","Jaw","Arms","Back","Shoulder"],500,312,frac(1,0.10),frac(1,0.50),"rgba(226,87,76,.45)",1200);
      const w=rv(T,frac(1,0.58),0.4); if(w>0){const g3=grp(g,w);txt("With:",{x:500,y:448,"font-size":23,fill:"#cfe7da"},g3);
        chipRow(g,["Nausea","Dizziness","Sweating","Short of breath"],500,462,frac(1,0.62),frac(1,0.92),"rgba(227,167,18,.35)",1200)}}
    const a2=rv(T,S[2].s,0.5); if(a2>0){const gg=grp(g,a2);el("rect",{x:70,y:508,width:430,height:56,rx:28,fill:"rgba(226,87,76,.7)"},gg);txt("Time is muscle",{x:285,y:546,"text-anchor":"middle","font-size":32,"font-weight":800},gg)}
  }

  if(i===2){
    // ECG trace and aspirin
    const pts=[];for(let k=0;k<=60;k++){const x=70+k*3.2;let y=280;const m=k%20;if(m===6)y=262;else if(m===7)y=292;else if(m===8)y=214;else if(m===9)y=318;else if(m===10)y=280;else if(m===13)y=266;pts.push(x+","+y)}
    const cut=Math.floor(61*rv(T,S[0].s,1.8)); el("polyline",{points:pts.slice(0,Math.max(2,cut)).join(" "),fill:"none",stroke:C.mint,"stroke-width":4,"stroke-linejoin":"round"},g);
    el("rect",{x:60,y:185,width:210,height:160,rx:18,fill:"none",stroke:C.cardLine,"stroke-width":2},g);txt("ECG",{x:165,y:372,"text-anchor":"middle","font-size":24,"font-weight":800,fill:C.mint},g);
    const pa=rv(T,S[2].s,0.5); if(pa>0){const gp=grp(g,pa);el("rect",{x:105,y:440,width:120,height:60,rx:30,fill:"#f1efe4"},gp);el("rect",{x:165,y:440,width:60,height:60,rx:30,fill:"#d9d3bd"},gp);el("rect",{x:165,y:440,width:30,height:60,fill:"#d9d3bd"},gp);txt("300 mg",{x:165,y:530,"text-anchor":"middle","font-size":22,"font-weight":800,fill:C.gold},gp)}
    row(g,320,170,890,96,"Basic care, including ECG monitoring",null,rv(T,S[0].s),C.mint);
    row(g,320,282,890,110,"Vital signs every 5 minutes","and consider clinical support",rv(T,S[1].s),C.mint);
    row(g,320,408,890,110,"Oral aspirin 300 mg","unless the patient is allergic",rv(T,S[2].s),C.gold);
  }

  if(i===3){
    const a0=rv(T,S[0].s);
    if(a0>0){const gg=grp(g,a0);card(gg,70,165,1140,108,"rgba(0,0,0,.30)");el("rect",{x:70,y:165,width:8,height:108,rx:4,fill:C.gold},gg);
      txt("GTN 300 microg, sublingual",{x:104,y:215,"font-size":36,"font-weight":800},gg);
      const dr=rv(T,frac(0,0.7),0.5); if(dr>0){el("path",{d:"M860 205 L1010 245 M990 228 L1012 247 L984 252",fill:"none",stroke:"#ff8c82","stroke-width":6,"stroke-linecap":"round","stroke-linejoin":"round",opacity:dr},gg);txt("can drop the blood pressure",{x:104,y:256,"font-size":23,fill:"#ffb3aa",opacity:dr},gg)}}
    badge(g,"So check first",640,311,rv(T,S[1].s,0.4),"rgba(227,167,18,.55)");
    const lim=[["Systolic BP","100 or more",frac(2,0.28)],["Pulse rate","60 to 120",frac(2,0.60)],["PDE-5 inhibitor","None recently",frac(2,0.92)]];
    lim.forEach((c,k)=>{const a=rv(T,c[2],0.45); if(a<=0)return; const gg=grp(g,a), x=70+k*385;
      card(gg,x,375,370,170,"rgba(0,0,0,.30)");txt(c[0],{x:x+26,y:424,"font-size":27,"font-weight":700,fill:"#cfe7da"},gg);txt(c[1],{x:x+26,y:482,"font-size":40,"font-weight":800,fill:C.gold},gg);tick(gg,x+328,410,pr(T,c[2]+0.25,c[2]+0.7),19)});
    txt("for a patient with GTN prescribed",{x:640,y:366,"text-anchor":"middle","font-size":20,fill:"#cfe7da",opacity:rv(T,frac(2,0.1),0.4)},g);
  }

  if(i===4){
    const drugs=[["Sildenafil",24],["Vardenafil",24],["Avanafil",24],["Tadalafil",48]];
    txt("No GTN within",{x:80,y:200,"font-size":26,fill:"#cfe7da",opacity:rv(T,S[0].s,0.4)},g);
    drugs.forEach((d,k)=>{const a=rv(T,frac(0,0.12+k*0.20),0.4); if(a<=0)return; const gg=grp(g,a), y=225+k*62;
      card(gg,70,y,1140,52,"rgba(0,0,0,.30)");txt(d[0],{x:96,y:y+36,"font-size":28,"font-weight":700},gg);
      const w=eo(pr(T,frac(0,0.12+k*0.20),frac(0,0.12+k*0.20)+1.0))*(d[1]/48)*600;
      el("rect",{x:420,y:y+11,width:Math.max(4,w),height:30,rx:15,fill:d[1]===48?C.red:C.gold},gg);txt(d[1]+" hours",{x:1180,y:y+36,"text-anchor":"end","font-size":28,"font-weight":800,fill:d[1]===48?"#ff8c82":C.gold},gg)});
    const b=rv(T,S[1].s,0.5); if(b>0){const gg=grp(g,b);card(gg,70,490,1140,70,"rgba(226,87,76,.2)","rgba(226,87,76,.65)");txt("Together: life-threatening low blood pressure",{x:640,y:536,"text-anchor":"middle","font-size":32,"font-weight":800,fill:"#ffb3aa"},gg)}
  }

  if(i===5){
    const dx=[110,520,930];
    for(let k=0;k<3;k++){const a=k===0?rv(T,S[0].s,0.4):(k===1?rv(T,frac(2,0.2),0.4):rv(T,frac(2,0.5),0.4)); if(a<=0)continue; const gg=grp(g,a);
      el("rect",{x:dx[k],y:200,width:240,height:130,rx:26,fill:k===0?"rgba(227,167,18,.30)":"rgba(0,0,0,.30)",stroke:k===0?C.gold:C.cardLine,"stroke-width":k===0?4:2},gg);
      txt("GTN 300 microg",{x:dx[k]+120,y:252,"text-anchor":"middle","font-size":25,"font-weight":800},gg);txt("Dose "+(k+1)+" of 3",{x:dx[k]+120,y:298,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.gold},gg);
      if(k<2){const b=rv(T,k===0?frac(2,0.05):frac(2,0.38),0.4);if(b>0){const g2=grp(g,b);el("path",{d:`M${dx[k]+250} 265 L${dx[k]+400} 265 M${dx[k]+382} 250 L${dx[k]+402} 265 L${dx[k]+382} 280`,fill:"none",stroke:"#fff","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"},g2);txt("5 min",{x:dx[k]+325,y:250,"text-anchor":"middle","font-size":24,"font-weight":800,fill:C.mint},g2)}}}
    const a1=rv(T,S[1].s,0.5); if(a1>0){const gg=grp(g,a1);el("rect",{x:70,y:370,width:560,height:70,rx:35,fill:"rgba(63,174,116,.35)"},gg);txt("Vital signs every 3 to 5 minutes",{x:350,y:415,"text-anchor":"middle","font-size":28,"font-weight":800},gg)}
    const a2=rv(T,frac(2,0.25),0.5); if(a2>0){const gg=grp(g,a2);el("rect",{x:650,y:370,width:560,height:70,rx:35,fill:"rgba(0,0,0,.35)"},gg);txt("Pain persists and the limits hold",{x:930,y:415,"text-anchor":"middle","font-size":26,"font-weight":700},gg)}
    const a3=rv(T,frac(2,0.7),0.5); if(a3>0){const gg=grp(g,a3);el("rect",{x:70,y:470,width:1140,height:70,rx:18,fill:"rgba(227,167,18,.22)",stroke:C.gold,"stroke-width":3},gg);txt("Maximum of 3 doses in total",{x:640,y:517,"text-anchor":"middle","font-size":34,"font-weight":800,fill:C.gold},gg)}
  }

  if(i===6){
    const a0=rv(T,S[0].s);
    if(a0>0){const gg=grp(g,a0);card(gg,70,175,500,150);txt("GTN not prescribed",{x:100,y:240,"font-size":34,"font-weight":800},gg);txt("to this patient",{x:100,y:282,"font-size":24,fill:"#cfe7da"},gg);
      el("path",{d:"M585 250 L650 250 M632 232 L652 250 L632 268",fill:"none",stroke:"#fff","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"},gg);
      card(gg,670,175,540,150,"rgba(227,167,18,.18)","rgba(227,167,18,.6)");txt("Consult the EOC Clinician",{x:700,y:240,"font-size":34,"font-weight":800,fill:C.gold},gg);txt("who may advise GTN",{x:700,y:282,"font-size":24,fill:"#cfe7da"},gg)}
    const a1=rv(T,S[1].s,0.5); if(a1>0){const gg=grp(g,a1);
      txt("Systolic BP limit",{x:640,y:388,"text-anchor":"middle","font-size":25,fill:"#cfe7da"},gg);
      card(gg,70,405,555,120);txt("GTN prescribed",{x:100,y:452,"font-size":25,fill:"#cfe7da"},gg);txt("100 or more",{x:100,y:503,"font-size":42,"font-weight":800},gg);
      card(gg,655,405,555,120,"rgba(227,167,18,.22)","rgba(227,167,18,.7)");txt("GTN not prescribed",{x:685,y:452,"font-size":25,fill:"#cfe7da"},gg);txt("above 100",{x:685,y:503,"font-size":42,"font-weight":800,fill:C.gold},gg)}
  }

  if(i===7){
    txt("Consult the EOC Clinician if",{x:80,y:195,"font-size":30,"font-weight":800,fill:C.gold,opacity:rv(T,S[0].s,0.4)},g);
    row(g,70,220,1140,92,"BP or HR outside the limits","at any time",rv(T,S[0].s+0.3),C.red);
    row(g,70,330,1140,92,"The pain is not resolved",null,rv(T,S[1].s),C.gold);
    row(g,70,440,1140,92,"Pain that had gone away comes back",null,rv(T,S[2].s),C.gold);
  }

  if(i===8){
    row(g,110,185,1060,140,"Medication checks","two clinicians whenever possible: medication, expiry date, dose",rv(T,S[0].s),C.mint);
    row(g,110,355,1060,140,"Provide transport","and notify the receiving facility",rv(T,S[1].s),C.gold);
  }

  if(i===9){
    const labels=[["1","Think","cardiac"],["2","Aspirin","unless allergic"],["3","Check BP, pulse","and PDE-5"],["4","Stop at","3 doses"],["5","Call the EOC","if it changes"]];
    const seg=(S[0].e-S[0].s)/5.2;
    labels.forEach((p,k)=>{const a=rv(T,S[0].s+0.5+k*seg,0.4), x=45+k*236;
      const gg=grp(g,a);el("rect",{x,y:225,width:216,height:170,rx:26,fill:k===4?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,275,p[0],k===4?"#fff":C.gold);
      txt(p[1],{x:x+108,y:338,"text-anchor":"middle","font-size":24,"font-weight":800,fill:k===4?C.ink:"#fff"},gg);txt(p[2],{x:x+108,y:372,"text-anchor":"middle","font-size":21,fill:k===4?C.ink:"#cfe7da"},gg);
      if(k<4)txt("›",{x:x+226,y:330,"text-anchor":"middle","font-size":48,fill:C.gold,opacity:a},g)});
    badge(g,"Call the EOC Clinician if anything changes",640,445,rv(T,S[1].s,0.5),"rgba(227,167,18,.5)");
    badge(g,"Now try the GTN checker on this page",640,515,rv(T,S[2].s,0.5),"rgba(0,0,0,.35)");
  }
}
function badge(g,s,x,y,a,col){
  if(a<=0)return;
  const gg=grp(g,a), w=s.length*15.5+56;
  el("rect",{x:x-w/2,y:y-30,width:w,height:56,rx:28,fill:col||"rgba(0,0,0,.35)"},gg);
  txt(s,{x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":700},gg);
}
function render(t){
  v.innerHTML=""; defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Chest pain",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("SAAS CPP-007-AO  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
