<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lower Eyre Peninsula</title>
<meta name="theme-color" content="#1f5b43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../training/theme.css">
<style>
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: .9rem; }
.tile { display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgba(20, 40, 30, .05); }
.tile .ph { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(145deg, var(--brand), color-mix(in srgb, var(--brand) 55%, #000)); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 700; font-size: 2.4rem; letter-spacing: -.02em; opacity: 1; }
.tile .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .body { display: flex; flex-direction: column; gap: .35rem; padding: .9rem 1.05rem 1.05rem; flex: 1; }
.tile h3 { font-size: 1.15rem; }
.tile .next { font-size: .85rem; color: var(--muted); min-height: 1.3em; }
.tile .btns { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: auto; padding-top: .55rem; }
.tile .btns a { flex: 1 1 auto; text-align: center; padding: .5rem .8rem; border-radius: 999px; font-size: .85rem; font-weight: 600; text-decoration: none; color: var(--brand); box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); }
.tile .btns a.pri { background: var(--brand); color: var(--brand-ink); box-shadow: none; }
.tile .btns a:hover { filter: brightness(1.08); box-shadow: inset 0 0 0 1px var(--brand); }
.tile .btns a.pri:hover { box-shadow: none; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading...</p></div>
<div id="toast" class="toast err" hidden></div>

<script src="../training/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";
  var C = window.TRAINING_APP;
  var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey);
  var $app = document.getElementById("app");
  var $toast = document.getElementById("toast");
  var S = { user: null, profile: null, region: null, groups: [], next: {}, photos: {}, regionPhoto: null, authMode: "in", edit: false, uploading: false };
  var MANAGER = "../modules/rosters/lowereyre/manager/", DASH = "../modules/rosters/lowereyre/manager/dashboard/";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fail(e) { $toast.textContent = e && e.message ? e.message : "Something went wrong. Try again."; $toast.hidden = false; clearTimeout(fail.t); fail.t = setTimeout(function () { $toast.hidden = true; }, 6000); }
  function parseDate(d) { var p = String(d).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayStr() { var n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); }
  function safeUrl(u) { u = String(u || "").trim(); return /^(https?:\/\/|\/|\.\.?\/)/i.test(u) && u.indexOf("//") !== 0 ? u : (/^https?:\/\//i.test(u) ? u : ""); }
  function links(a) { return Array.isArray(a) ? a.filter(function (l) { return l && l.label && safeUrl(l.url); }) : []; }
  function linksToText(a) { return (Array.isArray(a) ? a : []).map(function (l) { return (l.label || "") + " | " + (l.url || ""); }).join("\n"); }
  function parseLinks(t) { return String(t || "").split("\n").map(function (line) { var i = line.indexOf("|"); if (i < 0) return null; var label = line.slice(0, i).trim(), url = line.slice(i + 1).trim(); return label && url ? { label: label, url: url } : null; }).filter(Boolean); }
  function paras(text) { return String(text || "").split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean).map(function (p) { return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>"; }).join(""); }
  function q(p) { return p.then(function (r) { if (r.error) throw r.error; return r.data || []; }); }
  function loginEmail(v) { v = String(v || "").trim(); if (v.indexOf("@") > -1) return v.toLowerCase(); return v.toLowerCase().replace(/[^a-z0-9]/g, "") + "@id.dsytraining.com"; }
  function initials(n) { return String(n).split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase(); }

  function renderAuth() {
    var up = S.authMode === "up";
    $app.innerHTML = '<div class="auth stack"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>Region page</h1><p>Sign in with your training account.</p></div></div>' +
      '<form class="panel pad stack" id="authform">' +
      (up ? '<label>Your name<input name="name" autocomplete="name" required></label>' : "") +
      '<label>' + (up ? "Ambulance ID number" : "Ambulance ID number (or email)") + '<input name="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>' +
      '<label>Password<input name="pass" type="password" minlength="8" autocomplete="' + (up ? "new-password" : "current-password") + '" required></label>' +
      '<button class="btn" type="submit">' + (up ? "Create account" : "Sign in") + '</button>' +
      '<button class="linkbtn" type="button" id="swap">' + (up ? "I already have an account" : "Create an account") + '</button></form></div>';
  }

  function load() {
    return q(sb.from("profiles").select("*").eq("id", S.user.id)).then(function (rows) {
      S.profile = rows[0] || { role: "member" };
      if (S.profile.role !== "leader") { location.replace("../teams/"); return null; }
      return Promise.all([
        q(sb.from("region_info").select("*").limit(1)),
        q(sb.from("groups").select("*").eq("type", "team").order("name")),
        q(sb.from("upcoming_sessions").select("*").gte("session_date", todayStr()).order("session_date").order("start_time"))
      ]);
    }).then(function (r) {
      if (!r) return;
      S.region = r[0][0] || { name: "Lower Eyre Peninsula", links: [] };
      S.groups = r[1]; S.next = {};
      r[2].forEach(function (s) { if (!S.next[s.group_id]) S.next[s.group_id] = s; });
      var jobs = [];
      S.photos = {}; S.regionPhoto = null;
      S.groups.forEach(function (g) { if (g.photo_path) jobs.push(sb.storage.from("team-photos").createSignedUrl(g.photo_path, 3600).then(function (x) { if (!x.error) S.photos[g.id] = x.data.signedUrl; })); });
      if (S.region.photo_path) jobs.push(sb.storage.from("team-photos").createSignedUrl(S.region.photo_path, 3600).then(function (x) { if (!x.error) S.regionPhoto = x.data.signedUrl; }));
      return Promise.all(jobs).then(render);
    });
  }

  function header() {
    return '<header class="top"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>' + esc(C.appName || "Team Training") + '</h1><p>' + esc((S.profile && S.profile.full_name) || "") + '</p></div></div>' +
      '<div class="row"><button class="link" type="button" id="signout">Sign out</button></div></header>';
  }

  function nextLine(g) {
    var s = S.next[g.id]; if (!s) return "No upcoming session";
    var d = parseDate(s.session_date), t = s.lesson_title || s.topic;
    return "Next: " + d.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" }) + (t ? " - " + esc(t) : "");
  }

  function tile(g) {
    var ru = safeUrl(g.roster_url);
    return '<article class="tile"><div class="ph">' + (S.photos[g.id] ? '<img src="' + esc(S.photos[g.id]) + '" alt="' + esc(g.name) + '">' : esc(initials(g.name))) + '</div>' +
      '<div class="body"><h3>' + esc(g.name) + '</h3><div class="next">' + nextLine(g) + '</div>' +
      '<div class="btns"><a class="pri" href="../teams/#' + esc(g.id) + '">Team page</a>' + (ru ? '<a href="' + esc(ru) + '">Roster</a>' : "") + '<a href="../training/">Training</a></div></div></article>';
  }

  function render() {
    var r = S.region, html = header();
    html += '<section class="hero' + (S.regionPhoto ? "" : " plain") + '">' + (S.regionPhoto ? '<img src="' + esc(S.regionPhoto) + '" alt="' + esc(r.name) + '">' : "") +
      '<div class="cap"><h1>' + esc(r.name) + '</h1><p>Region overview</p></div></section>';
    html += '<div class="actions"><a class="big" href="../training/">Team Training<span>Sessions, lessons, attendance and people</span></a>' +
      '<a class="big alt" href="' + DASH + '">Manager dashboard<span>Rosters and cover across the region</span></a>' +
      '<a class="big alt" href="' + MANAGER + '">Roster manager<span>Open the manager roster page</span></a></div>';
    html += '<section class="stack"><div class="sec-h"><h2>Teams</h2><a class="link" href="../training/">Edit team photos and pages</a></div><div class="tiles">' + S.groups.map(tile).join("") + "</div></section>";
    if (S.edit) { html += editForm(); }
    else {
      var ls = links(r.links);
      html += '<section class="panel pad stack"><div class="sec-h"><h2>General information</h2><button class="link" type="button" id="edit">Edit</button></div>' +
        (r.blurb ? '<div class="prose">' + paras(r.blurb) + "</div>" : '<p class="muted">Nothing here yet. Use Edit to add notes, contacts and anything the region should have to hand.</p>') +
        (ls.length ? '<ul class="links">' + ls.map(function (l) { return '<li><a href="' + esc(safeUrl(l.url)) + '" rel="noopener">' + esc(l.label) + "</a></li>"; }).join("") + "</ul>" : "") + "</section>";
    }
    $app.innerHTML = html;
  }

  function editForm() {
    var r = S.region;
    return '<form class="panel pad stack" id="regionform"><h2>General information</h2>' +
      '<label>Region name<input name="name" value="' + esc(r.name) + '" required></label>' +
      '<label>Information (leave a blank line between paragraphs)<textarea name="blurb" rows="6">' + esc(r.blurb || "") + "</textarea></label>" +
      '<label>Links (one per line: name | address)<textarea name="links" rows="5" placeholder="SAMS intranet | https://...">' + esc(linksToText(r.links)) + "</textarea></label>" +
      '<div class="row"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" id="cancel">Cancel</button></div>' +
      '<h3>Region photo</h3><label class="drop" id="regiondrop"><strong>Drag a photo here</strong><span class="small">or click to choose. JPG, PNG or WebP, up to 10 MB.</span><input id="regionphoto" type="file" accept="image/jpeg,image/png,image/webp"></label>' +
      (r.photo_path ? '<div class="row"><button class="btn danger small" type="button" id="rmphoto">Remove photo</button></div>' : "") + "</form>";
  }

  function saveRegion(form) {
    var f = new FormData(form);
    var row = { name: f.get("name").trim() || "Lower Eyre Peninsula", blurb: f.get("blurb").trim() || null, links: parseLinks(f.get("links")), updated_at: new Date().toISOString() };
    return sb.from("region_info").update(row).eq("id", S.region.id || "main").then(function (r) { if (r.error) throw r.error; S.edit = false; return load(); });
  }
  function uploadRegionPhoto(file) {
    if (!file || S.uploading) return;
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return fail({ message: "Choose a JPG, PNG or WebP photo." });
    if (file.size > 10485760) return fail({ message: "That photo is over 10 MB." });
    var old = S.region.photo_path, path = "region/" + Date.now() + "-" + file.name.replace(/[^A-Za-z0-9._-]+/g, "_");
    S.uploading = true;
    sb.storage.from("team-photos").upload(path, file, { contentType: file.type }).then(function (r) {
      if (r.error) throw r.error;
      return sb.from("region_info").update({ photo_path: path }).eq("id", S.region.id || "main");
    }).then(function (r) { if (r.error) throw r.error; if (old) sb.storage.from("team-photos").remove([old]); return load(); }).catch(fail).then(function () { S.uploading = false; });
  }

  $app.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.id === "signout") sb.auth.signOut();
    else if (t.id === "swap") { S.authMode = S.authMode === "in" ? "up" : "in"; renderAuth(); }
    else if (t.id === "edit") { S.edit = true; render(); }
    else if (t.id === "cancel") { S.edit = false; render(); }
    else if (t.id === "rmphoto") { var old = S.region.photo_path; sb.from("region_info").update({ photo_path: null }).eq("id", S.region.id || "main").then(function (r) { if (r.error) throw r.error; if (old) sb.storage.from("team-photos").remove([old]); return load(); }).catch(fail); }
  });
  $app.addEventListener("change", function (e) { if (e.target.id === "regionphoto") uploadRegionPhoto(e.target.files[0]); });
  document.addEventListener("dragover", function (e) { if (!e.dataTransfer || [].indexOf.call(e.dataTransfer.types || [], "Files") < 0) return; e.preventDefault(); var z = e.target.closest && e.target.closest("#regiondrop"); e.dataTransfer.dropEffect = z ? "copy" : "none"; if (z) z.classList.add("over"); });
  document.addEventListener("dragleave", function (e) { var z = document.getElementById("regiondrop"); if (z && !e.relatedTarget) z.classList.remove("over"); });
  document.addEventListener("drop", function (e) { if (!e.dataTransfer || [].indexOf.call(e.dataTransfer.types || [], "Files") < 0) return; e.preventDefault(); var z = e.target.closest && e.target.closest("#regiondrop"); if (z) { z.classList.remove("over"); uploadRegionPhoto(e.dataTransfer.files[0]); } });
  $app.addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = e.target.querySelector('[type="submit"]'); btn.disabled = true;
    if (e.target.id === "regionform") { saveRegion(e.target).catch(fail).then(function () { if (document.contains(btn)) btn.disabled = false; }); return; }
    if (e.target.id !== "authform") return;
    var f = new FormData(e.target);
    var raw = f.get("email").trim(), email = loginEmail(raw), pass = f.get("pass");
    if (S.authMode === "up" && raw.indexOf("@") > -1) { btn.disabled = false; return fail({ message: "Enter your ambulance ID number, not an email address." }); }
    var job = S.authMode === "up"
      ? sb.auth.signUp({ email: email, password: pass, options: { data: { full_name: f.get("name").trim(), staff_id: raw } } }).then(function (r) { if (r.error) throw r.error; if (!r.data.session) return sb.auth.signInWithPassword({ email: email, password: pass }).then(function (x) { if (x.error) throw x.error; }); })
      : sb.auth.signInWithPassword({ email: email, password: pass }).then(function (r) { if (r.error) throw r.error; });
    job.catch(fail).then(function () { if (document.contains(btn)) btn.disabled = false; });
  });

  function onSession(session) {
    S.user = session ? session.user : null;
    if (!S.user) return renderAuth();
    load().catch(function (e) { fail(e); renderAuth(); });
  }
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(function () { onSession(session); }, 0);
  });
})();
</script>
</body>
</html>
