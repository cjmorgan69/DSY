<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Eyre Peninsula</title>
<link rel="icon" type="image/png" sizes="32x32" href="../shared/dsy-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../shared/dsy-favicon-192.png">
<link rel="apple-touch-icon" href="../shared/dsy-touch-180.png">
<meta name="theme-color" content="#1f5b43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../training/theme.css?v=20261123j">
<style>
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: .9rem; }
.tile { display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgba(20, 40, 30, .05); }
.tile .ph { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(145deg, var(--brand), color-mix(in srgb, var(--brand) 55%, #000)); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 700; font-size: 2.4rem; letter-spacing: -.02em; opacity: 1; }
.tile .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .body { display: flex; flex-direction: column; gap: .35rem; padding: .9rem 1.05rem 1.05rem; flex: 1; }
.tile h3 { font-size: 1.15rem; }
.tile .next { font-size: .85rem; color: var(--muted); min-height: 1.3em; }
.tile .btns { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: auto; padding-top: .55rem; }
.tile .btns a { flex: 1 1 auto; text-align: center; padding: .5rem .8rem; border-radius: 999px; font-size: .85rem; font-weight: 600; text-decoration: none; color: var(--brand); box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); }
.tile .btns a.pri { background: var(--brand); color: var(--brand-ink); box-shadow: none; }
.tile .btns a:hover { filter: brightness(1.08); box-shadow: inset 0 0 0 1px var(--brand); }
.tile .btns a.pri:hover { box-shadow: none; }
.tile .btns .editbtn { flex: 1 1 100%; padding: .45rem .8rem; border: 0; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: .82rem; font-weight: 600; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chips button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: .35rem .85rem; font: inherit; font-size: .86rem; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
.saved { font-size: .82rem; color: var(--muted); min-height: 1.2em; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.bannerprev { position: relative; overflow: hidden; border-radius: 16px; background: var(--brand-soft); }
.bannerprev img { display: block; width: 100%; aspect-ratio: 16 / 8; object-fit: cover; }
.bannerprev span { position: absolute; left: 1rem; bottom: .7rem; color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 1.4rem; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading...</p></div>
<div id="toast" class="toast err" hidden></div>

<script src="../training/config.js?v=20261123j"></script>
<script src="../training/pwreveal.js?v=20261123j" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";
  var C = window.TRAINING_APP;
  var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey);
  var $app = document.getElementById("app");
  var $toast = document.getElementById("toast");
  var CF = "dsy-region-cluster", CLUSTERS = ["Lower Eyre", "Central Eyre", "West Coast"];
  function cstore(v) { try { if (v === undefined) return localStorage.getItem(CF); localStorage.setItem(CF, v); } catch (e) { return null; } }
  var S = { cluster: null, editTeam: null, user: null, profile: null, region: null, groups: [], next: {}, photos: {}, regionPhoto: null, authMode: "in", edit: false, uploading: false };
  var MANAGER = "../modules/rosters/lowereyre/manager/", DASH = "/dashboard/";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fail(e) { $toast.textContent = e && e.message ? e.message : "Something went wrong. Try again."; $toast.hidden = false; clearTimeout(fail.t); fail.t = setTimeout(function () { $toast.hidden = true; }, 6000); }
  function parseDate(d) { var p = String(d).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayStr() { var n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); }
  function safeUrl(u) { u = String(u || "").trim(); return /^(https?:\/\/|\/|\.\.?\/)/i.test(u) && u.indexOf("//") !== 0 ? u : (/^https?:\/\//i.test(u) ? u : ""); }
  function links(a) { return Array.isArray(a) ? a.filter(function (l) { return l && l.label && safeUrl(l.url); }) : []; }
  function linksToText(a) { return (Array.isArray(a) ? a : []).map(function (l) { return (l.label || "") + " | " + (l.url || ""); }).join("\n"); }
  function parseLinks(t) { return String(t || "").split("\n").map(function (line) { var i = line.indexOf("|"); if (i < 0) return null; var label = line.slice(0, i).trim(), url = line.slice(i + 1).trim(); return label && url ? { label: label, url: url } : null; }).filter(Boolean); }
  function paras(text) { return String(text || "").split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean).map(function (p) { return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>"; }).join(""); }
  function q(p) { return p.then(function (r) { if (r.error) throw r.error; return r.data || []; }); }
  function loginEmail(v) { v = String(v || "").trim(); if (v.indexOf("@") > -1) return v.toLowerCase(); return v.toLowerCase().replace(/[^a-z0-9]/g, "") + "@id.dsytraining.com"; }
  function initials(n) { return String(n).split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase(); }

  function renderAuth() {
    var up = S.authMode === "up";
    $app.innerHTML = '<div class="auth stack"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>Region page</h1><p>Sign in with your training account.</p></div></div>' +
      '<form class="panel pad stack" id="authform">' +
      (up ? '<label>Your name<input name="name" autocomplete="name" required></label>' : "") +
      '<label>' + (up ? "Ambulance ID number" : "Ambulance ID number (or email)") + '<input name="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>' +
      '<label>Password<input name="pass" type="password" minlength="8" autocomplete="' + (up ? "new-password" : "current-password") + '" required></label>' +
      '<button class="btn" type="submit">' + (up ? "Create account" : "Sign in") + '</button>' +
      '<a class="linkbtn" href="/signin/?first=1&amp;next=' + encodeURIComponent(location.pathname) + '">First time here? Set up your sign-in</a></form></div>';
  }

  function load() {
    return q(sb.from("profiles").select("*").eq("id", S.user.id)).then(function (rows) {
      S.profile = rows[0] || { role: "member" };
      if (S.profile.role !== "leader") { location.replace("../teams/"); return null; }
      return Promise.all([
        q(sb.from("region_info").select("*").limit(1)),
        q(sb.from("groups").select("*").eq("type", "team").order("name")),
        q(sb.from("upcoming_sessions").select("*").gte("session_date", todayStr()).order("session_date").order("start_time"))
      ]);
    }).then(function (r) {
      if (!r) return;
      S.region = r[0][0] || { name: "Eyre Peninsula", links: [] };
      S.groups = r[1]; S.next = {};
      r[2].forEach(function (s) { if (!S.next[s.group_id]) S.next[s.group_id] = s; });
      var jobs = [];
      S.photos = {}; S.regionPhoto = null;
      S.groups.forEach(function (g) { if (!g.photo_path && g.hero && safeUrl(g.hero.url)) S.photos[g.id] = safeUrl(g.hero.url); });
      S.groups.forEach(function (g) { if (g.photo_path) jobs.push(sb.storage.from("team-photos").createSignedUrl(g.photo_path, 3600).then(function (x) { if (!x.error) S.photos[g.id] = x.data.signedUrl; })); });
      if (S.region.photo_path) jobs.push(sb.storage.from("team-photos").createSignedUrl(S.region.photo_path, 3600).then(function (x) { if (!x.error) S.regionPhoto = x.data.signedUrl; }));
      var m = /^#edit=(.+)$/.exec(location.hash || "");
      if (m && linkTeam(decodeURIComponent(m[1]))) S.editTeam = decodeURIComponent(m[1]);
      return Promise.all(jobs).then(function () {
        render();
        if (m && S.editTeam) { history.replaceState(null, "", location.pathname); var f = document.getElementById("teamform"); if (f) f.scrollIntoView({ block: "start" }); }
        fillThumbs();
      });
    });
  }

  function header() {
    return '<header class="top"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>' + esc(C.appName || "Team Training") + '</h1><p>' + esc((S.profile && S.profile.full_name) || "") + '</p></div></div>' +
      '<div class="row"><button class="link" type="button" id="signout">Sign out</button></div></header>';
  }

  function nextLine(g) {
    var s = S.next[g.id]; if (!s) return "No upcoming session";
    var d = parseDate(s.session_date), t = s.topic || s.lesson_title;
    return "Next: " + d.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" }) + (t ? " - " + esc(t) : "");
  }

  function tile(g) {
    var ru = safeUrl(g.roster_url);
    return '<article class="tile"><div class="ph">' + (S.photos[g.id] ? '<img src="' + esc(S.photos[g.id]) + '" alt="' + esc(g.name) + '"' + (g.banner_y != null ? ' style="object-position:50% ' + (+g.banner_y) + '%"' : "") + ">" : esc(initials(g.name))) + '</div>' +
      '<div class="body"><h3>' + esc(g.name) + '</h3><div class="next">' + nextLine(g) + '</div>' +
      '<div class="btns"><a class="pri" href="../teams/#' + esc(g.id) + '">Team page</a>' + (ru ? '<a href="' + esc(ru) + '">Roster</a>' : "") + '<a href="../training/">Training</a><button class="editbtn" type="button" data-edit="' + esc(g.id) + '">Edit page</button></div></div></article>';
  }

  function render() {
    var r = S.region, html = header();
    /* Cluster filter (owner, 22 Nov 2026): remembered on this device; starts on the leader's own cluster. */
    if (S.cluster == null) { var c0 = cstore(); S.cluster = c0 != null ? c0 : (S.profile && CLUSTERS.indexOf(S.profile.cluster) > -1 ? S.profile.cluster : ""); }
    /* banner: the region name for All clusters, else the cluster's name (owner, 22 Nov 2026) */
    var title = S.cluster || r.name || "Eyre Peninsula";
    html += '<section class="hero' + (S.regionPhoto ? "" : " plain") + '">' + (S.regionPhoto ? '<img src="' + esc(S.regionPhoto) + '" alt="' + esc(title) + '">' : "") +
      '<div class="cap"><h1>' + esc(title) + '</h1><p>' + (S.cluster ? "Cluster overview" : "Region overview") + '</p></div></section>';
    html += '<div class="actions"><a class="big" href="../training/">Team Training<span>Sessions, lessons, attendance and people</span></a>' +
      '<a class="big alt" href="' + DASH + '">Team Leader Dashboard<span>Rosters, training sessions, dispatch and tasks</span></a>' +
      '<a class="big alt" href="' + MANAGER + '">Roster manager<span>Open the manager roster page</span></a></div>';
    var shown = S.groups.filter(function (g) { return !S.cluster || g.cluster === S.cluster; });
    html += '<section class="stack"><div class="sec-h"><h2>Teams</h2></div><div class="chips" role="group" aria-label="Cluster">' +
      [""].concat(CLUSTERS).map(function (c) { return '<button type="button" data-cluster="' + esc(c) + '" aria-pressed="' + (S.cluster === c) + '">' + esc(c || "All clusters") + "</button>"; }).join("") + "</div>" +
      '<div class="tiles">' + (shown.length ? shown.map(tile).join("") : '<p class="muted">No teams in this cluster.</p>') + "</div></section>";
    if (S.editTeam) html += teamForm();
    if (S.edit) { html += editForm(); }
    else {
      var ls = links(r.links);
      html += '<section class="panel pad stack"><div class="sec-h"><h2>General information</h2><button class="link" type="button" id="edit">Edit</button></div>' +
        (r.blurb ? '<div class="prose">' + paras(r.blurb) + "</div>" : '<p class="muted">Nothing here yet. Use Edit to add notes, contacts and anything the region should have to hand.</p>') +
        (ls.length ? '<ul class="links">' + ls.map(function (l) { return '<li><a href="' + esc(safeUrl(l.url)) + '" rel="noopener">' + esc(l.label) + "</a></li>"; }).join("") + "</ul>" : "") + "</section>";
    }
    $app.innerHTML = html;
  }

  function editForm() {
    var r = S.region;
    return '<form class="panel pad stack" id="regionform"><h2>General information</h2>' +
      '<label>Region name<input name="name" value="' + esc(r.name) + '" required></label>' +
      '<label>Information (leave a blank line between paragraphs)<textarea name="blurb" rows="6">' + esc(r.blurb || "") + "</textarea></label>" +
      '<label>Links (one per line: name | address)<textarea name="links" rows="5" placeholder="SAMS intranet | https://...">' + esc(linksToText(r.links)) + "</textarea></label>" +
      '<div class="row"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" id="cancel">Cancel</button></div>' +
      '<h3>Region photo</h3><label class="drop" id="regiondrop"><strong>Drag a photo here</strong><span class="small">or click to choose. JPG, PNG or WebP, up to 10 MB.</span><input id="regionphoto" type="file" accept="image/jpeg,image/png,image/webp"></label>' +
      (r.photo_path ? '<div class="row"><button class="btn danger small" type="button" id="rmphoto">Remove photo</button></div>' : "") + "</form>";
  }

  function linkTeam(id) { return S.groups.filter(function (g) { return g.id === id; })[0]; }
  function teamForm() {
    var g = linkTeam(S.editTeam); if (!g) return "";
    return '<form class="panel pad stack" id="teamform" data-id="' + esc(g.id) + '"><h2>' + esc(g.name) + ' team page</h2>' +
      '<label>About this team (members see this)<textarea name="blurb" rows="6" placeholder="Station address, meeting place, contacts and anything else the team should know. Leave a blank line between paragraphs.">' + esc(g.blurb || "") + "</textarea></label>" +
      '<label>Roster link<input name="roster" value="' + esc(g.roster_url || "") + '" placeholder="/modules/rosters/lowereyre/tumbybay/"></label>' +
      '<label>Policies, procedures and links (one per line: name | address)<textarea name="links" rows="5" placeholder="SAMS intranet | https://...">' + esc(linksToText(g.links)) + "</textarea></label>" +
      '<div class="row"><button class="btn" type="submit">Save team page</button><button class="btn ghost" type="button" id="teamcancel">Close</button></div>' +
      '<h3>Banner photo</h3><p class="small muted">The big photo behind the team name. ' +
      (g.photo_path ? "Your photo is showing. Add a new one to replace it." : g.hero && g.hero.url ? "A town photo is showing (" + esc(g.hero.caption || "Wikimedia Commons") + "). Add your own photo to replace it." : "No photo yet.") + "</p>" +
      '<label class="drop" id="teamdrop"><strong>Choose a banner photo</strong><span class="small">or drag one here. JPG, PNG or WebP, up to 10 MB.</span><input id="teamphoto" type="file" accept="image/jpeg,image/png,image/webp"></label>' +
      (S.photos[g.id] ? '<div class="bannerprev"><img id="bannerimg" src="' + esc(S.photos[g.id]) + '" alt="" style="object-position:50% ' + (g.banner_y != null ? +g.banner_y : 50) + '%"><span>' + esc(g.name) + "</span></div>" +
        '<label>Move the photo to show the right part (top to bottom)<input id="bannery" type="range" min="0" max="100" step="1" value="' + (g.banner_y != null ? +g.banner_y : 50) + '"></label><p class="saved" id="bannersaved" aria-live="polite"></p>' : "") +
      (g.photo_path || (g.hero && g.hero.url) ? '<div class="row"><button class="btn danger small" type="button" id="teamrm">Remove banner photo</button></div>' : "") +
      slidesForm(g) + "</form>";
  }
  /* Photo slides (owner, 18 Nov 2026): members swipe through these on the Team Page. groups.photos = [{path, caption}]
     (path in storage bucket team-photos) or [{url, caption, credit, source}]. The banner's town photo is left out. */
  function slidesOf(g) {
    var h = g.hero && g.hero.url;
    return (Array.isArray(g.photos) ? g.photos : []).filter(function (x) { return x && (x.path || x.url) && !(x.url && x.url === h && !g.photo_path); });
  }
  function slidesForm(g) {
    var list = slidesOf(g);
    return '<h3>Photo slides</h3><p class="small muted">Members swipe through these under the buttons on the Team Page. ' + (list.length ? list.length + (list.length === 1 ? " photo." : " photos.") : "None yet.") + "</p>" +
      (list.length ? '<ul class="gallery-edit">' + list.map(function (x, i) {
        return '<li><img ' + (x.path ? 'data-thumb="' + esc(x.path) + '"' : 'src="' + esc(x.url) + '"') + ' alt=""><div class="stack" style="flex:1;gap:6px"><input type="text" maxlength="120" placeholder="Caption (optional)" value="' + esc(x.caption || "") + '" data-cap="' + i + '">' +
          '<div class="row">' + (i ? '<button class="btn ghost small" type="button" data-up="' + i + '">Move up</button>' : "") + '<button class="btn danger small" type="button" data-rm="' + i + '">Remove</button></div></div></li>';
      }).join("") + "</ul>" : "") +
      '<label class="drop" id="slidedrop"><strong>Add slide photos</strong><span class="small">Choose one or more, or drag them here. JPG, PNG or WebP, up to 10 MB each.</span><input id="slidephotos" type="file" multiple accept="image/jpeg,image/png,image/webp"></label>';
  }
  function fillThumbs() {
    var imgs = document.querySelectorAll("img[data-thumb]"); if (!imgs.length) return;
    sb.storage.from("team-photos").createSignedUrls([].map.call(imgs, function (i) { return i.dataset.thumb; }), 3600).then(function (r) {
      (r.data || []).forEach(function (u, k) { if (u && u.signedUrl && imgs[k]) imgs[k].src = u.signedUrl; });
    });
  }
  function changeSlides(fn) {
    var g = linkTeam(S.editTeam); if (!g) return;
    var keep = (Array.isArray(g.photos) ? g.photos : []).filter(function (x) { return slidesOf(g).indexOf(x) < 0; });
    var list = slidesOf(g).map(function (x) { return Object.assign({}, x); });
    var gone = fn(list);
    return sb.from("groups").update({ photos: list.concat(keep) }).eq("id", g.id).then(function (r) {
      if (r.error) throw r.error; if (gone) sb.storage.from("team-photos").remove([gone]); return load();
    }).catch(fail);
  }
  function uploadSlides(fileList) {
    var g = linkTeam(S.editTeam), files = [].slice.call(fileList || []);
    if (!g || !files.length || S.uploading) return;
    if (files.some(function (f) { return !/^image\/(jpeg|png|webp)$/.test(f.type) || f.size > 10485760; })) return fail({ message: "Photos must be JPG, PNG or WebP and up to 10 MB each." });
    S.uploading = true; var added = [];
    files.reduce(function (p, file, k) {
      return p.then(function () {
        var path = g.id + "/slides/" + Date.now() + "-" + k + "-" + file.name.replace(/[^A-Za-z0-9._-]+/g, "_");
        return sb.storage.from("team-photos").upload(path, file, { contentType: file.type }).then(function (r) { if (r.error) throw r.error; added.push({ path: path, caption: "" }); });
      });
    }, Promise.resolve()).then(function () {
      return changeSlides(function (l) { [].push.apply(l, added); });
    }).catch(fail).then(function () { S.uploading = false; });
  }
  function saveTeam(form) {
    var f = new FormData(form), id = form.dataset.id;
    return sb.from("groups").update({ blurb: f.get("blurb").trim() || null, roster_url: f.get("roster").trim() || null, links: parseLinks(f.get("links")) }).eq("id", id)
      .then(function (r) { if (r.error) throw r.error; return load(); });
  }
  function uploadTeamPhoto(file) {
    var g = linkTeam(S.editTeam);
    if (!file || !g || S.uploading) return;
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return fail({ message: "Choose a JPG, PNG or WebP photo." });
    if (file.size > 10485760) return fail({ message: "That photo is over 10 MB." });
    var old = g.photo_path, path = g.id + "/" + Date.now() + "-" + file.name.replace(/[^A-Za-z0-9._-]+/g, "_");
    S.uploading = true;
    sb.storage.from("team-photos").upload(path, file, { contentType: file.type }).then(function (r) {
      if (r.error) throw r.error;
      return sb.from("groups").update({ photo_path: path, banner_y: null }).eq("id", g.id);
    }).then(function (r) { if (r.error) throw r.error; if (old) sb.storage.from("team-photos").remove([old]); return load(); }).catch(fail).then(function () { S.uploading = false; });
  }

  function saveRegion(form) {
    var f = new FormData(form);
    var row = { name: f.get("name").trim() || "Eyre Peninsula", blurb: f.get("blurb").trim() || null, links: parseLinks(f.get("links")), updated_at: new Date().toISOString() };
    return sb.from("region_info").update(row).eq("id", S.region.id || "main").then(function (r) { if (r.error) throw r.error; S.edit = false; return load(); });
  }
  function uploadRegionPhoto(file) {
    if (!file || S.uploading) return;
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return fail({ message: "Choose a JPG, PNG or WebP photo." });
    if (file.size > 10485760) return fail({ message: "That photo is over 10 MB." });
    var old = S.region.photo_path, path = "region/" + Date.now() + "-" + file.name.replace(/[^A-Za-z0-9._-]+/g, "_");
    S.uploading = true;
    sb.storage.from("team-photos").upload(path, file, { contentType: file.type }).then(function (r) {
      if (r.error) throw r.error;
      return sb.from("region_info").update({ photo_path: path }).eq("id", S.region.id || "main");
    }).then(function (r) { if (r.error) throw r.error; if (old) sb.storage.from("team-photos").remove([old]); return load(); }).catch(fail).then(function () { S.uploading = false; });
  }

  $app.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.cluster != null) { S.cluster = t.dataset.cluster; cstore(S.cluster); render(); fillThumbs(); return; }
    if (t.dataset.edit) { S.editTeam = t.dataset.edit; render(); var f = document.getElementById("teamform"); if (f) f.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (t.id === "teamcancel") { S.editTeam = null; render(); return; }
    if (t.id === "teamrm") { var g = linkTeam(S.editTeam), old = g.photo_path; if (!window.confirm("Remove the banner photo?")) return; sb.from("groups").update({ photo_path: null, hero: null }).eq("id", g.id).then(function (r) { if (r.error) throw r.error; if (old) sb.storage.from("team-photos").remove([old]); return load(); }).catch(fail); return; }
    if (t.dataset.rm != null) { if (window.confirm("Remove this photo from the slides?")) changeSlides(function (l) { return l.splice(+t.dataset.rm, 1)[0].path || null; }); return; }
    if (t.dataset.up != null) { changeSlides(function (l) { var i = +t.dataset.up, x = l.splice(i, 1)[0]; l.splice(i - 1, 0, x); }); return; }
    if (t.id === "signout") sb.auth.signOut();
    else if (t.id === "swap") { S.authMode = S.authMode === "in" ? "up" : "in"; renderAuth(); }
    else if (t.id === "edit") { S.edit = true; render(); }
    else if (t.id === "cancel") { S.edit = false; render(); }
    else if (t.id === "rmphoto") { var old = S.region.photo_path; sb.from("region_info").update({ photo_path: null }).eq("id", S.region.id || "main").then(function (r) { if (r.error) throw r.error; if (old) sb.storage.from("team-photos").remove([old]); return load(); }).catch(fail); }
  });
  /* Banner position slider: preview moves while dragging, saves when let go. */
  /* 22 Nov 2026: also saves a moment after the last move (in case a phone sends no "change"), checks a row was
     written, says "Saved", and moves the team's tile photo too. */
  var bTimer = null;
  function saveBanner(y) {
    clearTimeout(bTimer); var bg = linkTeam(S.editTeam), msg = document.getElementById("bannersaved"); if (!bg) return;
    if (bg.banner_y === y) { if (msg) msg.textContent = "Saved."; return; }
    if (msg) msg.textContent = "Saving…";
    return sb.from("groups").update({ banner_y: y }).eq("id", bg.id).select("id").then(function (r) {
      if (r.error) throw r.error;
      if (!r.data || !r.data.length) throw new Error("The position was not saved: you may not have edit rights for this team.");
      bg.banner_y = y; if (msg) msg.textContent = "Saved. The Team Page and the tile above use this position.";
      var tim = document.querySelector('[data-edit="' + bg.id + '"]'); tim = tim && tim.closest(".tile").querySelector(".ph img"); if (tim) tim.style.objectPosition = "50% " + y + "%";
    }).catch(function (e) { if (msg) msg.textContent = ""; fail(e); });
  }
  $app.addEventListener("input", function (e) { if (e.target.id === "bannery") { var im = document.getElementById("bannerimg"), y = +e.target.value; if (im) im.style.objectPosition = "50% " + y + "%"; clearTimeout(bTimer); bTimer = setTimeout(function () { saveBanner(y); }, 800); } });
  $app.addEventListener("change", function (e) {
    if (e.target.id === "bannery") return saveBanner(+e.target.value);
    if (e.target.id === "slidephotos") return uploadSlides(e.target.files);
    if (e.target.dataset && e.target.dataset.cap != null) { var i = +e.target.dataset.cap, v = e.target.value.trim(); return changeSlides(function (l) { l[i].caption = v; }); }
    if (e.target.id === "regionphoto") uploadRegionPhoto(e.target.files[0]); else if (e.target.id === "teamphoto") uploadTeamPhoto(e.target.files[0]);
  });
  document.addEventListener("dragover", function (e) { if (!e.dataTransfer || [].indexOf.call(e.dataTransfer.types || [], "Files") < 0) return; e.preventDefault(); var z = e.target.closest && e.target.closest("#regiondrop, #teamdrop, #slidedrop"); e.dataTransfer.dropEffect = z ? "copy" : "none"; if (z) z.classList.add("over"); });
  document.addEventListener("dragleave", function (e) { if (!e.relatedTarget) [].forEach.call(document.querySelectorAll(".drop"), function (z) { z.classList.remove("over"); }); });
  document.addEventListener("drop", function (e) { if (!e.dataTransfer || [].indexOf.call(e.dataTransfer.types || [], "Files") < 0) return; e.preventDefault(); var z = e.target.closest && e.target.closest("#regiondrop, #teamdrop, #slidedrop"); if (z) { z.classList.remove("over"); if (z.id === "slidedrop") uploadSlides(e.dataTransfer.files); else if (z.id === "teamdrop") uploadTeamPhoto(e.dataTransfer.files[0]); else uploadRegionPhoto(e.dataTransfer.files[0]); } });
  $app.addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = e.target.querySelector('[type="submit"]'); btn.disabled = true;
    if (e.target.id === "teamform") { saveTeam(e.target).catch(fail).then(function () { if (document.contains(btn)) btn.disabled = false; }); return; }
    if (e.target.id === "regionform") { saveRegion(e.target).catch(fail).then(function () { if (document.contains(btn)) btn.disabled = false; }); return; }
    if (e.target.id !== "authform") return;
    var f = new FormData(e.target);
    var raw = f.get("email").trim(), email = loginEmail(raw), pass = f.get("pass");
    if (S.authMode === "up" && raw.indexOf("@") > -1) { btn.disabled = false; return fail({ message: "Enter your ambulance ID number, not an email address." }); }
    var job = S.authMode === "up"
      ? sb.auth.signUp({ email: email, password: pass, options: { data: { full_name: f.get("name").trim(), staff_id: raw } } }).then(function (r) { if (r.error) throw r.error; if (!r.data.session) return sb.auth.signInWithPassword({ email: email, password: pass }).then(function (x) { if (x.error) throw x.error; }); })
      : sb.auth.signInWithPassword({ email: email, password: pass }).then(function (r) { if (r.error) throw r.error; });
    job.catch(fail).then(function () { if (document.contains(btn)) btn.disabled = false; });
  });

  function onSession(session) {
    S.user = session ? session.user : null;
    if (!S.user) return renderAuth();
    load().catch(function (e) { fail(e); renderAuth(); });
  }
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(function () { onSession(session); }, 0);
  });
})();
</script>
</body>
</html>
