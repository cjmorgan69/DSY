<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Team Training</title>
<meta name="theme-color" content="#1f5b43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading...</p></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";
  var C = window.TRAINING_APP;
  var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey);
  var $app = document.getElementById("app");
  var $toast = document.getElementById("toast");
  var S = {
    user: null, profile: null, tab: "calendar", view: null,
    reflections: {}, attFilter: null, attSession: null, groups: [], lessons: [], sessions: [], bookings: [], profiles: [], memberships: [],
    mySessions: [], myBookings: {}, filter: "all", typeFilter: "all", showPast: false, authMode: "in", detail: null, lessonEdit: null, personEdit: null,
    shared: [], files: [], shares: [], roster: [], rosterSession: null, lessonView: null, memberTab: "sessions", delSession: null
  };

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function parseDate(d) { var p = String(d).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayStr() { var n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); }
  function hhmm(t) { var h = +String(t).slice(0, 2), m = String(t).slice(3, 5), ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return h + (m === "00" ? "" : ":" + m) + ap; }
  function timeRange(s) { return hhmm(s.start_time) + " to " + hhmm(s.end_time); }
  function tile(d) {
    var dt = parseDate(d);
    return '<div class="when"><span class="dow">' + dt.toLocaleDateString("en-AU", { weekday: "short" }) + '</span><span class="dom">' + dt.getDate() + '</span><span class="mon">' + dt.toLocaleDateString("en-AU", { month: "short" }) + "</span></div>";
  }
  function longDate(d) { return parseDate(d).toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" }); }
  function toast(msg, bad) {
    $toast.textContent = msg; $toast.className = "toast" + (bad ? " err" : ""); $toast.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { $toast.hidden = true; }, bad ? 6000 : 2600);
  }
  function fail(err) { toast(err && err.message ? err.message : "Something went wrong. Try again.", true); }
  function isLeader() { return S.profile && S.profile.role === "leader"; }
  function groupChip(g) { return '<span class="chip ' + (g && g.type === "course" ? "course" : "hi") + '">' + esc(g ? g.name : "") + "</span>"; }
  function by(id, list) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function groupOf(id) { return by(id, S.groups); }
  function nameOf(p) { return (p && p.full_name) || "Unnamed member"; }
  function typeChip(t) { return t === "team" ? '<span class="chip warn">Team-led</span>' : '<span class="chip hi">Leader-led</span>'; }
  function ledBy(s) { return s.facilitator_name ? "Led by " + s.facilitator_name : (s.session_type === "team" ? "Facilitator to be confirmed" : ""); }
  function linkify(text) {
    return esc(text).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>"; });
  }
  function paras(text) {
    return String(text || "").split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean).map(function (p) { return "<p>" + linkify(p).replace(/\n/g, "<br>") + "</p>"; }).join("");
  }

  /* ---------- auth ---------- */
  function loginEmail(v) { v = String(v || "").trim(); if (v.indexOf("@") > -1) return v.toLowerCase(); return v.toLowerCase().replace(/[^a-z0-9]/g, "") + "@id.dsytraining.com"; }
  function renderAuth() {
    var up = S.authMode === "up";
    $app.innerHTML =
      '<div class="auth stack"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>' + esc(C.appName) + "</h1><p>Sign in to see your sessions and book a spot.</p></div></div>" +
      '<form class="panel pad stack" data-form="auth" autocomplete="on">' +
      (up ? '<label>Your name<input id="f-name" name="name" autocomplete="name" required></label>' : "") +
      '<label>' + (up ? "Ambulance ID number" : "Ambulance ID number (or email)") + '<input id="f-email" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="' + (up ? "numeric" : "text") + '" required></label>' +
      (up ? '<p class="small muted">Your ID number is only used to sign you in and so your team leader knows who you are. We do not ask for an email address.</p>' : "") +
      '<label>Password<input id="f-pass" name="pass" type="password" minlength="8" autocomplete="' + (up ? "new-password" : "current-password") + '" required></label>' +
      '<button class="btn" type="submit">' + (up ? "Create account" : "Sign in") + "</button>" +
      '<button class="link" type="button" data-act="authmode">' + (up ? "I already have an account" : "Create an account") + "</button></form></div>";
  }

  /* ---------- data loading ---------- */
  function q(p) { return p.then(function (r) { if (r.error) throw r.error; return r.data || []; }); }

  function loadMember() {
    return Promise.all([
      q(sb.from("upcoming_sessions").select("*").gte("session_date", todayStr()).order("session_date").order("start_time")),
      q(sb.from("bookings").select("session_id,status").eq("member_id", S.user.id)),
      q(sb.from("lessons").select("*").order("created_at", { ascending: false })),
      q(sb.from("lesson_files").select("*").order("created_at"))
    ]).then(function (r) {
      S.mySessions = r[0]; S.myBookings = {};
      r[1].forEach(function (b) { S.myBookings[b.session_id] = b.status; });
      S.shared = r[2]; S.files = r[3];
    });
  }

  function loadLeader() {
    return Promise.all([
      q(sb.from("groups").select("*").order("type", { ascending: false }).order("name")),
      q(sb.from("lessons").select("*").order("created_at", { ascending: false })),
      q(sb.from("sessions").select("*").order("session_date").order("start_time")),
      q(sb.from("bookings").select("session_id,member_id,status")),
      q(sb.from("profiles").select("*").order("full_name")),
      q(sb.from("memberships").select("*")),
      q(sb.from("attendance").select("*")),
      q(sb.from("lesson_files").select("*").order("created_at")),
      q(sb.from("lesson_shares").select("*")),
      q(sb.from("session_reflections").select("*"))
    ]).then(function (r) {
      S.reflections = {}; r[9].forEach(function (x) { S.reflections[x.session_id] = x.notes; });
      S.groups = r[0]; S.lessons = r[1]; S.sessions = r[2]; S.bookings = r[3];
      S.profiles = r[4]; S.memberships = r[5]; S.attendance = r[6]; S.files = r[7]; S.shares = r[8];
    });
  }

  function load() {
    return q(sb.from("profiles").select("*").eq("id", S.user.id)).then(function (rows) {
      S.profile = rows[0] || { id: S.user.id, full_name: "", role: "member" };
      return isLeader() ? loadLeader() : loadMember();
    });
  }

  function refresh() { return load().then(render).catch(fail); }

  /* ---------- member view ---------- */
  function header(sub) {
    return '<header class="top"><div class="brand"><div class="brand-icon" aria-hidden="true">+</div><div><h1>' + esc(C.appName) + "</h1><p>" + esc(sub) + '</p></div></div><div class="row">' + (S.profile && S.profile.role === "leader" ? '<a class="link" href="../region/">Region</a>' : "") + '<a class="link" href="../teams/">Team page</a><button class="link" data-act="signout">Sign out</button></div></header>';
  }

  function renderMember() {
    var html = header(nameOf(S.profile) + (S.memberTab === "shared" && S.shared.length ? " - shared with you" : " - your upcoming sessions"));
    if (S.rosterSession) { $app.innerHTML = html + renderRoster(); return; }
    if (S.lessonView) { $app.innerHTML = html + renderSharedLesson(); return; }
    if (S.shared.length) {
      html += '<div class="tabs" role="tablist">' + [["sessions", "Sessions"], ["shared", "Shared with you"]].map(function (t) {
        return '<button role="tab" aria-selected="' + (S.memberTab === t[0]) + '" data-act="mtab" data-tab="' + t[0] + '">' + t[1] + "</button>";
      }).join("") + "</div>";
    }
    $app.innerHTML = html + (S.memberTab === "shared" && S.shared.length ? renderSharedList() : renderMemberSessions());
  }

  function renderMemberSessions() {
    var rows = S.mySessions;
    if (!rows.length) return '<div class="panel empty">No upcoming sessions yet. If you expected to see some, ask your team leader to add you to your team.</div>';
    return '<ul class="panel list">' + rows.map(function (s, i) {
      var booked = S.myBookings[s.id] === "booked", mine = s.is_facilitator && s.session_type === "team";
      var title = s.lesson_title || s.topic;
      return '<li><div class="item' + (i === 0 ? " next" : "") + '">' + tile(s.session_date) +
        '<div class="what"><span class="t">' + (title ? esc(title) : '<span class="muted">Topic to be confirmed</span>') + "</span>" +
        '<span class="small muted">' + timeRange(s) + (s.location ? " - " + esc(s.location) : "") + "</span>" +
        (ledBy(s) ? '<span class="small muted">' + esc(ledBy(s)) + "</span>" : "") +
        '<span class="row">' + groupChip({ name: s.group_name, type: s.group_type }) + typeChip(s.session_type) + (mine ? '<span class="chip good">You are facilitating</span>' : "") + "</span>" +
        (s.lesson_summary ? '<span class="small muted">' + esc(s.lesson_summary) + "</span>" : "") + "</div>" +
        '<div class="act">' + (mine ? '<button class="btn ghost small" type="button" data-act="roster" data-id="' + s.id + '">Team list</button>' : "") +
        (booked ? '<span class="chip good">Booked</span><button class="btn danger small" data-act="cancel" data-id="' + s.id + '">Cancel</button>'
          : '<button class="btn small" data-act="book" data-id="' + s.id + '">Book a spot</button>') + "</div></div></li>";
    }).join("") + "</ul>";
  }

  function renderSharedList() {
    return '<ul class="panel list">' + S.shared.map(function (l) {
      return '<li><button class="item" type="button" data-act="viewlesson" data-id="' + l.id + '"><div class="what"><span class="t">' + esc(l.title) + "</span>" +
        (l.summary ? '<span class="small muted">' + esc(l.summary) + "</span>" : "") + '</div><div class="act"><span class="chip hi">Open</span></div></button></li>';
    }).join("") + "</ul>";
  }

  function renderSharedLesson() {
    var l = by(S.lessonView, S.shared); if (!l) { S.lessonView = null; return ""; }
    var fs = S.files.filter(function (f) { return f.lesson_id === l.id; });
    return '<button class="link back" type="button" data-act="lessonviewback">Back</button>' +
      '<section class="panel pad stack"><h2>' + esc(l.title) + "</h2>" + (l.summary ? '<p class="muted">' + esc(l.summary) + "</p>" : "") +
      (l.content ? '<div class="prose">' + paras(l.content) + "</div>" : "") + "</section>" +
      (l.resources ? '<section class="panel pad stack"><h3>Resources and links</h3><div class="prose">' + paras(l.resources) + "</div></section>" : "") +
      (fs.length ? '<section class="panel pad stack"><h3>Files</h3>' + filesList(l.id, true) + "</section>" : "");
  }

  function renderRoster() {
    var s = by(S.rosterSession, S.mySessions) || {}, here = S.roster.filter(function (r) { return r.attended; }).length;
    return '<button class="link back" type="button" data-act="rback">Back</button>' +
      '<section class="panel pad stack"><div class="row">' + groupChip({ name: s.group_name, type: s.group_type }) + typeChip(s.session_type) + "</div><h2>" + esc(s.session_date ? longDate(s.session_date) : "Team list") + "</h2>" +
      '<p class="muted">You are facilitating this session. Tick each person who is here. <strong id="rcount">' + here + " of " + S.roster.length + " here</strong></p>" +
      (S.roster.length ? "<ul>" + S.roster.map(function (r) {
        return '<li><label class="check"><input type="checkbox" data-act="rattend" data-sid="' + S.rosterSession + '" data-mid="' + r.member_id + '"' + (r.attended ? " checked" : "") + "> <span>" + esc(r.full_name || "Unnamed member") + "</span>" + (r.booked ? ' <span class="chip good">Booked</span>' : "") + "</label></li>";
      }).join("") + "</ul>" : '<p class="muted">No one is in this team yet.</p>') + "</section>";
  }
  function openRoster(id) {
    return sb.rpc("session_roster", { p_session: id }).then(function (r) {
      if (r.error) throw r.error;
      S.roster = r.data || []; S.rosterSession = id; render(); window.scrollTo(0, 0);
    }).catch(fail);
  }
  function setRoster(sid, mid, on) {
    return sb.rpc("set_attendance", { p_session: sid, p_member: mid, p_attended: on }).then(function (r) {
      if (r.error) throw r.error;
      S.roster.forEach(function (x) { if (x.member_id === mid) x.attended = on; });
      var el = document.getElementById("rcount");
      if (el) el.textContent = S.roster.filter(function (x) { return x.attended; }).length + " of " + S.roster.length + " here";
    }).catch(function (e) { fail(e); openRoster(sid); });
  }

  function book(id) {
    return sb.from("bookings").upsert({ session_id: id, member_id: S.user.id, status: "booked" }, { onConflict: "session_id,member_id" })
      .then(function (r) { if (r.error) throw r.error; toast("Booked. See you there."); return refresh(); }).catch(fail);
  }
  function cancelBooking(id) {
    return sb.from("bookings").update({ status: "cancelled" }).eq("session_id", id).eq("member_id", S.user.id)
      .then(function (r) { if (r.error) throw r.error; toast("Booking cancelled."); return refresh(); }).catch(fail);
  }

  /* ---------- leader: shared pieces ---------- */
  function bookedCount(sid) { return S.bookings.filter(function (b) { return b.session_id === sid && b.status === "booked"; }).length; }
  function lessonOf(s) { return s.lesson_id ? by(s.lesson_id, S.lessons) : null; }

  function renderLeader() {
    var html = header("Team leader - " + nameOf(S.profile));
    if (S.detail) { $app.innerHTML = html + renderSessionDetail(); return; }
    html += '<div class="tabs" role="tablist">' + [["calendar", "Calendar"], ["lessons", "Lessons"], ["people", "People"]].map(function (t) {
      return '<button role="tab" aria-selected="' + (S.tab === t[0]) + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] + "</button>";
    }).join("") + "</div>";
    html += S.tab === "calendar" ? renderCalendar() : S.tab === "lessons" ? renderLessons() : renderPeople();
    $app.innerHTML = html;
  }

  /* ---------- leader: calendar ---------- */
  function renderCalendar() {
    var t = todayStr();
    var list = S.sessions.filter(function (s) {
      return (S.filter === "all" || s.group_id === S.filter) && (S.typeFilter === "all" || s.session_type === S.typeFilter) && (S.showPast || s.session_date >= t);
    });
    var html = '<div class="filters" role="group" aria-label="Filter by team or course"><button aria-pressed="' + (S.filter === "all") + '" data-act="filter" data-g="all">All</button>' +
      S.groups.map(function (g) { return '<button aria-pressed="' + (S.filter === g.id) + '" data-act="filter" data-g="' + g.id + '">' + esc(g.name) + "</button>"; }).join("") + "</div>" +
      '<div class="filters" role="group" aria-label="Filter by who leads">' + [["all", "Any session"], ["leader", "Leader-led"], ["team", "Team-led"]].map(function (x) {
        return '<button aria-pressed="' + (S.typeFilter === x[0]) + '" data-act="typefilter" data-t="' + x[0] + '">' + x[1] + "</button>";
      }).join("") + '<button aria-pressed="' + S.showPast + '" data-act="past">Show past</button></div>';
    if (!list.length) return html + '<div class="panel empty">No sessions to show.</div>';
    return html + '<ul class="panel list">' + list.map(function (s) {
      var l = lessonOf(s), n = bookedCount(s.id), team = s.session_type === "team";
      var set = l ? '<span class="chip good">Lesson set</span>' : s.topic ? '<span class="chip hi">Topic set</span>' : '<span class="chip warn">' + (team ? "Needs topic" : "Needs lesson") + "</span>";
      return '<li><button class="item" data-act="open" data-id="' + s.id + '">' + tile(s.session_date) +
        '<div class="what"><span class="t">' + (l ? esc(l.title) : s.topic ? esc(s.topic) : '<span class="muted">' + (team ? "No topic yet" : "No lesson yet") + "</span>") + "</span>" +
        '<span class="small muted">' + timeRange(s) + (s.location ? " - " + esc(s.location) : "") + (ledBy(s) ? " - " + esc(ledBy(s)) : "") + '</span><span class="row">' + groupChip(groupOf(s.group_id)) + typeChip(s.session_type) + "</span></div>" +
        '<div class="act">' + set + (team && !s.facilitator_name ? '<span class="chip warn">Needs facilitator</span>' : "") + '<span class="chip">' + n + " booked</span>" + (S.reflections[s.id] ? '<span class="chip good">Reflection</span>' : s.session_date < t ? '<span class="chip warn">Needs reflection</span>' : "") + "</div></button></li>";
    }).join("") + "</ul>";
  }

  function renderSessionDetail() {
    var s = by(S.detail, S.sessions); if (!s) { S.detail = null; return ""; }
    var g = groupOf(s.group_id);
    var members = S.memberships.filter(function (m) { return m.group_id === s.group_id; }).map(function (m) { return by(m.member_id, S.profiles); }).filter(Boolean);
    var bookedIds = {}; S.bookings.forEach(function (b) { if (b.session_id === s.id && b.status === "booked") bookedIds[b.member_id] = true; });
    var att = {}; S.attendance.forEach(function (a) { if (a.session_id === s.id) att[a.member_id] = a.attended; });
    var nb = Object.keys(bookedIds).length;
    var facOpts = '<option value="">To be confirmed</option><option value="' + S.profile.id + '"' + (s.facilitator_id === S.profile.id ? " selected" : "") + ">" + esc(nameOf(S.profile)) + " (regional team leader)</option>" +
      members.filter(function (p) { return p.id !== S.profile.id; }).map(function (p) { return '<option value="' + p.id + '"' + (s.facilitator_id === p.id ? " selected" : "") + ">" + esc(nameOf(p)) + "</option>"; }).join("");
    var visitor = !s.facilitator_id && s.facilitator_name ? s.facilitator_name : "";
    return '<button class="link back" data-act="back">Back to calendar</button>' +
      '<section class="panel pad stack"><div class="row">' + groupChip(g) + typeChip(s.session_type) + '<span class="chip">' + nb + " booked</span></div><h2>" + esc(longDate(s.session_date)) + '</h2><p class="muted">' + timeRange(s) + "</p>" +
      '<form class="stack" data-form="session" data-id="' + s.id + '"><div class="grid2">' +
      '<label>Who leads<select id="s-type" name="type"><option value="leader"' + (s.session_type === "leader" ? " selected" : "") + '>Leader-led</option><option value="team"' + (s.session_type === "team" ? " selected" : "") + ">Team-led</option></select></label>" +
      '<label>Facilitator<select id="s-fac" name="fac">' + facOpts + "</select></label></div>" +
      '<label>Visitor or other name (leave blank when choosing from the list)<input id="s-facname" name="facname" value="' + esc(visitor) + '" autocomplete="off"></label>' +
      '<div class="grid2"><label>Lesson<select id="s-lesson" name="lesson"><option value="">No lesson yet</option>' + S.lessons.map(function (l) { return '<option value="' + l.id + '"' + (l.id === s.lesson_id ? " selected" : "") + ">" + esc(l.title) + "</option>"; }).join("") + "</select></label>" +
      '<label>Location<input id="s-loc" name="location" value="' + esc(s.location || "") + '"></label></div>' +
      '<label>Session name (shown when there is no lesson)<input id="s-topic" name="topic" value="' + esc(s.topic || "") + '"></label>' +
      '<label>Notes for you<input id="s-notes" name="notes" value="' + esc(s.notes || "") + '"></label>' +
      '<div class="row"><button class="btn" type="submit">Save session</button>' + (S.delSession === s.id ? "" : '<button class="btn danger" type="button" data-act="asksession" data-id="' + s.id + '">Delete session</button>') + "</div></form>" +
      (S.delSession === s.id ? '<div class="notice stack"><p><strong>Delete this session?</strong> Its bookings and attendance are removed too. This cannot be undone.</p><div class="row"><button class="btn danger small" type="button" data-act="deletesession" data-id="' + s.id + '">Yes, delete session</button><button class="btn ghost small" type="button" data-act="keepsession">Keep it</button></div></div>' : "") + "</section>" +
      renderAttendance(s, members, att, bookedIds) + renderReflection(s);
  }

  function renderAttendance(s, members, att, bookedIds) {
    if (!members.length) return '<section class="panel pad stack"><h3>Attendance</h3><p class="muted">No one is in this group yet. Add people in the People tab.</p></section>';
    var came = members.filter(function (p) { return att[p.id]; }), nots = members.filter(function (p) { return !att[p.id]; });
    var f = S.attFilter && S.attSession === s.id ? S.attFilter : (S.reflections[s.id] && came.length ? "came" : "all");
    var shown = f === "came" ? came : f === "not" ? nots : members;
    var chips = [["all", "Everyone (" + members.length + ")"], ["came", "Attended (" + came.length + ")"], ["not", "Not attended (" + nots.length + ")"]].map(function (x) {
      return '<button type="button" aria-pressed="' + (f === x[0]) + '" data-act="attfilter" data-f="' + x[0] + '" data-sid="' + s.id + '">' + x[1] + "</button>";
    }).join("");
    return '<section class="panel pad stack"><h3>Attendance</h3><div class="filters" role="group" aria-label="Filter attendance">' + chips + "</div>" +
      '<p class="small muted">Tick each person who came. Those who booked are marked. Nobody is removed when you tick them, so you can still add or fix people; use the filters to see just who attended.' + (s.session_type === "team" && s.facilitator_id && s.facilitator_id !== S.profile.id ? " The facilitator can also tick people on the night." : "") + "</p>" +
      (shown.length ? "<ul>" + shown.map(function (p) {
        return '<li><label class="check"><input type="checkbox" data-act="attend" data-sid="' + s.id + '" data-mid="' + p.id + '"' + (att[p.id] ? " checked" : "") + "> <span>" + esc(nameOf(p)) + "</span>" + (bookedIds[p.id] ? ' <span class="chip good">Booked</span>' : "") + "</label></li>";

  function saveSession(form) {
    var id = form.dataset.id, f = new FormData(form);

    }).eq("id", id)

      .then(function (r) { if (r.error) throw r.error; var hit = false; S.attendance.forEach(function (a) { if (a.session_id === sid && a.member_id === mid) { a.attended = on; hit = true; } }); if (!hit) S.attendance.push({ session_id: sid, member_id: mid, attended: on }); }).catch(function (e) { fail(e); refresh(); });
  }

  /* ---------- leader: lessons ---------- */

        (l.summary ? '<span class="small muted">' + esc(l.summary) + "</span>" : "") + '</div><div class="act">' + (sh ? '<span class="chip hi">Shared with ' + sh + "</span>" : "") + '<span class="chip ' + (n ? "good" : "warn") + '">' + n + " session" + (n === 1 ? "" : "s") + "</span></div></button></li>";
    }).join("") + "</ul>";
  }

  function renderLessonForm() {
    var l = S.lessonEdit === "new" ? { id: "", title: "", summary: "", content: "", resources: "" } : by(S.lessonEdit, S.lessons);
    if (!l) { S.lessonEdit = null; return renderLessons(); }
    var t = todayStr();
    var upcoming = S.sessions.filter(function (s) { return s.session_date >= t; });
    return '<button class="link back" data-act="lessonback">Back to lessons</button>' +
      '<form class="panel pad stack" data-form="lesson" data-id="' + l.id + '">' +
      '<label>Title<input id="l-title" name="title" value="' + esc(l.title) + '" required></label>' +
      '<label>Short summary (members see this)<input id="l-summary" name="summary" value="' + esc(l.summary || "") + '"></label>' +
      '<label>Lesson content (visible to you and anyone you share it with)<textarea id="l-content" name="content">' + esc(l.content || "") + "</textarea></label>" +
      '<label>Resources and links<textarea id="l-res" name="resources">' + esc(l.resources || "") + "</textarea></label>" +
      '<div class="stack"><h3>Files</h3>' + (l.id
        ? '<div id="lfiles">' + filesList(l.id) + '</div><label class="drop" id="l-drop" data-lid="' + l.id + '"><strong>Drag files here</strong><span class="small">or click to choose. Up to 50 MB each.</span><input id="l-upload" type="file" multiple data-act="upload" data-lid="' + l.id + '"></label>'
        : '<p class="small muted">Save the lesson first, then come back to attach files.</p>') + "</div>" +
      '<div class="stack"><h3>Share with</h3><p class="small muted">Chosen people can open this lesson, its links and its files from their own login. They need an account.</p>' + shareList(l) + "</div>" +
      '<h3>Use this lesson in</h3>' +
      (upcoming.length ? '<ul>' + upcoming.map(function (s) {
        return '<li><label class="check"><input type="checkbox" name="sess" value="' + s.id + '"' + (l.id && s.lesson_id === l.id ? " checked" : "") + "> <span>" + esc(parseDate(s.session_date).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" })) + " - " + esc((groupOf(s.group_id) || {}).name) + "</span>" +
          (s.lesson_id && s.lesson_id !== l.id ? ' <span class="chip warn">Has another lesson</span>' : "") + "</label></li>";
      }).join("") + "</ul>" : '<p class="muted">No upcoming sessions.</p>') +
      '<div class="row"><button class="btn" type="submit">Save lesson</button>' + (l.id ? '<button class="btn danger" type="button" data-act="deletelesson" data-id="' + l.id + '">Delete</button>' : "") + "</div></form>";
  }

  function shareList(l) {
    var people = S.profiles.filter(function (p) { return p.role !== "leader"; });
    if (!people.length) return '<p class="small muted">No one else has an account yet.</p>';
    return "<ul>" + people.map(function (p) {
      var on = l.id && S.shares.some(function (x) { return x.lesson_id === l.id && x.member_id === p.id; });
      return '<li><label class="check"><input type="checkbox" name="share" value="' + p.id + '"' + (on ? " checked" : "") + "> <span>" + esc(nameOf(p)) + "</span></label></li>";
    }).join("") + "</ul>";
  }
  function fileSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  function filesList(lid, ro) {
    var fs = (S.files || []).filter(function (f) { return f.lesson_id === lid; });
    if (!fs.length) return '<p class="small muted">No files attached.</p>';
    return '<ul class="list panel">' + fs.map(function (f) {
      return '<li><div class="item"><div class="what"><span class="t">' + esc(f.name) + '</span><span class="small muted">' + fileSize(f.size || 0) + '</span></div><div class="act">' +
        '<button class="btn ghost small" type="button" data-act="openfile" data-id="' + f.id + '">Open</button>' +
        (ro ? "" : '<button class="btn danger small" type="button" data-act="removefile" data-id="' + f.id + '">Remove</button>') + "</div></div></li>";
    }).join("") + "</ul>";
  }
  function redrawFiles(lid) { var el = document.getElementById("lfiles"); if (el) el.innerHTML = filesList(lid); }

  function uploadFiles(lid, fileList, input) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length || S.uploading) return;
    S.uploading = true; if (input) input.disabled = true; toast("Uploading...");
    var chain = Promise.resolve(), done = 0;
    files.forEach(function (file) {
      chain = chain.then(function () {
        if (file.size > 52428800) throw new Error(file.name + " is over 50 MB.");
        var safe = file.name.replace(/[^A-Za-z0-9._-]+/g, "_");
        var path = lid + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "-" + safe;
        return sb.storage.from("lesson-files").upload(path, file, { contentType: file.type || "application/octet-stream" }).then(function (r) {
          if (r.error) throw r.error;
          return sb.from("lesson_files").insert({ lesson_id: lid, path: path, name: file.name, size: file.size, content_type: file.type || null }).select().single();
        }).then(function (r) { if (r.error) throw r.error; S.files.push(r.data); done++; redrawFiles(lid); });
      });
    });
    return chain.then(function () { toast(done + (done === 1 ? " file" : " files") + " attached."); })
      .catch(fail).then(function () { S.uploading = false; var el = document.getElementById("l-upload"); if (el) { el.disabled = false; el.value = ""; } });
  }
  function openFile(id) {
    var f = by(id, S.files); if (!f) return;
    var w = window.open("", "_blank");
    return sb.storage.from("lesson-files").createSignedUrl(f.path, 300).then(function (r) {
      if (r.error) throw r.error;
      if (w) w.location.href = r.data.signedUrl; else window.location.href = r.data.signedUrl;
    }).catch(function (e) { if (w) w.close(); fail(e); });
  }
  function removeFile(id) {
    var f = by(id, S.files); if (!f) return;
    return sb.storage.from("lesson-files").remove([f.path]).then(function (r) {
      if (r.error) throw r.error;
      return sb.from("lesson_files").delete().eq("id", id);
    }).then(function (r) {
      if (r.error) throw r.error;
      S.files = S.files.filter(function (x) { return x.id !== id; }); redrawFiles(f.lesson_id); toast("File removed.");
    }).catch(fail);
  }

  function saveLesson(form) {
    var f = new FormData(form), id = form.dataset.id;
    var row = { title: f.get("title").trim(), summary: f.get("summary").trim() || null, content: f.get("content") || null, resources: f.get("resources") || null };
    var checked = f.getAll("sess");
    var p = id ? sb.from("lessons").update(row).eq("id", id).select().single() : sb.from("lessons").insert(row).select().single();
    return p.then(function (r) {
      if (r.error) throw r.error;
      var lid = r.data.id, t = todayStr();
      var off = S.sessions.filter(function (s) { return s.lesson_id === lid && s.session_date >= t && checked.indexOf(s.id) < 0; }).map(function (s) { return s.id; });
      var ops = [];
      if (checked.length) ops.push(sb.from("sessions").update({ lesson_id: lid }).in("id", checked));
      if (off.length) ops.push(sb.from("sessions").update({ lesson_id: null }).in("id", off));
      var want = f.getAll("share"), have = S.shares.filter(function (x) { return x.lesson_id === lid; }).map(function (x) { return x.member_id; });
      var addS = want.filter(function (m) { return have.indexOf(m) < 0; }), delS = have.filter(function (m) { return want.indexOf(m) < 0; });
      if (addS.length) ops.push(sb.from("lesson_shares").insert(addS.map(function (m) { return { lesson_id: lid, member_id: m }; })));
      if (delS.length) ops.push(sb.from("lesson_shares").delete().eq("lesson_id", lid).in("member_id", delS));
      return Promise.all(ops).then(function (rs) { rs.forEach(function (x) { if (x.error) throw x.error; }); });
    }).then(function () { toast("Lesson saved."); S.lessonEdit = null; return load().then(render); }).catch(fail);
  }

  /* ---------- leader: people and groups ---------- */

    if (S.personEdit) return renderPersonForm();
    if (S.pageEdit) return renderPageForm();
    var html = '<ul class="panel list">' + (S.profiles.length ? S.profiles.map(function (p) {
      var gs = S.memberships.filter(function (m) { return m.member_id === p.id; }).map(function (m) { return groupChip(groupOf(m.group_id)); }).join(" ");
      return '<li><button class="item" data-act="editperson" data-id="' + p.id + '"><div class="what"><span class="t">' + esc(nameOf(p)) + '</span>' + (p.staff_id ? '<span class="small muted">ID ' + esc(p.staff_id) + "</span>" : "") + '<span class="row">' + (gs || '<span class="small muted">Not in any group</span>') + "</span></div>" +
        '<div class="act">' + (p.role === "leader" ? '<span class="chip warn">Leader</span>' : "") + "</div></button></li>";
    }).join("") : '<li class="empty">No one has signed up yet. Share the app link and ask your teams to create an account.</li>') + "</ul>";
    html += '<section class="panel pad stack"><h3>Team and region pages</h3><p class="small muted">Photos, information, roster links and policy links are now edited from the Region page.</p><div class="row"><a class="link" href="../region/">Open the Region page</a></div></section>';

      html += '<section class="panel pad stack"><h3>Your courses</h3><ul class="stack">' + courses.map(function (g) {
        var ns = S.sessions.filter(function (s) { return s.group_id === g.id; }).length;
        var nm = S.memberships.filter(function (m) { return m.group_id === g.id; }).length;
        var info = ns + " session" + (ns === 1 ? "" : "s") + ", " + nm + " " + (nm === 1 ? "person" : "people");
        if (S.delCourse === g.id) {
          return '<li class="notice stack"><p><strong>Delete ' + esc(g.name) + '?</strong> This removes its ' + ns + ' session' + (ns === 1 ? "" : "s") + ', all bookings and attendance for them, and takes ' + nm + ' ' + (nm === 1 ? "person" : "people") + ' out of the course. Lessons are kept. This cannot be undone.</p>' +
            '<div class="row"><button class="btn danger small" type="button" data-act="deletecourse" data-id="' + g.id + '">Yes, delete course</button><button class="btn ghost small" type="button" data-act="keepcourse">Keep it</button></div></li>';
        }
        return '<li class="row"><div class="what"><span class="t">' + esc(g.name) + '</span><span class="small muted">' + info + '</span></div><button class="btn danger small" type="button" data-act="askdelcourse" data-id="' + g.id + '">Delete</button></li>';
      }).join("") + "</ul></section>";
    }
    html += '<form class="panel pad stack" data-form="course"><h3>Add a course</h3><p class="small muted">A course is a separate set of sessions, for example for recruits from different teams. Choose the first date and the last date; sessions are created at the interval you set.</p>' +
      '<label>Course name<input id="c-name" name="name" placeholder="Ambulance Responders 2026" required></label>' +
      '<div class="grid2"><label>First session<input id="c-first" name="first" type="date" required></label><label>Last date<input id="c-last" name="last" type="date" required></label><label>Days between sessions<input id="c-every" name="every" type="number" min="1" value="14" required></label></div>' +
      '<button class="btn" type="submit">Create course</button></form>';
    return html;
  }

  function renderPersonForm() {

    var inG = {}; S.memberships.forEach(function (m) { if (m.member_id === p.id) inG[m.group_id] = true; });
    return '<button class="link back" data-act="personback">Back to people</button>' +
      '<section class="panel pad stack"><h2>' + esc(nameOf(p)) + "</h2><h3>Teams and courses</h3><ul>" +
      S.groups.map(function (g) { return '<li><label class="check"><input type="checkbox" data-act="member" data-mid="' + p.id + '" data-gid="' + g.id + '"' + (inG[g.id] ? " checked" : "") + "> <span>" + esc(g.name) + "</span> " + (g.type === "course" ? '<span class="chip course">Course</span>' : "") + "</label></li>"; }).join("") + "</ul>" +
      (p.id !== S.profile.id ? '<form class="stack" data-form="resetpw" data-id="' + p.id + '"><h3>Reset password</h3><p class="small muted">Set a temporary password and tell them. They can sign in with it straight away.</p><label>New password (8 or more characters)<input name="pw" type="text" minlength="8" autocomplete="off" required></label><button class="btn small" type="submit">Set password</button></form>' : "") +
      '<label>Role<select id="p-role" data-act="role" data-mid="' + p.id + '"><option value="member"' + (p.role === "member" ? " selected" : "") + '>Member</option><option value="leader"' + (p.role === "leader" ? " selected" : "") + ">Leader</option></select></label></section>";

  function linksToText(a) { return (Array.isArray(a) ? a : []).map(function (l) { return (l.label || "") + " | " + (l.url || ""); }).join("\n"); }
  function parseLinks(t) {

      var label = line.slice(0, i).trim(), url = line.slice(i + 1).trim();

  function renderPageForm() {

      '<form class="panel pad stack" data-form="page" data-id="' + g.id + '"><h2>' + esc(g.name) + ' page</h2>' +
      '<label>About this team (members see this)<textarea id="pg-blurb" name="blurb" placeholder="Station address, meeting place, contacts and anything else the team should know. Leave a blank line between paragraphs.">' + esc(g.blurb || "") + "</textarea></label>" +
      '<label>Roster link<input id="pg-roster" name="roster" value="' + esc(g.roster_url || "") + '" placeholder="/modules/rosters/lowereyre/tumbybay/"></label>' +
      '<label>Policies, procedures and links (one per line: name | address)<textarea id="pg-links" name="links" placeholder="SAMS intranet | https://...&#10;Policies and procedures | https://...">' + esc(linksToText(g.links)) + "</textarea></label>" +
      '<div class="row"><button class="btn" type="submit">Save page</button></div></form>' +
      '<section class="panel pad stack"><h3>Photo</h3><p class="small muted">' + (g.photo_path ? "A photo is set. Drop a new one to replace it." : "No photo yet.") + '</p>' +
      '<label class="drop" data-gid="' + g.id + '"><strong>Drag a photo here</strong><span class="small">or click to choose. JPG, PNG or WebP, up to 10 MB.</span><input id="pg-photo" type="file" accept="image/jpeg,image/png,image/webp" data-act="uploadphoto" data-gid="' + g.id + '"></label>' +

    return sb.from("groups").update(row).eq("id", id).then(function (r) {
      if (r.error) throw r.error; toast("Page saved."); return load().then(render);
    }).catch(fail);
  }
  function uploadPhoto(gid, fileList) {
    var file = fileList && fileList[0]; if (!file || S.uploading) return;

    if (file.size > 10485760) return fail({ message: "That photo is over 10 MB." });
    var g = by(gid, S.groups), old = g && g.photo_path;
    var path = gid + "/" + Date.now() + "-" + file.name.replace(/[^A-Za-z0-9._-]+/g, "_");
    S.uploading = true; toast("Uploading photo...");
    return sb.storage.from("team-photos").upload(path, file, { contentType: file.type }).then(function (r) {
      if (r.error) throw r.error;
      return sb.from("groups").update({ photo_path: path }).eq("id", gid);
    }).then(function (r) {
      if (r.error) throw r.error;
      if (old) sb.storage.from("team-photos").remove([old]);
      toast("Photo saved."); return load().then(render);

  }
  function removePhoto(gid) {

      if (r.error) throw r.error;
      return sb.storage.from("team-photos").remove([g.photo_path]);

        if (r.error) throw r.error;
        S.delSession = null; S.detail = null; toast("Session deleted."); return refresh();
      }).catch(fail);
    },
    attfilter: function (d) { S.attSession = d.sid; S.attFilter = d.f; render(); },
    past: function () { S.showPast = !S.showPast; render(); },
    open: function (d) { S.detail = d.id; S.attFilter = null; render(); window.scrollTo(0, 0); },
    back: function () { S.detail = null; render(); },
    newlesson: function () { S.lessonEdit = "new"; render(); },
    editlesson: function (d) { S.lessonEdit = d.id; render(); window.scrollTo(0, 0); },
    lessonback: function () { S.lessonEdit = null; render(); },
    deletelesson: function (d) {
      if (!window.confirm("Delete this lesson? Sessions using it will be left without a lesson.")) return;
      var paths = (S.files || []).filter(function (f) { return f.lesson_id === d.id; }).map(function (f) { return f.path; });
      var clear = paths.length ? sb.storage.from("lesson-files").remove(paths) : Promise.resolve({});
      return clear.then(function (r) { if (r.error) throw r.error; return sb.from("lessons").delete().eq("id", d.id); })
        .then(function (r) { if (r.error) throw r.error; S.lessonEdit = null; toast("Lesson deleted."); return refresh(); }).catch(fail);
    },
    editpage: function (d) { S.pageEdit = d.id; render(); window.scrollTo(0, 0); },
    pageback: function () { S.pageEdit = null; render(); },
    removephoto: function (d) { return removePhoto(d.id); },
    askdelcourse: function (d) { S.delCourse = d.id; render(); },
    keepcourse: function () { S.delCourse = null; render(); },
    deletecourse: function (d) {
      var g = groupOf(d.id); if (!g || g.type !== "course") return;
      return sb.from("groups").delete().eq("id", d.id).eq("type", "course").then(function (r) {
        if (r.error) throw r.error;
        S.delCourse = null; if (S.filter === d.id) S.filter = "all"; toast("Course deleted."); return refresh();
      }).catch(fail);
    },
    openfile: function (d) { return openFile(d.id); },
    removefile: function (d) { return removeFile(d.id); },
    editperson: function (d) { S.personEdit = d.id; render(); window.scrollTo(0, 0); },
    personback: function () { S.personEdit = null; render(); }
  };

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t || t.tagName === "INPUT" || t.tagName === "SELECT") return;
    var fn = actions[t.dataset.act]; if (fn) fn(t.dataset, t);
  });
  document.addEventListener("change", function (e) {
    var t = e.target; if (!t.dataset || !t.dataset.act) return;
    if (t.dataset.act === "attend") setAttendance(t.dataset.sid, t.dataset.mid, t.checked);
    else if (t.dataset.act === "rattend") setRoster(t.dataset.sid, t.dataset.mid, t.checked);
    else if (t.dataset.act === "member") setMembership(t.dataset.mid, t.dataset.gid, t.checked);
    else if (t.dataset.act === "role") setRole(t.dataset.mid, t.value);
    else if (t.dataset.act === "upload") uploadFiles(t.dataset.lid, t.files, t);
    else if (t.dataset.act === "uploadphoto") uploadPhoto(t.dataset.gid, t.files);
  });
  /* drag and drop: highlight the drop zone, and stop the browser opening a file dropped elsewhere */
  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0; }
  document.addEventListener("dragover", function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    var z = e.target.closest && e.target.closest(".drop");
    e.dataTransfer.dropEffect = z ? "copy" : "none";
    Array.prototype.forEach.call(document.querySelectorAll(".drop"), function (d) { d.classList.toggle("over", d === z); });
  });
  document.addEventListener("dragleave", function (e) {
    if (!e.relatedTarget) Array.prototype.forEach.call(document.querySelectorAll(".drop"), function (d) { d.classList.remove("over"); });
  });
  document.addEventListener("drop", function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    Array.prototype.forEach.call(document.querySelectorAll(".drop"), function (d) { d.classList.remove("over"); });
    var z = e.target.closest && e.target.closest(".drop");
    if (z && z.dataset.gid) uploadPhoto(z.dataset.gid, e.dataTransfer.files);
    else if (z) uploadFiles(z.dataset.lid, e.dataTransfer.files);
  });
  document.addEventListener("submit", function (e) {
    var form = e.target; if (!form.dataset.form) return;
    e.preventDefault();
    var btn = form.querySelector('[type="submit"]'); if (btn) btn.disabled = true;
    var kind = form.dataset.form, f = new FormData(form), job;
    if (kind === "auth") {
      var raw = f.get("email").trim(), email = loginEmail(raw), pass = f.get("pass");
      if (S.authMode === "up" && raw.indexOf("@") > -1) { if (btn) btn.disabled = false; return fail({ message: "Enter your ambulance ID number, not an email address." }); }
      job = S.authMode === "up"
        ? sb.auth.signUp({ email: email, password: pass, options: { data: { full_name: f.get("name").trim(), staff_id: raw } } }).then(function (r) {
            if (r.error) throw r.error;
            if (!r.data.session) return sb.auth.signInWithPassword({ email: email, password: pass }).then(function (x) { if (x.error) throw x.error; });
          })
        : sb.auth.signInWithPassword({ email: email, password: pass }).then(function (r) { if (r.error) throw r.error; });
      job = job.catch(fail);
    } else if (kind === "resetpw") {
      job = sb.rpc("leader_set_password", { member: form.dataset.id, new_password: f.get("pw") }).then(function (r) { if (r.error) throw r.error; form.reset(); toast("Password set. Let them know."); }).catch(fail);
    } else if (kind === "reflection") job = saveReflection(form);
    else if (kind === "session") job = saveSession(form);
    else if (kind === "lesson") job = saveLesson(form);
    else if (kind === "course") job = createCourse(form);
    else if (kind === "page") job = savePage(form);
    if (job) job.then(function () { if (btn && document.contains(btn)) btn.disabled = false; });
  });

  /* ---------- start ---------- */
  function onSession(session) {
    S.user = session ? session.user : null;
    if (!S.user) { S.profile = null; S.detail = null; S.tab = "calendar"; return renderAuth(); }
    load().then(render).catch(function (e) { fail(e); renderAuth(); });
  }
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(function () { onSession(session); }, 0);
  });
})();
</script>
</body>
</html>
