<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
<script>
/* Team Leader training nights intro. Screenshots (*.jpg, 2x) are of /training/ (leader view) filled with invented
   teams and people; SH holds each picture's size and the boxes of the parts that get highlighted (image px). */
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const SH={"calendar":{"_w":860,"_h":1200,"setup":[32,438,358,72],"one":[414,438,292,72],"tabs":[32,98,796,96]},"plan":{"_w":860,"_h":3510,"team":[79,112,702,139],"who":[79,277,702,331],"first":[79,634,338,142],"repeat":[443,634,338,142],"last":[79,801,338,142],"times":[79,969,338,142],"skips":[79,1301,702,88],"preview":[79,1528,702,1789],"create":[79,3342,702,88],"xold":[79,1797,702,48],"xhol":[79,2017,702,48]},"plan-team":{"_w":860,"_h":1200,"who":[79,227,702,331],"first":[79,584,338,142],"preview":[79,1478,702,1715]},"after":{"_w":860,"_h":2720,"list":[32,70,796,11906]},"session":{"_w":860,"_h":1350,"lessons":[79,197,702,464],"save":[79,1180,283,88],"del":[386,1180,307,88]},"delete":{"_w":860,"_h":600,"notice":[79,201,702,278]},"one":{"_w":860,"_h":1460,"form":[32,38,796,1375]},"dash-training":{"_w":796,"_h":2206,"warn":[37,406,722,153]}};
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74",g:"#2e9d5f",y:"#e3a712",r:"#c9483a"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
const mix=(a,b,f)=>a+(b-a)*eo(f);
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
let clipN=0;
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:8,stdDeviation:10,"flood-color":"#000","flood-opacity":.35},sh); return d}
let D;
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?h*.42:h*.62),"font-size":30,"font-weight":700},gg);
  if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function chip(g,s,x,y,a,fill,dot){if(a<=0)return;const gg=grp(g,a),w=s.length*14+(dot?78:44);
  el("rect",{x,y,width:w,height:54,rx:27,fill},gg);
  if(dot)el("rect",{x:x+20,y:y+15,width:24,height:24,rx:6,fill:dot},gg);
  txt(s,{x:x+(dot?58:22),y:y+35,"font-size":24,"font-weight":700},gg);return w}
/* a screenshot in a rounded window: name, window x/y/w/h, source y (image px) at the top of the window */
function shot(g,name,x,y,w,h,srcY,a){
  if(a<=0)return null;
  const s=w/SH[name]._w, id="c"+(clipN++);
  const cp=el("clipPath",{id},D);el("rect",{x,y,width:w,height:h,rx:20},cp);
  const gg=grp(g,a);
  el("rect",{x,y,width:w,height:h,rx:20,fill:"#f4f6f1",filter:"url(#sh)"},gg);
  const ig=el("g",{"clip-path":`url(#${id})`},gg);
  el("image",{href:name+".jpg",x,y:y-srcY*s,width:w,height:SH[name]._h*s},ig);
  return {g:ig,s,x,y,srcY,name}}   // highlights go inside the clipped window
/* a gold outline round part of a screenshot */
function hi(P,key,a,col){if(!P||a<=0)return;const b=SH[P.name][key];if(!b)return;
  el("rect",{x:P.x+b[0]*P.s-6,y:P.y+(b[1]-P.srcY)*P.s-6,width:b[2]*P.s+12,height:b[3]*P.s+12,rx:14,fill:"none",stroke:col||C.gold,"stroke-width":5,opacity:a},P.g)}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>62;
  el("rect",{x:70,y:long?578:590,width:1140,height:long?108:84,rx:22,fill:"rgba(0,0,0,.42)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>52?30:34,"font-weight":600},g);
  else{let m=Math.floor(s.text.length/2),L=s.text.lastIndexOf(" ",m),R=s.text.indexOf(" ",m);const cut=(m-L<R-m||R<0)?L:R;
    txt(s.text.slice(0,cut),{x:640,y:622,"text-anchor":"middle","font-size":30,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:662,"text-anchor":"middle","font-size":30,"font-weight":600},g);}
  txt("DSY TEAM LEADER GUIDE",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const frac=(k,f)=>S[k].s+(S[k].e-S[k].s)*f;
  const at=(k)=>S[Math.min(k,S.length-1)].s;
  const W=[70,150,560,420];   // screenshot window

  if(i===0){
    txt("TRAINING NIGHTS",{x:640,y:320,"text-anchor":"middle","font-size":118,"font-weight":800,"letter-spacing":"-3",opacity:rv(T,S[0].s,0.5)},g);
    el("rect",{x:640-200*rv(T,S[0].s+0.2,0.7),y:352,width:400*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("Team Leader microlearning",{x:640,y:420,"text-anchor":"middle","font-size":38,fill:"#dff1e7",opacity:rv(T,S[0].s+0.4,0.5)},g);
    chip(g,"A whole year of nights, in one go",640-255,476,rv(T,S[1].s,0.5),"rgba(63,174,116,.55)");
  }

  if(i===1){
    if(T<S[2].s-0.1){
      const P=shot(g,"calendar",...W,mix(0,300,pr(T,S[1].s-0.2,S[1].s+0.6)),rv(T,S[0].s-0.2,0.5));
      hi(P,"tabs",rv(T,S[0].s+0.3,0.3)*(1-pr(T,S[1].s-0.2,S[1].s)));
      hi(P,"setup",rv(T,S[1].s+0.3,0.3));
    } else {
      const P=shot(g,"plan",...W,0,1); hi(P,"team",rv(T,S[2].s+0.2,0.3));
    }
    row(g,680,170,530,96,"Training app: Calendar",null,rv(T,S[0].s),C.mint);
    row(g,680,282,530,96,"Set up training nights",null,rv(T,S[1].s),C.gold);
    row(g,680,394,530,96,"Choose the team",null,rv(T,S[2].s),C.gold);
  }

  if(i===2){
    const P=shot(g,"plan",...W,200,rv(T,S[0].s-0.2,0.5)); hi(P,"who",rv(T,S[0].s+0.4,0.3));
    row(g,680,170,530,120,"Team Leader visits","Leader-led, you facilitate",rv(T,S[1].s),C.gold);
    row(g,680,310,530,120,"Team training","Team-led, facilitator later",rv(T,S[2].s),C.mint);
  }

  if(i===3){
    const P=shot(g,"plan",...W,mix(560,600,pr(T,S[0].s,S[4].s)),rv(T,S[0].s-0.2,0.5));
    hi(P,"first",rv(T,S[0].s,0.3)*(1-pr(T,S[2].s-0.2,S[2].s)));
    hi(P,"repeat",rv(T,S[2].s,0.3)*(1-pr(T,S[3].s-0.2,S[3].s)));
    hi(P,"last",rv(T,S[3].s,0.3)*(1-pr(T,S[4].s-0.2,S[4].s)));
    hi(P,"times",rv(T,S[4].s,0.3));
    row(g,680,160,530,88,"First night: repeats that weekday",null,rv(T,S[0].s),C.gold);
    row(g,680,262,530,88,"Weekly to every 4th week",null,rv(T,S[2].s),C.gold);
    row(g,680,364,530,88,"Last date: end of school year",null,rv(T,S[3].s),C.gold);
    row(g,680,466,530,88,"Start and finish times",null,rv(T,S[4].s),C.mint);
  }

  if(i===4){
    const y=T<S[1].s?1150:T<S[4].s?mix(1150,1560,pr(T,S[1].s,S[2].s)):mix(1560,2860,pr(T,S[4].s,S[4].s+1));
    const P=shot(g,"plan",...W,y,rv(T,S[0].s-0.2,0.5));
    hi(P,"skips",rv(T,S[0].s+0.2,0.3)*(1-pr(T,S[1].s-0.2,S[1].s)));
    hi(P,"xhol",rv(T,S[2].s,0.3),C.red); hi(P,"xold",rv(T,S[3].s,0.3),C.red);
    hi(P,"create",rv(T,frac(4,0.6),0.3));
    chip(g,"Holidays left out",680,180,rv(T,S[0].s,0.4),"rgba(0,0,0,.32)",C.y);
    chip(g,"Crossed through, with the reason",680,254,rv(T,S[2].s,0.4),"rgba(0,0,0,.32)",C.r);
    chip(g,"Existing nights kept",680,328,rv(T,S[3].s,0.4),"rgba(0,0,0,.32)",C.g);
    chip(g,"Create sessions",680,430,rv(T,S[4].s,0.4),"rgba(227,167,18,.55)");
  }

  if(i===5){
    const P=shot(g,"plan-team",70,150,555,420,180,rv(T,S[1].s-0.2,0.5)); hi(P,"who",rv(T,S[2].s,0.3));
    const Q=shot(g,"after",655,150,555,420,mix(60,300,pr(T,frac(2,0.5),frac(2,0.5)+1.2)),rv(T,frac(2,0.4),0.5));
    if(T<S[1].s-0.2) chip(g,"Visits and team training, week about",640-300,300,rv(T,S[0].s,0.4),"rgba(0,0,0,.35)");
  }

  if(i===6){
    if(T<S[2].s-0.1){
      const P=shot(g,"session",...W,mix(0,120,pr(T,S[1].s,S[1].s+0.8)),rv(T,S[0].s-0.2,0.5)); hi(P,"lessons",rv(T,S[1].s+0.4,0.3));
    } else {
      const P=shot(g,"dash-training",...W,mix(120,220,pr(T,S[2].s,S[2].s+0.8)),1); hi(P,"warn",rv(T,S[2].s+0.3,0.3));
    }
    row(g,680,170,530,96,"Open a session",null,rv(T,S[1].s),C.mint);
    row(g,680,282,530,96,"Add lessons, in order",null,rv(T,frac(1,0.4)),C.mint);
    row(g,680,394,530,110,"Dashboard","Nights with no lesson, next 4 weeks",rv(T,S[2].s),C.gold);
  }

  if(i===7){
    if(T<S[1].s-0.1){ const P=shot(g,"one",...W,mix(0,200,pr(T,S[0].s+0.5,S[0].s+1.5)),rv(T,S[0].s-0.2,0.5)); hi(P,"form",0); }
    else { const P=shot(g,"delete",...W,90,1); hi(P,"notice",rv(T,S[2].s,0.3),C.red); }
    row(g,680,170,530,96,"Add one session",null,rv(T,S[0].s),C.mint);
    row(g,680,282,530,96,"Delete session",null,rv(T,S[1].s),C.red);
    chip(g,"Bookings and attendance go too",680,410,rv(T,S[2].s,0.4),"rgba(226,87,76,.55)");
    chip(g,"Can't be undone",680,484,rv(T,frac(2,0.6),0.4),"rgba(226,87,76,.55)");
  }

  if(i===8){
    [["1","Team","and who it's for"],["2","Dates","check the list"],["3","Lessons","one for every night"]].forEach((p,k)=>{
      const a=rv(T,S[k].s,0.4), w=360, x=70+k*390, y=230, last=k===2;
      const gg=grp(g,a);el("rect",{x,y,width:w,height:180,rx:26,fill:last?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,y+50,p[0],last?"#fff":C.gold);
      txt(p[1],{x:x+w/2,y:y+115,"text-anchor":"middle","font-size":34,"font-weight":800,fill:last?C.ink:"#fff"},gg);
      txt(p[2],{x:x+w/2,y:y+152,"text-anchor":"middle","font-size":25,fill:last?C.ink:"#cfe7da"},gg)});
  }
}
function render(t){
  v.innerHTML=""; clipN=0; D=defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Training nights",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("dsytraining.com/training  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
