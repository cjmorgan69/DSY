<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRiVE presenter view</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html, body { overflow: auto; background: #f1f6f4; color: var(--ink); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 24px 40px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-family: var(--head); font-size: 28px; margin: 0; color: var(--gd); flex: 1; min-width: 260px; }
  button { background: var(--g); color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font: inherit; font-size: 16px; cursor: pointer; }
  button.alt { background: #cfe0d9; color: var(--gd); }
  .panel { background: #fff; border-radius: 14px; padding: 20px 24px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  .panel h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
  #cur { font-family: var(--head); font-size: 30px; color: var(--gd); margin-bottom: 6px; }
  #meta { color: var(--mut); margin-bottom: 14px; }
  #timer { font-size: 34px; font-variant-numeric: tabular-nums; color: var(--gd); font-weight: 700; }
  #nextTitle { font-size: 20px; }
  #onslide li { margin-bottom: 4px; }
  #notesBody { font-size: 18px; line-height: 1.45; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="hdr">DRiVE presenter view</h1>
    <span id="timer">00:00</span>
    <button class="alt" id="tReset">Reset timer</button>
    <button class="alt" id="bP">&#9664; Previous</button>
    <button id="bN">Next &#9654;</button>
  </header>
  <div>
    <div class="panel">
      <h2>Now showing</h2>
      <div id="cur">Waiting for the slide show&hellip;</div>
      <div id="meta"></div>
      <div id="notesBody"></div>
    </div>
  </div>
  <div>
    <div class="panel" style="margin-bottom:24px"><h2>Next</h2><div id="nextTitle">&ndash;</div></div>
    <div class="panel"><h2>On the slide</h2><ul id="onslide"></ul></div>
  </div>
</div>
<p class="small" style="text-align:center">Keep the slide show window open (it is what the group sees). Arrow keys here also move the slides.</p>
<script src="data/manifest.js"></script>
<script src="assets/common.js"></script>
<script>
(function () {
  var D = window.DRIVE, E = D.esc, slides = D.flat(), t0 = Date.now();
  function post(m) { if (window.opener) window.opener.postMessage(m, '*'); }
  function render(g, step, max) {
    var it = slides[g]; if (!it) return;
    document.getElementById('cur').textContent = D.title(it.s);
    document.getElementById('meta').textContent = 'Section ' + it.sec.number + ' · slide ' + it.n + ' of ' + it.sec.slides.length + (max ? ' · reveal ' + step + ' of ' + max : '');
    document.getElementById('notesBody').innerHTML = D.notesHTML(it.s);
    var nx = max && step < max ? { s: { title: 'Reveal next point on this slide' } } : (slides[g + 1] || null);
    document.getElementById('nextTitle').textContent = nx ? D.title(nx.s) : 'End of the slides';
    document.getElementById('onslide').innerHTML = D.slideText(it.s).map(function (x) { return '<li>' + E(x) + '</li>'; }).join('');
    document.title = 'Presenter: ' + D.title(it.s);
  }
  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.type === 'state') render(m.g, m.step, m.maxStep);
  });
  document.getElementById('bN').onclick = function () { post({ type: 'nav', dir: 1 }); };
  document.getElementById('bP').onclick = function () { post({ type: 'nav', dir: -1 }); };
  document.getElementById('tReset').onclick = function () { t0 = Date.now(); };
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].indexOf(k) > -1) { e.preventDefault(); post({ type: 'nav', dir: 1 }); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].indexOf(k) > -1) { e.preventDefault(); post({ type: 'nav', dir: -1 }); }
  });
  setInterval(function () {
    var s = Math.floor((Date.now() - t0) / 1000), m = Math.floor(s / 60);
    document.getElementById('timer').textContent = (m < 10 ? '0' : '') + m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }, 500);
  post({ type: 'hello' });
})();
</script>
</body>
</html>
