<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#2a4f8a,#0f2142);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const C={gold:"#e3a712",red:"#e2574c",mint:"#9cc3f0",ink:"#0f2142",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:6,stdDeviation:8,"flood-color":"#000","flood-opacity":.28},sh)}
/* reveal: fade/slide in starting at time s */
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function tick(g,x,y,a,r){r=r||20;el("circle",{cx:x,cy:y,r,fill:a>0?C.ok:"rgba(255,255,255,.15)"},g);
  if(a>0)el("path",{d:`M${x-r*.45} ${y} L${x-r*.1} ${y+r*.38} L${x+r*.5} ${y-r*.35}`,fill:"none",stroke:"#fff","stroke-width":r*.28,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":60,"stroke-dashoffset":60*(1-a)},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?(Array.isArray(sub)?h*.32:h*.42):h*.62),"font-size":32,"font-weight":700},gg);
  if(Array.isArray(sub))sub.forEach((ln,k)=>txt(ln,{x:x+34,y:y+h*.62+k*30,"font-size":23,fill:"#cdd9ec"},gg));
  else if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cdd9ec"},gg);
  return gg}
function bullets(g,x,y,items,t,starts,col){items.forEach((s,i)=>{const a=rv(t,starts[i]);const gg=grp(g,a);
  el("circle",{cx:x,cy:y+i*50-9,r:7,fill:col||C.gold},gg);txt(s,{x:x+24,y:y+i*50,"font-size":28},gg)})}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>70;
  el("rect",{x:70,y:long?570:590,width:1140,height:long?112:84,rx:22,fill:"rgba(0,0,0,.34)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>62?30:34,"font-weight":600},g);
  else{ // wrap into two lines at the nearest space to the middle
    let m=Math.floor(s.text.length/2), L=s.text.lastIndexOf(" ",m), R=s.text.indexOf(" ",m);
    const cut=(m-L<R-m||R<0)?L:R;
    const fs=s.text.length>150?25:(s.text.length>125?28:32);
    txt(s.text.slice(0,cut),{x:640,y:620,"text-anchor":"middle","font-size":fs,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:664,"text-anchor":"middle","font-size":fs,"font-weight":600},g);}
  txt("CEC ADULT SEPSIS PATHWAY · ECAT A3.4",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const frac=(k,f)=>S[k].s+(S[k].e-S[k].s)*f;
  const chips=(items,x0,y,starts,fill,maxX)=>{let x=x0,yy=y;items.forEach((c,k)=>{const w=c.length*13.2+40;if(x+w>maxX){x=x0;yy+=62}
      const a=rv(T,starts[k],0.35);if(a>0){const g2=grp(g,a);el("rect",{x,y:yy,width:w,height:48,rx:24,fill},g2);txt(c,{x:x+w/2,y:yy+31,"text-anchor":"middle","font-size":22,"font-weight":700},g2)}x+=w+10})};

  if(i===0){
    txt("Adult sepsis",{x:640,y:320,"text-anchor":"middle","font-size":124,"font-weight":800,"letter-spacing":"-4",opacity:rv(T,S[0].s,0.5)},g);
    el("rect",{x:640-230*rv(T,S[0].s+0.2,0.7),y:352,width:460*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("What rural nurses need to know in the first hour",{x:640,y:430,"text-anchor":"middle","font-size":36,fill:"#dce6f5",opacity:rv(T,S[1].s,0.5)},g);
    badge(g,"A medical emergency",640,505,rv(T,S[1].s+0.5,0.5),"rgba(226,87,76,.55)");
  }

  if(i===1){
    row(g,70,170,1140,90,"Infection with organ dysfunction",null,rv(T,S[0].s),C.red);
    row(g,70,275,1140,80,"A medical emergency",null,rv(T,S[1].s),C.gold);
    row(g,70,370,1140,90,"Adult Sepsis Pathway: 16 years or older","any clinical setting",rv(T,S[2].s),C.mint);
    badge(g,"Pregnant or up to 6 weeks after: Maternal Sepsis Pathway",640,510,rv(T,S[3].s,0.5),"rgba(0,0,0,.4)");
  }

  if(i===2){
    txt("Signs of infection",{x:70,y:188,"font-size":24,fill:"#cdd9ec",opacity:rv(T,S[1].s,0.4)},g);
    chips(["Fever or rigors","Fast breathing","New confusion","Red, swollen wound or line","Non-blanching rash"],70,205,[S[2].s,frac(2,0.45),frac(2,0.8),S[3].s,frac(3,0.6)],"rgba(226,87,76,.45)",1210);
    txt("Risk factors",{x:70,y:368,"font-size":24,fill:"#cdd9ec",opacity:rv(T,S[4].s,0.4)},g);
    chips(["65 or older","Frail","Immunocompromised","Device or line"],70,385,[S[5].s,frac(5,0.35),frac(5,0.6),frac(5,0.85)],"rgba(227,167,18,.38)",1210);
    badge(g,"Elderly: there may be no fever",640,520,rv(T,S[6].s,0.5),"rgba(0,0,0,.4)");
  }

  if(i===3){
    row(g,70,165,1140,70,"A-G assessment and a full set of observations",null,rv(T,S[0].s),C.mint);
    const a1=rv(T,S[1].s); if(a1>0){const gg=grp(g,a1);card(gg,70,250,560,250,"rgba(226,87,76,.25)","rgba(226,87,76,.7)");
      txt("Any RED zone",{x:100,y:300,"font-size":34,"font-weight":800},gg);txt("or lactate 4 or more",{x:100,y:338,"font-size":24,fill:"#f3d0cc"},gg);
      if(T>=S[2].s){txt("Rapid response",{x:100,y:400,"font-size":30,"font-weight":800,fill:"#ff9d94"},gg);txt("probable sepsis, septic shock",{x:100,y:438,"font-size":22,fill:"#f3d0cc"},gg)}}
    const a3=rv(T,S[3].s); if(a3>0){const gg=grp(g,a3);card(gg,650,250,560,250,"rgba(227,167,18,.18)","rgba(227,167,18,.7)");
      txt("2+ YELLOW zone",{x:680,y:300,"font-size":34,"font-weight":800},gg);txt("or lactate 2 or more",{x:680,y:338,"font-size":24,fill:"#f1e3bd"},gg);
      if(T>=S[4].s){txt("Clinical review",{x:680,y:400,"font-size":30,"font-weight":800,fill:C.gold},gg);txt("within 30 min + senior clinician",{x:680,y:438,"font-size":22,fill:"#f1e3bd"},gg)}}
  }

  if(i===4){
    badge(g,"Within 60 minutes",640,190,rv(T,S[1].s,0.5),"rgba(227,167,18,.55)");
    const st=[["1","Get help",S[2].s],["2","Monitor","SpO2 95%+",frac(2,0.4)],["3","Access","lactate, bloods, 2 cultures",S[3].s],["4","500 mL bolus","aim SBP 100+",S[4].s],["5","Antibiotics",S[5].s]];
    st.forEach((c,k)=>{const tt=c.length===4?c[3]:c[2], a=rv(T,tt,0.45); if(a<=0)return; const gg=grp(g,a), x=60+k*236;
      card(gg,x,240,220,220);badgeNum(gg,x+44,290,c[0],C.gold);
      txt(c[1],{x:x+22,y:360,"font-size":c[1].length>10?24:28,"font-weight":800},gg);if(c.length===4)txt(c[2],{x:x+22,y:396,"font-size":c[2].length>14?16:20,fill:"#cdd9ec"},gg)});
  }

  if(i===5){
    row(g,70,165,1140,90,"ECAT: a credentialed nurse can start antibiotics",null,rv(T,S[0].s),C.mint);
    row(g,70,270,1140,90,"Probable sepsis or septic shock","and no medical or nurse practitioner available",rv(T,S[1].s),C.gold);
    const a2=rv(T,S[2].s); if(a2>0){const gg=grp(g,a2);card(gg,70,375,1140,100);
      txt("Gentamicin (by weight)",{x:104,y:420,"font-size":30,"font-weight":800},gg);
      txt("+ flucloxacillin",{x:500,y:420,"font-size":30,"font-weight":800,fill:C.mint},gg);
      if(T>=S[3].s)txt("or cefazolin, or vancomycin, by allergy",{x:104,y:458,"font-size":24,fill:"#cdd9ec"},gg)}
    badge(g,"Cultures first, but never delay antibiotics",640,520,rv(T,S[4].s,0.5),"rgba(226,87,76,.5)");
  }

  if(i===6){
    row(g,70,180,1140,90,"Repeat lactate within 2 hours",null,rv(T,S[1].s),C.gold);
    row(g,70,290,1140,100,"Observations every 30 min for 2 hours","then hourly for 4 hours",rv(T,S[2].s),C.mint);
    row(g,70,410,1140,90,"Escalate early if not improving",null,rv(T,S[3].s),C.red);
  }

  if(i===7){
    const labels=[["1","Think","sepsis"],["2","Escalate","local CERS"],["3","Treat","within the hour"]];
    labels.forEach((p,k)=>{const a=rv(T,k===0?frac(0,0.4):S[k].s,0.4), x=110+k*360;
      const gg=grp(g,a);el("rect",{x,y:225,width:330,height:170,rx:26,fill:k===2?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,275,p[0],k===2?"#fff":C.gold);
      txt(p[1],{x:x+165,y:338,"text-anchor":"middle","font-size":30,"font-weight":800,fill:k===2?C.ink:"#fff"},gg);txt(p[2],{x:x+165,y:372,"text-anchor":"middle","font-size":24,fill:k===2?C.ink:"#cdd9ec"},gg)});
    badge(g,"Now try the antibiotic checker on this page",640,470,rv(T,S[3].s,0.5),"rgba(0,0,0,.35)");
  }
}
function badge(g,s,x,y,a,col){
  if(a<=0)return;
  const gg=grp(g,a), w=s.length*15.5+56;
  el("rect",{x:x-w/2,y:y-30,width:w,height:56,rx:28,fill:col||"rgba(0,0,0,.35)"},gg);
  txt(s,{x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":700},gg);
}
function render(t){
  v.innerHTML=""; defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Adult sepsis",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("CEC Adult Sepsis Pathway · ECAT A3.4 · DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
