<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta name="theme-color" content="#f5f5f7">
  <title>Operations Overview</title>

  <style>
    :root {
      color-scheme: light;
      --background: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #e5e5ea;
      --blue: #0066cc;
      --green: #b9edc7;
      --yellow: #ffe581;
      --red: #ffc4bf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.35;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #80baff;
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      max-width: 1080px;
      margin: auto;
      padding: 18px 10px 28px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 3px 14px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.8px;
    }

    .text-button {
      min-height: 44px;
      padding: 6px 10px;
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
    }

    .date-controls {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      gap: 7px;
      max-width: 680px;
      margin: 0 auto 10px;
    }

    .date-controls button,
    .date-controls input {
      width: 100%;
      min-width: 0;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }

    .date-controls button {
      color: var(--blue);
      font-size: 27px;
    }

    .date-controls input {
      padding: 7px;
      color: var(--text);
      text-align: center;
      font-size: 16px;
    }

    /* Cluster filter: All / Lower Eyre / Central Eyre / West Coast. */
    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
      max-width: 680px;
      margin: 0 auto 10px;
      padding: 3px;
      border-radius: 12px;
      background: #e8e8ed;
    }

    .filters button {
      min-height: 38px;
      padding: 4px 2px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .filters button[aria-pressed="true"] {
      background: var(--surface);
      box-shadow: 0 1px 3px #0000001f;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 2px 5px #00000003;
    }

    .day-heading {
      padding: 13px 8px 12px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    .day-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    /* Needs-attention summary above the grid. */
    .attention {
      padding: 10px 12px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.5;
    }

    .attention h3 {
      margin: 0 0 4px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .attention ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 3px;
    }

    .attention li {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 8px;
      align-items: baseline;
    }

    .attention .team {
      font-weight: 650;
      min-width: 0;
    }

    .attention .ranges {
      color: #78221b;
      font-variant-numeric: tabular-nums;
      min-width: 0;
    }

    .attention .all-clear {
      color: #124a25;
    }

    /* The grid scrolls sideways on narrow screens; the time column stays put. */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }

    .time-column {
      width: 48px;
    }

    thead th {
      height: 35px;
      padding: 4px 2px;
      border-bottom: 1px solid var(--line);
      background: #fafafa;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    thead tr.clusters th {
      height: 28px;
      color: var(--text);
      font-size: 11px;
      letter-spacing: 0.2px;
    }

    thead th.cluster-start,
    tbody td.cluster-start {
      border-left: 2px solid var(--line);
    }

    thead th:first-child {
      text-align: left;
      padding-left: 8px;
    }

    tbody th {
      padding: 0 0 0 8px;
      color: var(--muted);
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    th.sticky {
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--surface);
    }

    thead th.sticky {
      background: #fafafa;
    }

    tbody td {
      padding: 2px 2px;
    }

    tbody td:last-child {
      padding-right: 7px;
    }

    tbody tr {
      height: 28px;
    }

    tbody tr.night {
      border-top: 4px solid #f2f2f7;
    }

    tbody tr.midnight {
      border-top: 2px solid var(--line);
    }

    .tile {
      display: grid;
      min-height: 24px;
      place-items: center;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .green {
      background: var(--green);
      color: #124a25;
    }

    .yellow {
      background: var(--yellow);
      color: #554000;
    }

    .red {
      background: var(--red);
      color: #78221b;
    }

    .key {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px 12px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .footnote,
    .updated {
      margin: 9px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .message {
      max-width: 680px;
      margin: 10px auto;
      padding: 14px;
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      color: #8b241b;
      background: #ffebe8;
    }

    .load-problems {
      margin: 0 0 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #ffebe8;
      color: #8b241b;
      font-size: 12px;
      line-height: 1.5;
    }

    .load-problems p {
      margin: 0;
    }

    @media (max-width: 539px) {
      /* 12 teams need a little more room than a phone has. */
      table.all-teams {
        min-width: 420px;
      }
    }

    @media (min-width: 540px) {
      .page {
        padding-top: 28px;
      }

      .time-column {
        width: 65px;
      }

      tbody tr {
        height: 32px;
      }

      .tile {
        min-height: 27px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="top">
      <h1>Operations Overview</h1>
      <div>
        <button id="today" class="text-button" type="button">
          Today
        </button>
        <button id="refresh" class="text-button" type="button">
          Refresh
        </button>
      </div>
    </header>

    <nav class="date-controls" aria-label="Operational date">
      <button
        id="previous-day"
        type="button"
        aria-label="Previous operational day"
      >‹</button>

      <input
        id="date-picker"
        type="date"
        aria-label="Operational day starting date"
      >

      <button
        id="next-day"
        type="button"
        aria-label="Next operational day"
      >›</button>
    </nav>

    <div class="filters" role="group" aria-label="Show cluster">
      <button type="button" data-cluster="all" aria-pressed="true">All</button>
      <button type="button" data-cluster="lowereyre" aria-pressed="false">Lower Eyre</button>
      <button type="button" data-cluster="centraleyre" aria-pressed="false">Central Eyre</button>
      <button type="button" data-cluster="westcoast" aria-pressed="false">West Coast</button>
    </div>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    >Loading coverage…</div>

    <section id="results" hidden>
      <div id="load-problems" class="load-problems" role="alert" hidden></div>

      <div class="card">
        <div class="day-heading">
          <h2 id="day-title"></h2>
          <p id="day-range"></p>
        </div>

        <div id="attention" class="attention" aria-live="polite"></div>

        <div class="table-scroll">
          <table id="grid" aria-label="Hourly operational crew coverage for all teams">
            <colgroup id="columns"></colgroup>
            <thead id="table-head"></thead>
            <tbody id="timeline"></tbody>
          </table>
        </div>
      </div>

      <div id="team-key" class="key"></div>

      <div class="legend" aria-label="Coverage legend">
        <span><i class="dot green"></i>2+ crew</span>
        <span><i class="dot yellow"></i>1 crew</span>
        <span><i class="dot red"></i>0 crew</span>
      </div>

      <p class="footnote">
        Each row covers the next hour. Numbers show minimum
        operational crew throughout that hour. REC excluded.
        On a phone, swipe left or right on the date heading to
        change cluster.
      </p>

      <p id="dst-note" class="footnote" hidden></p>
      <p id="updated" class="updated"></p>
    </section>
  </main>

  <script>
    "use strict";

    /*
     * Each cluster's Apps Script already answers the "coverage"
     * request used by its own manager dashboard. This page asks all
     * three for the same operational day and shows them together.
     */
    const CLUSTERS = [
      {
        key: "lowereyre",
        name: "Lower Eyre",
        url: "https://script.google.com/macros/s/AKfycbxEboPS9reZI5OpUMdlriag0QeAJzIyXFZ2Jy0z_4qBJLEK054R5bDcJgyWAW2YSP6l/exec"
      },
      {
        key: "centraleyre",
        name: "Central Eyre",
        url: "https://script.google.com/macros/s/AKfycbwbeUGYW4VaBC8i0k228ASyRQt-B4_7pKKr5F3O5L-CrCmTH0hnx48pN7QTqkjXrfwRDA/exec"
      },
      {
        key: "westcoast",
        name: "West Coast",
        url: "https://script.google.com/macros/s/AKfycbxrcfdjF7kUZQBkHuw2mqrYXhqz54VrK9Agv-zzOyBG8BbAbC-lrDkY6zGK91VAwB_z/exec"
      }
    ];

    // Teams never shown here (test rosters).
    const EXCLUDED_TEAMS = ["summer bay"];

    const TIME_ZONE = "Australia/Adelaide";
    const FILTER_ORDER = ["all", ...CLUSTERS.map((cluster) => cluster.key)];
    const FILTER_STORAGE_KEY = "dsyOperationsOverviewFilter";

    const $ = (id) => document.getElementById(id);

    let selectedDate = currentOperationalDate();
    let overview = null;
    let filter = readStoredFilter();
    let requestNumber = 0;
    let activeController = null;

    function readStoredFilter() {
      try {
        const stored = localStorage.getItem(FILTER_STORAGE_KEY);
        return FILTER_ORDER.includes(stored) ? stored : "all";
      } catch (error) {
        return "all";
      }
    }

    function storeFilter() {
      try {
        localStorage.setItem(FILTER_STORAGE_KEY, filter);
      } catch (error) {
        // The filter simply isn't remembered.
      }
    }

    function addDays(date, days) {
      const value = new Date(date + "T12:00:00Z");
      value.setUTCDate(value.getUTCDate() + days);
      return value.toISOString().slice(0, 10);
    }

    function currentOperationalDate() {
      const parts = new Intl.DateTimeFormat("en-AU", {
        timeZone: TIME_ZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const values = Object.fromEntries(
        parts.map((part) => [part.type, part.value])
      );

      const date =
        values.year + "-" + values.month + "-" + values.day;

      return Number(values.hour) < 8 ? addDays(date, -1) : date;
    }

    function formatCalendarDate(date, options) {
      return new Intl.DateTimeFormat("en-AU", {
        ...options,
        timeZone: "UTC"
      }).format(new Date(date + "T12:00:00Z"));
    }

    function showMessage(text, error = false) {
      $("message").textContent = text;
      $("message").className = "message" + (error ? " error" : "");
      $("message").hidden = false;
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);

      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;

      return node;
    }

    function colourFor(count) {
      return count >= 2 ? "green" : count === 1 ? "yellow" : "red";
    }

    /*
     * Same request and checks as the cluster dashboards.
     */
    async function fetchCluster(cluster, date, signal) {
      const url = new URL(cluster.url);
      url.searchParams.set("action", "coverage");
      url.searchParams.set("date", date);
      url.searchParams.set("_", String(Date.now()));

      const response = await fetch(url.toString(), {
        method: "GET",
        redirect: "follow",
        credentials: "omit",
        signal
      });

      if (!response.ok) {
        throw new Error("Server returned HTTP " + response.status + ".");
      }

      const data = await response.json();

      if (!data.ok) {
        throw new Error(data.error || "Unable to load coverage.");
      }

      if (!Array.isArray(data.teams) || !Array.isArray(data.hours)) {
        throw new Error("Unexpected dashboard response.");
      }

      data.hours.forEach((hour) => {
        if (
          !Array.isArray(hour.counts) ||
          hour.counts.length !== data.teams.length ||
          hour.counts.some(
            (count) => !Number.isInteger(count) || count < 0
          )
        ) {
          throw new Error("Invalid coverage values returned.");
        }
      });

      return data;
    }

    /*
     * Combine the clusters into one list of teams, each with its own
     * hourly counts. Hours are matched by label so a cluster can never
     * shift another cluster's numbers by an hour.
     */
    function combine(results) {
      const loaded = results.filter((result) => result.data);
      const base = loaded[0].data;

      const teams = [];

      loaded.forEach(({ cluster, data }) => {
        const countsByLabel = new Map(
          data.hours.map((hour) => [hour.label + "|" + hour.calendarDate, hour.counts])
        );

        data.teams.forEach((team, teamIndex) => {
          if (EXCLUDED_TEAMS.includes(String(team.name || "").trim().toLowerCase())) {
            return;
          }

          teams.push({
            cluster,
            name: team.name,
            shortName: team.shortName || team.name,
            counts: base.hours.map((hour) => {
              const counts = countsByLabel.get(hour.label + "|" + hour.calendarDate);
              return counts ? counts[teamIndex] : null;
            })
          });
        });
      });

      return {
        operationalDate: base.operationalDate,
        nextDate: base.nextDate,
        hours: base.hours,
        teams,
        generatedAt: loaded
          .map(({ data }) => data.generatedAt)
          .filter(Boolean)
          .sort()[0],
        problems: results
          .filter((result) => result.error)
          .map(({ cluster, error }) => ({ cluster, error }))
      };
    }

    async function loadCoverage() {
      const thisRequest = ++requestNumber;

      if (activeController) activeController.abort();

      const controller = new AbortController();
      activeController = controller;

      $("date-picker").value = selectedDate;
      $("results").hidden = true;
      $("refresh").disabled = true;

      showMessage("Loading coverage for all clusters…");

      const timeout = setTimeout(() => controller.abort(), 30000);

      try {
        const results = await Promise.all(
          CLUSTERS.map((cluster) =>
            fetchCluster(cluster, selectedDate, controller.signal)
              .then((data) => ({ cluster, data }))
              .catch((error) => ({
                cluster,
                error: error.name === "AbortError"
                  ? "The request timed out."
                  : error.message
              }))
          )
        );

        // Do not let an older request replace a newer date.
        if (thisRequest !== requestNumber) return;

        if (!results.some((result) => result.data)) {
          showMessage(
            "No cluster could be loaded. " +
            results.map(({ cluster, error }) => cluster.name + ": " + error).join(" ") +
            " Check the connection, then Refresh.",
            true
          );
          return;
        }

        overview = combine(results);

        if (overview.teams.length === 0) {
          showMessage(
            "No active teams found. Add teams to each cluster's Teams " +
            "tab and set Active to TRUE."
          );
          return;
        }

        render();
      } finally {
        clearTimeout(timeout);

        if (thisRequest === requestNumber) {
          $("refresh").disabled = false;
        }
      }
    }

    /*
     * Contiguous runs of hours where a team has the given crew count,
     * written as "02:00–06:00".
     */
    function runsWhere(team, test) {
      const runs = [];
      let start = null;

      overview.hours.forEach((hour, index) => {
        const matches = team.counts[index] !== null && test(team.counts[index]);

        if (matches && start === null) start = index;

        if (!matches && start !== null) {
          runs.push([start, index]);
          start = null;
        }
      });

      if (start !== null) runs.push([start, overview.hours.length]);

      return runs.map(([from, to]) => {
        const end = to < overview.hours.length
          ? overview.hours[to].label
          : "08:00";

        return {
          text: overview.hours[from].label + "–" + end,
          hours: to - from
        };
      });
    }

    function renderAttention(visibleTeams) {
      const box = $("attention");
      box.replaceChildren();

      box.appendChild(element("h3", "Needs attention"));

      const flagged = visibleTeams
        .map((team) => ({ team, runs: runsWhere(team, (count) => count === 0) }))
        .filter(({ runs }) => runs.length > 0);

      if (flagged.length === 0) {
        box.appendChild(
          element(
            "p",
            "Every team shown has at least 1 crew in every hour.",
            "all-clear"
          )
        );
        box.lastChild.style.margin = "0";
        return;
      }

      const list = element("ul");

      flagged.forEach(({ team, runs }) => {
        const item = element("li");
        const total = runs.reduce((sum, run) => sum + run.hours, 0);

        item.appendChild(element("span", team.name, "team"));
        item.appendChild(
          element(
            "span",
            "0 crew " + runs.map((run) => run.text).join(", ") +
            " (" + total + (total === 1 ? " hour)" : " hours)"),
            "ranges"
          )
        );

        list.appendChild(item);
      });

      box.appendChild(list);
    }

    function render() {
      if (!overview) return;

      document.querySelectorAll(".filters button").forEach((button) => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.cluster === filter)
        );
      });

      const visibleTeams = overview.teams.filter(
        (team) => filter === "all" || team.cluster.key === filter
      );

      $("message").hidden = true;
      $("results").hidden = false;

      // Clusters that failed to load are named; the rest still show.
      const problems = overview.problems.filter(
        ({ cluster }) => filter === "all" || cluster.key === filter
      );

      $("load-problems").replaceChildren(
        ...problems.map(({ cluster, error }) =>
          element("p", cluster.name + " could not be loaded: " + error + " Use Refresh to try again.")
        )
      );
      $("load-problems").hidden = problems.length === 0;

      $("day-title").textContent = formatCalendarDate(
        overview.operationalDate,
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

      $("day-range").textContent =
        "08:00 → " +
        formatCalendarDate(overview.nextDate, {
          weekday: "short",
          day: "numeric",
          month: "short"
        }) +
        " 07:59 · Adelaide time";

      if (visibleTeams.length === 0) {
        $("attention").replaceChildren();
        $("columns").replaceChildren();
        $("table-head").replaceChildren();
        $("timeline").replaceChildren();
        $("team-key").replaceChildren();
        return;
      }

      renderAttention(visibleTeams);

      $("grid").classList.toggle("all-teams", visibleTeams.length > 6);

      $("columns").replaceChildren();
      $("columns").appendChild(element("col", undefined, "time-column"));

      visibleTeams.forEach(() => {
        $("columns").appendChild(element("col"));
      });

      // Row 1: cluster names spanning their teams.
      const clusterRow = element("tr", undefined, "clusters");
      const corner = element("th", "", "sticky");
      corner.rowSpan = 2;
      corner.textContent = "Time";
      corner.scope = "col";
      clusterRow.appendChild(corner);

      CLUSTERS.forEach((cluster) => {
        const span = visibleTeams.filter((team) => team.cluster === cluster).length;
        if (!span) return;

        const heading = element("th", cluster.name, "cluster-start");
        heading.colSpan = span;
        heading.scope = "colgroup";
        clusterRow.appendChild(heading);
      });

      // Row 2: team short names.
      const teamRow = element("tr");

      visibleTeams.forEach((team, index) => {
        const heading = element("th", team.shortName);
        heading.scope = "col";
        heading.title = team.name;
        heading.setAttribute("aria-label", team.name);

        if (index === 0 || visibleTeams[index - 1].cluster !== team.cluster) {
          heading.classList.add("cluster-start");
        }

        teamRow.appendChild(heading);
      });

      $("table-head").replaceChildren(clusterRow, teamRow);

      const fragment = document.createDocumentFragment();

      overview.hours.forEach((hour, hourIndex) => {
        const row = element("tr");

        if (hour.label === "18:00") row.classList.add("night");

        if (
          hourIndex > 0 &&
          hour.calendarDate !== overview.hours[hourIndex - 1].calendarDate
        ) {
          row.classList.add("midnight");
        }

        const timeCell = element("th", hour.label, "sticky");
        timeCell.scope = "row";
        timeCell.title = hour.detail;
        timeCell.setAttribute("aria-label", hour.detail);
        row.appendChild(timeCell);

        visibleTeams.forEach((team, teamIndex) => {
          const count = team.counts[hourIndex];
          const cell = element("td");

          if (teamIndex === 0 || visibleTeams[teamIndex - 1].cluster !== team.cluster) {
            cell.classList.add("cluster-start");
          }

          if (count === null) {
            cell.appendChild(element("div", "–", "tile"));
          } else {
            const tile = element("div", String(count), "tile " + colourFor(count));

            tile.setAttribute(
              "aria-label",
              team.name + ": minimum " + count +
              " operational crew, " + hour.detail
            );

            tile.title =
              team.name + " · " + hour.detail +
              " · Minimum " + count + " operational crew";

            cell.appendChild(tile);
          }

          row.appendChild(cell);
        });

        fragment.appendChild(row);
      });

      $("timeline").replaceChildren(fragment);

      $("team-key").replaceChildren();

      visibleTeams.forEach((team) => {
        const item = element("span");
        item.appendChild(element("strong", team.shortName + " "));
        item.appendChild(document.createTextNode(team.name));
        $("team-key").appendChild(item);
      });

      $("dst-note").hidden = overview.hours.length === 24;
      $("dst-note").textContent =
        "Daylight-saving change: this operational day contains " +
        overview.hours.length + " actual hours.";

      $("updated").textContent = overview.generatedAt
        ? "Updated " +
          new Intl.DateTimeFormat("en-AU", {
            timeZone: TIME_ZONE,
            day: "numeric",
            month: "short",
            hour: "2-digit",
            minute: "2-digit"
          }).format(new Date(overview.generatedAt)) +
          " · Adelaide time"
        : "";
    }

    function setFilter(next) {
      if (!FILTER_ORDER.includes(next) || next === filter) return;

      filter = next;
      storeFilter();
      render();
    }

    document.querySelectorAll(".filters button").forEach((button) => {
      button.addEventListener("click", () => setFilter(button.dataset.cluster));
    });

    /*
     * Swipe left/right on the day heading or the needs-attention box
     * to step through All → Lower Eyre → Central Eyre → West Coast.
     * (The grid itself keeps sideways scrolling for 12 teams.)
     */
    let touchStart = null;

    ["day-title", "day-range", "attention"].forEach((id) => {
      const target = id === "attention" ? $(id) : $(id).parentElement;

      target.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });

      target.addEventListener("touchend", (event) => {
        if (!touchStart) return;

        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        touchStart = null;

        if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;

        const index = FILTER_ORDER.indexOf(filter);
        const next = index + (dx < 0 ? 1 : -1);

        if (next >= 0 && next < FILTER_ORDER.length) {
          setFilter(FILTER_ORDER[next]);
        }
      }, { passive: true });
    });

    $("previous-day").addEventListener("click", () => {
      selectedDate = addDays(selectedDate, -1);
      loadCoverage();
    });

    $("next-day").addEventListener("click", () => {
      selectedDate = addDays(selectedDate, 1);
      loadCoverage();
    });

    $("today").addEventListener("click", () => {
      selectedDate = currentOperationalDate();
      loadCoverage();
    });

    $("refresh").addEventListener("click", loadCoverage);

    $("date-picker").addEventListener("change", () => {
      if (!$("date-picker").value) return;

      selectedDate = $("date-picker").value;
      loadCoverage();
    });

    loadCoverage();
  </script>
</body>
</html>
