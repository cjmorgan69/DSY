<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
<script>
/* Team Leader team page intro. Screenshots (*.jpg, 2x) are of /teams/ and /region/ with invented data; the photos are
   Wikimedia Commons town photos (Coffin Bay: Jack Stradling, CC BY 3.0; Port Neill: Takver, CC BY-SA 3.0; Streaky Bay:
   Bahnfrend, CC BY-SA 4.0). SH holds each picture's size and the boxes of the parts that get highlighted (image px). */
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const SH={"team-after":{"_w":860,"_h":3503,"hero":[32,410,796,398],"edit":[32,1411,796,201],"about":[32,2690,796,388],"photos":[32,1960,796,660]},"region":{"_w":860,"_h":1000,"tile":[32,149,796,786],"editbtn":[66,833,729,68]},"form":{"_w":796,"_h":3092,"blurb":[47,116,702,378],"roster":[47,519,702,139],"links":[47,684,702,371],"save":[47,1080,328,88],"choose":[47,1364,702,224],"preview":[47,1614,702,351],"slider":[47,1990,702,147],"rmbanner":[47,2163,367,72],"slides":[47,2431,702,368],"cap":[47,2431,702,172],"addslides":[47,2824,702,224]}};
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74",g:"#2e9d5f",y:"#e3a712",r:"#c9483a"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
const mix=(a,b,f)=>a+(b-a)*eo(f);
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
let clipN=0;
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:8,stdDeviation:10,"flood-color":"#000","flood-opacity":.35},sh); return d}
let D;
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?h*.42:h*.62),"font-size":30,"font-weight":700},gg);
  if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function chip(g,s,x,y,a,fill,dot){if(a<=0)return;const gg=grp(g,a),w=s.length*14+(dot?78:44);
  el("rect",{x,y,width:w,height:54,rx:27,fill},gg);
  if(dot)el("rect",{x:x+20,y:y+15,width:24,height:24,rx:6,fill:dot},gg);
  txt(s,{x:x+(dot?58:22),y:y+35,"font-size":24,"font-weight":700},gg);return w}
/* a screenshot in a rounded window: name, window x/y/w/h, source y (image px) at the top of the window */
function shot(g,name,x,y,w,h,srcY,a){
  if(a<=0)return null;
  const s=w/SH[name]._w, id="c"+(clipN++);
  const cp=el("clipPath",{id},D);el("rect",{x,y,width:w,height:h,rx:20},cp);
  const gg=grp(g,a);
  el("rect",{x,y,width:w,height:h,rx:20,fill:"#f4f6f1",filter:"url(#sh)"},gg);
  const ig=el("g",{"clip-path":`url(#${id})`},gg);
  el("image",{href:name+".jpg",x,y:y-srcY*s,width:w,height:SH[name]._h*s},ig);
  return {g:ig,s,x,y,srcY,name}}   // highlights go inside the clipped window
/* a gold outline round part of a screenshot */
function hi(P,key,a,col){if(!P||a<=0)return;const b=SH[P.name][key];if(!b)return;
  el("rect",{x:P.x+b[0]*P.s-6,y:P.y+(b[1]-P.srcY)*P.s-6,width:b[2]*P.s+12,height:b[3]*P.s+12,rx:14,fill:"none",stroke:col||C.gold,"stroke-width":5,opacity:a},P.g)}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>62;
  el("rect",{x:70,y:long?578:590,width:1140,height:long?108:84,rx:22,fill:"rgba(0,0,0,.42)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>52?30:34,"font-weight":600},g);
  else{let m=Math.floor(s.text.length/2),L=s.text.lastIndexOf(" ",m),R=s.text.indexOf(" ",m);const cut=(m-L<R-m||R<0)?L:R;
    txt(s.text.slice(0,cut),{x:640,y:622,"text-anchor":"middle","font-size":30,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:662,"text-anchor":"middle","font-size":30,"font-weight":600},g);}
  txt("DSY TEAM LEADER GUIDE",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const frac=(k,f)=>S[k].s+(S[k].e-S[k].s)*f;
  const W=[70,150,560,420], WIDE=[70,150,1140,420];
  const title=(a,b,c)=>{txt(a,{x:640,y:320,"text-anchor":"middle","font-size":a.length>16?96:118,"font-weight":800,"letter-spacing":"-3",opacity:rv(T,S[0].s,0.5)},g);
    el("rect",{x:640-200*rv(T,S[0].s+0.2,0.7),y:352,width:400*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("Team Leader microlearning",{x:640,y:420,"text-anchor":"middle","font-size":38,fill:"#dff1e7",opacity:rv(T,S[0].s+0.4,0.5)},g);
    chip(g,b,640-c,476,rv(T,S[1].s,0.5),"rgba(63,174,116,.55)");};
  const tiles3=(items)=>items.forEach((p,k)=>{
      const a=rv(T,S[k].s,0.4), w=360, x=70+k*390, y=230, last=k===2;
      const gg=grp(g,a);el("rect",{x,y,width:w,height:180,rx:26,fill:last?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,y+50,String(k+1),last?"#fff":C.gold);
      txt(p[0],{x:x+w/2,y:y+115,"text-anchor":"middle","font-size":34,"font-weight":800,fill:last?C.ink:"#fff"},gg);
      txt(p[1],{x:x+w/2,y:y+152,"text-anchor":"middle","font-size":25,fill:last?C.ink:"#cfe7da"},gg)});

  if(i===0) title("YOUR TEAM PAGE","What your crew sees when they sign in",270);

  if(i===1){
    const y=T<S[1].s?300:T<S[2].s?mix(300,900,pr(T,S[1].s,S[1].s+0.6)):T<S[3].s?mix(900,1900,pr(T,S[2].s,S[2].s+0.8)):mix(1900,2620,pr(T,S[3].s,S[3].s+0.8));
    const P=shot(g,"team-after",...W,y,rv(T,S[0].s-0.2,0.5));
    hi(P,"hero",rv(T,S[0].s+0.3,0.3)*(1-pr(T,S[1].s-0.2,S[1].s))); hi(P,"photos",rv(T,S[2].s+0.6,0.3)*(1-pr(T,S[3].s-0.2,S[3].s))); hi(P,"about",rv(T,S[3].s+0.6,0.3));
    row(g,680,150,530,86,"Banner photo",null,rv(T,S[0].s),C.gold);
    row(g,680,248,530,86,"Schedule and learning",null,rv(T,S[1].s),C.mint);
    row(g,680,346,530,86,"Photo slides",null,rv(T,S[2].s),C.gold);
    row(g,680,444,530,86,"About the team, and links",null,rv(T,S[3].s),C.mint);
  }

  if(i===2){
    if(T<S[1].s-0.1){ const P=shot(g,"team-after",...W,1000,rv(T,S[0].s-0.2,0.5)); hi(P,"edit",rv(T,S[0].s+0.4,0.3)); }
    else { const P=shot(g,"region",...W,300,1); hi(P,"editbtn",rv(T,S[1].s+0.4,0.3)); }
    row(g,680,170,530,110,"Team page","Edit this page",rv(T,S[0].s),C.gold);
    row(g,680,300,530,110,"Region page","Edit page on the tile",rv(T,S[1].s),C.mint);
  }

  if(i===3){
    const P=shot(g,"form",...W,mix(1300,1560,pr(T,S[1].s,S[2].s)),rv(T,S[0].s-0.2,0.5));
    hi(P,"choose",rv(T,S[0].s+0.2,0.3)*(1-pr(T,S[1].s-0.2,S[1].s))); hi(P,"preview",rv(T,S[1].s,0.3)*(1-pr(T,S[2].s-0.2,S[2].s)));
    hi(P,"slider",rv(T,S[2].s+0.3,0.3));
    row(g,680,170,530,96,"Choose a banner photo",null,rv(T,S[0].s),C.gold);
    row(g,680,282,530,96,"Replaces the town photo",null,rv(T,S[1].s),C.mint);
    row(g,680,394,530,110,"Move the photo","Saves when you let go",rv(T,S[2].s),C.gold);
  }

  if(i===4){
    const P=shot(g,"form",...W,2440,rv(T,S[0].s-0.2,0.5));
    hi(P,"addslides",rv(T,S[0].s+0.2,0.3)*(1-pr(T,S[1].s-0.2,S[1].s))); hi(P,"cap",rv(T,S[1].s,0.3)*(1-pr(T,S[2].s-0.2,S[2].s))); hi(P,"slides",rv(T,S[2].s,0.3));
    row(g,680,170,530,96,"Add slide photos",null,rv(T,S[0].s),C.gold);
    row(g,680,282,530,96,"Captions, if you like",null,rv(T,S[1].s),C.mint);
    row(g,680,394,530,96,"Move up, or Remove",null,rv(T,S[2].s),C.mint);
  }

  if(i===5){
    const P=shot(g,"form",...W,mix(0,560,pr(T,S[0].s+0.4,S[1].s)),rv(T,S[0].s-0.2,0.5));
    hi(P,"blurb",rv(T,S[0].s+0.2,0.3)*(1-pr(T,frac(0,0.6),frac(0,0.6)+0.3))); hi(P,"links",rv(T,frac(0,0.6),0.3)*(1-pr(T,S[1].s-0.2,S[1].s))); hi(P,"save",rv(T,S[1].s,0.3));
    row(g,680,170,530,96,"Save team page",null,rv(T,S[1].s),C.gold);
    row(g,680,282,530,110,"Photos","Save as soon as they upload",rv(T,S[2].s),C.mint);
  }

  if(i===6){
    const P=shot(g,"team-after",...W,1980,rv(T,S[0].s-0.2,0.5));
    chip(g,"JPG, PNG or WebP, up to 10 MB",680,190,rv(T,S[0].s,0.4),"rgba(0,0,0,.32)");
    chip(g,"Your photos, or permission",680,280,rv(T,S[1].s,0.4),"rgba(227,167,18,.55)");
    chip(g,"Crews and patients happy",680,370,rv(T,S[2].s,0.4),"rgba(227,167,18,.55)");
  }

  if(i===7) tiles3([["Banner","a good one"],["Slides","a few"],["Words","what your crew need"]]);
}
function render(t){
  v.innerHTML=""; clipN=0; D=defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Your team page",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("dsytraining.com/teams  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
