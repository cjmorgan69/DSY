<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:6,stdDeviation:8,"flood-color":"#000","flood-opacity":.28},sh)}
/* reveal: fade/slide in starting at time s */
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function tick(g,x,y,a,r){r=r||20;el("circle",{cx:x,cy:y,r,fill:a>0?C.ok:"rgba(255,255,255,.15)"},g);
  if(a>0)el("path",{d:`M${x-r*.45} ${y} L${x-r*.1} ${y+r*.38} L${x+r*.5} ${y-r*.35}`,fill:"none",stroke:"#fff","stroke-width":r*.28,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":60,"stroke-dashoffset":60*(1-a)},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?(Array.isArray(sub)?h*.32:h*.42):h*.62),"font-size":32,"font-weight":700},gg);
  if(Array.isArray(sub))sub.forEach((ln,k)=>txt(ln,{x:x+34,y:y+h*.62+k*30,"font-size":23,fill:"#cfe7da"},gg));
  else if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function bullets(g,x,y,items,t,starts,col){items.forEach((s,i)=>{const a=rv(t,starts[i]);const gg=grp(g,a);
  el("circle",{cx:x,cy:y+i*50-9,r:7,fill:col||C.gold},gg);txt(s,{x:x+24,y:y+i*50,"font-size":28},gg)})}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>70;
  el("rect",{x:70,y:long?570:590,width:1140,height:long?112:84,rx:22,fill:"rgba(0,0,0,.34)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>62?30:34,"font-weight":600},g);
  else{ // wrap into two lines at the nearest space to the middle
    let m=Math.floor(s.text.length/2), L=s.text.lastIndexOf(" ",m), R=s.text.indexOf(" ",m);
    const cut=(m-L<R-m||R<0)?L:R;
    const fs=s.text.length>150?25:(s.text.length>125?28:32);
    txt(s.text.slice(0,cut),{x:640,y:620,"text-anchor":"middle","font-size":fs,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:664,"text-anchor":"middle","font-size":fs,"font-weight":600},g);}
  txt("SAAS CPP-062-AO",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const frac=(k,f)=>S[k].s+(S[k].e-S[k].s)*f;
  const chips=(items,x0,y,starts,fill,maxX)=>{let x=x0,yy=y;items.forEach((c,k)=>{const w=c.length*12+36;if(x+w>maxX){x=x0;yy+=62}
      const a=rv(T,starts[k],0.35);if(a>0){const g2=grp(g,a);el("rect",{x,y:yy,width:w,height:48,rx:24,fill},g2);txt(c,{x:x+w/2,y:yy+31,"text-anchor":"middle","font-size":22,"font-weight":700},g2)}x+=w+10})};

  if(i===0){
    txt("Sepsis",{x:640,y:320,"text-anchor":"middle","font-size":140,"font-weight":800,"letter-spacing":"-4",opacity:rv(T,S[0].s,0.5)},g);
    el("rect",{x:640-200*rv(T,S[0].s+0.2,0.7),y:352,width:400*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("What every Ambulance Officer needs to know",{x:640,y:430,"text-anchor":"middle","font-size":38,fill:"#dff1e7",opacity:rv(T,S[1].s,0.5)},g);
    badge(g,"Life threatening",640,505,rv(T,S[1].s+0.5,0.5),"rgba(226,87,76,.55)");
  }

  if(i===1){
    row(g,70,170,1140,90,"Life threatening",null,rv(T,S[0].s),C.red);
    row(g,70,275,1140,100,"The body's response to an infection","damages its own tissues and organs",rv(T,S[1].s),C.gold);
    const a2=rv(T,S[2].s); if(a2>0){const gg=grp(g,a2);txt("Almost any infection",{x:70,y:420,"font-size":26,fill:"#cfe7da"},gg)}
    chips(["Lungs","Abdomen","Urinary tract","Skin"],330,392,[frac(2,0.45),frac(2,0.6),frac(2,0.75),frac(2,0.9)],"rgba(227,167,18,.38)",1210);
    badge(g,"Early recognition saves lives",640,510,rv(T,S[3].s,0.5),"rgba(63,174,116,.55)");
  }

  if(i===2){
    txt("Signs can include",{x:70,y:188,"font-size":24,fill:"#cfe7da",opacity:rv(T,S[0].s,0.4)},g);
    chips(["Fast breathing","Breathlessness","Fever and chills","Low temperature"],70,205,[S[1].s,frac(1,0.6),S[2].s,frac(2,0.6)],"rgba(226,87,76,.45)",1210);
    chips(["Little or no urine","Fast or slow heartbeat","Confusion","Sleepiness"],70,300,[S[3].s,S[4].s,S[5].s,frac(5,0.6)],"rgba(227,167,18,.38)",1210);
    chips(["New rash","Clammy, sweaty skin"],70,395,[S[6].s+0.2,frac(6,0.6)],"rgba(63,174,116,.45)",1210);
  }

  if(i===3){
    row(g,70,165,1140,80,"PPE and basic care",null,rv(T,S[0].s),C.mint);
    row(g,70,258,1140,80,"SpO2 below 94%: high flow oxygen",null,rv(T,S[1].s),C.gold);
    row(g,70,351,1140,80,"Chronic lung disease: consult the EOC Clinician",null,rv(T,S[2].s),C.red);
    row(g,70,444,560,80,"NEWS2 calculator",null,rv(T,S[3].s),C.gold);
    row(g,650,444,560,80,"Request clinical support",null,rv(T,S[4].s),C.mint);
  }

  if(i===4){
    txt("Suspect sepsis from",{x:70,y:188,"font-size":24,fill:"#cfe7da",opacity:rv(T,S[0].s,0.4)},g);
    chips(["Suspected infection","The signs","Your judgement","NEWS2"],70,205,[frac(1,0.15),frac(1,0.35),frac(1,0.6),frac(1,0.85)],"rgba(63,174,116,.5)",1210);
    badge(g,"BP doesn't diagnose it: it sets the pathway",640,300,rv(T,S[2].s,0.5),"rgba(227,167,18,.5)");
    const a3=rv(T,S[3].s,0.5); if(a3>0){const gg=grp(g,a3);
      card(gg,70,340,1140,80,"rgba(63,174,116,.25)","rgba(139,224,177,.6)");
      txt("SBP above 100 mmHg",{x:104,y:392,"font-size":34,"font-weight":800},gg);
      txt("suspected sepsis pathway",{x:1176,y:392,"text-anchor":"end","font-size":30,"font-weight":800,fill:C.mint},gg)}
    row(g,70,432,560,72,"Oxygen if needed","priority transport",rv(T,S[4].s),C.mint);
    row(g,650,432,560,72,"Consult; notify","\"suspected sepsis\"",rv(T,S[5].s),C.mint);
  }

  if(i===5){
    const a0=rv(T,S[0].s,0.5); if(a0>0){const gg=grp(g,a0);
      card(gg,70,165,1140,96,"rgba(226,87,76,.28)","rgba(226,87,76,.7)");
      txt("SBP 100 mmHg or less",{x:104,y:225,"font-size":38,"font-weight":800},gg);
      txt("suspected septic shock pathway",{x:1176,y:225,"text-anchor":"end","font-size":30,"font-weight":800,fill:"#ff8c82"},gg)}
    const items=[["Request early clinical support","say \"suspected septic shock\""],["Don't delay extrication or transport","rendezvous en route if required"],["High-flow oxygen, priority transport","notify \"suspected septic shock\""]];
    const st=[S[1].s,S[2].s,S[3].s];
    items.forEach((c,k)=>row(g,70,280+k*92,1140,80,c[0],c[1],rv(T,st[k]),C.red));
  }

  if(i===6){
    row(g,70,165,1140,90,"Meningococcal disease","can cause death within hours",rv(T,S[0].s),C.red);
    const a1=rv(T,S[1].s); if(a1>0){const gg=grp(g,a1);card(gg,70,275,1140,120,"rgba(227,167,18,.16)","rgba(227,167,18,.6)");
      txt("Febrile + altered conscious state",{x:104,y:325,"font-size":34,"font-weight":800},gg);
      txt("consult the EOC Clinician about ceftriaxone",{x:104,y:368,"font-size":26,fill:C.gold},gg)}
    badge(g,"With or without a rash",400,445,rv(T,S[2].s,0.5),"rgba(0,0,0,.4)");
    badge(g,"The rash is a late sign",880,445,rv(T,S[3].s,0.5),"rgba(226,87,76,.5)");
    const dots=rv(T,frac(3,0.2),0.8); if(dots>0){[0,1,2,3,4,5,6,7].forEach(k=>el("circle",{cx:470+k*48,cy:520,r:4+k*1.8,fill:k<3?"#e07a74":"#7b3b8c",opacity:dots*(k<=dots*8?1:0)},g))}
  }

  if(i===7){
    const a0=rv(T,S[0].s); if(a0>0){const gg=grp(g,a0);card(gg,70,165,560,110);txt("50 mg per kg",{x:104,y:225,"font-size":40,"font-weight":800,fill:C.mint},gg);txt("IM ceftriaxone, if advised",{x:104,y:258,"font-size":22,fill:"#cfe7da"},gg)}
    const a1=rv(T,S[1].s); if(a1>0){const gg=grp(g,a1);card(gg,650,165,560,110,"rgba(227,167,18,.16)","rgba(227,167,18,.6)");txt("Single max 2 g",{x:684,y:235,"font-size":40,"font-weight":800,fill:C.gold},gg)}
    const a2=rv(T,S[2].s); if(a2>0){const gg=grp(g,a2);card(gg,70,295,1140,100);
      el("rect",{x:104,y:318,width:44,height:60,rx:8,fill:"#f2e6b8"},gg);el("rect",{x:110,y:310,width:32,height:12,rx:3,fill:"#c9a227"},gg);
      txt("1 g vial + 3.5 mL sodium chloride 0.9% = 4 mL",{x:170,y:350,"font-size":30,"font-weight":800},gg);txt("250 mg per mL",{x:170,y:382,"font-size":22,fill:"#cfe7da"},gg)}
    row(g,70,415,560,80,"Max 1 g (4 mL) per site",null,rv(T,S[3].s),C.red);
    row(g,650,415,560,80,"2 g = two sites",null,rv(T,S[4].s),C.gold);
    badge(g,"Cephalosporin allergy: consult for medical advice",640,535,rv(T,S[5].s,0.5),"rgba(0,0,0,.42)");
  }

  if(i===8){
    const labels=[["1","Spot it","early"],["2","Check the","blood pressure"],["3","Say the","right words"],["4","Get","moving"]];
    labels.forEach((p,k)=>{const a=rv(T,k===0?frac(0,0.4):S[k].s,0.4), x=70+k*290;
      const gg=grp(g,a);el("rect",{x,y:225,width:270,height:170,rx:26,fill:k===3?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,275,p[0],k===3?"#fff":C.gold);
      txt(p[1],{x:x+135,y:338,"text-anchor":"middle","font-size":27,"font-weight":800,fill:k===3?C.ink:"#fff"},gg);txt(p[2],{x:x+135,y:372,"text-anchor":"middle","font-size":24,fill:k===3?C.ink:"#cfe7da"},gg);
      if(k<3)txt("›",{x:x+280,y:330,"text-anchor":"middle","font-size":48,fill:C.gold,opacity:a},g)});
    badge(g,"Now try the sepsis checker on this page",640,470,rv(T,S[4].s,0.5),"rgba(0,0,0,.35)");
  }
}
function badge(g,s,x,y,a,col){
  if(a<=0)return;
  const gg=grp(g,a), w=s.length*15.5+56;
  el("rect",{x:x-w/2,y:y-30,width:w,height:56,rx:28,fill:col||"rgba(0,0,0,.35)"},gg);
  txt(s,{x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":700},gg);
}
function render(t){
  v.innerHTML=""; defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Sepsis",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("SAAS CPP-062-AO  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
