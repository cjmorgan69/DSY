  function time(ms) { return timeFmt.format(new Date(ms)); }
  function dayLabel(date) { return dayFmt.format(new Date(date + "T12:00:00Z")); }
  function when(x) { return x.open ? dayLabel(dateOf(x.from)) + " " + time(x.from) + " onwards" : span(x.from, x.to); }
  function howLong(x) { return (x.open ? "more than " : "") + duration(x.minutes); }
  function span(from, to) {
    var a = dateOf(from), b = dateOf(to);
    return dayLabel(a) + " " + time(from) + " to " + (a === b ? "" : dayLabel(b) + " ") + time(to);
  }
  function duration(min) { var h = Math.floor(min / 60), m = Math.round(min % 60); return h && m ? h + " h " + m + " min" : h ? h + " h" : m + " min"; }

  /* ---------- teams ---------- */
  function allTeams() {
    var T = window.DSY_ROSTER_TEAMS || {}, out = [];
    Object.keys(T).forEach(function (id) { if (!T[id].testTeam) out.push({ id: id, name: T[id].name, cluster: T[id].cluster, api: T[id].apiUrl }); });
    return out;
  }
  // A cluster's Team Leader picks from their own teams; an all-clusters leader from every team.
  function myTeams() { return allTeams().filter(function (t) { return !acc.cluster || t.cluster === acc.cluster; }); }
  function teamByName(name) { return allTeams().filter(function (t) { return t.name === name; })[0]; }

  /* ---------- rules ---------- */
  function cleanGroup(g) {
    g = g || {};
    var levels = {};
    LEVELS.forEach(function (l) { var v = g.levels && g.levels[l]; levels[l] = v === "full" || v === "with" || v === "no" ? v : DEFAULT_LEVELS[l]; });
    var min = Math.round(Number(g.min)); if (!(min >= 1 && min <= 8)) min = 2;
    var hrs = Number(g.minHours); if (GAP_CHOICES.indexOf(hrs) < 0) hrs = 6;
    var teams = (Array.isArray(g.teams) ? g.teams : []).filter(function (n) { return teamByName(n); });
    return { name: String(g.name || "").trim().slice(0, 60), teams: teams, min: min, levels: levels, minHours: hrs };
  }
  function groupTitle(g) { return g.name || g.teams.join(" + "); }
  function ruleText(g) {
    var full = LEVELS.filter(function (l) { return g.levels[l] === "full"; });
    var withs = LEVELS.filter(function (l) { return g.levels[l] === "with"; });
    var t = "Minimum " + g.min + (g.teams.length > 1 ? " across " + g.teams.join(", ") : " at " + g.teams[0]) + ". Counted: " + (full.join(", ") || "nobody");
    if (withs.length) t += "; " + withs.join(", ") + " only with " + (full.length === 1 ? "a " + full[0] : "one of those") + " in the same town";

    return t;
  }

  /* ---------- coverage ---------- */
  function groupBookings(g) {

  }
  // Split [from, to) into pieces with a steady count of counted crew.
  function pieces(g, list, from, to) {
    var counted = list.filter(function (b) { return g.levels[b.level] && g.levels[b.level] !== "no" && b.start < to && b.end > from; });
    var pts = {}; pts[from] = 1; pts[to] = 1;
    counted.forEach(function (b) { if (b.start > from && b.start < to) pts[b.start] = 1; if (b.end > from && b.end < to) pts[b.end] = 1; });
    var sorted = Object.keys(pts).map(Number).sort(function (a, b) { return a - b; }), out = [];
    for (var i = 0; i < sorted.length - 1; i++) {

        var f = here.filter(function (x) { return x.town === town && g.levels[x.level] === "full"; }).length;
        var w = here.filter(function (x) { return x.town === town && g.levels[x.level] === "with"; }).length;
        lead[town] = f; count += f + (f ? w : 0);

  }
  function analyse(g) {

    var ps = pieces(g, list, from, to + 24 * HOUR), gaps = [], empty = [];
    ps.forEach(function (p) {
      if (p.count < g.min) {

        if (last && last.to === p.from) { last.to = p.to; last.parts.push(p); } else gaps.push({ from: p.from, to: p.to, parts: [p] });
      }

        if (p.lead[town]) return;

    var segs = [];

    t1.appendChild(el("strong", String(r.segs.length))); t1.appendChild(el("span", (r.segs.length === 1 ? "gap" : "gaps") + ", counted by shift"));
    t2.appendChild(el("strong", total ? duration(total) : "0 h")); t2.appendChild(el("span", "below the minimum in these 8 days"));
    totals.appendChild(t1); totals.appendChild(t2); card.appendChild(totals);
    card.appendChild(strip(r));
    card.appendChild(el("p", "Each bar is one day, 08:00 to 08:00, with a mark at 18:00. Red is a listed gap.", "note"));

    var ul = el("ul", null, "gaps");
    if (!r.segs.length) ul.appendChild(el("li", g.minHours ? "No gaps of " + g.minHours + " hours or more." : "No gaps. The minimum is met for the whole period."));
    r.segs.forEach(function (gp) {
      var li = el("li"); li.appendChild(el("strong", segTitle(gp)));
      var sub = el("span", null, "sub"); sub.appendChild(el("span", booked(g, gp) + " booked", gp.highest === 0 ? "tag none" : "tag some"));
      var extra = breakdown(g, gp); if (extra) sub.appendChild(document.createTextNode(" " + extra));
      li.appendChild(sub); var more = longer(gp); if (more) li.appendChild(el("span", more, "sub"));
      li.appendChild(whoBlock(g, r, gp)); ul.appendChild(li);
    });
    card.appendChild(ul);

    if (r.empty.length) {
      card.appendChild(el("h3", "Town with nobody counted in their own right"));
      var ul2 = el("ul", null, "gaps");
      r.empty.forEach(function (x) {
        var li = el("li"); li.appendChild(el("strong", when(x) + " · " + howLong(x)));
        var sub = el("span", null, "sub"); sub.appendChild(el("span", x.town, "tag town")); li.appendChild(sub); ul2.appendChild(li);
      });
      card.appendChild(ul2);
    }

    var copy = el("button", "Copy as text", "btn ghost small"); copy.type = "button";
    copy.addEventListener("click", function () {
      var done = function (ok) { copy.textContent = ok ? "Copied" : "Couldn't copy"; setTimeout(function () { copy.textContent = "Copy as text"; }, 2000); };
      try { navigator.clipboard.writeText(copyText(g, r)).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
    });
    var row = el("div", null, "row"); row.appendChild(copy); card.appendChild(row);
    return card;
  }
  function render() {
    var box = $("results"); box.replaceChildren();
    var use = groups.filter(function (g) { return g.teams.length; });
    if (!use.length) {
      var c = el("section", null, "card");
      c.appendChild(el("h2", "Set your rules first"));
      c.appendChild(el("p", "Open \"Your rules\" below, add a group, tick the teams that are checked together and choose your minimum.", "rule"));
      box.appendChild(c); $("rulesFold").open = true; $("checked").textContent = ""; return;
    }
    if (!loadedAt) return;
    use.forEach(function (g) { box.appendChild(groupCard(g)); });
    $("checked").textContent = "Checked from the live rosters " + stampFmt.format(loadedAt) + ". Counted to the minute. Gaps already finished are left out.";
  }

  /* ---------- rosters ---------- */
  function loadTeam(t) {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 60000);
    return fetch(t.api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getBookings", team: t.name }), redirect: "follow", credentials: "omit", signal: ctl.signal })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        if (!d || !Array.isArray(d.bookings)) throw new Error(d && d.error || "unexpected reply");
        return { t: t, list: d.bookings.filter(function (b) { return String(b.team || "").trim() === t.name; }).map(function (b) {
          return { town: t.name, user: String(b.user || "").trim(), level: String(b.clinicalLevel || "").trim().toUpperCase(), start: new Date(b.start).getTime(), end: new Date(b.end).getTime() };
        }).filter(function (b) { return b.user && isFinite(b.start) && isFinite(b.end) && b.end > b.start; }) };
      })
      .catch(function (e) { return { t: t, err: e.name === "AbortError" ? "timed out" : e.message }; })
      .finally(function () { clearTimeout(timer); });
  }
  function loadRosters() {
    var names = {}; groups.forEach(function (g) { g.teams.forEach(function (n) { names[n] = 1; }); });
    var teams = Object.keys(names).map(teamByName).filter(Boolean);
    if (!teams.length) { loadedAt = null; render(); return Promise.resolve(); }
    var run = ++loadRun;
    $("refresh").disabled = true; msg("Loading " + teams.length + (teams.length === 1 ? " roster…" : " rosters…"));
    return Promise.all(teams.map(loadTeam)).then(function (res) {
      if (run !== loadRun) return;
      bookings = {}; problems = [];
      res.forEach(function (r) { if (r.err) problems.push(r.t.name + " (" + r.err + ")"); else bookings[r.t.name] = r.list; });
      loadedAt = new Date();
      msg(problems.length ? "Not loaded: " + problems.join(", ") + "." : "", problems.length > 0);
      $("refresh").disabled = false; render();
    });
  }

  /* ---------- rules editor ---------- */
  function drawEditor() {
    var box = $("groups"); box.replaceChildren();
    var lock = !!viewOnly;
    $("add").hidden = lock; $("save").hidden = lock;
    if (!groups.length) box.appendChild(el("p", "No groups yet.", "note"));
    groups.forEach(function (g, i) {
      var card = el("div", null, "grp");
      var name = el("label", "Group name (optional)"), ni = el("input"); ni.type = "text"; ni.maxLength = 60; ni.value = g.name; ni.placeholder = "For example: Tumby Bay and Cummins"; ni.disabled = lock;
      ni.addEventListener("input", function () { g.name = ni.value; dirty(); }); name.appendChild(ni); card.appendChild(name);

      card.appendChild(el("span", "Teams checked together", "note"));
      var teams = el("div", null, "teams"), lastCluster = "";
      myTeams().concat(allTeams().filter(function (t) { return g.teams.indexOf(t.name) >= 0 && myTeams().indexOf(t) < 0 && !myTeams().some(function (m) { return m.name === t.name; }); })).forEach(function (t) {
        if (!acc.cluster && t.cluster !== lastCluster) { teams.appendChild(el("span", t.cluster, "cl")); lastCluster = t.cluster; }
        var lab = el("label"), cb = el("input"); cb.type = "checkbox"; cb.checked = g.teams.indexOf(t.name) >= 0; cb.disabled = lock;
        cb.addEventListener("change", function () {
          g.teams = g.teams.filter(function (n) { return n !== t.name; }); if (cb.checked) g.teams.push(t.name); dirty();
        });
        lab.appendChild(cb); lab.appendChild(document.createTextNode(t.name)); teams.appendChild(lab);
      });
      card.appendChild(teams);

      var grid = el("div", null, "grid2");
      var l1 = el("label", "Minimum crew across the group"), s1 = el("select");
      for (var n = 1; n <= 8; n++) { var o = el("option", String(n)); o.value = n; s1.appendChild(o); }
      s1.value = g.min; s1.disabled = lock; s1.addEventListener("change", function () { g.min = Number(s1.value); dirty(); }); l1.appendChild(s1);
      var l2 = el("label", "List gaps of"), s2 = el("select");
      GAP_CHOICES.forEach(function (h) { var o = el("option", h ? h + (h === 1 ? " hour" : " hours") + " or more" : "Any length"); o.value = h; s2.appendChild(o); });
      s2.value = g.minHours; s2.disabled = lock; s2.addEventListener("change", function () { g.minHours = Number(s2.value); dirty(); }); l2.appendChild(s2);
      grid.appendChild(l1); grid.appendChild(l2); card.appendChild(grid);

      card.appendChild(el("span", "Who counts toward the minimum", "note"));
      var lv = el("div", null, "levels");
      LEVELS.forEach(function (l) {
        lv.appendChild(el("span", LEVEL_NAMES[l]));
        var s = el("select");
        [["full", "Counts"], ["with", "Only with a counted person in the same town"], ["no", "Doesn't count"]].forEach(function (c) { var o = el("option", c[1]); o.value = c[0]; s.appendChild(o); });
        s.value = g.levels[l]; s.disabled = lock; s.setAttribute("aria-label", LEVEL_NAMES[l]);
        s.addEventListener("change", function () { g.levels[l] = s.value; dirty(); }); lv.appendChild(s);
      });
      card.appendChild(lv);

      if (!lock) {
        var rm = el("button", "Remove this group", "btn danger small"); rm.type = "button";
        rm.addEventListener("click", function () { if (!confirm("Remove this group?")) return; groups.splice(i, 1); dirty(); drawEditor(); });
        var row = el("div", null, "row"); row.appendChild(rm); card.appendChild(row);
      }
      box.appendChild(card);
    });
  }
  function dirty() { $("saved").textContent = "Not saved yet"; }
  $("add").addEventListener("click", function () {
    var mine = myTeams();
    groups.push(cleanGroup({ teams: mine.length === 1 ? [mine[0].name] : [] })); dirty(); drawEditor();
  });
  $("save").addEventListener("click", function () {
    $("rerr").hidden = true;
    var bad = groups.filter(function (g) { return !g.teams.length; });
    if (bad.length) { $("rerr").textContent = "Tick at least one team in each group, or remove the empty group."; $("rerr").hidden = false; return; }
    groups = groups.map(cleanGroup);
    $("save").disabled = true;
    sb.from("coverage_rules").upsert({ owner_id: me, groups: groups, updated_at: new Date().toISOString() }).then(function (r) {
      $("save").disabled = false;
      if (r.error) { $("rerr").textContent = "That didn't save: " + r.error.message; $("rerr").hidden = false; return; }
      $("saved").textContent = "Saved"; drawEditor(); loadRosters();
    });
  });

  /* ---------- start ---------- */
  startDate = operationalToday(); $("start").value = startDate;
  $("start").addEventListener("change", function () { if (!$("start").value) return; startDate = $("start").value; render(); });
  $("today").addEventListener("click", function () { startDate = operationalToday(); $("start").value = startDate; render(); });
  $("refresh").addEventListener("click", loadRosters);

  (window.DSY_GATE ? window.DSY_GATE.ready : Promise.resolve()).then(function () { return sb.auth.getSession(); }).then(function (x) {
    me = x && x.data && x.data.session && x.data.session.user && x.data.session.user.id;
    return Promise.all([sb.rpc("my_access"), sb.from("coverage_rules").select("owner_id,groups")]);
  }).then(function (r) {
    if (r[1].error) throw r[1].error;
    acc = (r[0] && r[0].data) || {};
    var rows = r[1].data || [], mine = rows.filter(function (x) { return x.owner_id === me; })[0];
    // A relief Team Leader with no rules of their own sees (but can't change) the rules of the leader they cover.
    var other = !mine && rows[0];
    if (other) {
      viewOnly = other.owner_id;
      var who = (acc.covering || []).filter(function (c) { return c.id === other.owner_id; })[0];
      $("covering").textContent = "Showing " + (who && who.name ? who.name + "'s" : "the covered leader's") + " rules while you are covering. You can't change them.";
      $("covering").hidden = false;
    }
    groups = (((mine || other || {}).groups) || []).map(cleanGroup);
    drawEditor(); render(); return loadRosters();
  }).catch(function (e) { msg("Could not load: " + (e && e.message || e), true); });
})();
</script>
</body>
</html>
