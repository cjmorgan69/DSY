<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Customised scenario - DSY Training</title>
<meta name="theme-color" content="#1f5b43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../training/theme.css?v=20261017a">
<link rel="stylesheet" href="../../microlearning/shared/module.css?v=20261017a">
</head>
<body>
<div class="wrap" id="app"><p class="muted" id="status">Loading the scenario…</p></div>
<script src="../../training/config.js?v=20261017a"></script>
<script src="../render.js?v=20261017a"></script>
<script>
/* A customised walk-through scenario: the link carries the scenario and the local details after the #
   (for example #s=chest-pain-ao&patient=Ron&town=Cummins). The template comes from Supabase (public.scenarios),
   is filled in by ../render.js, then drawn by the shared module.js like any other scenario page. */
(function () {
  var V = "20261017a", status = document.getElementById("status");
  function load(src) { return new Promise(function (ok, fail) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.body.appendChild(s); }); }
  var input = SCENARIO.fromHash(location.hash);
  if (!input.s) { status.innerHTML = 'No scenario chosen. <a href="../">Customise a scenario</a>.'; return; }
  SCENARIO.fetchScenarios("slug,template,fields", input.s).then(function (rows) {
    if (!rows.length) throw new Error("That scenario was not found.");
    window.MODULE = SCENARIO.build(rows[0], input);
    status.remove();
    return load("../../microlearning/shared/related.js?v=" + V).then(function () { return load("../../microlearning/shared/module.js?v=" + V); });
  }).then(function () {
    var back = document.createElement("div"), a = document.createElement("a");
    back.className = "row"; a.className = "link"; a.href = "../" + location.hash; a.textContent = "\u2190 Change the local details";
    back.appendChild(a); document.querySelector(".top").after(back);
  }).catch(function (e) {
    status.textContent = (e && e.message) || "Could not load the scenario. Check your connection and try again.";
  });
  window.addEventListener("hashchange", function () { location.reload(); });
})();
</script>
</body>
</html>
