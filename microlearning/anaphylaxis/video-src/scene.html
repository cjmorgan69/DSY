<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:6,stdDeviation:8,"flood-color":"#000","flood-opacity":.28},sh)}
/* reveal: fade/slide in starting at time s */
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function tick(g,x,y,a,r){r=r||20;el("circle",{cx:x,cy:y,r,fill:a>0?C.ok:"rgba(255,255,255,.15)"},g);
  if(a>0)el("path",{d:`M${x-r*.45} ${y} L${x-r*.1} ${y+r*.38} L${x+r*.5} ${y-r*.35}`,fill:"none",stroke:"#fff","stroke-width":r*.28,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":60,"stroke-dashoffset":60*(1-a)},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?(Array.isArray(sub)?h*.32:h*.42):h*.62),"font-size":32,"font-weight":700},gg);
  if(Array.isArray(sub))sub.forEach((ln,k)=>txt(ln,{x:x+34,y:y+h*.62+k*30,"font-size":23,fill:"#cfe7da"},gg));
  else if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function bullets(g,x,y,items,t,starts,col){items.forEach((s,i)=>{const a=rv(t,starts[i]);const gg=grp(g,a);
  el("circle",{cx:x,cy:y+i*50-9,r:7,fill:col||C.gold},gg);txt(s,{x:x+24,y:y+i*50,"font-size":28},gg)})}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>78;
  el("rect",{x:70,y:long?570:590,width:1140,height:long?112:84,rx:22,fill:"rgba(0,0,0,.34)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>62?30:34,"font-weight":600},g);
  else{ // wrap into two lines at the nearest space to the middle
    let m=Math.floor(s.text.length/2), L=s.text.lastIndexOf(" ",m), R=s.text.indexOf(" ",m);
    const cut=(m-L<R-m||R<0)?L:R;
    const fs=s.text.length>150?25:(s.text.length>125?28:32);
    txt(s.text.slice(0,cut),{x:640,y:620,"text-anchor":"middle","font-size":fs,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:664,"text-anchor":"middle","font-size":fs,"font-weight":600},g);}
  txt("SAAS CPP-003-AO",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});
  const frac=(k,f)=>S[k].s+(S[k].e-S[k].s)*f;
  const chips=(items,x0,y,tStart,tEnd,fill,maxX)=>{let x=x0,yy=y;items.forEach((c,k)=>{const w=c.length*12+36;if(x+w>maxX){x=x0;yy+=62}
      const a=rv(T,tStart+(tEnd-tStart)*k/Math.max(1,items.length-1),0.35);if(a>0){const g2=grp(g,a);el("rect",{x,y:yy,width:w,height:48,rx:24,fill},g2);txt(c,{x:x+w/2,y:yy+31,"text-anchor":"middle","font-size":22,"font-weight":700},g2)}x+=w+10})};

  if(i===0){
    txt("Anaphylaxis",{x:640,y:320,"text-anchor":"middle","font-size":132,"font-weight":800,"letter-spacing":"-4",opacity:rv(T,S[0].s,0.5)},g);
    el("rect",{x:640-230*rv(T,S[0].s+0.2,0.7),y:352,width:460*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("What every Ambulance Officer needs to know",{x:640,y:430,"text-anchor":"middle","font-size":38,fill:"#dff1e7",opacity:rv(T,S[1].s,0.5)},g);
    badge(g,"A medical emergency",640,505,rv(T,S[1].s+0.5,0.5),"rgba(226,87,76,.55)");
  }

  if(i===1){
    row(g,70,170,1140,100,"A potentially life-threatening severe allergic reaction",null,rv(T,S[0].s),C.red);
    row(g,70,290,1140,100,"A medical emergency","immediate treatment is needed",rv(T,S[1].s),C.gold);
    row(g,70,410,1140,100,"It can follow a mild to moderate reaction","so keep watching",rv(T,S[2].s),C.mint);
  }

  if(i===2){
    txt("Look for",{x:70,y:188,"font-size":24,fill:"#cfe7da",opacity:rv(T,S[0].s,0.4)},g);
    chips(["Difficult or noisy breathing","Tongue swelling","Throat tightness","Hoarse voice","Trouble talking"],70,205,frac(0,0.10),frac(0,0.85),"rgba(226,87,76,.45)",1210);
    chips(["Wheeze","Persistent cough","Persistent dizziness","Collapse"],70,345,frac(1,0.15),frac(1,0.8),"rgba(227,167,18,.38)",1210);
    chips(["Young children: pale and floppy"],70,455,S[2].s+0.2,S[2].s+0.2,"rgba(63,174,116,.45)",1210);
  }

  if(i===3){
    const a0=rv(T,S[0].s,0.5); if(a0>0){const gg=grp(g,a0);el("rect",{x:70,y:170,width:520,height:64,rx:32,fill:"rgba(226,87,76,.6)"},gg);txt("Anaphylaxis suspected",{x:330,y:213,"text-anchor":"middle","font-size":32,"font-weight":800},gg);
      txt("AND any one of:",{x:630,y:213,"font-size":28,"font-weight":700,fill:C.gold},gg)}
    [["Hypotension",frac(0,0.45)],["Severe bronchospasm",frac(0,0.68)],["Severe breathing distress","from airway swelling (angioedema)",frac(0,0.92)]].forEach((c,k)=>{
      const tt=c.length===3?c[2]:c[1], a=rv(T,tt,0.45); if(a<=0)return; const gg=grp(g,a), x=70+k*385;
      card(gg,x,270,370,170,"rgba(0,0,0,.30)");el("rect",{x,y:270,width:8,height:170,rx:4,fill:C.gold},gg);
      txt(c[0],{x:x+28,y:c.length===3?340:350,"font-size":c.length===3?27:32,"font-weight":800},gg);if(c.length===3)txt(c[1],{x:x+28,y:384,"font-size":22,fill:"#cfe7da"},gg)});
    badge(g,"Any one of those is enough",640,505,rv(T,S[1].s,0.5),"rgba(227,167,18,.5)");
  }

  if(i===4){
    row(g,70,175,1140,100,"Lay the patient flat","unless their breathing is difficult",rv(T,S[0].s),C.mint);
    row(g,70,295,1140,90,"Do not let them stand or walk",null,rv(T,S[1].s),C.red);
    row(g,70,405,1140,100,"Remove the trigger if you can","and request clinical support",rv(T,S[2].s),C.gold);
  }

  if(i===5){
    row(g,70,170,1140,100,"Follow the patient's anaphylaxis plan","if it is immediately available",rv(T,S[0].s),C.mint);
    const a1=rv(T,S[1].s); if(a1>0){const gg=grp(g,a1);
      card(gg,70,300,1140,220,"rgba(227,167,18,.14)","rgba(227,167,18,.6)");
      el("rect",{x:130,y:380,width:360,height:64,rx:20,fill:"#e8eee8",filter:"url(#sh)"},gg);el("rect",{x:130,y:380,width:90,height:64,rx:20,fill:"#3b6fd6"},gg);el("rect",{x:430,y:380,width:90,height:64,rx:18,fill:"#f08a24"},gg);
      txt("Prescribed adrenaline auto-injector",{x:570,y:410,"font-size":34,"font-weight":800,fill:C.gold},gg);txt("use it as a priority",{x:570,y:452,"font-size":26},gg)}
  }

  if(i===6){
    const st=[["1","Blue cap off",frac(0,0.25)],["2","Orange end firmly","against the mid thigh",frac(0,0.55)],["3","Click, then hold","for 10 or more seconds",frac(0,0.92)]];
    st.forEach((c,k)=>{const tt=c.length===4?c[3]:c[2], a=rv(T,tt,0.45); if(a<=0)return; const gg=grp(g,a), x=70+k*385;
      card(gg,x,175,370,170);badgeNum(gg,x+44,225,c[0],C.gold);
      txt(c[1],{x:x+28,y:292,"font-size":29,"font-weight":800},gg);if(c.length===4)txt(c[2],{x:x+28,y:326,"font-size":23,fill:"#cfe7da"},gg)});
    badge(g,"Can be given through clothing if required",640,410,rv(T,S[1].s,0.5),"rgba(0,0,0,.4)");
    row(g,70,462,1140,84,"Then massage the site gently for 10 seconds",null,rv(T,S[2].s),C.mint);
  }

  if(i===7){
    row(g,70,170,1140,86,"Consult the EOC Clinician",null,rv(T,S[0].s),C.gold);
    const a1=rv(T,S[1].s); if(a1>0){const gg=grp(g,a1);card(gg,70,275,1140,140,"rgba(0,0,0,.30)");
      txt("They may advise IM adrenaline",{x:104,y:325,"font-size":28,fill:"#cfe7da"},gg);
      el("rect",{x:104,y:345,width:360,height:56,rx:28,fill:C.mint},gg);txt("10 microg per kg",{x:284,y:383,"text-anchor":"middle","font-size":30,"font-weight":800,fill:C.ink},gg);
      el("rect",{x:490,y:345,width:560,height:56,rx:28,fill:C.gold},gg);txt("single maximum dose 500 microg",{x:770,y:383,"text-anchor":"middle","font-size":30,"font-weight":800,fill:C.ink},gg)}
    row(g,70,435,1140,86,"Further doses if required",null,rv(T,S[2].s),C.mint);
  }

  if(i===8){
    const ws=[10,20,30,40,50,60,70], base=490, sc=0.44, x0=130, step=150;
    const grow=eo(pr(T,S[0].s,S[0].s+1.4));
    ws.forEach((w,k)=>{const d=Math.min(10*w,500), h=d*sc*grow, x=x0+k*step;
      const hi20=(w===20&&T>=frac(0,0.35)), cap=(w>=50&&T>=S[1].s+0.3);
      el("rect",{x,y:base-h,width:96,height:h,rx:8,fill:hi20?C.gold:(cap?C.red:"rgba(139,224,177,.55)")},g);
      txt(w+" kg",{x:x+48,y:base+34,"text-anchor":"middle","font-size":24,"font-weight":700,fill:"#cfe7da"},g);
      if(grow>.95)txt(String(d),{x:x+48,y:base-h-10,"text-anchor":"middle","font-size":26,"font-weight":800,fill:hi20?C.gold:(cap?"#ff8c82":"#fff")},g)});
    el("line",{x1:100,y1:base,x2:1180,y2:base,stroke:"#fff","stroke-width":3,opacity:.6},g);
    txt("microg",{x:70,y:178,"font-size":22,fill:"#cfe7da"},g);
    const c=rv(T,S[1].s+0.2,0.5); if(c>0){el("line",{x1:100,y1:base-500*sc,x2:1180,y2:base-500*sc,stroke:C.red,"stroke-width":4,"stroke-dasharray":"12 8",opacity:c},g);txt("single maximum 500 microg",{x:1180,y:base-500*sc-12,"text-anchor":"end","font-size":24,"font-weight":800,fill:"#ff8c82",opacity:c},g)}
    const a=rv(T,frac(0,0.4),0.4); if(a>0){const gg=grp(g,a);txt("20 kg child",{x:x0+step*1+48,y:base-200*sc-62,"text-anchor":"middle","font-size":24,"font-weight":800,fill:C.gold},gg)}
  }

  if(i===9){
    const a0=rv(T,S[0].s);
    if(a0>0){const gg=grp(g,a0);card(gg,70,170,520,130,"rgba(0,0,0,.30)");txt("Known asthma and an allergy",{x:100,y:222,"font-size":27,"font-weight":800},gg);txt("sudden breathing difficulty",{x:100,y:260,"font-size":23,fill:"#cfe7da"},gg);
      el("path",{d:"M605 235 L665 235 M647 218 L667 235 L647 252",fill:"none",stroke:"#fff","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"},gg);
      card(gg,680,170,530,130,"rgba(227,167,18,.18)","rgba(227,167,18,.6)");txt("Treat for anaphylaxis first",{x:710,y:222,"font-size":29,"font-weight":800,fill:C.gold},gg);txt("before any asthma medication",{x:710,y:260,"font-size":23,fill:"#cfe7da"},gg)}
    row(g,70,325,1140,92,"Continue basic care","provide prompt transport and notify the receiving facility",rv(T,S[1].s),C.mint);
    row(g,70,437,1140,100,"Every allergy patient goes to a health facility","even if they seem to recover",rv(T,S[2].s),C.red);
  }

  if(i===10){
    const labels=[["1","Look for","the signs"],["2","Lay them","flat"],["3","Adrenaline","early"],["4","Auto-injector","first"],["5","Always","transport"]];
    const seg=(S[0].e-S[0].s)/5.2;
    labels.forEach((p,k)=>{const a=rv(T,S[0].s+0.5+k*seg,0.4), x=45+k*236;
      const gg=grp(g,a);el("rect",{x,y:225,width:216,height:170,rx:26,fill:k===4?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+46,275,p[0],k===4?"#fff":C.gold);
      txt(p[1],{x:x+108,y:338,"text-anchor":"middle","font-size":25,"font-weight":800,fill:k===4?C.ink:"#fff"},gg);txt(p[2],{x:x+108,y:372,"text-anchor":"middle","font-size":23,fill:k===4?C.ink:"#cfe7da"},gg);
      if(k<4)txt("›",{x:x+226,y:330,"text-anchor":"middle","font-size":48,fill:C.gold,opacity:a},g)});
    badge(g,"Now try the adrenaline checker on this page",640,470,rv(T,S[1].s,0.5),"rgba(0,0,0,.35)");
  }
}
function badge(g,s,x,y,a,col){
  if(a<=0)return;
  const gg=grp(g,a), w=s.length*15.5+56;
  el("rect",{x:x-w/2,y:y-30,width:w,height:56,rx:28,fill:col||"rgba(0,0,0,.35)"},gg);
  txt(s,{x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":700},gg);
}
function render(t){
  v.innerHTML=""; defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Anaphylaxis",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("SAAS CPP-003-AO  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
