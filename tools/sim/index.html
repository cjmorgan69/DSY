<!doctype html>
<html lang="en-AU">
<head>

<title>Treatment simulator - DSY Training</title>
<meta name="theme-color" content="#1f5b43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Treatment simulator (prototype). Layout: a phone column; clock bar, obs strip, the scene, then talk / tap controls. */
body { background: var(--bg); }
.simwrap { max-width: 760px; margin: 0 auto; padding: 0 0 calc(12px + env(safe-area-inset-bottom)); }
.page { padding: 20px 16px 28px; }
.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); }
h1 { font-family: var(--font-head); font-size: 30px; line-height: 1.1; margin: 0 0 10px; letter-spacing: -.02em; }
h2 { font-family: var(--font-head); font-size: 19px; margin: 24px 0 8px; }
.lead { font-size: 17px; margin: 0 0 16px; }
.muted { color: var(--muted); } .small { font-size: 13.5px; }
.mdt { background: #10201a; color: #d7f5e3; border-radius: var(--radius); padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
.mdt b { color: #f0bd3a; letter-spacing: .08em; } .mdt ul { margin: 6px 0 0; padding-left: 18px; }
.how { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px 10px; margin: 16px 0; }
.how h2 { margin-top: 12px; } .how ul { margin: 0; padding-left: 20px; } .how li { margin: 6px 0; }
.scene-txt { font-size: 17px; border-left: 4px solid var(--accent); padding-left: 12px; margin: 18px 0; }
.sbig { display: block; font-family: var(--font-body); letter-spacing: 0; width: 100%; min-height: 54px; margin: 10px 0; padding: 14px 18px; border: 0; border-radius: 999px; background: var(--brand); color: var(--brand-ink);
  font: 600 17px var(--font-body); text-align: center; text-decoration: none; cursor: pointer; }
.sbig.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }

/* play screen */
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #10201a; color: #fff; }
.bar #clock { font: 700 20px ui-monospace, SFMono-Regular, Menlo, monospace; color: #f0bd3a; min-width: 96px; }
.bar .ttl { flex: 1; font-size: 13px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar button { background: #24382f; color: #fff; border: 0; border-radius: 999px; padding: 7px 11px; font: 600 13px var(--font-body); cursor: pointer; }
.mon { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #000; }
.tile { background: #0b1511; color: #7dffa9; padding: 6px 4px 7px; text-align: center; min-width: 0; }
.tile i { display: block; font: 600 11px var(--font-body); font-style: normal; letter-spacing: .08em; color: #9fb0a5; }
.tile b { display: block; font: 700 25px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; }
.tile u { display: block; text-decoration: none; font-size: 10.5px; color: #9fb0a5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.empty b { color: #4b5c53; }
.tile:nth-child(2) b { color: #ff8f8f; } .tile:nth-child(3) b { color: #7fd4ff; } .tile:nth-child(4) b { color: #ffe27a; }
.stage { position: relative; background: #cfe3c4; overflow: hidden; }
.stage svg { display: block; width: 100%; height: auto; max-height: 52vh; }
.stage [data-tab] { cursor: pointer; }
.said { min-height: 92px; padding: 8px 10px 0; }
.bubble { padding: 9px 14px; border-radius: 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-size: 16px; line-height: 1.35; opacity: 0; transition: opacity .2s; }
.bubble.show { opacity: 1; }
.bubble b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; color: var(--brand); }
.bubble.who-d b { color: #c2551f; } .bubble.who-w b { color: #a05cb8; } .bubble.who-e b { color: #3d7fc4; }
.bubble.who-n { background: #10201a; color: #fff; border-color: #10201a; }
.doing { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(16,32,26,.9); color: #fff; font: 600 14px var(--font-body);
  white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .15s; }
.doing.show { opacity: 1; }
.heard { min-height: 40px; padding: 6px 14px 4px; font-size: 14.5px; color: var(--muted); }
.simtabs { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 4px 10px 8px; }
.stab { flex: 1; min-height: 48px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: 600 15px var(--font-body); cursor: pointer; padding: 0 2px; }
.stab.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.mic { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.2); }
.mic svg { width: 28px; height: 28px; } .mic[disabled] { opacity: .35; }
body.listening .mic { background: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(179,57,43,.18); } }
body.busy .stab, body.busy .mic { opacity: .45; pointer-events: none; }
.sheet { display: none; padding: 0 10px 6px; } .sheet.show { display: block; }
.sheethead { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 6px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sheethead button { border: 0; background: none; color: var(--brand); font: 600 14px var(--font-body); padding: 6px; cursor: pointer; }
.sact { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; min-height: 48px; margin: 0 0 6px; padding: 10px 14px; text-align: left;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: 500 16px var(--font-body); cursor: pointer; }
.sact em { font-style: normal; font-size: 13px; color: var(--muted); white-space: nowrap; }
.modal { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(8,16,12,.6); align-items: flex-end; justify-content: center; padding: 12px; }
.modal.show { display: flex; }
.mbox { width: 100%; max-width: 560px; max-height: 86vh; overflow: auto; background: var(--surface); color: var(--ink); border-radius: 18px; padding: 18px 16px calc(14px + env(safe-area-inset-bottom)); }
.mbox h3 { margin: 0 0 6px; font: 700 19px var(--font-head); } .mbox p { margin: 0 0 12px; }
.mopt { display: block; width: 100%; min-height: 50px; margin: 0 0 8px; padding: 12px 14px; text-align: left; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: 600 16px var(--font-body); cursor: pointer; }
.mopt.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); text-align: center; } .mopt.quiet { text-align: center; color: var(--muted); }
.mmic { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border: 0; background: none; color: var(--brand); font: 600 15px var(--font-body); padding: 8px; cursor: pointer; }
.notes { list-style: none; margin: 0 0 12px; padding: 0; } .notes li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.notes b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-right: 6px; color: var(--brand); }

/* debrief */
.dhead { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; } .dhead p:last-child { margin: 0; }
.dcheck { list-style: none; margin: 0; padding: 0; }
.dcheck li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.dcheck .ic { flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: var(--ok); }
.dcheck .late .ic { background: var(--accent); color: #1d2a24; } .dcheck .no .ic { background: var(--danger); }
.dcheck p { margin: 3px 0 0; font-size: 15px; color: var(--muted); }
.src { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); vertical-align: 1px; white-space: nowrap; }
.tablewrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; font-size: 15px; background: var(--surface); }
th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
.dbtns { margin-top: 22px; }
@media (min-width: 700px) { .dbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; } .sheet.show { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; } .sheethead { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="simwrap">
  <section class="page" id="intro"></section>
  <section id="play" hidden>
    <div class="bar"><span id="clock">14:42:00</span><span class="ttl">David, 54 &middot; CPP-003-AO</span>
      <button id="notesbtn">Notes</button><button id="mute">Sound on</button><button id="endbtn">End</button></div>
    <div class="mon" id="mon"></div>
    <div class="stage"><div id="scene"></div><div class="doing" id="doing"></div></div>
    <div class="said"><div class="bubble" id="bubble"></div></div>
    <div class="heard" id="heard" aria-live="polite"></div>
    <div class="simtabs" id="tabs"></div>
    <div class="sheet" id="sheet"></div>
  </section>
  <section class="page" id="debrief" hidden></section>
</div>
<div class="modal" id="modal"></div>
<script src="cases/david.js?v=20261112a"></script>
<script src="cases/david.scene.js?v=20261112a"></script>
<script src="sim.js?v=20261112a"></script>
</body>
</html>
