<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambulance Roster Explained</title>
<style>
:root{--g:#1f5b43;--gd:#143d2d;--gold:#e3a712;--bg:#f4f6f1;--ink:#1d2a24;--mut:#5d6b63;--red:#b3392b}
*{box-sizing:border-box}body{margin:0;background:#cfd6cc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink)}
.slide{width:1080px;height:1080px;background:var(--bg);position:relative;overflow:hidden;padding:80px 84px;display:flex;flex-direction:column}
.slide.dark{background:var(--g);color:#fff}
h1{font-size:92px;line-height:1.02;letter-spacing:-.03em;margin:0 0 28px}
h2{font-size:70px;line-height:1.06;letter-spacing:-.025em;margin:0 0 24px}
p{font-size:38px;line-height:1.3;margin:0 0 18px}
.sub{font-size:44px;opacity:.9}
.tag{font-size:26px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
.foot{margin-top:auto;font-size:24px;color:var(--mut);display:flex;justify-content:space-between}
.dark .foot{color:#cfe3d8}
.big{font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--g)}
.dark .big{color:var(--gold)}
.gold{color:var(--gold)}
.days{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:6px}.day{grid-column:span 3}.day:nth-child(n+5){grid-column:span 4}
.day{background:#fff;border:3px solid var(--g);border-radius:22px;text-align:center;padding:16px 8px 12px}
.day b{display:block;font-size:34px;color:var(--g)}
.day svg{width:130px;height:90px}

.pager{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.chip{background:#fff;border-radius:999px;padding:14px 28px;font-size:34px;border:3px solid #dde3da}
.bar{display:flex;height:120px;border-radius:20px;overflow:hidden;margin:24px 0 12px;border:3px solid var(--g)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:30px;font-size:30px}
.legend span:before{content:"";display:inline-block;width:26px;height:26px;border-radius:6px;margin-right:10px;vertical-align:-3px;background:var(--c)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:26px 0}
.week div{height:150px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:700;background:#e5eae2;color:var(--mut)}
.week div.on{background:var(--g);color:#fff}
.week small{font-size:22px;font-weight:600;margin-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:6px}
.card{background:#fff;border-radius:26px;padding:34px;border:3px solid #dde3da}
.card.good{border-color:var(--g)}.card.warn{border-color:var(--gold)}
.card .n{font-size:100px;font-weight:800;line-height:1}
.card.good .n{color:var(--g)}.card.warn .n{color:#b07d00}
.card p{font-size:32px;margin:8px 0 0}
.people{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.people svg{width:46px;height:56px}
.logo{height:64px;margin-bottom:26px;align-self:flex-start}
.cta{display:flex;align-items:center;gap:30px;justify-content:space-between;background:var(--gold);color:var(--gd);border-radius:26px;padding:30px 36px;font-size:44px;font-weight:800;margin-top:20px}
#qr{background:#fff;padding:14px;border-radius:16px;flex:none;line-height:0}#all .slide{margin:20px auto;transform-origin:top left}
</style></head><body>
<div id="all"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const P=(c)=>`<svg viewBox="0 0 46 56"><circle cx="23" cy="13" r="11" fill="${c}"/><path d="M3 56c0-17 8-26 20-26s20 9 20 26z" fill="${c}"/></svg>`;
const pair=c=>`<svg viewBox="0 0 100 70"><g transform="translate(2,6) scale(.85)"><circle cx="23" cy="13" r="11" fill="${c}"/><path d="M3 56c0-17 8-26 20-26s20 9 20 26z" fill="${c}"/></g><g transform="translate(50,6) scale(.85)"><circle cx="23" cy="13" r="11" fill="${c}"/><path d="M3 56c0-17 8-26 20-26s20 9 20 26z" fill="${c}"/></g></svg>`;
const foot=(n)=>`<div class="foot"><span>Volunteer ambulance roster, Eyre Peninsula</span><span>${n} / 7</span></div>`;
const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const S=[
`<div class="slide dark"><div class="tag">Volunteer ambulance</div>
<h1>On call for the ambulance <span class="gold">won't take over your life.</span></h1>
<p class="sub">Here's how a team of 14 shares the load.</p>
${foot(1)}</div>`,

`<div class="slide"><div class="tag">The roster</div>
<h2>14 people = 7 crews. One crew per day.</h2>
<div class="days">${D.map(d=>`<div class="day ${d=='Sun'?'sun':''}"><b>${d}</b>${pair('#1f5b43')}</div>`).join('')}</div>
<p style="margin-top:26px">Two people make a crew. Each crew is on call for one day of the week. <b>That's your on-call day.</b></p>
<p>And at night? You're on call from <b>your own bed</b>.</p>
${foot(2)}</div>`,

`<div class="slide"><div class="tag">On call from home</div>
<h2>Your day starts at 8 am with a pager, not a rostered shift.</h2>
<p>You're on call <b>from home</b>. Carry on as normal:</p>
<div class="pager"><span class="chip">🍳 Breakfast</span><span class="chip">🌱 The garden</span><span class="chip">🍲 Cooking dinner</span><span class="chip">📺 Netflix</span></div>
<p style="margin-top:34px">The pager only sounds when someone in the community needs ambulance assistance. Then you and your crew partner respond. If nobody calls, you've simply had a normal day.</p>
${foot(3)}</div>`,

`<div class="slide"><div class="tag">How busy is it?</div>
<h2>About one job a day, on average.</h2>
<p>That's our busiest team. Other towns on the Peninsula have fewer. A job usually takes 1 to 3 hours.</p>
<p style="margin-top:8px"><b>Worst case: a 3-hour job.</b></p>
<div class="bar"><i style="width:12.5%;background:var(--red)"></i><i style="width:87.5%;background:#a9d1bc"></i></div>
<div class="legend"><span style="--c:var(--red)">3 hours out</span><span style="--c:#a9d1bc">21 hours still yours</span></div>
<p style="margin-top:30px">No two days are the same, so these are averages.</p>
${foot(4)}</div>`,

`<div class="slide dark"><div class="tag">Then you're done</div>
<h2>One day on call. Then forget ambulance until next week.</h2>
<div class="week">${D.map((d,i)=>`<div class="${i==0?'on':''}">${d}<small>${i==0?'ON CALL':'off'}</small></div>`).join('')}</div>
<p>Pager off. Nothing to do until your day comes round again.</p>
<p><span class="gold"><b>24 hours out of 168.</b></span></p>
${foot(5)}</div>`,

`<div class="slide"><div class="tag">Why numbers matter</div>
<h2>Fewer people means more days each.</h2>
<div class="cols">
<div class="card good"><div class="n">14</div><p><b>1 day</b> on call a week</p><div class="people">${Array(14).fill(0).map(()=>P('#1f5b43')).join('')}</div></div>
<div class="card warn"><div class="n">7</div><p><b>2 days</b> on call a week</p><div class="people">${Array(7).fill(0).map(()=>P('#e3a712')).join('')}</div></div>
</div>
<div class="week" style="margin-top:34px">${D.map((d,i)=>`<div class="${i==0||i==3?'on':''}" style="height:110px;font-size:26px">${d}</div>`).join('')}</div>
<p style="font-size:32px">With 7 people, each of you covers two days, for example Monday and Thursday.</p>
${foot(6)}</div>`,

`<div class="slide dark"><div class="tag">Two on the ambulance</div>
<h2>We only need 2 people on the ambulance. Not the whole town.</h2>
<p>You're not needed every day and every night. With enough volunteers it's <b class="gold">24 hours a week</b>, from home.</p>
<div class="cta"><div>Want to be part of the roster?<br>Ask your local ambulance team, or scan the code.</div><div id="qr"></div></div>
<p style="font-size:30px;margin-top:18px">saambulance.sa.gov.au/volunteer-with-us</p>
${foot(7)}</div>`
];
const q=new URLSearchParams(location.search).get('s');
const all=document.getElementById('all');
if(q){all.innerHTML=S[q-1];document.body.style.background='none';all.firstChild.style.margin=0}
else{all.innerHTML=S.join('');const f=()=>{const k=Math.min(1,(innerWidth-20)/1080);document.querySelectorAll('.slide').forEach(s=>{s.style.zoom=k})};f();addEventListener('resize',f)}
document.querySelectorAll('#qr').forEach(e=>new QRCode(e,{text:'https://saambulance.sa.gov.au/volunteer-with-us/',width:220,height:220,correctLevel:QRCode.CorrectLevel.M}));
</script></body></html>
