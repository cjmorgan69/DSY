<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burns skills stations - DSY Training</title>
<meta name="theme-color" content="#1f5b43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../training/theme.css?v=20261027c">
<style>
/* Skills stations: a self-run practical night. The pages are drawn from STATIONS below.
   Routes: #s1 to #s4 one station, #end finish together, #setup instructor sheet, #print everything for printing. */
.wrap { gap: 1.1rem; }
.top a { color: inherit; text-decoration: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .6rem; }
.card h3 { font-size: 1.1rem; }
.card.warn { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.card.red { background: color-mix(in srgb, var(--danger) 11%, var(--surface)); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.card.dsy { border-style: dashed; }
.src { font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
.src b { color: var(--brand); font-weight: 700; }
.door { display: flex; align-items: center; gap: .9rem; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-left: 8px solid var(--brand); border-radius: var(--radius); padding: .9rem 1rem; }
.door .n { flex: none; width: 2.4rem; height: 2.4rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-head); font-weight: 700;
  background: var(--brand-soft); color: var(--brand); font-size: 1.15rem; }
.door.done .n { background: var(--ok); color: #fff; }
.door div { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.door small { color: var(--muted); }
.door.alt { border-left-color: var(--accent); }
ol.steps { padding-left: 1.4rem; display: flex; flex-direction: column; gap: .45rem; list-style: decimal; }
ul.dots { display: flex; flex-direction: column; gap: .35rem; }
ul.dots li { padding-left: 1.1rem; position: relative; }
ul.dots li::before { content: "›"; position: absolute; left: 0; font-weight: 800; color: var(--brand); }
.case { border: 1px solid var(--line); border-radius: 12px; padding: .8rem .9rem; display: flex; flex-direction: column; gap: .5rem; }
.case .who { font-weight: 700; }
.case details summary { cursor: pointer; font-weight: 600; color: var(--brand); }
.case details[open] summary { margin-bottom: .35rem; }
.answer { font-size: .95rem; }
table.t { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.t th, table.t td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
@media (max-width: 420px) { table.t th, table.t td { padding: .35rem .3rem; font-size: .86rem; } }
.ticks { display: flex; flex-direction: column; gap: .2rem; }
.ticks label { display: flex; gap: .65rem; align-items: flex-start; padding: .35rem 0; cursor: pointer; }
.ticks input { width: 1.3rem; height: 1.3rem; flex: none; margin-top: .15rem; accent-color: var(--brand); }
.field { display: flex; flex-direction: column; gap: .3rem; font-weight: 600; font-size: .9rem; }
.field input, .field textarea { font-weight: 400; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: .5rem; }
.qr { display: flex; align-items: center; gap: 1rem; }
.qr .code { flex: none; background: #fff; padding: 6px; border-radius: 6px; }
.qr .code img, .qr .code canvas { display: block; width: 110px; height: 110px; }
.foot { font-size: .8rem; color: var(--muted); }
.pagebreak { display: none; }
.printonly { display: none; }
[hidden] { display: none !important; }
@media print {
  @page { size: A4; margin: 14mm; }
  :root { --bg: #fff; --surface: #fff; --ink: #111; --muted: #444; --line: #bbb; --brand: #1f5b43; --brand-soft: #e7efe9; color-scheme: light; }
  body { background: #fff; font-size: 11pt; }
  .wrap, .stack { display: block; width: 100%; padding: 0; }
  .wrap > * + *, .stack > * + * { margin-top: .6rem; }
  .card { display: block; } .card > * + * { margin-top: .4rem; }
  .noprint { display: none !important; }
  .printonly { display: block; }
  .pagebreak { display: block; break-after: page; height: 0; }
  .case, tr, li, .qr, .ticks label { break-inside: avoid; }
  h2, h3 { break-after: avoid; }
  .card { padding: .6rem .8rem; gap: .4rem; }
  .case details summary { display: none; }
  .answer::before { content: "Answer: "; font-weight: 700; }
  .ticks label { display: block; padding: .15rem 0; }
  .ticks label::before { content: "☐"; font-size: 1.1rem; margin-right: .5rem; }
  .ticks input { display: none; }
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* Burns skills stations (AO). Built 27 Oct 2026 for a group training night without the instructor present, to go with the
   module /microlearning/burns/ and the walk-through /modules/burns/ (Daniel, 42).
   Sources: CPP-006-AO Burns v5.0 (Dec 2016, no review date shown); CTL-050 and CTL-051 rule of nines; CPP-013-AO Pain
   Management v7.2 (as checked for the pain module); CPPRO-012 Inhaled Medication Administration v2.0 (review date Mar 2021
   passed) for methoxyflurane; CPPRO-008 and CPPRO-009 (review June 2020 passed); SAAS Clinical Skills Study Guide v3.2
   (released Oct 2026; owner's scanned copy, not stored in the repo), read for the cling film and hydrogel burn dressings.
   Lead instructor guidance (owner): facial burns + singed eyebrows = suspected airway burn (request clinical support,
   consult the EOC Clinician, cover and transport urgently rather than finish cooling). Patient cards and how-to-run notes
   are DSY-written and marked as such. */
var SRC = {
  cssg: "SAAS Clinical Skills Study Guide v3.2 (Oct 2026)",
  cpp006: "CPP-006-AO Burns v5.0",
  ctl050: "CTL-050 Wallace's Rule of Nines (adults)",
  ctl051: "CTL-051 Paediatric Rule of Nines",
  cpp013: "CPP-013-AO Pain Management v7.2",
  c012: "CPPRO-012 Inhaled Medication Administration v2.0",
  c008: "CPPRO-008 Medication Checks v1.0",
  lead: "DSY lead instructor",
  dsy: "DSY-written for practice: check with your instructor"
};

var STATIONS = [
{ id: "s1", n: 1, title: "Airway first", mins: 15,
  goal: "Spot the signs of an airway burn, know what to watch for, and know that airway and urgent transport come before cooling.",
  kit: ["The patient cards below", "A partner with face paint or a drawn-on 'burn' (optional)"],
  blocks: [
    { h: "Signs that raise suspicion (CPP-006-AO)", src: ["cpp006"], tone: "warn", list: ["Facial burns", "Singed nasal hairs", "Singed eyelashes or eyebrows", "Soot around the nose or mouth"] },
    { h: "Monitor for", src: ["cpp006"], list: ["Hoarseness", "Difficulty speaking", "Wheeze", "Stridor", "Shortness of breath", "Altered conscious state"] },
    { h: "Suspected airway burn", src: ["cpp006"], tone: "red", list: [
      "Airway management and urgent transport take precedence over burn cooling",
      "Request clinical support",
      "Consult the EOC Clinician for advice",
      "Urgent transport, notify the receiving facility"
    ] },
    { h: "Our local rule", src: ["lead"], list: ["Facial burns with singed eyebrows = suspected airway burn: request clinical support, consult the EOC Clinician, cover the burn and transport urgently rather than finish cooling"] },
    { h: "Patient cards", src: ["dsy", "cpp006", "lead"], cases: [
      { who: "A. Daniel, 42", text: "Diesel flash in his face lighting a burn pile. Red face, singed eyebrows. Talking normally.", answer: "Suspected airway burn even though he's talking. Request clinical support, consult the EOC Clinician, cover and transport urgently. Keep monitoring for hoarseness, stridor and the rest." },
      { who: "B. Scalded hand", text: "Kettle scald to the back of the hand. Face fine, no soot, voice normal.", answer: "No airway signs. Cool with running water for 20 minutes, keep her warm, cover, pain relief, transport." },
      { who: "C. Getting hoarse", text: "House fire. Soot round his nose. Twenty minutes later his voice is hoarse.", answer: "Soot plus new hoarseness: airway first. Urgent transport, clinical support, consult the EOC Clinician now." }
    ] },
    { h: "How to run it", src: ["dsy"], steps: ["Act out a card. The other names the signs, the things to monitor, and the plan.", "Swap."] }
  ],
  checks: ["Named all four signs", "Named the six things to monitor", "Said airway and urgent transport come before cooling", "Request clinical support and consult the EOC Clinician"] },

{ id: "s2", n: 2, title: "Cool and cover", mins: 25,
  goal: "Cool a burn properly while keeping the patient warm, then cover it with cling film or use a hydrogel dressing when there's no water.",
  kit: ["A sink, hose or bottles of water and a bucket", "Cling film roll", "Roller bandages", "BurnAID hydrogel dressings (expired or training: face mask and large rectangle)", "Blankets", "Gloves"],
  blocks: [
    { h: "Thermal burns (CPP-006-AO)", src: ["cpp006"], steps: [
      "Cool the burn with running water for 20 minutes.",
      "Manage the environment so the patient doesn't become hypothermic while cooling.",
      "Consider clinical support. Consult the EOC Clinician for significant burns."
    ] },
    { h: "Chemical burns", src: ["cpp006"], tone: "warn", list: [
      "No hydrogel on chemical burns",
      "Follow local management plans, or irrigate with running cold water for at least 20 minutes where chemically appropriate",
      "Keep them warm. Consult the EOC Clinician, who may seek specialist advice"
    ] },
    { h: "Cling film (study guide)", src: ["cssg", "cpp006"], steps: [
      "PPE. Cool first, as the protocol says.",
      "Throw away the first 5 to 10 cm from the roll.",
      "Lay a layer of cling film over the cooled burn.",
      "Never wrap it all the way round a limb: swelling can make it tight. Never across the face.",
      "Hold it on with a loose roller bandage so heat can escape.",
      "You can keep cooling over the cling film or a wet dressing if needed."
    ] },
    { h: "Hydrogel: BurnAID (study guide)", src: ["cssg", "cpp006"], steps: [
      "Only when cooling by other means isn't available. Never on chemical burns.",
      "SAAS carries two sizes: a face mask and a large rectangle for the trunk or a limb.",
      "Cover the burn with the right one. A loose roller bandage can hold it, but not over the face.",
      "Take it off after 20 minutes. Neonates: 10 minutes at most.",
      "Use it cautiously: it can cause hypothermia."
    ] },
    { h: "After cooling", src: ["cpp006"], list: [
      "Take off any hydrogel; cover with non-circumferential cling wrap or a simple moist dressing",
      "Keep cooling over the cover if needed, watch for deterioration and airway compromise",
      "Keep them warm; transport and notify the receiving facility"
    ] },
    { h: "How to run it", src: ["dsy"], steps: [
      "Partner's forearm is 'burnt'. Run water over it (a minute is enough tonight) while you keep the rest of them covered and warm.",
      "Cover with cling film, then a loose roller bandage. Check it isn't all the way round.",
      "Then the BurnAID face mask and large rectangle: say when you'd use them and for how long.",
      "Swap."
    ] }
  ],
  checks: ["Said 20 minutes of running water", "Kept the rest of the patient covered and warm", "First 5 to 10 cm of cling film discarded", "Not circumferential, not on the face",
    "Loose roller bandage", "Hydrogel only without water; 20 minutes, 10 for neonates; never chemical"] },

{ id: "s3", n: 3, title: "How big is the burn?", mins: 15,
  goal: "Estimate the burn size with the rule of nines for an adult and a child, and say it clearly to the EOC Clinician.",
  kit: ["Coloured tape or stickers", "Printed CTL-050 and CTL-051 charts, or the burns module on a phone", "A partner"],
  blocks: [
    { h: "Adults (CTL-050)", src: ["ctl050"], table: { head: ["Area", "%"], rows: [["Head", "9"], ["Each arm", "9"], ["Front of the trunk", "18"], ["Back of the trunk", "18"], ["Each leg", "18"], ["Perineum", "1"]] } },
    { h: "Children (CTL-051)", src: ["ctl051"], table: { head: ["Age", "Head", "Each leg"], rows: [
      ["0", "18", "14"], ["1", "17", "14.5"], ["2", "16", "15"], ["3", "15", "15.5"], ["4", "14", "16"], ["5", "13", "16.5"], ["6", "12", "17"], ["7", "11", "17.5"], ["8", "10", "18"], ["9 to adult", "9", "18"]
    ] }, list: ["Each arm 9% and the front of the trunk 18% at every age"] },
    { h: "Cards", src: ["dsy", "ctl050", "ctl051"], cases: [
      { who: "A. Adult", text: "Front of the chest and abdomen, and the whole right arm.", answer: "18 + 9 = 27%." },
      { who: "B. Adult", text: "Head and both arms.", answer: "9 + 9 + 9 = 27%." },
      { who: "C. 2 years old", text: "Hot tea over the head and the front of the trunk.", answer: "16 + 18 = 34%." },
      { who: "D. 5 years old", text: "Both legs.", answer: "16.5 + 16.5 = 33%." }
    ] },
    { h: "How to run it", src: ["dsy"], steps: ["Tape a 'burn' onto your partner (over clothes). The other works out the percentage.", "Then the child cards. Say each answer as you'd say it to the EOC Clinician.", "Swap."] }
  ],
  checks: ["Adult areas right", "Used the child's age for the head and legs", "Added up correctly", "Said it clearly as a percentage"] },

{ id: "s4", n: 4, title: "Pain relief: paracetamol and Penthrox", mins: 20,
  goal: "Do the medication check, give paracetamol, and set up and coach a patient through methoxyflurane (Penthrox).",
  kit: ["An empty or expired Penthrox inhaler kit, labelled TRAINING (don't open the bottle)", "Expired paracetamol, labelled TRAINING", "A glass of water"],
  blocks: [
    { h: "Safety", src: ["dsy", "c012"], tone: "red", list: [
      "Nobody inhales Penthrox or takes paracetamol tonight. Don't open the Penthrox bottle: mime pouring it",
      "In real use the vapour reaches the crew: use the vehicle extraction and fresh-air ventilation (CPPRO-012)"
    ] },
    { h: "From CPP-013-AO", src: ["cpp013"], list: [
      "Cooling itself eases pain. Then analgesia as per CPP-013-AO",
      "Paracetamol, if none in the past 4 hours: adults 1000 mg oral. Under 16: consult the EOC Clinician",
      "Ibuprofen only for crews who have done the training, if no NSAIDs in the past 6 hours: adults 400 mg. Under 16: consult",
      "Methoxyflurane 3 mL, repeated once if needed. Never more than 2 doses in 24 hours, or 15 mL in a week",
      "IN fentanyl and sublingual ketamine only for AOs with the specific SAAS authority (see the pain module)"
    ] },
    { h: "Methoxyflurane (CPPRO-012)", src: ["c012", "c008"], steps: [
      "Medication checks. Explain it and get consent. Check allergies. Hand hygiene.",
      "Tilt the inhaler and pour the whole 3 mL bottle into the base while rotating it. Shake gently. Bin the bottle.",
      "Wrist loop over the patient's wrist. Mouthpiece between their lips.",
      "First few breaths gentle, then breathe normally in and out through the mouthpiece.",
      "Stronger relief: cover the dilutor hole on top with a finger while breathing in.",
      "The same inhaler can be used for a second dose. Hand hygiene. Record dose, route and time."
    ] },
    { h: "Cards", src: ["dsy", "cpp013"], cases: [
      { who: "A. Daniel, 42", text: "Took two paracetamol 2 hours ago. Pain 8/10.", answer: "No paracetamol (within 4 hours). Methoxyflurane 3 mL, coach him through it." },
      { who: "B. Scalded hand, adult", text: "No paracetamol today. Pain 6/10 after cooling. No allergies.", answer: "Paracetamol 1000 mg oral (none in 4 hours), and methoxyflurane 3 mL if she needs more." },
      { who: "C. Second dose", text: "First Penthrox finished, pain back to 7.", answer: "Repeat once if needed (3 mL), using the same inhaler. No more than 2 doses in 24 hours." }
    ] },
    { h: "How to run it", src: ["dsy"], steps: ["Do the medication check aloud.", "Mime the pour, then coach your partner through the breathing with the empty inhaler (no liquid in it).", "Swap."] }
  ],
  checks: ["Medication check and allergies", "Paracetamol timing checked (4 hours)", "Pour mimed with rotation, bottle binned", "Wrist loop on", "Coached gentle breaths, then normal; dilutor hole for more relief", "Knew the dose limits"] }
];

var END = { title: "Finish together", mins: 25,
  steps: [
    "Run the student walk-through as one crew: Daniel, 42, a diesel flash burn to the face. Use each station's kit as you reach it.",
    "Then each person does the knowledge check in the burns microlearning on their own phone.",
    "Write any questions for the instructor below, then send your record."
  ] };

var KEY = "dsy-stations-burns";
var state = (function () { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
state.ticks = state.ticks || {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

var app = document.getElementById("app");
// QR codes and printed links always point at the live site, so a pack printed from a test copy still works.
var root = "https://dsytraining.com/";
var here = root + "stations/burns/";
function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function a(text, href, cls) { var x = el("a", cls || "btn small ghost", text); x.href = href; return x; }
function srcLine(keys) {
  var p = el("p", "src");
  keys.forEach(function (k, i) { if (i) p.appendChild(document.createTextNode(" · ")); var b = el(k === "dsy" ? "span" : "b", null, SRC[k]); p.appendChild(b); });
  return p;
}
function header(sub) {
  var h = el("header", "top"), b = el("a", "brand"); b.href = "#";
  b.innerHTML = '<div class="brand-icon"><img src="../../microlearning/shared/dsy-logo.png" alt="" width="40" height="40"></div>';
  var t = el("div"); t.appendChild(el("h1", null, "Burns skills stations")); t.appendChild(el("p", null, sub)); b.appendChild(t); h.appendChild(b);
  return h;
}
function qr(box, url) {
  var c = el("div", "code"); box.appendChild(c);
  if (window.QRCode) new QRCode(c, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
}
function done(s) { var t = state.ticks[s.id] || {}; return s.checks.every(function (_, i) { return t[i]; }); }

function block(b) {
  var c = el("section", "card" + (b.tone ? " " + b.tone : "") + (b.src && b.src.indexOf("dsy") >= 0 ? " dsy" : ""));
  if (b.h) c.appendChild(el("h3", null, b.h));
  if (b.text) c.appendChild(el("p", null, b.text));
  if (b.list) { var u = el("ul", "dots"); b.list.forEach(function (x) { u.appendChild(el("li", null, x)); }); c.appendChild(u); }
  if (b.steps) { var o = el("ol", "steps"); b.steps.forEach(function (x) { o.appendChild(el("li", null, x)); }); c.appendChild(o); }
  if (b.table) {
    var t = el("table", "t"), tr = el("tr"); b.table.head.forEach(function (x) { tr.appendChild(el("th", null, x)); }); t.appendChild(tr);
    b.table.rows.forEach(function (r) { var row = el("tr"); r.forEach(function (x) { row.appendChild(el("td", null, x)); }); t.appendChild(row); });
    c.appendChild(t);
  }
  if (b.cases) b.cases.forEach(function (k) {
    var d = el("div", "case"); d.appendChild(el("p", "who", k.who)); if (k.text) d.appendChild(el("p", null, k.text));
    var det = el("details"); det.appendChild(el("summary", null, "Show the answer"));
    var inner = el("div"); inner.appendChild(el("p", "answer", k.answer));
    if (k.eoc) { var e = el("p", "answer"); e.innerHTML = "<b>EOC Clinician (role-play):</b> "; e.appendChild(document.createTextNode(k.eoc)); inner.appendChild(e); }
    det.appendChild(inner); d.appendChild(det); c.appendChild(d);
  });
  if (b.choose) {
    // pick-one toggle (e.g. CT-6 or Slishman): the choice is kept on this phone; printing shows every option
    var ch = b.choose; c.appendChild(el("h3", null, ch.h));
    var row = el("div", "btns noprint"), body = el("div", "stack");
    function show() {
      body.innerHTML = "";
      ch.options.forEach(function (o) { if (PRINT || state[ch.key] === o.value) o.blocks.forEach(function (x) { body.appendChild(block(x)); }); });
      if (!PRINT && !state[ch.key]) body.appendChild(el("p", "src", "Choose one to see its steps."));
      row.querySelectorAll("button").forEach(function (x) { x.className = "btn small" + (state[ch.key] === x.value ? "" : " ghost"); });
    }
    ch.options.forEach(function (o) {
      var btn = el("button", "btn small ghost", o.label); btn.type = "button"; btn.value = o.value;
      btn.addEventListener("click", function () { state[ch.key] = o.value; save(); show(); }); row.appendChild(btn);
    });
    c.appendChild(row); c.appendChild(body); show();
  }
  if (b.src) c.appendChild(srcLine(b.src));
  return c;
}

function stationPage(s, print) {
  var f = document.createDocumentFragment();
  if (!print) f.appendChild(header("Station " + s.n + " of " + STATIONS.length));
  var head = el("section", "stack");
  var hq = el("div", "qr");
  if (print) qr(hq, here + "#" + s.id);
  var ht = el("div", "stack"); ht.appendChild(el("p", "eyebrow", "Station " + s.n + " · about " + s.mins + " minutes"));
  ht.appendChild(el("h2", null, s.title)); ht.appendChild(el("p", null, s.goal));
  if (print) ht.appendChild(el("p", "src", "Scan for this station on your phone"));
  hq.appendChild(ht); head.appendChild(hq); f.appendChild(head);
  f.appendChild(block({ h: "Kit", list: s.kit }));
  s.blocks.forEach(function (b) { f.appendChild(block(b)); });
  var c = el("section", "card"); c.appendChild(el("h3", null, "Partner check"));
  c.appendChild(el("p", "src", "Your partner ticks each one when they see you do it. Swap and go again."));
  var box = el("div", "ticks"), t = state.ticks[s.id] = state.ticks[s.id] || {};
  s.checks.forEach(function (x, i) {
    var l = el("label"), cb = el("input"); cb.type = "checkbox"; cb.checked = !!t[i];
    cb.addEventListener("change", function () { t[i] = cb.checked; save(); });
    l.appendChild(cb); l.appendChild(el("span", null, x)); box.appendChild(l);
  });
  c.appendChild(box); f.appendChild(c);
  if (!print) {
    var nav = el("div", "btns noprint"), i = STATIONS.indexOf(s);
    nav.appendChild(a("All stations", "#", "btn small ghost"));
    nav.appendChild(i < STATIONS.length - 1 ? a("Next: station " + (i + 2), "#" + STATIONS[i + 1].id, "btn small") : a("Finish together", "#end", "btn small"));
    f.appendChild(nav);
  }
  return f;
}

function endPage(print) {
  var f = document.createDocumentFragment();
  if (!print) f.appendChild(header("Finish together"));
  var head = el("div", "qr"); if (print) qr(head, here + "#end");
  var ht = el("div", "stack"); ht.appendChild(el("p", "eyebrow", "Last · about " + END.mins + " minutes")); ht.appendChild(el("h2", null, END.title));
  head.appendChild(ht); f.appendChild(head);
  f.appendChild(block({ steps: END.steps }));
  var links = el("div", "btns noprint");
  links.appendChild(a("Daniel: student walk-through", "../../modules/burns/?mode=student", "btn small"));
  links.appendChild(a("Knowledge check (microlearning)", "../../microlearning/burns/", "btn small ghost"));
  f.appendChild(links);
  if (print) { f.appendChild(el("p", "printonly src", "Walk-through: " + root + "modules/burns/?mode=student")); return f; }
  var c = el("section", "card"); c.appendChild(el("h3", null, "Send your record to the instructor"));
  var nm = el("label", "field", "Names of everyone here"), ni = el("input"); ni.value = state.names || ""; ni.placeholder = "First names";
  ni.addEventListener("input", function () { state.names = ni.value; save(); }); nm.appendChild(ni); c.appendChild(nm);
  var qq = el("label", "field", "Questions or anything that didn't work"), qt = el("textarea"); qt.rows = 3; qt.value = state.q || "";
  qt.addEventListener("input", function () { state.q = qt.value; save(); }); qq.appendChild(qt); c.appendChild(qq);
  var b = el("button", "btn", "Share the record"); b.type = "button"; var msg = el("p", "src");
  b.addEventListener("click", function () {
    var lines = ["DSY burns skills stations, " + new Date().toLocaleDateString("en-AU"), "Crew: " + (state.names || "(no names)")];
    STATIONS.forEach(function (s) {
      var t = state.ticks[s.id] || {}, n = s.checks.filter(function (_, i) { return t[i]; }).length;
      lines.push("Station " + s.n + " " + s.title + ": " + n + " of " + s.checks.length + " ticked");
      s.checks.forEach(function (x, i) { if (!t[i]) lines.push("  not ticked: " + x); });
    });
    if (state.q) lines.push("Questions: " + state.q);
    var text = lines.join("\n");
    if (navigator.share) { navigator.share({ title: "Burns skills stations", text: text }).catch(function () {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { msg.textContent = "Copied. Paste it into a message to your instructor."; }, function () { msg.textContent = text; });
  });
  c.appendChild(b); c.appendChild(msg);
  var r = el("button", "btn small ghost", "Clear the ticks for the next group"); r.type = "button";
  r.addEventListener("click", function () { if (confirm("Clear all ticks, names and questions on this phone?")) { state = { ticks: {} }; save(); go(); } });
  c.appendChild(r);
  f.appendChild(c);
  return f;
}

function setupPage(print) {
  var f = document.createDocumentFragment();
  if (!print) f.appendChild(header("Instructor setup"));
  f.appendChild(el("h2", null, "Instructor setup sheet"));
  f.appendChild(block({ h: "The night at a glance", table: { head: ["Time", "What"], rows: [
    ["Before", "Everyone does the microlearning \"Burns\" (about 15 min). Send the link a few days ahead."],
    ["0:00", "Read the safety box at station 4 together (nobody inhales Penthrox or takes paracetamol; the Penthrox bottle stays closed). Split into pairs or threes."],
    ["0:05", "Rotate through stations 1 to 4 (15 to 25 min each). Partners tick the checks on the phone."],
    ["about 1:20", "Finish together: Daniel's walk-through as one crew, then the knowledge check."],
    ["End", "Share the record with the instructor. Pack up and reset."]
  ] } }));
  var kit = el("section", "card"); kit.appendChild(el("h3", null, "Kit by station"));
  STATIONS.forEach(function (s) { kit.appendChild(el("p", null, s.n + ". " + s.title)); var u = el("ul", "dots"); s.kit.forEach(function (x) { u.appendChild(el("li", null, x)); }); kit.appendChild(u); });
  f.appendChild(kit);
  f.appendChild(block({ h: "Set up", src: ["dsy"], steps: [
    "Tape each station's printed page (with its QR code) at the station, or print one pack per pair.",
    "Station 1: the patient cards.",
    "Station 2: a sink, hose or water bottles and a bucket, cling film, roller bandages, expired BurnAID dressings (face mask and large rectangle), blankets.",
    "Station 3: coloured tape or stickers, printed CTL-050 and CTL-051 charts.",
    "Station 4: an empty or expired Penthrox kit and expired paracetamol, labelled TRAINING and kept apart from operational stock.",
    "Leave this page open on one phone so the group can find the finish."
  ] }));
  f.appendChild(block({ h: "Pack up and reset", src: ["dsy"], list: [
    "Wet floor mopped, blankets hung to dry.",
    "Used cling film, bandages and BurnAID dressings binned or replaced.",
    "Training Penthrox and paracetamol back in their labelled TRAINING box, apart from operational stock.",
    "On the phone used for ticks: Finish together > Clear the ticks for the next group."
  ] }));
  var q = el("section", "card"); q.appendChild(el("h3", null, "Station links"));
  var row = el("div", "stack");
  STATIONS.concat([{ id: "end", n: "", title: END.title }]).forEach(function (s) {
    var x = el("div", "qr"); qr(x, here + "#" + s.id); var t = el("div"); t.appendChild(el("b", null, (s.n ? "Station " + s.n + ": " : "") + s.title));
    t.appendChild(el("p", "src", here + "#" + s.id)); x.appendChild(t); row.appendChild(x);
  });
  q.appendChild(row); f.appendChild(q);
  return f;
}

function home() {
  var f = document.createDocumentFragment();
  f.appendChild(header("A practical night you can run as a team"));
  var i = el("section", "stack");
  i.appendChild(el("p", null, "Four stations to practise the hands-on parts of a burns job, then one full job together. Work in pairs or threes. At each station, read the page, practise, and have your partner tick the checks."));
  var pre = el("div", "card warn"); pre.appendChild(el("h3", null, "Before you start"));
  pre.appendChild(el("p", null, "Everyone does the microlearning \"Burns\" first (about 15 minutes)."));
  var pb = el("div", "btns"); pb.appendChild(a("Open the microlearning", "../../microlearning/burns/", "btn small")); pre.appendChild(pb);
  i.appendChild(pre); f.appendChild(i);
  var list = el("nav", "stack");
  STATIONS.forEach(function (s) {
    var d = a("", "#" + s.id, "door" + (done(s) ? " done" : "")); d.appendChild(el("span", "n", done(s) ? "✓" : String(s.n)));
    var t = el("div"); t.appendChild(el("b", null, s.title)); t.appendChild(el("small", null, "About " + s.mins + " minutes")); d.appendChild(t); list.appendChild(d);
  });
  var e = a("", "#end", "door alt"); e.appendChild(el("span", "n", "★")); var et = el("div"); et.appendChild(el("b", null, END.title));
  et.appendChild(el("small", null, "Daniel's walk-through, knowledge check, send your record")); e.appendChild(et); list.appendChild(e);
  f.appendChild(list);
  var ins = el("div", "btns"); ins.appendChild(a("Instructor setup sheet", "#setup")); ins.appendChild(a("Print all pages or save as PDF", "#print"));
  f.appendChild(ins);
  f.appendChild(el("p", "foot", "Steps come from " + [SRC.cpp006, SRC.ctl050, SRC.ctl051, SRC.cpp013, SRC.c012, SRC.cssg].join(", ") +
    ". CPP-006-AO (Dec 2016) shows no review date; the review dates of CPPRO-012 (Mar 2021) and CPPRO-008 (June 2020) have passed. The airway burn rule follows the DSY lead instructor's guidance. Dashed boxes are DSY-written for practice. Training resource only: it does not replace the SAAS protocols or advice from the EOC Clinician."));
  return f;
}

function printAll() {
  var f = document.createDocumentFragment();
  var bar = el("div", "btns noprint"); var pb = el("button", "btn", "Print or save as PDF"); pb.type = "button"; pb.onclick = function () { window.print(); };
  bar.appendChild(pb); bar.appendChild(a("Back", "#")); f.appendChild(bar);
  f.appendChild(header("Instructor setup")); f.appendChild(setupPage(true)); f.appendChild(el("div", "pagebreak"));
  STATIONS.forEach(function (s) { f.appendChild(header("Station " + s.n)); f.appendChild(stationPage(s, true)); f.appendChild(el("div", "pagebreak")); });
  f.appendChild(header("Finish together")); f.appendChild(endPage(true));
  return f;
}

var PRINT = false;
function go() {
  var h = location.hash.slice(1); PRINT = h === "print"; var s = STATIONS.filter(function (x) { return x.id === h; })[0];
  app.innerHTML = "";
  app.appendChild(s ? stationPage(s) : h === "end" ? endPage() : h === "setup" ? setupPage() : h === "print" ? printAll() : home());
  if (h === "print") app.querySelectorAll("details").forEach(function (d) { d.open = true; });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", go);
go();
</script>
