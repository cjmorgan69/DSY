<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#25694e,#123d2c);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif}
svg{position:absolute;inset:0}
</style>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const TL=TIMELINE, NS="http://www.w3.org/2000/svg";
const C={gold:"#e3a712",red:"#e2574c",mint:"#8be0b1",ink:"#123d2c",card:"rgba(0,0,0,.30)",cardLine:"rgba(255,255,255,.16)",ok:"#3fae74"};
const cl=t=>Math.max(0,Math.min(1,t)), eo=t=>1-Math.pow(1-cl(t),3);
const pr=(t,a,b)=>cl((t-a)/(b-a));
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||v).appendChild(e);return e}
function txt(s,a,p){const e=el("text",Object.assign({fill:"#fff","font-family":"Helvetica Neue,Arial,sans-serif"},a),p);e.textContent=s;return e}
function defs(){const d=el("defs",{});const sh=el("filter",{id:"sh",x:"-20%",y:"-20%",width:"140%",height:"140%"},d);
  el("feDropShadow",{dx:0,dy:6,stdDeviation:8,"flood-color":"#000","flood-opacity":.28},sh)}
/* reveal: fade/slide in starting at time s */
function rv(t,s,d){return eo(pr(t,s,s+(d||0.5)))}
function grp(p,a){return el("g",{opacity:a,transform:`translate(0 ${(1-a)*16})`},p)}
function card(g,x,y,w,h,fill,stroke){return el("rect",{x,y,width:w,height:h,rx:22,fill:fill||C.card,stroke:stroke||C.cardLine,"stroke-width":2},g)}
function badgeNum(g,x,y,n,col){el("circle",{cx:x,cy:y,r:24,fill:col||C.gold},g);txt(String(n),{x,y:y+10,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},g)}
function tick(g,x,y,a,r){r=r||20;el("circle",{cx:x,cy:y,r,fill:a>0?C.ok:"rgba(255,255,255,.15)"},g);
  if(a>0)el("path",{d:`M${x-r*.45} ${y} L${x-r*.1} ${y+r*.38} L${x+r*.5} ${y-r*.35}`,fill:"none",stroke:"#fff","stroke-width":r*.28,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":60,"stroke-dashoffset":60*(1-a)},g)}
function row(g,x,y,w,h,title,sub,a,col){
  const gg=grp(g,a);card(gg,x,y,w,h);
  el("rect",{x,y,width:8,height:h,rx:4,fill:col||C.gold},gg);
  txt(title,{x:x+34,y:y+(sub?(Array.isArray(sub)?h*.32:h*.42):h*.62),"font-size":32,"font-weight":700},gg);
  if(Array.isArray(sub))sub.forEach((ln,k)=>txt(ln,{x:x+34,y:y+h*.62+k*30,"font-size":23,fill:"#cfe7da"},gg));
  else if(sub)txt(sub,{x:x+34,y:y+h*.76,"font-size":23,fill:"#cfe7da"},gg);
  return gg}
function bullets(g,x,y,items,t,starts,col){items.forEach((s,i)=>{const a=rv(t,starts[i]);const gg=grp(g,a);
  el("circle",{cx:x,cy:y+i*50-9,r:7,fill:col||C.gold},gg);txt(s,{x:x+24,y:y+i*50,"font-size":28},gg)})}

function lineAt(t){let i=0;TL.lines.forEach((l,k)=>{if(t>=l.start-0.45)i=k});return i}
function sentAt(t,l){let j=0;l.s.forEach((s,k)=>{if(t>=s.s-0.15)j=k});return j}

function chrome(t,i){
  const l=TL.lines[i], n=TL.lines.length;
  txt("DSY TRAINING",{x:70,y:62,"font-size":17,"font-weight":700,"letter-spacing":"3",opacity:.65});
  txt(l.head,{x:70,y:112,"font-size":46,"font-weight":800,"letter-spacing":"-1"});
  for(let k=0;k<n;k++){const w=32,x=1210-(n-k)*(w+7);
    el("rect",{x,y:52,width:w,height:7,rx:3.5,fill:"rgba(255,255,255,.22)"});
    const f=k<i?1:k>i?0:pr(t,l.start,l.end);
    if(f>0)el("rect",{x,y:52,width:w*f,height:7,rx:3.5,fill:C.gold});}
  const j=sentAt(t,l), s=l.s[j];
  const a=Math.min(cl((t-(s.s-0.15))/0.2), t>l.end+0.35?cl(1-(t-l.end-0.35)/0.25):1);
  const g=el("g",{opacity:a});
  const long=s.text.length>78;
  el("rect",{x:70,y:long?570:590,width:1140,height:long?112:84,rx:22,fill:"rgba(0,0,0,.34)"},g);
  if(!long) txt(s.text,{x:640,y:644,"text-anchor":"middle","font-size":s.text.length>62?30:34,"font-weight":600},g);
  else{ // wrap into two lines at the nearest space to the middle
    let m=Math.floor(s.text.length/2), L=s.text.lastIndexOf(" ",m), R=s.text.indexOf(" ",m);
    const cut=(m-L<R-m||R<0)?L:R;
    txt(s.text.slice(0,cut),{x:640,y:620,"text-anchor":"middle","font-size":32,"font-weight":600},g);
    txt(s.text.slice(cut+1),{x:640,y:664,"text-anchor":"middle","font-size":32,"font-weight":600},g);}
  txt("SAAS CPP-016-AO",{x:1210,y:704,"text-anchor":"end","font-size":15,opacity:.5,"letter-spacing":"1.5"});
}

function scene(t,i){
  const l=TL.lines[i], S=l.s, T=t;
  const fade=Math.min(cl((t-(l.start-0.45))/0.35), i<TL.lines.length-1?cl((TL.lines[i+1].start-0.45-t)/0.3):1);
  const g=el("g",{opacity:fade});

  if(i===0){
    txt("Stroke",{x:640,y:330,"text-anchor":"middle","font-size":170,"font-weight":800,"letter-spacing":"-5",opacity:rv(T,S[0].s,0.4)},g);
    el("rect",{x:640-190*rv(T,S[0].s+0.2,0.7),y:362,width:380*rv(T,S[0].s+0.2,0.7),height:7,rx:3.5,fill:C.gold},g);
    txt("What every Ambulance Officer needs to know",{x:640,y:440,"text-anchor":"middle","font-size":38,fill:"#dff1e7",opacity:rv(T,S[1].s,0.5)},g);
    const b=rv(T,S[1].s+0.5,0.5);if(b>0){const gb=grp(g,b);el("rect",{x:520,y:480,width:240,height:46,rx:23,fill:"rgba(0,0,0,.3)"},gb);txt("Protocol CPP-016-AO",{x:640,y:511,"text-anchor":"middle","font-size":22,"font-weight":700},gb)}
  }

  if(i===1){
    // clock sweeping over the scene
    const cx=270,cy=360,r=125,p=pr(T,l.start,l.end), ang=p*Math.PI*2*2.2-Math.PI/2;
    el("circle",{cx,cy,r,fill:"rgba(0,0,0,.28)",stroke:"#fff","stroke-width":6,opacity:rv(T,S[0].s,0.5)},g);
    for(let k=0;k<12;k++){const a=k/12*Math.PI*2;el("line",{x1:cx+Math.cos(a)*(r-18),y1:cy+Math.sin(a)*(r-18),x2:cx+Math.cos(a)*(r-6),y2:cy+Math.sin(a)*(r-6),stroke:"#fff","stroke-width":4,opacity:.7},g)}
    el("line",{x1:cx,y1:cy,x2:cx+Math.cos(ang)*(r-30),y2:cy+Math.sin(ang)*(r-30),stroke:C.gold,"stroke-width":8,"stroke-linecap":"round"},g);
    el("circle",{cx,cy,r:10,fill:C.gold},g);
    badge(g,"Rapid early assessment",270,545,rv(T,S[0].s,0.4));
    const c1=rv(T,S[1].s), c2=rv(T,S[2].s);
    if(c1>0){const gg=grp(g,c1);card(gg,520,200,670,130);el("rect",{x:520,y:200,width:8,height:130,rx:4,fill:C.mint},gg);
      txt("Comprehensive Stroke Unit",{x:556,y:255,"font-size":34,"font-weight":800},gg);txt("CSU: the best place for stroke care",{x:556,y:298,"font-size":24,fill:"#cfe7da"},gg)}
    if(c2>0){const gg=grp(g,c2);card(gg,520,355,670,130);el("rect",{x:520,y:355,width:8,height:130,rx:4,fill:C.gold},gg);
      txt("Thrombolysis",{x:556,y:410,"font-size":34,"font-weight":800},gg);txt("clot-busting treatment, only if they arrive in time",{x:556,y:453,"font-size":24,fill:"#cfe7da"},gg)}
  }

  if(i===2){
    // glucometer
    el("rect",{x:150,y:175,width:230,height:380,rx:40,fill:"#e9eee9",filter:"url(#sh)"},g);
    el("rect",{x:174,y:205,width:182,height:130,rx:18,fill:C.ink},g);
    const low=T>=S[2].s;
    const val=low?"2.8":(T>=S[1].s?"5.6":"- . -");
    txt(val,{x:265,y:300,"text-anchor":"middle","font-size":70,"font-weight":800,fill:low?"#ff8c82":C.mint},g);
    txt("mmol/L",{x:265,y:326,"text-anchor":"middle","font-size":18,fill:"#cfe7da"},g);
    el("circle",{cx:265,cy:430,r:42,fill:"#cfd8d1"},g);el("circle",{cx:265,cy:430,r:30,fill:"#bcc7bf"},g);
    txt("BGL",{x:265,y:520,"text-anchor":"middle","font-size":24,"font-weight":700,fill:C.ink},g);
    row(g,470,170,740,100,"Basic care and life support",null,rv(T,S[0].s));
    const a1=rv(T,S[1].s); row(g,470,290,740,100,"Measure the BGL","to rule out low blood sugar",a1,C.mint);
    const a2=rv(T,S[2].s); const r2=row(g,470,410,740,120,"Below 3.5 mmol/L: treat first","as per CPP-009-AO Hypoglycaemia, then reassess",a2,C.red);
  }

  if(i===3){
    // clipboard
    el("rect",{x:150,y:175,width:250,height:360,rx:26,fill:"#f1efe4",filter:"url(#sh)"},g);
    el("rect",{x:210,y:158,width:130,height:44,rx:14,fill:"#8f876d"},g);
    txt("ROSIER",{x:275,y:275,"text-anchor":"middle","font-size":44,"font-weight":800,fill:C.ink,opacity:rv(T,S[0].s,0.4)},g);
    for(let k=0;k<5;k++)el("rect",{x:185,y:315+k*42,width:180-(k%2)*40,height:12,rx:6,fill:"#c9c3ae",opacity:rv(T,S[0].s+0.4+k*0.15,0.3)},g);
    const a1=rv(T,S[1].s), a2=rv(T,S[2].s);
    row(g,470,190,740,150,"The preferred stroke recognition tool","of the SA state-wide stroke clinical network",a1,C.mint);
    row(g,470,370,740,150,"Use it alongside","a thorough history and clinical assessment",a2,C.gold);
  }

  if(i===4){
    txt("Eligible for thrombolysis only if ALL apply",{x:190,y:178,"font-size":26,"font-weight":700,fill:C.gold,opacity:rv(T,S[0].s,0.5)},g);
    const rows=["Stroke is clinically suspected","ROSIER score is positive","Independent before this event","Arrive at CSU/STS within 4 hours of onset","Travel time under 60 minutes"];
    rows.forEach((s,k)=>{const st=S[k+1].s, a=rv(T,st,0.45), y=205+k*70;
      const gg=grp(g,a);card(gg,190,y,900,58);txt(s,{x:262,y:y+39,"font-size":30,"font-weight":600},gg);
      tick(gg,226,y+29,pr(T,st+0.25,st+0.7),19)});
  }

  if(i===5){
    const a0=rv(T,S[0].s), a1=rv(T,S[1].s), a2=rv(T,S[2].s);
    let gg=grp(g,a0);card(gg,70,175,560,330);txt("Stroke Thrombolysis Services",{x:100,y:222,"font-size":28,"font-weight":800,fill:C.mint},gg);
    ["Port Lincoln Hospital","Whyalla Hospital","Port Augusta Hospital"].forEach((h,k)=>{
      const ha=rv(T,S[0].s+0.5+k*0.9,0.4), g3=grp(gg,ha);el("rect",{x:96,y:248+k*62,width:508,height:50,rx:12,fill:"rgba(227,167,18,.22)"},g3);txt(h,{x:116,y:282+k*62,"font-size":29,"font-weight":700},g3)});
    txt("also: Mount Gambier, Naracoorte, Port Pirie,",{x:100,y:450,"font-size":20,fill:"#cfe7da"},gg);txt("Berri, Wallaroo (full list on this page)",{x:100,y:476,"font-size":20,fill:"#cfe7da"},gg);
    gg=grp(g,a1);card(gg,670,175,540,330);txt("Comprehensive Stroke Units",{x:700,y:222,"font-size":28,"font-weight":800,fill:C.gold},gg);
    [["Flinders Medical Centre","0800-2000"],["Royal Adelaide Hospital",""],["Lyell McEwin Hospital","0800-2000"]].forEach((h,k)=>{
      el("rect",{x:696,y:248+k*62,width:488,height:50,rx:12,fill:"rgba(255,255,255,.08)"},gg);txt(h[0],{x:716,y:282+k*62,"font-size":27,"font-weight":700},gg);
      if(h[1]&&a2>0){const gh=grp(gg,a2);el("rect",{x:1040,y:256+k*62,width:132,height:34,rx:17,fill:C.gold},gh);txt(h[1],{x:1106,y:280+k*62,"text-anchor":"middle","font-size":20,"font-weight":800,fill:C.ink},gh)}});
  }

  if(i===6){
    row(g,110,175,1060,108,"1  Consult the EOC Clinician","for authorisation to transport directly to the closest hospital with a CSU/STS",rv(T,S[0].s),C.gold);
    row(g,110,300,1060,108,"2  Request clinical support","if the patient is unstable, or transport time is over 20 minutes",rv(T,S[1].s),C.mint);
    row(g,110,425,1060,108,"3  Confirm the details","patient identification + phone number for the substitute decision maker, relative or carer",rv(T,S[2].s),C.gold);
  }

  if(i===7){
    // phone
    el("rect",{x:140,y:170,width:190,height:370,rx:36,fill:"#e9eee9",filter:"url(#sh)"},g);
    el("rect",{x:156,y:200,width:158,height:290,rx:14,fill:C.ink},g);
    "ISBAR".split("").forEach((c,k)=>{const a=rv(T,S[0].s+0.6+k*0.35,0.3);txt(c,{x:200,y:243+k*50,"text-anchor":"middle","font-size":36,"font-weight":800,fill:C.gold,opacity:a},g);
      el("rect",{x:226,y:225+k*50,width:64*a,height:10,rx:5,fill:"rgba(255,255,255,.35)"},g)});
    el("circle",{cx:235,cy:515,r:12,fill:"#cfd8d1"},g);
    row(g,400,170,810,100,"Phone the stroke coordinator","on their mobile, using ISBAR",rv(T,S[0].s),C.gold);
    const a1=rv(T,S[1].s);if(a1>0){const gg=grp(g,a1);["Eligibility criteria","ETA"].forEach((c,k)=>{const w=c.length*17+60;const x=k?400+ "Eligibility criteria".length*17+80:400;
      el("rect",{x,y:290,width:w,height:62,rx:31,fill:C.mint},gg);txt(c,{x:x+w/2,y:330,"text-anchor":"middle","font-size":28,"font-weight":800,fill:C.ink},gg)})}
    row(g,400,385,810,150,"No answer, or local procedure says so",["request GRN notification to the stroke coordinator","at the receiving Emergency Department"],rv(T,S[2].s),C.red);
  }

  if(i===8){
    const a0=rv(T,S[0].s), a1=rv(T,S[1].s), a2=rv(T,S[2].s);
    let gg=grp(g,a0);card(gg,70,170,560,270,"rgba(226,87,76,.14)","rgba(226,87,76,.55)");txt("Not eligible if any of:",{x:100,y:218,"font-size":28,"font-weight":800,fill:"#ffb3aa"},gg);
    bullets(gg,104,276,["ROSIER score negative","4 hours or more from onset","Not independent before"],T,[S[0].s+0.4,S[0].s+1.8,S[0].s+3.4],C.red);
    if(a1>0){const ga=grp(g,a1);el("path",{d:"M640 305 L680 305 M668 290 L684 305 L668 320",fill:"none",stroke:"#fff","stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round"},ga)}
    gg=grp(g,a1);card(gg,700,170,510,270);txt("Then transport to:",{x:730,y:218,"font-size":28,"font-weight":800,fill:C.mint},gg);
    bullets(gg,734,276,["the closest CSU/STS, or","the closest hospital if travel","is excessive, or","consult the EOC Clinician"].slice(0,4).map((s,k)=>s),T,[S[1].s+0.3,S[1].s+2.4,S[1].s+2.4,S[1].s+4.6],C.mint);
    gg=grp(g,a2);card(gg,70,462,1140,104,"rgba(227,167,18,.18)","rgba(227,167,18,.6)");
    txt("Everything else fits, but travel is over 60 minutes",{x:100,y:508,"font-size":29,"font-weight":800,fill:C.gold},gg);
    txt("consult the EOC Clinician to discuss transport",{x:100,y:546,"font-size":26},gg);
  }

  if(i===9){
    const labels=[["1","Sugar first"],["2","ROSIER next"],["3","Time + distance"],["4","Call the EOC"]];
    const seg=(S[0].e-S[0].s)/4.2;
    labels.forEach((p,k)=>{const a=rv(T,S[0].s+0.6+k*seg*0.95,0.4), x=70+k*290;
      const gg=grp(g,a);el("rect",{x,y:250,width:250,height:150,rx:26,fill:k===3?C.gold:"rgba(0,0,0,.32)",stroke:C.cardLine,"stroke-width":2},gg);
      badgeNum(gg,x+50,300,p[0],k===3?C.ink:C.gold); if(k===3)gg.lastChild.setAttribute("fill","#fff");
      txt(p[1],{x:x+125,y:365,"text-anchor":"middle","font-size":29,"font-weight":800,fill:k===3?C.ink:"#fff"},gg);
      if(k<3)txt("›",{x:x+270,y:340,"text-anchor":"middle","font-size":60,fill:C.gold,opacity:a},g)});
    badge(g,"Now try the eligibility checker on this page",640,480,rv(T,S[1].s,0.5),"rgba(0,0,0,.35)");
  }
}
function badge(g,s,x,y,a,col){
  if(a<=0)return;
  const gg=grp(g,a), w=s.length*15.5+56;
  el("rect",{x:x-w/2,y:y-30,width:w,height:56,rx:28,fill:col||"rgba(0,0,0,.35)"},gg);
  txt(s,{x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":700},gg);
}
function render(t){
  v.innerHTML=""; defs();
  const i=lineAt(t);
  scene(t,i); chrome(t,i);
  const last=TL.lines[TL.lines.length-1].end;
  if(t>last+0.3){const a=eo(pr(t,last+0.3,last+0.9));
    el("rect",{x:0,y:0,width:1280,height:720,fill:C.ink,opacity:a*.94});
    txt("Stroke",{x:640,y:330,"text-anchor":"middle","font-size":64,"font-weight":800,opacity:a});
    txt("SAAS CPP-016-AO  ·  DSY Training",{x:640,y:385,"text-anchor":"middle","font-size":26,opacity:a*.75});}
}
</script>
